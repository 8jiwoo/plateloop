<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlateLoop survey</title>
<meta name="description" content="A 4-minute anonymous survey about canteen food, waste and nutrition, for students, kitchen staff, hospital staff and office workers.">
<meta name="theme-color" content="#040705">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
:root{--g:#30D158;--a:#30D158;--ink:#F5F5F7;--ink2:#AEB3B8;--ink3:#7A7F85;--card:#0F1311;--card2:#161C18;--line:rgba(255,255,255,.08);color-scheme:dark}
*{box-sizing:border-box}
html{background:#040705}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden;position:relative;z-index:0}
.glow{z-index:-1}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* drifting glow background, tinted by the chosen group */
.glow{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.glow i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5}
.glow i:nth-child(1){width:60vmax;height:60vmax;left:45%;top:-35vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--a) 45%,transparent),transparent);animation:drift1 18s ease-in-out infinite}
.glow i:nth-child(2){width:50vmax;height:50vmax;left:-25vmax;top:55%;background:radial-gradient(closest-side,color-mix(in srgb,var(--a) 22%,transparent),transparent);animation:drift2 22s ease-in-out infinite}
.glow i:nth-child(3){width:40vmax;height:40vmax;right:-20vmax;bottom:-20vmax;background:radial-gradient(closest-side,rgba(10,132,255,.18),transparent);animation:drift1 26s ease-in-out infinite reverse}
@keyframes drift1{50%{transform:translate(-8vmax,6vmax) scale(1.1)}}
@keyframes drift2{50%{transform:translate(7vmax,-6vmax) scale(1.15)}}

.wrap{max-width:640px;margin:0 auto;padding:18px 20px 40px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;height:44px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;letter-spacing:-.03em;text-decoration:none;color:var(--ink)}
.logo .w span{color:var(--g)}
.back{margin-left:auto;border:0;background:rgba(255,255,255,.07);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink2);transition:background .2s,color .2s,transform .2s}
.back:hover{color:var(--ink);background:rgba(255,255,255,.12)}
.back:active{transform:scale(.95)}

/* progress: a glowing bar with a seedling riding the tip */
.prog{position:relative;margin:14px 13px 0;height:22px}
.prog .track{position:absolute;left:-13px;right:-13px;top:8px;height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.prog .fill{position:relative;display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--a) 55%,#000),var(--a));box-shadow:0 0 14px var(--a);transition:width .6s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.prog .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-100%);animation:shine 2.4s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.prog .sprout{position:absolute;top:-6px;left:0;width:26px;height:26px;margin-left:-13px;transition:left .6s cubic-bezier(.2,.8,.2,1)}
.prog .sprout svg{width:100%;height:100%;filter:drop-shadow(0 0 6px var(--a));animation:sway 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(-10deg)}}
.count{display:flex;justify-content:space-between;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--ink3);letter-spacing:.05em}
.count b{color:var(--a)}

.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 0}
.screen{animation:in .55s cubic-bezier(.2,.8,.2,1) both}
.screen.back-in{animation-name:inback}
.screen.out{animation:out .24s ease-in both}
@keyframes in{from{opacity:0;transform:translateX(46px)}}
@keyframes inback{from{opacity:0;transform:translateX(-46px)}}
@keyframes out{to{opacity:0;transform:translateX(-30px) scale(.98)}}
.st{animation:up .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0) * 55ms + 120ms)}
@keyframes up{from{opacity:0;transform:translateY(16px)}}

/* Loopi */
.loopi{display:block;overflow:visible;flex:none}
.loopi .lp-body{animation:lpbob 3.2s ease-in-out infinite;transform-origin:60px 120px}
.loopi .lp-eye{animation:lpblink 5.5s infinite;transform-box:fill-box;transform-origin:center}
.loopi .lp-wave{animation:lpwave 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
.loopi .lp-leaf{animation:lpleaf 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
.lp-cheer .lp-body{animation:lpjump 1.4s ease-in-out infinite}
@keyframes lpbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes lpjump{0%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}55%{transform:translateY(0)}}
@keyframes lpblink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes lpwave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
@keyframes lpleaf{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
.hop{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{40%{transform:translateY(-10px) scale(1.08)}}

/* home */
.hero{display:flex;align-items:flex-end;gap:14px}
.hero .loopi{filter:drop-shadow(0 14px 28px rgba(48,209,88,.35))}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--g)}
h1{margin:8px 0 0;font-size:clamp(34px,8vw,50px);font-weight:900;letter-spacing:-.045em;line-height:1.02}
h1 em{font-style:normal;background:linear-gradient(90deg,#4ADE80,#30D158 55%,#9BE15D);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:14px 0 0;font-size:17px;line-height:1.55;color:var(--ink2)}
.groups{display:grid;gap:12px;margin-top:26px}
.grp{--c:var(--g);position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;padding:18px;border:0;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .25s,background .25s}
.grp::before{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 30%,transparent),transparent);opacity:0;transition:opacity .3s}
.grp:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 60%,transparent),0 18px 40px -22px var(--c);background:var(--card2)}
.grp:hover::before{opacity:1}
.grp:active{transform:scale(.98)}
.grp .ic{flex:none;width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.grp:hover .ic{transform:rotate(-8deg) scale(1.08)}
.grp .ic svg{width:27px;height:27px;color:var(--c)}
.grp b{display:block;font-size:18px;letter-spacing:-.01em}
.grp small{display:block;margin-top:3px;font-size:14px;color:var(--ink3)}
.grp .arr{margin-left:auto;color:var(--ink3);font-size:20px;transition:transform .25s,color .25s}
.grp:hover .arr{transform:translateX(4px);color:var(--c)}
.fine{margin-top:22px;font-size:13px;color:var(--ink3);line-height:1.5}

/* question */
.guide{display:flex;align-items:flex-end;gap:10px;margin-bottom:16px}
.bubble{position:relative;padding:9px 14px;border-radius:18px 18px 18px 6px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:22px;transform-origin:0 100%;animation:pop .45s cubic-bezier(.3,1.6,.5,1) .15s both}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(8px)}}
.q-code{font-size:12.5px;font-weight:800;color:var(--a);letter-spacing:.08em}
.q{margin:6px 0 22px;font-size:clamp(24px,5.6vw,31px);font-weight:800;letter-spacing:-.03em;line-height:1.2}
.opts{display:grid;gap:10px}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:16px 18px;border:0;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:17px;font-weight:600;text-align:left;transition:background .2s,box-shadow .2s,transform .2s cubic-bezier(.3,1.4,.5,1)}
.opt:hover{background:var(--card2);transform:translateX(4px)}
.opt:active{transform:scale(.98)}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink3);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18);transition:background .2s,color .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.opt[aria-pressed="true"]{background:color-mix(in srgb,var(--a) 15%,transparent);box-shadow:inset 0 0 0 2px var(--a)}
.opt[aria-pressed="true"] .k{background:var(--a);color:#04210F;box-shadow:none;transform:scale(1.12)}
.ripple{position:absolute;border-radius:50%;width:12px;height:12px;margin:-6px 0 0 -6px;background:color-mix(in srgb,var(--a) 55%,transparent);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(40);opacity:0}}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sc{aspect-ratio:1;border:0;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:24px;font-weight:800;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,box-shadow .2s}
.sc:hover{background:var(--card2);transform:translateY(-4px)}
.sc[aria-pressed="true"]{background:var(--a);color:#04210F;box-shadow:0 12px 28px -10px var(--a);transform:translateY(-4px) scale(1.06)}
.ends{display:flex;justify-content:space-between;margin-top:10px;font-size:13.5px;font-weight:600;color:var(--ink3)}
.num{display:flex;align-items:center;gap:12px}
.num button{width:60px;height:60px;border:0;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:26px;font-weight:700;transition:transform .2s,background .2s}
.num button:hover{background:var(--card2)}
.num button:active{transform:scale(.9)}
.num input{flex:1;min-width:0;height:60px;border:0;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font:900 28px Inter,sans-serif;text-align:center;letter-spacing:-.03em}
.num input.bump{animation:bump .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{50%{transform:scale(1.06)}}
.num input:focus,textarea:focus{outline:2px solid var(--a);outline-offset:0}
textarea{width:100%;min-height:140px;padding:16px;border:0;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font:500 17px/1.5 Inter,sans-serif;resize:vertical}
.nav{display:flex;gap:10px;margin-top:26px}
.btn{flex:1;height:56px;border:0;border-radius:18px;font-size:17px;font-weight:800;transition:transform .2s cubic-bezier(.3,1.6,.5,1),opacity .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.prim{background:var(--a);color:#04210F;box-shadow:0 14px 30px -14px var(--a)}
.btn.prim:hover{box-shadow:0 18px 36px -12px var(--a)}
.btn.prim:disabled{opacity:.3;box-shadow:none;cursor:default}
.btn.ghost{flex:0 0 auto;padding:0 22px;background:rgba(255,255,255,.07);color:var(--ink2)}

/* finish */
.done{text-align:center;position:relative}
.done .loopi{margin:0 auto 6px;filter:drop-shadow(0 18px 34px rgba(48,209,88,.45));animation:popin .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popin{from{transform:scale(.2) translateY(40px);opacity:0}}
.done h1{animation:up .6s .2s cubic-bezier(.2,.8,.2,1) both}
.done .lead{animation:up .6s .3s cubic-bezier(.2,.8,.2,1) both}
.done .nav{animation:up .6s .4s cubic-bezier(.2,.8,.2,1) both}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:3px;background:var(--cc);left:var(--x);animation:fall var(--t) cubic-bezier(.2,.6,.4,1) var(--dl) forwards;opacity:0}
.confetti i.leaf{width:14px;height:9px;border-radius:14px 0 14px 0}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(105vh) translateX(var(--dx)) rotate(var(--r))}}

.res{display:grid;gap:12px;margin-top:22px}
.res div{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.res b{font-size:17px;color:var(--ink)}.res span span{color:var(--ink3);font-size:14px}
.res button{margin-left:auto;border:0;border-radius:12px;padding:10px 14px;background:var(--g);color:#04210F;font-weight:700}
.res button:disabled{opacity:.3}
.note{margin-top:18px;padding:14px 16px;border-radius:14px;background:rgba(255,159,10,.1);color:#FFB547;font-size:14px;line-height:1.5}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <div class="top"><a class="logo" href="../" id="logo"></a><button class="back" id="back" hidden>← Back</button></div>
  <div class="prog" id="prog" hidden><div class="track"><span class="fill" id="fill"></span></div><span class="sprout" id="sprout"><svg viewBox="0 0 24 24"><path d="M12 22v-9" stroke="#3E9B4A" stroke-width="2.4" stroke-linecap="round"/><path d="M12 14c-1-5-5-7-9-6 0 4 4 7 9 6Z" fill="#62C76F"/><path d="M12 12c1-6 6-8 10-7 0 5-4 8-10 7Z" fill="#8FDB7E"/></svg></span></div>
  <div class="count" id="count" hidden><span id="cnt"></span><b id="pct"></b></div>
  <main class="stage" id="stage"></main>
</div>
<script src="questions.js"></script>
<script src="config.js"></script>
<script>
(() => {
  const COLORS = { Students: '#30D158', Kitchen: '#FF9F0A', Hospital: '#0A84FF', Office: '#7D7AFF' };
  const ICONS = {
    Students: '<path d="M2 9l10-5 10 5-10 5Z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
    Kitchen: '<path d="M6 14h12v6H6zM4 10c0-3 2-5 4-5 1-2 7-2 8 0 2 0 4 2 4 5 0 2-2 4-4 4H8c-2 0-4-2-4-4Z"/>',
    Hospital: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>',
    Office: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M8 15h2M14 15h2"/>',
  };
  const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;

  // Loopi, the PlateLoop mascot (same drawing as apps/js/visual.js)
  function loopi(expr = 'happy', size = 96) {
    const look = { point: [2.2, .5], think: [-1.8, -2.2], wow: [0, 0] }[expr] || [0, .6];
    const eye = x => expr === 'cheer'
      ? `<path d="M${x - 7} 67q7-8 14 0" fill="none" stroke="#1F2A1D" stroke-width="3.4" stroke-linecap="round"/>`
      : `<g class="lp-eye"><ellipse cx="${x}" cy="66" rx="${expr === 'wow' ? 8 : 7}" ry="${expr === 'wow' ? 9.5 : 8.5}" fill="#fff"/><circle cx="${x + look[0]}" cy="${67 + look[1]}" r="${expr === 'wow' ? 4.6 : 4}" fill="#1F2A1D"/><circle cx="${x + look[0] + 1.6}" cy="${65 + look[1]}" r="1.4" fill="#fff"/></g>`;
    const mouth = {
      cheer: '<path d="M49 80q11 16 22 0Z" fill="#1F2A1D"/><path d="M54 86q6 5 12 0" fill="#FF8FA0"/>',
      wow: '<ellipse cx="60" cy="84" rx="4.5" ry="5.5" fill="#1F2A1D"/>',
      think: '<path d="M56 84q5-2 9 1" fill="none" stroke="#1F2A1D" stroke-width="3" stroke-linecap="round"/>',
    }[expr] || '<path d="M50 80q10 10 20 0" fill="none" stroke="#1F2A1D" stroke-width="3.2" stroke-linecap="round"/>';
    const arm = (d, cls = '') => `<path class="${cls}" d="${d}" fill="none" stroke="#6CC25C" stroke-width="8" stroke-linecap="round"/>`;
    const arms = {
      cheer: arm('M26 76q-12-8-13-22') + arm('M94 76q12-8 13-22'),
      wave: arm('M26 82q-9 7-10 16') + arm('M94 76q13-6 14-22', 'lp-wave'),
      point: arm('M26 82q-9 7-10 16') + arm('M95 80q13-1 21-7'),
      think: arm('M26 82q-9 7-10 16') + arm('M92 88q-8 6-22 0'),
    }[expr] || arm('M26 82q-9 7-10 16') + arm('M94 82q9 7 10 16');
    return `<svg class="loopi lp-${expr}" width="${size}" height="${size * 1.08}" viewBox="0 0 120 130" aria-hidden="true">
      <ellipse cx="60" cy="124" rx="30" ry="4" fill="rgba(0,0,0,.3)"/><g class="lp-body">
      <ellipse cx="47" cy="119" rx="9" ry="5" fill="#4FA844"/><ellipse cx="73" cy="119" rx="9" ry="5" fill="#4FA844"/>${arms}
      <path d="M60 30c27 0 43 20 43 47s-17 42-43 42-43-15-43-42 16-47 43-47Z" fill="#8FDB7E"/>
      <path d="M18 84c5 21 21 35 42 35s37-14 42-35c-8 13-23 21-42 21s-34-8-42-21Z" fill="#76C866"/>
      <ellipse cx="60" cy="94" rx="21" ry="15" fill="#D6F5CB"/>
      <path d="M60 31c-1-7 0-12 2-16" fill="none" stroke="#3E9B4A" stroke-width="4" stroke-linecap="round"/>
      <path class="lp-leaf" d="M62 16c6-10 19-10 23-5-4 8-15 10-23 5Z" fill="#4DB35B"/><path d="M60 18c-6-8-17-8-21-3 4 7 14 8 21 3Z" fill="#62C76F"/>
      <circle cx="38" cy="78" r="6" fill="#FF9AA8" opacity=".55"/><circle cx="82" cy="78" r="6" fill="#FF9AA8" opacity=".55"/>
      ${eye(47)}${eye(73)}${mouth}</g></svg>`;
  }

  const $ = id => document.getElementById(id), stage = $('stage');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const KEY = 'plateloop-survey-responses';
  const store = { all() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } },
                  add(r) { try { const a = this.all(); a.push(r); localStorage.setItem(KEY, JSON.stringify(a)); } catch (e) {} } };
  let G = null, i = 0, answers = {}, dir = 1, busy = false;
  $('logo').innerHTML = `${loopi('happy', 30)}<span class="w">Plate<span>Loop</span></span>`;

  const accent = c => document.documentElement.style.setProperty('--a', c);
  function show(html) { stage.innerHTML = `<div class="screen ${dir < 0 ? 'back-in' : ''}">${html}</div>`; }
  // fade the current screen out before the next one slides in
  function leave(then) {
    const s = stage.firstElementChild;
    if (calm || !s) return then();
    s.classList.add('out'); setTimeout(then, 200);
  }
  function chrome(on) {
    $('back').hidden = !on; $('prog').hidden = !on; $('count').hidden = !on;
    if (on) {
      const p = i / G.questions.length;
      $('fill').style.width = `${p * 100}%`; $('sprout').style.left = `${p * 100}%`;
      $('cnt').textContent = `QUESTION ${i + 1} OF ${G.questions.length}`; $('pct').textContent = `${Math.round(p * 100)}%`;
    }
  }
  // what Loopi says above each question
  function cheer() {
    const n = G.questions.length, q = G.questions[i];
    if (i === 0) return ['wave', 'Hi! Tap an answer and I’ll move us along.'];
    if (i === n - 1) return ['cheer', 'Last one!'];
    if (i === Math.floor(n / 2)) return ['cheer', 'Halfway there. Nice!'];
    if (q.type === 'lik') return ['think', '1 = not at all, 5 = completely.'];
    if (q.type === 'num') return ['point', 'A rough guess is fine.'];
    if (q.type === 'text') return ['happy', 'Optional. Say anything, or skip.'];
    return [['happy', 'point', 'wow'][i % 3], ['Quick one.', 'Go with your first instinct.', 'No right or wrong answers.', 'Thanks, this really helps.'][i % 4]];
  }

  function home() {
    G = null; chrome(false); dir = 1; accent('#30D158');
    show(`<div class="hero st">${loopi('wave', 96)}<div><div class="eyebrow">4-minute survey</div><h1>Help us cut <em>canteen food waste.</em></h1></div></div>
      <p class="lead st" style="--k:1">Anonymous questions about lunch, leftovers and nutrition. Pick the group that fits you best.</p>
      <div class="groups">${SURVEY.map((g, k) => `<button class="grp st" style="--k:${k + 2};--c:${COLORS[g.key]}" data-g="${g.key}"><span class="ic">${icon(g.key)}</span><span><b>${esc(g.title)}</b><small>${g.questions.length} questions · about 4 minutes</small></span><span class="arr">→</span></button>`).join('')}</div>
      <p class="fine st" style="--k:7">No names or emails are collected. Answers are used only to design PlateLoop, a student project for the EcoLoop hackathon.</p>`);
    stage.querySelectorAll('[data-g]').forEach(b => b.onclick = () => leave(() => start(b.dataset.g)));
  }
  function start(key) { G = SURVEY.find(g => g.key === key); i = 0; answers = {}; dir = 1; accent(COLORS[G.key]); history.replaceState(null, '', '#' + key.toLowerCase()); ask(); }

  function ask() {
    busy = false;
    const q = G.questions[i]; chrome(true);
    const v = answers[q.code], [expr, say] = cheer();
    let body = '', needsNext = true;
    if (q.type === 'cat') {
      needsNext = false;
      body = `<div class="opts">${q.options.map((o, k) => `<button class="opt st" style="--k:${k + 2}" data-v="${esc(o)}" aria-pressed="${v === o}"><span class="k">${String.fromCharCode(65 + k)}</span>${esc(o)}</button>`).join('')}</div>`;
    } else if (q.type === 'lik') {
      needsNext = false;
      body = `<div class="scale">${[1, 2, 3, 4, 5].map(n => `<button class="sc st" style="--k:${n + 1}" data-v="${n}" aria-pressed="${v === n}" aria-label="${n}">${n}</button>`).join('')}</div><div class="ends st" style="--k:7"><span>${esc(q.options[0])}</span><span>${esc(q.options[1])}</span></div>`;
    } else if (q.type === 'num') {
      body = `<div class="num st" style="--k:2"><button data-step="-1" aria-label="Less">−</button><input id="numv" type="number" inputmode="numeric" min="0" value="${v ?? ''}" placeholder="0"><button data-step="1" aria-label="More">+</button></div>`;
    } else {
      body = `<textarea class="st" style="--k:2" id="txt" placeholder="Type here, or skip">${esc(v || '')}</textarea>`;
    }
    const last = i === G.questions.length - 1;
    show(`<div class="guide"><span id="guide">${loopi(expr, 58)}</span><div class="bubble">${say}</div></div>
      <div class="q-code st">${q.code}</div><div class="q st" style="--k:1">${esc(q.text)}</div>${body}
      <div class="nav st" style="--k:8">${needsNext || v !== undefined ? `<button class="btn prim" id="next" ${q.type === 'num' && (v === undefined || v === '') ? 'disabled' : ''}>${last ? 'Submit' : 'Next'}</button>` : ''}${q.type === 'text' ? '<button class="btn ghost" id="skip">Skip</button>' : ''}</div>`);
    stage.querySelectorAll('[data-v]').forEach(b => b.onclick = e => {
      if (busy) return; busy = true;
      answers[q.code] = q.type === 'lik' ? +b.dataset.v : b.dataset.v;
      stage.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      if (!calm) {
        if (b.classList.contains('opt')) {
          const r = b.getBoundingClientRect(), dot = document.createElement('span');
          dot.className = 'ripple';
          dot.style.left = `${(e.clientX || r.left + r.width / 2) - r.left}px`; dot.style.top = `${(e.clientY || r.top + r.height / 2) - r.top}px`;
          b.appendChild(dot);
        }
        react();
      }
      setTimeout(next, calm ? 150 : 380); // auto-advance after a tap
    });
    const nv = $('numv');
    if (nv) {
      const sync = () => { answers[q.code] = nv.value === '' ? undefined : Math.max(0, Math.round(+nv.value)); $('next').disabled = answers[q.code] === undefined; };
      nv.oninput = sync; nv.onkeydown = e => { if (e.key === 'Enter' && !$('next').disabled) next(); };
      stage.querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
        nv.value = Math.max(0, (+nv.value || 0) + +b.dataset.step); sync();
        nv.classList.remove('bump'); void nv.offsetWidth; nv.classList.add('bump');
      });
      setTimeout(() => nv.focus(), 350);
    }
    const tx = $('txt'); if (tx) tx.oninput = () => { answers[q.code] = tx.value.trim(); };
    if ($('next')) $('next').onclick = () => { if (busy) return; busy = true; if (!calm) react(); setTimeout(next, calm ? 0 : 250); };
    if ($('skip')) $('skip').onclick = () => { if (busy) return; busy = true; answers[q.code] = ''; next(); };
  }
  // Loopi hops happily when you answer
  function react() {
    const g = $('guide'); if (!g) return;
    g.innerHTML = loopi('cheer', 58); g.firstElementChild.classList.add('hop');
  }
  function next() {
    if (i < G.questions.length - 1) leave(() => { i++; dir = 1; ask(); });
    else leave(submit);
  }
  $('back').onclick = () => leave(() => { if (!G) return home(); if (i > 0) { i--; dir = -1; ask(); } else home(); });

  function confetti() {
    if (calm) return;
    const box = document.createElement('div'); box.className = 'confetti';
    const cols = ['#30D158', '#8FDB7E', '#FF9F0A', '#0A84FF', '#7D7AFF', '#FFD60A'];
    box.innerHTML = Array.from({ length: 70 }, (_, k) => `<i class="${k % 3 ? '' : 'leaf'}" style="--x:${Math.random() * 100}%;--cc:${cols[k % cols.length]};--t:${2.2 + Math.random() * 1.8}s;--dl:${Math.random() * .5}s;--dx:${(Math.random() - .5) * 200}px;--r:${(Math.random() - .5) * 900}deg"></i>`).join('');
    document.body.appendChild(box); setTimeout(() => box.remove(), 4800);
  }

  async function submit() {
    const rec = { sheet: G.sheet, group: G.key, id: G.key[0] + Date.now().toString(36).toUpperCase(), codes: G.questions.map(q => q.code), answers, at: new Date().toISOString() };
    store.add(rec);
    let sent = false;
    if (window.SURVEY_ENDPOINT) {
      try { await fetch(window.SURVEY_ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(rec) }); sent = true; } catch (e) {}
    }
    chrome(false); $('prog').hidden = false; $('fill').style.width = '100%'; $('sprout').style.left = '100%';
    dir = 1;
    show(`<div class="done">${loopi('cheer', 150)}
      <h1>Thank you!</h1><p class="lead">Your answers help us design PlateLoop to waste less food and give people useful feedback on their meals.</p>
      <div class="nav"><button class="btn prim" id="again">Done</button></div></div>`);
    confetti();
    $('again').onclick = () => { history.replaceState(null, '', location.pathname); leave(home); };
    if (!sent && window.SURVEY_ENDPOINT) console.warn('Response saved in this browser only.');
  }

  // survey/#results: responses saved in this browser, as CSV in the analysis workbook's column order
  function results() {
    chrome(false);
    const all = store.all();
    show(`<h1>Responses</h1><p class="lead">Saved in this browser. Download a group as CSV and paste the rows into the matching tab of the analysis workbook.</p>
      <div class="res">${SURVEY.map(g => { const n = all.filter(r => r.group === g.key).length; return `<div><span><b>${esc(g.title)}</b><br><span>${n} response${n === 1 ? '' : 's'}</span></span><button data-csv="${g.key}" ${n ? '' : 'disabled'}>CSV</button></div>`; }).join('')}</div>
      ${window.SURVEY_ENDPOINT ? '' : '<p class="note">Online collection isn’t connected yet, so responses are only saved on the device they were filled in on. See docs/survey/HOW-TO-COLLECT-RESPONSES.md to send them to a Google Sheet.</p>'}`);
    stage.querySelectorAll('[data-csv]').forEach(b => b.onclick = () => {
      const g = SURVEY.find(x => x.key === b.dataset.csv), rows = all.filter(r => r.group === g.key);
      const cell = v => { const s = v === undefined || v === null ? '' : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
      const csv = [['ID', ...g.questions.map(q => q.code)].join(','), ...rows.map(r => [r.id, ...g.questions.map(q => r.answers[q.code])].map(cell).join(','))].join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = `plateloop-${g.key.toLowerCase()}-responses.csv`; a.click();
    });
  }

  const h = location.hash.slice(1).toLowerCase();
  if (h === 'results') results();
  else if (SURVEY.some(g => g.key.toLowerCase() === h)) start(SURVEY.find(g => g.key.toLowerCase() === h).key);
  else home();
})();
</script>
</body>
</html>
