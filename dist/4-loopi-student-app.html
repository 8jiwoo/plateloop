<body>
<div id="root"></div>
<noscript>PlateLoop needs JavaScript to run.</noscript>
<script>
/* ---- js/core.js ---- */
/* PlateLoop core: shared data, before/after scans, state store (synced across tabs and files),
   pixel pet + tray renderers. The four apps (model, scanner, kitchen, student) all use PL.store. */
(() => {
'use strict';
const PL = window.PL = { apps: {} };

/* ------------------------------------------------------------ utils */
const $ = PL.$ = (s, r = document) => r.querySelector(s);
PL.$$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = PL.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
PL.pct = v => Math.round(v * 100) + '%';
PL.fmt1 = v => (Math.round(v * 10) / 10).toFixed(1);
PL.money = v => 'S$' + Math.round(v).toLocaleString('en-US');
PL.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
PL.reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rng = PL.rng = seed => { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
PL.toast = msg => {
  document.querySelectorAll('.toast').forEach(o => o.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, 3400);
};

/* ------------------------------------------------------------ motion: every app calls PL.motion(container, key) after it
   renders. When the key changes (a new tab, view or screen), cards rise in one after another, bars and rings fill from
   zero and numbers count up. Re-renders with the same key (live updates) stay still, so nothing flickers. */
const COUNT = /^([^\d-]*)(-?[\d,]*\.?\d+)(.*)$/;
PL.countUp = (el, dur = 700, delay = 0) => {
  const txt = el.textContent.trim(), m = COUNT.exec(txt); if (!m || el.children.length || /\d:\d|#/.test(txt)) return; // not clock times or ranks
  const [, pre, raw, post] = m, to = parseFloat(raw.replace(/,/g, '')), dec = (raw.split('.')[1] || '').length, comma = raw.includes(',');
  if (!isFinite(to) || Math.abs(to) < 2 && !dec) return;
  const show = v => pre + (comma ? v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) : v.toFixed(dec)) + post;
  const t0 = performance.now() + delay; el.textContent = show(0);
  const step = now => { if (!el.isConnected) return; const k = Math.min(1, Math.max(0, (now - t0) / dur)), e = 1 - Math.pow(1 - k, 3); el.textContent = show(to * e); if (k < 1) requestAnimationFrame(step); else el.textContent = show(to); };
  requestAnimationFrame(step);
  setTimeout(() => { if (el.isConnected) el.textContent = show(to); }, delay + dur + 400); // background tabs pause frames
};
const lastKey = new WeakMap();
const RISE = '.vcard,.card,.kpi,.vtip,.vring,.insight,.kio-meta>div,.kio-chips>span,.kio-steps>div,.g-row,.lbrow,.hplate figure,.slot-card,.pl-rise';
PL.motion = (el, key, opts = {}) => {
  if (!el || PL.reduceMotion || !el.animate) return;
  if (lastKey.get(el) === key && !opts.force) return;
  lastKey.set(el, key);
  el.dataset.enter = ''; clearTimeout(el._enterT); el._enterT = setTimeout(() => delete el.dataset.enter, 1300);
  if (opts.slide) el.animate([{ opacity: 0, transform: `translateX(${opts.slide * 18}px)` }, { opacity: 1, transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' });
  [...el.querySelectorAll(RISE)].filter(n => !n.closest('[data-still]')).slice(0, 18).forEach((n, i) =>
    n.animate([{ opacity: 0, transform: 'translateY(14px) scale(.985)' }, { opacity: 1, transform: 'none' }], { duration: 480, delay: 40 + i * 45, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
  el.querySelectorAll('i[style*="width:"],b[style*="width:"]').forEach((n, i) => {
    if (n.closest('[data-still]')) return;
    n.style.transformOrigin = 'left center';
    n.animate([{ transform: 'scaleX(0)' }, { transform: 'none' }], { duration: 750, delay: 120 + Math.min(i, 14) * 35, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
  });
  [...el.querySelectorAll('.num,.kpi .v,.big-num')].slice(0, 40).forEach((n, i) => { if (!n.closest('[data-still]')) PL.countUp(n, 750, 80 + Math.min(i, 10) * 30); });
};

/* ------------------------------------------------------------ constants */
const MENU = PL.MENU = [
  { id: 'kailan', n: { c: .04, p: .03, f: .04 }, name: 'Stir-fried kailan', group: 'veg', g: { S: 30, M: 45, L: 60 }, kcal: .6, price: .009, color: '#3F7D32', edge: '#2A5A22', slot: [0, 0] },
  { id: 'cabbage', n: { c: .05, p: .012, f: .02 }, name: 'Braised cabbage', group: 'veg', g: { S: 25, M: 35, L: 45 }, kcal: .4, price: .004, color: '#D8E6A8', edge: '#9DB36A', slot: [1, 0] },
  { id: 'melon', n: { c: .08, p: .006, f: .002 }, name: 'Watermelon', group: 'fruit', g: { S: 50, M: 70, L: 90 }, kcal: .3, price: .004, color: '#F2545B', edge: '#B8323A', slot: [2, 0] },
  { id: 'rice', n: { c: .32, p: .03, f: .003 }, name: 'Brown rice mix', group: 'grain', g: { S: 170, M: 230, L: 290 }, kcal: 1.45, price: .0032, color: '#F3EDDA', edge: '#BFB28E', slot: [0, 1] },
  { id: 'chicken', n: { c: .03, p: .22, f: .08 }, name: 'Soy sauce chicken', group: 'protein', g: { S: 80, M: 115, L: 150 }, kcal: 1.75, price: .012, color: '#9C5A2E', edge: '#6B3A1A', slot: [1, 1] },
  { id: 'soup', n: { c: .04, p: .02, f: .01 }, name: 'ABC soup', group: 'soup', g: { S: 150, M: 200, L: 250 }, kcal: .3, price: .0021, color: '#E8A25C', edge: '#B8722F', slot: [2, 1] },
];
const DISH = PL.DISH = Object.fromEntries(MENU.map(d => [d.id, d]));
/* nutrition: per-lunch targets for a Secondary 3 student (illustrative, about a third of the daily need) */
PL.TARGET = { kcal: 700, c: 100, p: 30, f: 22 };
PL.NUTRIENTS = [['kcal', 'Calories', 'kcal'], ['c', 'Carbs', 'g'], ['p', 'Protein', 'g'], ['f', 'Fat', 'g']];
PL.nutrientsOf = grams => {
  const o = { kcal: 0, c: 0, p: 0, f: 0 };
  MENU.forEach(d => { const g = grams[d.id] || 0; o.kcal += g * d.kcal; o.c += g * d.n.c; o.p += g * d.n.p; o.f += g * d.n.f; });
  return { kcal: Math.round(o.kcal), c: Math.round(o.c), p: Math.round(o.p), f: Math.round(o.f) };
};
/** Nuvilab-style status for one nutrient against the lunch target. */
PL.nStatus = (k, v) => { const r = v / PL.TARGET[k]; return r < .8 ? 'low' : r > 1.3 ? 'high' : 'ok'; };
/* environment equivalents (illustrative factors: 2.5 kg CO2e per kg food, a pine tree absorbs ~6.6 kg CO2 a year, a car emits ~0.17 kg CO2 per km) */
PL.env = kg => { const co2 = kg * 2.5; return { kg, co2, trees: co2 / 6.6, km: co2 / .17 }; };
PL.CRAVING = 'kailan';

function seedLog(baseline, r) {
  return DAYS.map(d => {
    const w = clamp(baseline * (0.55 + r() * 0.7), 0.02, 0.6);
    const portion = r() < .3 ? 'S' : r() < .85 ? 'M' : 'L';
    const std = PL.nutrientsOf(Object.fromEntries(MENU.map(x => [x.id, x.g[portion]])));
    const k = 1 - w * (.8 + r() * .4);
    return { day: d, portion, w, pts: Math.round(22 + (baseline - w) / baseline * 14 + r() * 8), n: { kcal: Math.round(std.kcal * k), c: Math.round(std.c * k), p: Math.round(std.p * k * (.85 + r() * .3)), f: Math.round(std.f * k) } };
  }).reverse();
}
function freshState() {

/* ------------------------------------------------------------ store (localStorage + cross-tab sync) */
const KEY = 'plateloop-sg-v9';
const chan = 'BroadcastChannel' in window ? new BroadcastChannel('plateloop') : null;
const subs = new Set();
function readStored() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!s || s.v !== 8) return null;
    if (s.today.co2 == null) s.today.co2 = 11200; // saves from before the live CO₂ counter
    return s;
  } catch (e) { return null; }
}
PL.S = readStored() || freshState();
PL.store = {
  save(kind = 'update') {
    try { localStorage.setItem(KEY, JSON.stringify(PL.S)); } catch (e) {}
    if (chan) chan.postMessage(kind);
    subs.forEach(fn => fn(kind, true));
  },
  subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
  reset() { PL.S = freshState(); this.save('reset'); },
};
const pull = kind => { const s = readStored(); if (s) { PL.S = s; subs.forEach(fn => fn(kind || 'update', false)); } };
// Both: BroadcastChannel is instant between tabs, and the storage event also covers pages opened as local files.
if (chan) chan.onmessage = e => pull(e.data);
addEventListener('storage', e => { if (e.key === KEY) pull('update'); });

/* ------------------------------------------------------------ lookups + leaderboards */
PL.student = id => PL.S.students.find(s => s.id === id);
PL.stageOf = xp => [...STAGES].reverse().find(s => xp >= s.at);
PL.nextStage = xp => STAGES.find(s => s.at > xp);
PL.formOf = pet => Object.entries({ leafy: pet.c.veg, crystal: pet.c.lowWaste, guardian: pet.c.balanced, explorer: pet.c.quests * 2 }).sort((a, b) => b[1] - a[1])[0][0];
PL.moodOf = pet => { const a = (pet.en + pet.nu + pet.jo) / 3; return a < 40 ? 'sleepy' : a < 62 ? 'happy' : 'joy'; };
PL.clock = () => { const m = Math.round(PL.S.today.clock); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; };
PL.classStats = c => { const w = c.ret / c.served; return { w, red: (c.base - w) / c.base }; };
PL.classRows = () => PL.S.classes.map(c => ({ c, ...PL.classStats(c) })).sort((a, b) => b.red - a.red);
PL.studentRows = () => [...PL.S.students].sort((a, b) => b.week - a.week || a.name.localeCompare(b.name));
PL.streakRows = () => [...PL.S.students].sort((a, b) => b.pet.streak - a.pet.streak || b.week - a.week);
PL.cls32Scanned = () => PL.S.students.filter(s => s.cls === '3B' && s.scanned).length;
PL.schoolRows = () => {
  const cr = PL.S.classes.map(PL.classStats);
  const us = { id: 'harbourlight', name: PL.SCHOOL, us: true, red: cr.reduce((a, c) => a + c.red, 0) / cr.length, acc: .93, kg: PL.S.term.kg };
  return [us, ...SCHOOLS].sort((a, b) => b.red - a.red);
};
PL.todayTotals = () => { let sv = 0, lf = 0, val = 0; MENU.forEach(d => { const x = PL.S.today.dish[d.id]; sv += x.served; lf += x.ret; val += x.ret * d.price; }); return { sv, lf, val, w: lf / sv }; };

/* ------------------------------------------------------------ one scanner, two scans per tray
   BEFORE lunch: the tray is weighed and photographed full, which records what was served.
   AFTER lunch: the same scanner measures what is left. eaten = before − after. */
const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
const STANDARD_M = Object.fromEntries(MENU.map(d => [d.id, d.g.M]));
PL.portionOf = served => { const r = sum(served) / sum(STANDARD_M); return r < .87 ? 'S' : r > 1.12 ? 'L' : 'M'; };
PL.scanState = st => st.scanned ? 'done' : st.before ? 'eating' : 'none';

function scoreMeal(st, served, measured, portion) {
  const pet = st.pet;
  const total = sum(served), left = sum(measured);
  const w = left / total;
  const improvement = (st.baseline - w) / st.baseline;
  let energy = clamp(Math.round(10 + 14 * improvement), 2, 25);
  const rightSized = portion === 'S' && w < .12;
  if (rightSized) energy = 25;
  const eaten = id => 1 - measured[id] / served[id];
  const groups = ['grain', 'protein', 'veg', 'fruit'].filter(g => MENU.some(d => d.group === g && eaten(d.id) >= .5));
  const nutrition = groups.length * 5;
  const vegTried = MENU.some(d => d.group === 'veg' && eaten(d.id) >= .5);
  const tasted = eaten(PL.CRAVING) >= .2;
  const questDone = tasted && pet.quest < 3;
  const lowWaste = w < .15;
  const streak = lowWaste ? pet.streak + 1 : 0;
  const joy = 4 + (streak >= 3 ? 6 : 0) + (questDone ? 15 : 0);
  const xp = energy + nutrition + joy;
  const mood = w < .12 ? 'joy' : w < .3 ? 'happy' : 'meh';
  let line;
  if (rightSized) line = 'Perfect portion! A small plate, all eaten. Full energy for me!';
  else if (questDone) line = `You tasted the ${DISH[PL.CRAVING].name.toLowerCase()}! Quest ${pet.quest + 1} of 3 done!`;
  else if (improvement > .3) line = 'Way less left than usual. I feel super strong!';
  else if (w < .3) line = 'Yum, thanks for lunch! Nice job.';
  else line = 'Lots came back today. Take a smaller portion tomorrow and I still get full energy!';
  return { w, served: total, left, improvement, energy, nutrition, joy, xp, groups, vegTried, questDone, lowWaste, streak, mood, line, rightSized };
}

/** BEFORE lunch. portion: what the kitchen served (S/M/L); the scanner measures the real grams.
 *  pick (optional): dish id → serving multiplier, when the student asked for less or more of a dish. */
PL.scanBefore = (sid, portion, method = 'face', pick = null) => {
  const st = PL.student(sid), T = PL.S.today;
  const served = Object.fromEntries(MENU.map(d => [d.id, Math.max(1, Math.round(d.g[portion] * (pick && pick[d.id] || 1) * (.94 + Math.random() * .12)))]));
  const tray = ++T.trayNo;
  T.clock += .2;
  st.before = { served, t: PL.clock(), tray, method };
  MENU.forEach(d => { T.servedNow[d.id] += served[d.id]; });
  T.eating += 1;
  const total = sum(served);
  T.feed.unshift({ kind: 'before', t: PL.clock(), tray, cls: st.cls, sid, method, portion: PL.portionOf(served), served: total });
  T.feed = T.feed.slice(0, 60);
  PL.S.lastScan = { sid, at: Date.now(), kind: 'before' };
  return { served, total, n: PL.nutrientsOf(served), kcal: PL.nutrientsOf(served).kcal, portion: PL.portionOf(served), tray, method };
};

/** AFTER lunch. eatPct: dish id → % eaten (0–100). Without a before scan the standard portion is assumed. */
PL.scanAfter = (sid, eatPct, method = 'face') => {
  const st = PL.student(sid), pet = st.pet, T = PL.S.today;
  const clsRankBefore = PL.classRows().findIndex(r => r.c.id === st.cls) + 1;
  const meRankBefore = PL.studentRows().findIndex(s => s.id === sid) + 1;
  let served = st.before && st.before.served, estimated = false, tray = st.before && st.before.tray;
  if (!served) { served = { ...STANDARD_M }; estimated = true; tray = ++T.trayNo; MENU.forEach(d => { T.servedNow[d.id] += served[d.id]; }); }
  else T.eating = Math.max(0, T.eating - 1);
  const portion = PL.portionOf(served);
  const measured = Object.fromEntries(MENU.map(d => {
    const g = served[d.id], tru = g * (1 - eatPct[d.id] / 100);
    return [d.id, tru < 1 ? 0 : clamp(tru + (Math.random() * 4 - 2), 0, g)];
  }));
  const r = scoreMeal(st, served, measured, portion);
  pet.xp += r.xp;
  pet.en = clamp(Math.round(pet.en * .55 + r.energy * 4 * .45), 5, 100);
  pet.nu = clamp(Math.round(pet.nu * .55 + r.nutrition * 5 * .45), 5, 100);
  pet.jo = clamp(Math.round(pet.jo * .6 + (40 + r.joy * 3) * .4), 5, 100);
  pet.streak = r.streak;
  if (r.vegTried) pet.c.veg++;
  if (r.lowWaste) pet.c.lowWaste++;
  if (r.groups.length >= 3) pet.c.balanced++;
  if (r.questDone) { pet.c.quests++; pet.quest++; }
  st.week += r.xp;
  st.scanned = true;
  r.intake = PL.nutrientsOf(Object.fromEntries(MENU.map(d => [d.id, served[d.id] - measured[d.id]])));
  r.zero = r.w < .05;
  // CO₂e avoided on this tray compared with the student's usual leftovers, in grams (shown live to the student)
  r.co2 = Math.round(Math.max(0, st.baseline * r.served - r.left) / 1000 * PL.CO2_PER_KG * 1000);
  T.co2 = (T.co2 || 0) + r.co2;
  if (r.zero) { T.zero = (T.zero || 0) + 1; PL.S.term.zero = (PL.S.term.zero || 0) + 1; }
  st.after = { t: (T.clock += .35, PL.clock()), left: r.left, w: r.w, intake: r.intake, zero: r.zero, served, measured, co2: r.co2 };
  st.log.unshift({ day: 'Fri 25', portion, w: r.w, pts: r.xp, n: r.intake });
  st.log = st.log.slice(0, 6);
  r.servedBy = served; r.measured = measured;
  r.game = PL.game ? PL.game.feedLunch(st, r) : null; // Loopi's hunger, hearts and the plate in its bowl
  // completed trays feed the kitchen's waste numbers and the class league
  MENU.forEach(d => { T.dish[d.id].served += served[d.id]; T.dish[d.id].ret += measured[d.id]; });
  T.trays++;
  const c = PL.S.classes.find(c => c.id === st.cls);
  c.served += r.served / 1000; c.ret += r.left / 1000; c.xp += Math.max(2, Math.round((c.base - r.w) * 40));
  PL.S.term.meals++;
  PL.S.term.kg += Math.max(0, r.served / 1000 * (PL.SCHOOL_BASELINE - r.w));
  T.feed.unshift({ kind: 'after', t: PL.clock(), tray, cls: st.cls, sid, method, portion, w: r.w, xp: r.xp, served: r.served, left: r.left, estimated, zero: r.zero, kcal: r.intake.kcal });
  T.feed = T.feed.slice(0, 60);
  Object.assign(r, { clsRank: PL.classRows().findIndex(x => x.c.id === st.cls) + 1, clsRankBefore, meRank: PL.studentRows().findIndex(s => s.id === sid) + 1, meRankBefore, measured, portion, sid, tray, estimated });
  PL.S.lastScan = { sid, at: Date.now(), kind: 'after', xp: r.xp, line: r.line };
  return r;
};
/** Both scans in one go (used to simulate the rest of the class). */
PL.scanTray = (sid, portion, eatPct) => { if (!PL.student(sid).before) PL.scanBefore(sid, portion); return PL.scanAfter(sid, eatPct); };
PL.zeroRate = () => { const t = PL.S.today; return t.trays ? t.zero / t.trays : 0; };
/** Simulate everyone in class 3B who hasn't finished both scans yet. */
PL.scanRestOfClass = () => {
  let n = 0;
  PL.S.students.filter(s => s.cls === '3B' && !s.scanned).forEach(s => {
    const p = Math.random() < .3 ? 'S' : Math.random() < .8 ? 'M' : 'L';
    const f = (s.baseline / .3) * (.5 + Math.random() * .6);
    PL.scanTray(s.id, p, Object.fromEntries(MENU.map(d => [d.id, Math.round(clamp(1 - TYPICAL_LEFT[d.id] * f, 0, 1) * 100)])));
    n++;
  });
  return n;
};

/* ------------------------------------------------------------ pixel pet renderer (LCD style) */
const LCD = PL.LCD = { bg: '#DDE4D4', ink: '#1D1D1F', mid: '#9AA592' };
const ACC_SLOT = { cap: 'head', crown: 'head', halo: 'head', headphones: 'head', bow: 'side', flower: 'side', glasses: 'face', scarf: 'neck', wings: 'back', aura: 'aura' };
PL.drawPet = (cv, o) => {
  // o.ink / o.mid recolour the outline and shading; o.fill paints the body (for the full-colour room)
  const INK = o.ink || LCD.ink, MID = o.mid || LCD.mid, FILL = o.fill || null;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.imageSmoothingEnabled = false;
  if (o.bg === 'none') ctx.clearRect(0, 0, W, H); else { ctx.fillStyle = o.bg || LCD.bg; ctx.fillRect(0, 0, W, H); }
  const rows = o.rows || 30;
  const u = Math.max(1, Math.floor(H / rows));
  const cols = Math.floor(W / u);
  const ox = Math.floor((W - cols * u) / 2), oy = Math.floor((H - rows * u) / 2);
  const P = (x, y, c = INK) => { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= cols || y >= rows) return; ctx.fillStyle = c; ctx.fillRect(ox + x * u, oy + y * u, u, u); };
  const t = o.t || 0, cx = cols / 2, ground = rows - 4;
  if (!o.noGround) for (let x = 2; x < cols - 2; x += 2) P(x, ground + 1, MID);
  const ell = (ecx, ecy, rx, ry, dither = true) => {
    const inside = (x, y) => ((x + .5 - ecx) / rx) ** 2 + ((y + .5 - ecy) / ry) ** 2 <= 1;
    for (let y = Math.floor(ecy - ry - 1); y <= Math.ceil(ecy + ry + 1); y++)
      for (let x = Math.floor(ecx - rx - 1); x <= Math.ceil(ecx + rx + 1); x++) {
        if (!inside(x, y)) continue;
        const edge = !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1);
        if (edge) P(x, y); else { if (FILL) P(x, y, FILL); if ((dither || FILL) && y > ecy + ry * .35 && (x + y) % 2 === 0) P(x, y, MID); }
      }
  };
  if (o.stage === 'egg') {
    const wob = t % 4 === 1 ? 1 : t % 4 === 3 ? -1 : 0, ex = cx + wob, ery = 8.5, ey = ground - ery;
    ell(ex, ey, 6.5, ery, false);
    [[-2, -3], [2, -1], [-1, 2], [3, 3], [0, -6]].forEach(([dx, dy]) => { P(ex + dx - .5, ey + dy, MID); P(ex + dx + .5, ey + dy, MID); });
    if ((o.progress || 0) > .6) [[-3, -1], [-2, 0], [-1, -1], [0, 0], [1, -1], [2, 0]].forEach(([dx, dy]) => P(ex + dx, ey + dy - 1));
    return;
  }
  const [rx, ry] = { baby: [5, 4.2], child: [7, 5.8], adult: [8.8, 7.2] }[o.stage];
  const bob = (t % 2) ? 1 : 0;
  const by = ground - ry - (o.stage === 'baby' ? 0 : 1.5) - bob;
  ell(cx, by, rx, ry);
  if (o.stage !== 'baby') { P(cx - 3, ground); P(cx - 2, ground); P(cx + 2, ground); P(cx + 3, ground); P(cx - 3, ground - 1); P(cx + 3, ground - 1); }
  if (o.stage === 'adult') { const wave = t % 2 ? -1 : 0; P(cx - rx - 1, by + 1 + wave); P(cx - rx - 2, by + wave); P(cx + rx + 1, by + 1); P(cx + rx + 2, by + 2); }
  const ex = Math.round(rx * .42), ey = Math.round(by - ry * .15), blink = t % 9 === 0;
  const eye = x => {
    const m = o.mood;
    if (m === 'sleepy' || blink) { P(x - 1, ey); P(x, ey); P(x + 1, ey); }
    else if (m === 'joy') { P(x - 1, ey + 1); P(x, ey); P(x + 1, ey + 1); }
    else if (m === 'meh') { P(x, ey); P(x, ey + 1); }
    else { P(x, ey); P(x + 1, ey); P(x, ey + 1); P(x + 1, ey + 1); }
  };
  eye(Math.round(cx - ex - .5)); eye(Math.round(cx + ex - .5));
  const my = ey + 3, mx = Math.round(cx - .5);
  if (o.mood === 'joy') { for (let i = -2; i <= 2; i++) P(mx + i, my); P(mx - 1, my + 1); P(mx, my + 1); P(mx + 1, my + 1); P(Math.round(cx - ex - 2.5), my - 1, MID); P(Math.round(cx + ex + 1.5), my - 1, MID); }
  else if (o.mood === 'happy') { P(mx - 2, my); P(mx + 2, my); P(mx - 1, my + 1); P(mx, my + 1); P(mx + 1, my + 1); }
  else if (o.mood === 'meh') { P(mx - 1, my + 1); P(mx, my + 1); P(mx + 1, my + 1); }
  else P(mx, my + 1);
  if (o.mood === 'sleepy') { const zx = cx + rx + 1, zy = by - ry - 2 - (t % 3); [[0, 0], [1, 0], [2, 0], [1, 1], [0, 2], [1, 2], [2, 2]].forEach(([a, b]) => P(zx + a, zy + b)); }

    const a = o.acc, xc = cx - .5, I = INK, M = MID;

    else if (a === 'crown') { for (let x = -3; x <= 3; x++) { P(xc + x, top - 1); P(xc + x, top - 2, Math.abs(x) === 3 || x === 0 ? I : M); } [-3, 0, 3].forEach(x => P(xc + x, top - 3)); P(xc, top - 4); }
    else if (a === 'halo') { const y0 = top - 4; for (let x = -2; x <= 2; x++) { P(xc + x, y0 - 1); P(xc + x, y0 + 1); } P(xc - 3, y0); P(xc + 3, y0); if (t % 2) P(xc + 4, y0 - 2, M); }
    else if (a === 'headphones') { for (let k = 0; k <= 16; k++) { const ang = Math.PI * (.12 + .76 * k / 16); P(cx + Math.cos(ang) * (rx + 1) - .5, by - Math.sin(ang) * (ry + 1)); } [-1, 1].forEach(s => { const x0 = Math.round(cx + s * (rx + 1) - .5); for (let y = -1; y <= 1; y++) { P(x0, ey + y); P(x0 - s, ey + y, M); } }); }
    else if (a === 'bow') { const bx = Math.round(cx + rx * .55), y0 = top + 1; P(bx, y0, M); [-1, -2, 1, 2].forEach(dx => { P(bx + dx, y0 - 1); P(bx + dx, y0 + 1); if (Math.abs(dx) === 2) P(bx + dx, y0); }); }
    else if (a === 'flower') { const fx = Math.round(cx - rx * .55), fy = top + 1; P(fx, fy, M); P(fx, fy - 1); P(fx, fy + 1); P(fx - 1, fy); P(fx + 1, fy); }
    else if (a === 'glasses') { const xs = [Math.round(cx - ex - .5), Math.round(cx + ex - .5)]; xs.forEach(x0 => { for (let x = -2; x <= 2; x++) { P(x0 + x, ey - 1); P(x0 + x, ey + 2); } P(x0 - 2, ey); P(x0 - 2, ey + 1); P(x0 + 2, ey); P(x0 + 2, ey + 1); }); for (let x = xs[0] + 3; x <= xs[1] - 3; x++) P(x, ey); }
    else if (a === 'scarf') { const y = Math.round(by + ry * .3); for (let x = Math.round(cx - rx * .85); x <= Math.round(cx + rx * .85); x++) { P(x, y); P(x, y + 1, M); } P(xc + 3, y + 2); P(xc + 3, y + 3); P(xc + 4, y + 3, M); }
    else if (a === 'wings') { const flap = t % 2; [-1, 1].forEach(s => [[0, 0, M], [1, -1, M], [1, 0, M], [2, -2, I], [2, -1, M], [2, 0, I], [1, 1, I], [3, -2, I]].forEach(([dx, dy, c]) => P(cx + s * (rx + 1 + dx) - .5, by - 1 + dy - flap, c))); }
    else if (a === 'aura') { for (let k = 0; k < 4; k++) { const ang = t * .6 + k * Math.PI / 2, x0 = Math.round(cx + Math.cos(ang) * (rx + 3) - .5), y0 = Math.round(by + Math.sin(ang) * (ry + 1)); P(x0, y0); if ((t + k) % 2) { P(x0 - 1, y0, M); P(x0 + 1, y0, M); P(x0, y0 - 1, M); P(x0, y0 + 1, M); } } }
  };
  if (o.stage === 'baby') { if (!headAcc) { P(cx - .5, top - 1); P(cx - .5, top - 2); } drawAcc(); return; }
  if (headAcc && f !== 'guardian') { /* hats and crowns replace the form's head decoration */ }
  else if (f === 'leafy') {
    P(cx - .5, top - 1); P(cx - .5, top - 2);
    [[-1, -3], [-2, -3], [-3, -4], [-2, -4], [-4, -5], [-3, -5], [-2, -5]].forEach(([a, b]) => { P(cx - .5 + a, top + b); P(cx - .5 - a, top + b + (full ? 0 : 1)); });
    if (full) [[-3, 2], [3, 3], [-1, 4]].forEach(([a, b]) => P(cx + a, by + b, MID));

    for (let i = 0; i <= h; i++) for (let j = -i; j <= i; j++) P(cx - .5 + j, top - 1 - (2 * h - i), Math.abs(j) === i ? INK : MID);
    for (let i = h - 1; i >= 0; i--) for (let j = -i; j <= i; j++) P(cx - .5 + j, top - 1 - i, Math.abs(j) === i ? INK : MID);
    if (full && t % 2 === 0) [[-rx - 3, -ry], [rx + 2, -ry + 2]].forEach(([a, b]) => { P(cx + a, by + b); P(cx + a - 1, by + b); P(cx + a + 1, by + b); P(cx + a, by + b - 1); P(cx + a, by + b + 1); });
  } else if (f === 'guardian') {
    const yb = Math.round(by - ry * .62);
    for (let x = Math.round(cx - rx * .8); x <= Math.round(cx + rx * .8); x++) P(x, yb);
    P(cx - .5, yb - 1); P(cx - .5, yb - 2);
    if (full) { const sx = Math.round(cx + rx + 1), sy = Math.round(by - 1); for (let y = 0; y < 5; y++) { P(sx, sy + y); P(sx + 3, sy + y); } for (let x = 0; x <= 3; x++) P(sx + x, sy); P(sx + 1, sy + 5); P(sx + 2, sy + 5); P(sx + 1, sy + 2, MID); P(sx + 2, sy + 2, MID); }
  } else if (f === 'explorer') {
    const w = Math.round(rx * (full ? .95 : .7));
    for (let x = -w; x <= w; x++) P(cx - .5 + x, top);
    for (let x = -2; x <= 2; x++) { P(cx - .5 + x, top - 1); P(cx - .5 + x, top - 2, x === -2 || x === 2 ? INK : MID); }
    for (let x = -2; x <= 2; x++) P(cx - .5 + x, top - 3);
    if (full) { const bx = Math.round(cx - rx - 3), byy = Math.round(by - 2); for (let y = 0; y < 5; y++) { P(bx, byy + y); P(bx + 2, byy + y); } P(bx + 1, byy); P(bx + 1, byy + 4); P(bx + 1, byy + 2, MID); }

/** A small canvas showing a student's (or class's) current pet. */
PL.petCanvas = (w, h, o) => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; PL.drawPet(cv, { rows: 30, ...o }); return cv; };
/** A student's Loopi stage comes from the game (hearts → evolve); before game.js loads, fall back to XP. */
PL.stuStage = st => st.game ? STAGES[st.game.stage] : PL.stageOf(st.pet.xp);

  const mood = g && g.hunger === 0 ? 'sleepy' : PL.moodOf(st.pet);
  return { stage: PL.stuStage(st).id, form: PL.formOf(st.pet), mood, progress: g ? g.hearts / Math.max(1, (PL.game ? PL.game.heartsReq(g) : 3)) : st.pet.xp / 40, acc: g ? g.eq : null };
};
/** Replace every <canvas data-pet="sid"> / data-cls="id"> inside root with a drawn pet. */
PL.paintPets = (root, t = 0) => {
  PL.$$('canvas[data-pet]', root).forEach(cv => { const st = PL.student(cv.dataset.pet); if (st) PL.drawPet(cv, { rows: 30, t, ...PL.petOf(st) }); });
  PL.$$('canvas[data-cls]', root).forEach(cv => { const c = PL.S.classes.find(c => c.id === cv.dataset.cls); if (c) PL.drawPet(cv, { rows: 30, t, stage: PL.stageOf(c.xp).id, form: c.form, mood: PL.classStats(c).red > .25 ? 'joy' : 'happy' }); });

PL.lcdText = (cv, lines) => {

/* ------------------------------------------------------------ tray (top view SVG) */
const CELL = { x: [22, 144, 266], w: 112, y: [22, 138], h: [106, 140] };
const PORTION_F = { S: .74, M: 1, L: 1.18 };
function blobPath(cx, cy, rx, ry, seed) {
  const n = 14, pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, k = 1 + .09 * Math.sin(3 * a + seed) + .06 * Math.sin(5 * a + seed * 2.3); pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); }
  let d = '';
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    if (i === 0) d += `M${((p[0] + q[0]) / 2).toFixed(1)},${((p[1] + q[1]) / 2).toFixed(1)}`;
    const nx = pts[(i + 1) % n], nn = pts[(i + 2) % n];
    d += ` Q${nx[0].toFixed(1)},${nx[1].toFixed(1)} ${((nx[0] + nn[0]) / 2).toFixed(1)},${((nx[1] + nn[1]) / 2).toFixed(1)}`;
  }

PL.traySVG = ({ portion = 'M', left = null, scanning = false, labels = null, empty = false, id = 'tg' }) => {
  let s = `<svg viewBox="0 0 400 300" role="img" aria-label="Lunch tray, top view"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--steel-2)"/><stop offset="1" stop-color="var(--steel)"/></linearGradient></defs>`;
  s += `<rect x="6" y="6" width="388" height="288" rx="22" fill="url(#${id})" stroke="var(--steel-edge)" stroke-width="2"/>`;
  MENU.forEach(d => { const [ci, ri] = d.slot; s += `<rect x="${CELL.x[ci]}" y="${CELL.y[ri]}" width="${CELL.w}" height="${CELL.h[ri]}" rx="14" fill="var(--steel-2)" stroke="var(--steel-edge)" stroke-width="1.5"/>`; });
  if (!empty) MENU.forEach((d, i) => {
    const [ci, ri] = d.slot, cx = CELL.x[ci] + CELL.w / 2, cy = CELL.y[ri] + CELL.h[ri] / 2;
    const frac = (left ? left[d.id] : 1) * PORTION_F[portion];
    if (frac <= 0.01) return;
    const k = Math.sqrt(frac);
    if (d.id === 'soup') {
      s += `<circle cx="${cx}" cy="${cy}" r="46" fill="#F7F7F2" stroke="var(--steel-edge)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="${(38 * Math.min(1, k)).toFixed(1)}" fill="${d.color}"/>`;
      s += `<circle cx="${cx - 10}" cy="${cy - 8}" r="${(5 * k).toFixed(1)}" fill="#E7C08A" opacity=".8"/><circle cx="${cx + 12}" cy="${cy + 6}" r="${(4 * k).toFixed(1)}" fill="#6E8F3A" opacity=".8"/>`;
    } else {
      const rx = CELL.w * .36 * k, ry = CELL.h[ri] * .33 * k;
      s += `<path d="${blobPath(cx, cy, Math.min(rx, CELL.w * .45), Math.min(ry, CELL.h[ri] * .44), i * 1.7)}" fill="${d.color}" stroke="${d.edge}" stroke-width="1.5"/>`;
      if (d.id === 'rice') for (let j = 0; j < 14; j++) { const a = j * 2.4, rr = (j % 5) / 5 * .8; s += `<ellipse cx="${(cx + Math.cos(a) * rx * rr).toFixed(1)}" cy="${(cy + Math.sin(a) * ry * rr).toFixed(1)}" rx="2.2" ry="1.3" fill="#8C6B4A" opacity=".5"/>`; }
      if (d.id === 'cabbage' || d.id === 'chicken' || d.id === 'kailan') for (let j = 0; j < 5; j++) { const a = j * 1.9 + i; s += `<ellipse cx="${(cx + Math.cos(a) * rx * .45).toFixed(1)}" cy="${(cy + Math.sin(a) * ry * .45).toFixed(1)}" rx="${(6 * k).toFixed(1)}" ry="${(3 * k).toFixed(1)}" fill="${d.edge}" opacity=".55" transform="rotate(${j * 40} ${cx} ${cy})"/>`; }
      if (d.id === 'melon') for (let j = 0; j < 6; j++) s += `<ellipse cx="${(cx - 20 + (j % 3) * 20).toFixed(1)}" cy="${(cy - 8 * k + Math.floor(j / 3) * 16 * k).toFixed(1)}" rx="2" ry="3" fill="#2B2B2E" opacity=".8"/>`;
    }
  });
  if (labels) MENU.forEach(d => {
    const [ci, ri] = d.slot, x = CELL.x[ci] + 4, y = CELL.y[ri] + 4, w = CELL.w - 8, h = CELL.h[ri] - 8, txt = `${labels[d.id]} g left`;
    s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="none" stroke="var(--mint)" stroke-width="2" stroke-dasharray="6 4"/>`;
    s += `<rect x="${x + 6}" y="${y + h - 24}" width="${Math.min(w - 12, 12 + txt.length * 6.3)}" height="18" rx="9" fill="var(--ink)"/><text class="det-label" x="${x + 13}" y="${y + h - 11}" fill="var(--ground)">${txt}</text>`;
  });

  return s + '</svg>';
};

/* ------------------------------------------------------------ shared UI bits */
PL.rankDelta = (before, after) => after < before ? `<span class="up">▲ ${before - after}</span>` : '';
PL.icons = {

  loop: '<svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="var(--mint)" stroke-width="4"/><path d="M16 3a13 13 0 0 1 13 13" fill="none" stroke="var(--persim)" stroke-width="4" stroke-linecap="round"/><circle cx="16" cy="16" r="5" fill="currentColor"/></svg>',
};
PL.backLink = (label = 'All apps') => `<a class="backlink" href="#home">${PL.icons.back}<span>${label}</span></a>`;

/* ------------------------------------------------------------ a push notification that slides down inside the phone.

PL.notify = (host, o) => {

/* ------------------------------------------------------------ first-run intro, inside the phone frame.

  const el = document.createElement('div'); el.className = 'onb'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Welcome');

      ${i < consentAt ? '<button class="onb-skip" data-onb="skip">Skip</button>' : '<span></span>'}</div>
      <div class="onb-page"><div class="onb-art">${s.art || ''}</div><h2>${s.title}</h2>${s.text ? `<p>${s.text}</p>` : ''}${s.body || ''}</div>
      <div class="onb-foot"><button class="btn primary onb-next" data-onb="next" ${can ? '' : 'disabled'}>${s.cta || (i === last ? 'Get started' : 'Continue')}</button></div>`;
    Object.entries(kept).forEach(([n, v]) => { const x = el.querySelector(`[data-pref="${n}"]`); if (x) { if (x.type === 'checkbox') x.checked = v; else x.value = v; } });
    const agree = el.querySelector('[data-agree]');
    if (agree) { agree.checked = el.dataset.agree === '1'; agree.onchange = () => { el.dataset.agree = agree.checked ? '1' : ''; el.querySelector('.onb-next').disabled = !agree.checked; }; }
    if (dir && el.animate && !PL.reduceMotion) {
      el.querySelector('.onb-page').animate([{ opacity: 0, transform: `translateX(${dir * 36}px)` }, { opacity: 1, transform: 'none' }], { duration: 340, easing: 'cubic-bezier(.2,.8,.2,1)' });
      const art = el.querySelector('.onb-art'); if (art) art.animate([{ transform: 'scale(.86)' }, { transform: 'scale(1.04)', offset: .7 }, { transform: 'none' }], { duration: 480, easing: 'ease-out' });
    }

    }

})();

<script>

const KIND = [

const PLATE_COL = { fv: '#4CAF50', g: '#F2B33D', p: '#E4674B' };

  return `<div class="vring"><div class="vr" style="--p:${p};--c:${col}"><div><b class="num">${Math.round(value).toLocaleString('en-US')}</b><small>/ ${Math.round(target).toLocaleString('en-US')}${unit === 'kcal' ? '' : ' ' + unit}</small></div></div><span>${label}</span></div>`;
};

V.pctRing = (frac, label, good = .75) => { const p = Math.round(frac * 100); return `<div class="vring"><div class="vr" style="--p:${p};--c:${frac >= good ? 'var(--tint)' : frac >= .5 ? '#FFB23F' : '#FF6B5B'}"><div><b class="num">${p}%</b></div></div><span>${label}</span></div>`; };

const TIPICON = {

  muscle: '<path d="M6 26c2-10 8-16 14-16 4 0 5 3 3 5-2 1-5 1-6 3 6-1 11 2 12 7 1 6-5 8-11 8-6 0-11-2-12-7Z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>',
  plate: '<circle cx="18" cy="18" r="13" fill="none" stroke="currentColor" stroke-width="3"/><path d="M18 5v26M18 18h13" stroke="currentColor" stroke-width="2.6"/>',
  warn: '<path d="M18 4 3 31h30Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M18 14v8M18 26v.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',

</script>
<script>
/* ---- js/game.js ---- */
/* Loopi's rules, adapted from the team's tomogatchi prototype and tied to real school lunches.
   The core: a tray scanned back feeds Loopi the food you ate; a tray with less left than your usual earns
   a heart; full hearts grow Loopi from egg to adult, and a grown Loopi lays an egg (rarity odds shown) that
   hatches a new one while the old one retires to the Barn. Your real leftovers become crumbs to sweep into
   the food waste bin. Around it: gems, ingredients from the food groups you actually ate, oven cooking in
   recipe order (burnt or wrong dishes are thrown away; now and then a dish comes out golden), recipe cards
   from the Healthy Catch minigame, and wardrobe crates (earned gems only, odds shown). Hearts only ever come from real trays, so the game can't be won without eating well. */
(() => {
'use strict';
const { MENU } = PL;
const G = PL.game = {};
const V = 3; // bump when the saved game changes shape

/* ---------------------------------------------------------------- tuning */
G.HUNGER_MAX = [4, 6, 9, 13];
G.HEARTS_REQ = [3, 5, 7, 9];
G.PLAYS_PER_DAY = 3;          // Healthy Catch games a day
G.BALLS_PER_DAY = 5;          // fetch throws that add Joy
G.PETS_PER_DAY = 5;           // pats that add Joy
G.PET_GEM = { chance: .25, min: 2, max: 8, cap: 3 };
G.OVEN_CAP = 4;
G.SPOIL_CHANCE = .1;          // a correct recipe can still burn; it's thrown away
G.GOLDEN_CHANCE = .15; G.GOLDEN_HUNGER = 2; // a cooked dish sometimes comes out golden
G.RARITY_BONUS = { common: .4, rare: 1, epic: 1.7, legendary: 2.5 };
G.MENTOR_BONUS = .1;
G.EGG_WEIGHTS = { common: 50, rare: 30, epic: 15, legendary: 5 };
G.DUP_REFUND = .2;

G.INGREDIENTS = {
  rice: { name: 'Rice', draw: { name: 'Rice', color: '#F3EDDA', edge: '#BFB28E' } },
  veg: { name: 'Greens', draw: { name: 'Greens', color: '#3F9A48', edge: '#2A5A22' } },
  protein: { name: 'Chicken', draw: { name: 'Chicken', color: '#C98A4B', edge: '#8E5E28' } },
  fruit: { name: 'Fruit', draw: { name: 'Watermelon', color: '#F2545B', edge: '#B8323A' } },
};
/** Which ingredient each lunch food group gives when you eat at least half of it. */
const GROUP_ING = { grain: 'rice', veg: 'veg', protein: 'protein', fruit: 'fruit' };
G.RECIPES = [
  { id: 'chickenrice', name: 'Chicken rice', seq: ['rice', 'protein', 'veg'], hunger: 3, unlock: null },
  { id: 'vegsoup', name: 'Veggie soup', seq: ['veg', 'veg', 'rice'], hunger: 2, unlock: null },
  { id: 'fruitcup', name: 'Fruit cup', seq: ['fruit', 'fruit', 'veg'], hunger: 2, unlock: null },
  { id: 'nasilemak', name: 'Nasi lemak', seq: ['rice', 'protein', 'veg', 'rice'], hunger: 4, unlock: 'nasi', cost: 3 },
  { id: 'rainbow', name: 'Rainbow bowl', seq: ['rice', 'protein', 'veg', 'fruit'], hunger: 6, unlock: 'rainbow', cost: 5 },
];
G.CARD_NAME = { nasi: 'Nasi lemak card', rainbow: 'Rainbow bowl card' };
G.ACCESSORIES = [
  { id: 'cap', name: 'Cap', rarity: 'normal' }, { id: 'bow', name: 'Bow', rarity: 'normal' },
  { id: 'glasses', name: 'Glasses', rarity: 'normal' }, { id: 'scarf', name: 'Scarf', rarity: 'normal' },
  { id: 'flower', name: 'Flower', rarity: 'normal' }, { id: 'headphones', name: 'Headphones', rarity: 'epic' },
  { id: 'halo', name: 'Halo', rarity: 'epic' }, { id: 'wings', name: 'Wings', rarity: 'epic' },
  { id: 'crown', name: 'Crown', rarity: 'legendary' }, { id: 'aura', name: 'Sparkle aura', rarity: 'legendary' },
];
G.CRATES = {
  normal: { name: 'Basic crate', cost: 40, w: { normal: 85, epic: 14, legendary: 1 } },
  epic: { name: 'Epic crate', cost: 120, w: { normal: 40, epic: 50, legendary: 10 } },
  legendary: { name: 'Legendary crate', cost: 300, w: { normal: 10, epic: 50, legendary: 40 } },
};

const today = () => new Date().toISOString().slice(0, 10);
const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const blank = () => ({ rice: 0, veg: 0, protein: 0, fruit: 0 });
const pickWeighted = w => { const e = Object.entries(w), tot = e.reduce((a, [, v]) => a + v, 0); let x = Math.random() * tot; for (const [k, v] of e) { if (x < v) return k; x -= v; } return e[0][0]; };
const daily = g => { if (!g.day || g.day.d !== today()) g.day = { d: today(), balls: 0, pets: 0, drops: 0, plays: 0 }; return g.day; };
/** Leftovers become crumbs: one per 20 g left of a dish, at most 3 per dish. */
const crumbsFrom = (left, menu = MENU) => menu.flatMap(d => Array(Math.min(3, Math.floor((left[d.id] || 0) / 20))).fill(d.id));
/** The tray is "good" when less is left than 15%, or a quarter less than the student's usual. */
G.heartLine = st => Math.max(.15, st.baseline * .75);

/* ---------------------------------------------------------------- setup */
G.init = st => {
  const r = PL.rng(hash(st.id)), stage = PL.STAGES.indexOf(PL.stageOf(st.pet.xp)), req = G.HEARTS_REQ[stage];
  const n = Math.min(4, Math.round(st.log[0].w * 12));
  const g = {
    v: V, name: 'Loopi', rarity: 'common', stage,
    hunger: Math.round(G.HUNGER_MAX[stage] * (.4 + r() * .3)),
    hearts: st.named ? req - 1 : Math.floor(r() * req), ready: false,
    plate: null, mess: ['kailan', 'cabbage', 'soup', 'rice'].slice(0, n), composted: Math.round(15 + r() * 50),
    gems: Math.round(40 + r() * 140),
    ing: { rice: 1 + Math.floor(r() * 4), veg: 1 + Math.floor(r() * 4), protein: Math.floor(r() * 3), fruit: 1 + Math.floor(r() * 3) },
    grown: blank(), bin: ['veg', 'rice', 'fruit'].slice(0, 1 + Math.floor(r() * 3)), oven: [], snacks: [],
    unlocked: { nasi: false, rainbow: false }, cards: { nasi: 1 + Math.floor(r() * 2), rainbow: Math.floor(r() * 2) },
    acc: [], eq: null, barn: [], eggs: [], best: 0,
    day: { d: today(), balls: 0, pets: 0, drops: 0, plays: 0 },
  };
  if (st.named) g.snacks.push({ id: 's' + Math.floor(r() * 1e6), recipe: 'chickenrice', name: 'Chicken rice', hunger: 3, golden: false });
  (st.pet.book || []).forEach((form, i) => g.barn.push({ id: 'b' + i, name: 'Loopi ' + (i + 1), form, rarity: r() < .6 ? 'common' : 'rare', stage: 3 }));
  if (st.id === 's3') { g.acc.push('crown'); g.eq = 'crown'; }
  if (st.id === 's6') { g.acc.push('headphones'); g.eq = 'headphones'; }
  return g;
};
G.ensure = st => { if (!st.game || st.game.v !== V) st.game = G.init(st); return st.game; };
const ensureAll = () => PL.S.students.forEach(G.ensure);
ensureAll();
PL.store.subscribe(ensureAll);

/* ---------------------------------------------------------------- lookups */
G.hungerMax = g => G.HUNGER_MAX[g.stage];
G.heartsReq = g => G.HEARTS_REQ[g.stage];
G.plantOf = st => Math.min(4, Math.floor(st.pet.c.lowWaste / 5));
G.playsLeft = g => G.PLAYS_PER_DAY - daily(g).plays;
G.recipeUnlocked = (g, rc) => !rc.unlock || g.unlocked[rc.unlock];
/** Barn bonus on the gems each lunch earns: your best Loopi (active or retired) sets it; every other grown Loopi adds a little. */
G.multiplier = g => {
  const pets = [...g.barn, { rarity: g.rarity, stage: g.stage }];
  const val = p => 1 + G.RARITY_BONUS[p.rarity] * (p.stage / 3);
  const best = pets.reduce((a, p) => val(p) > val(a) ? p : a, pets[0]);
  return val(best) + pets.filter(p => p !== best).reduce((a, p) => a + G.MENTOR_BONUS * (p.stage / 3), 0);
};

/* ---------------------------------------------------------------- lunch: the heart of it */
/** Called after the second scan. Hunger, hearts, gems and ingredients change right away; the food waits in the bowl. */
G.feedLunch = (st, r, menu = MENU) => {
  const g = G.ensure(st), max = G.hungerMax(g), req = G.heartsReq(g);
  if (g.plate && !g.plate.eaten) g.mess.push(...g.plate.crumbs); // yesterday's uneaten plate still counts
  const gain = 1 + (r.w < .3 ? 1 : 0) + (r.w < .12 ? 1 : 0);
  g.hunger = Math.min(max, g.hunger + gain);
  let heart = false;
  if (r.w < G.heartLine(st) && g.hearts < req) {
    g.hearts++; heart = true;
    if (g.hearts === req) g.ready = true;
  }
  // one ingredient for each food group you ate at least half of
  const got = blank();
  menu.forEach(d => { const k = GROUP_ING[d.group]; if (k && r.servedBy[d.id] && r.measured[d.id] <= r.servedBy[d.id] * .5) got[k] = 1; });
  Object.keys(got).forEach(k => { g.ing[k] += got[k]; });
  const gems = Math.round((gain * 5 + 5) * G.multiplier(g));
  g.gems += gems;
  g.plate = {
    eaten: false, heart, gain,
    food: menu.filter(d => r.servedBy[d.id] - r.measured[d.id] > 10).map(d => d.id),
    crumbs: crumbsFrom(r.measured, menu),
  };
  return { hunger: gain, heart, ready: g.ready, crumbs: g.plate.crumbs.length, gems, ing: got };
};
/** Loopi eats what's in the bowl; the tray's leftovers land on the floor. */
G.serveLunch = st => {
  const g = G.ensure(st), p = g.plate;
  if (!p || p.eaten) return null;
  p.eaten = true;
  g.mess.push(...p.crumbs);
  return p;
};
/** Swept crumbs are your real leftovers: they go in the food waste bin and are counted, but never turned into ingredients. */
G.sweep = (st, dish) => {
  const g = G.ensure(st), i = g.mess.indexOf(dish);
  if (i >= 0) { g.mess.splice(i, 1); g.composted++; }
  return g.mess.length;
};
/** A cooked snack fills Food and cheers Loopi up (golden: more of both). Hearts only come from real trays. */
G.eatSnack = (st, snackId) => {
  const g = G.ensure(st), i = g.snacks.findIndex(s => s.id === snackId);
  if (i < 0) return null;
  const [s] = g.snacks.splice(i, 1), max = G.hungerMax(g), wasFull = g.hunger >= max;
  g.hunger = Math.min(max, g.hunger + s.hunger);
  st.pet.jo = Math.min(100, st.pet.jo + (s.golden ? 12 : 5));
  g.gems += s.hunger * 2;
  return { snack: s, wasFull, heart: false };
};

/* ---------------------------------------------------------------- growing up, eggs and the Barn */
/** Full hearts: grow a stage. A fully grown Loopi lays an egg instead. */
G.evolve = st => {
  const g = G.ensure(st);
  if (!g.ready) return null;
  g.ready = false; g.hearts = 0;
  if (g.stage < 3) { g.stage += 1; return { type: 'grow', stage: PL.STAGES[g.stage] }; }
  const rarity = pickWeighted(G.EGG_WEIGHTS);
  g.eggs.push(rarity);
  return { type: 'egg', rarity };
};
/** Hatching retires the grown Loopi to the Barn (it keeps boosting your gems) and starts a new one. */
G.hatch = st => {
  const g = G.ensure(st);
  if (!g.eggs.length) return null;
  const rarity = g.eggs.shift();
  g.barn.push({ id: 'b' + Date.now(), name: g.name, form: PL.formOf(st.pet), rarity: g.rarity, stage: g.stage, acc: g.eq });
  Object.assign(g, { name: 'Loopi ' + (g.barn.length + 1), rarity, stage: 0, hunger: 2, hearts: 0, ready: false, eq: null });
  return rarity;
};

/* ---------------------------------------------------------------- cooking */
function dump(g) { g.oven.forEach(o => g.bin.push(o.t)); g.oven = []; }
G.ovenAdd = (st, type) => {
  const g = G.ensure(st);
  let grown = false;
  if (g.grown[type] > 0) { g.grown[type]--; grown = true; }
  else if (g.ing[type] > 0) g.ing[type]--;
  else return { result: 'none' };
  g.oven.push({ t: type, grown });
  const seq = g.oven.map(o => o.t), open = G.RECIPES.filter(rc => G.recipeUnlocked(g, rc));
  const match = open.find(rc => rc.seq.length === seq.length && rc.seq.every((x, i) => x === seq[i]));
  if (match) {
    if (Math.random() < G.SPOIL_CHANCE) { dump(g); return { result: 'spoiled', recipe: match }; }
    const golden = Math.random() < G.GOLDEN_CHANCE;
    const snack = { id: 's' + Date.now() + Math.floor(Math.random() * 1e4), recipe: match.id, name: (golden ? 'Golden ' : '') + match.name, hunger: match.hunger + (golden ? G.GOLDEN_HUNGER : 0), golden };
    g.snacks.push(snack); g.oven = []; g.gems += 3;
    return { result: 'cooked', snack };
  }
  const prefix = open.some(rc => rc.seq.length > seq.length && seq.every((x, i) => rc.seq[i] === x));
  if (!prefix || seq.length >= G.OVEN_CAP) { dump(g); return { result: 'rejected' }; }
  return { result: 'pending' };
};
G.emptyOven = st => { const g = G.ensure(st), n = g.oven.length; dump(g); return n; };

G.unlock = (st, key) => {
  const g = G.ensure(st), rc = G.RECIPES.find(x => x.unlock === key);
  if (!rc || g.unlocked[key] || g.cards[key] < rc.cost) return false;
  g.cards[key] -= rc.cost; g.unlocked[key] = true; return true;
};

/* ---------------------------------------------------------------- play, petting */
G.playBall = st => {
  const g = G.ensure(st), d = daily(g);
  if (d.balls >= G.BALLS_PER_DAY) return false;
  d.balls++; st.pet.jo = Math.min(100, st.pet.jo + 3); return true;
};
/** A pat adds Joy, and now and then Loopi finds a few gems (at most 3 times a day). */
G.petLoopi = st => {
  const g = G.ensure(st), d = daily(g);
  if (d.pets < G.PETS_PER_DAY) { d.pets++; st.pet.jo = Math.min(100, st.pet.jo + 1); }
  if (d.drops >= G.PET_GEM.cap || Math.random() >= G.PET_GEM.chance) return 0;
  const gems = G.PET_GEM.min + Math.floor(Math.random() * (G.PET_GEM.max - G.PET_GEM.min + 1));
  g.gems += gems; d.drops++; return gems;
};

/* ---------------------------------------------------------------- Healthy Catch */
G.catchStart = st => { const g = G.ensure(st), d = daily(g); if (d.plays >= G.PLAYS_PER_DAY) return false; d.plays++; return true; };
G.catchEnd = (st, res) => {
  const g = G.ensure(st), got = blank();
  Object.keys(got).forEach(t => { got[t] = Math.floor((res.caught[t] + 1) / 2); g.ing[t] += got[t]; });
  Object.keys(res.cards).forEach(k => { g.cards[k] += res.cards[k]; });
  const gems = Math.floor(res.score / 4);
  g.gems += gems;
  const best = res.score > g.best; if (best) g.best = res.score;
  return { got, gems, best };
};

/* ---------------------------------------------------------------- wardrobe: badges and crates */
G.BADGES = [
  { id: 'first', name: 'First scan', item: 'cap', how: 'Scan a lunch tray', test: st => st.log.length > 0 },
  { id: 'small', name: 'Small and clean', item: 'bow', how: 'Finish a small portion', test: st => st.log.some(l => l.portion === 'S' && l.w < .12) },
  { id: 'streak', name: 'Three in a row', item: 'scarf', how: '3 clean trays in a row', test: st => st.pet.streak >= 3 },
  { id: 'veg', name: 'Veggie explorer', item: 'flower', how: 'Try the veggies 10 times', test: st => st.pet.c.veg >= 10 },
  { id: 'kailan', name: 'Kailan week', item: 'glasses', how: 'Taste the kailan 3 times', test: st => st.pet.quest >= 3 },
  { id: 'balanced', name: 'Balanced plate', item: 'halo', how: 'Eat from every food group 5 times', test: st => st.pet.c.balanced >= 5 },
  { id: 'class', name: 'Team goal', item: 'wings', how: 'Your class goes under 20% waste', test: st => { const c = PL.S.classes.find(c => c.id === st.cls); return c ? c.ret / c.served < .2 : false; } },
  { id: 'top3', name: 'Podium', item: 'headphones', how: 'Be top 3 in your class', test: st => PL.studentRows().findIndex(s => s.id === st.id) < 3 },
  { id: 'adult', name: 'All grown up', item: 'crown', how: 'Grow Loopi into an adult', test: st => G.ensure(st).stage === 3 || G.ensure(st).barn.length > 0 },
];
G.earned = st => G.BADGES.filter(b => b.test(st));
/** Everything Loopi can wear: won in crates, or unlocked by a badge. */
G.owned = st => new Set([...G.ensure(st).acc, ...G.earned(st).map(b => b.item)]);
G.wear = (st, item) => { const g = G.ensure(st); if (item && !G.owned(st).has(item)) return; g.eq = g.eq === item ? null : item; };
G.openCrate = (st, tier) => {
  const g = G.ensure(st), c = G.CRATES[tier];
  if (g.gems < c.cost) return { error: `The ${c.name.toLowerCase()} costs ${c.cost} gems.` };
  g.gems -= c.cost;
  const rarity = pickWeighted(c.w), pool = G.ACCESSORIES.filter(a => a.rarity === rarity);
  const acc = pool[Math.floor(Math.random() * pool.length)], dup = G.owned(st).has(acc.id);
  let refund = 0;
  if (dup) { refund = Math.round(c.cost * G.DUP_REFUND); g.gems += refund; } else g.acc.push(acc.id);
  return { acc, dup, refund };
};

/* ---------------------------------------------------------------- pixel sprites for the catch game */
G.SPRITES = {
  rice: { p: ['..wwww..', '.wwwwww.', 'bbbbbbbb', '.bbbbbb.', '..bbbb..'], c: { w: '#FFFFFF', b: '#3E74C9' } },
  veg: { p: ['..gg.gg.', '.gggggg.', '.gdggdg.', '..gggg..', '...dd...', '...dd...'], c: { g: '#3C9A48', d: '#23602D' } },
  protein: { p: ['...bb...', '..bbbb..', '.bbbbbb.', '.bbbbbb.', '..bbbb..', '...ww...', '..w..w..'], c: { b: '#C98A4B', w: '#FFF8EC' } },
  fruit: { p: ['gggggggg', '.rrrrrr.', '.rkrrkr.', '..rrrr..', '...rr...'], c: { g: '#5BA84A', r: '#F2545B', k: '#1F2A1D' } },
  soda: { p: ['..kkkk..', '..cccc..', '..ckcc..', '..cccc..', '..cccc..', '..kkkk..'], c: { c: '#B8322A', k: '#D9D9D9' } },
  candy: { p: ['p......p', 'pp.pp.pp', 'pppppppp', 'pp.pp.pp', 'p......p'], c: { p: '#E86FB0' } },
  card: { p: ['.tttttt.', '.tkkkkt.', '.tttttt.', '.tkkktt.', '.tttttt.'], c: { t: '#F1DFAE', k: '#6B4A2B' } },
};
G.drawSprite = (ctx, name, x, y, s) => {
  const sp = G.SPRITES[name];
  sp.p.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') { ctx.fillStyle = sp.c[ch]; ctx.fillRect(Math.round(x + i * s), Math.round(y + j * s), s, s); } }));
};
})();

</script>
<script>
/* ---- js/room.js ---- */
/* Loopi's room: a full-colour pixel room. Loopi wanders around, eats the lunch waiting in its bowl, plays
   fetch, gets petted and sleeps when the lights go off. Crumbs on the floor are the student's real
   leftovers; tapping one (or Sweep) flicks it into the food waste bin. The plant grows with clean trays.
   This file only animates and handles taps; game-state changes go back to the app through `hooks`. */
(() => {
'use strict';
const W = 160, H = 110, FLOOR = 98, BOWL_X = 22, BIN_X = 140, SCALE = 4;
const BODY = { leafy: ['#D7F2CB', '#A9D99A'], crystal: ['#D6ECFA', '#A9CFEA'], guardian: ['#F8E6C8', '#E2C290'], explorer: ['#FBDCCF', '#EDB39C'], egg: ['#FFF4DC', '#EAD9B0'] };
const rand = (a, b) => a + Math.random() * (b - a);
const dish = id => PL.DISH[id] || { color: '#E8B27A', edge: '#A77A45' };

const Room = PL.Room = {
  pet: { x: 80, y: 0, face: 1, mode: 'idle', until: 0, target: 80, next: 1.5, jumpT: 0, jumpDur: .5, jumpH: 8, onArrive: null },
  ball: null, crumbs: [], hearts: [], night: false, food: null, speech: null, time: 0, tick: 0,
  cv: null, sayEl: null, hooks: {}, raf: 0, last: 0, lastTap: 0, petCv: null,

  /** Bind (or re-bind after a re-render) to a canvas and its speech-bubble element. */
  attach(cv, sayEl, hooks) {
    this.cv = cv; this.sayEl = sayEl; this.hooks = hooks;
    cv.width = W * SCALE; cv.height = H * SCALE;
    if (!this.petCv) { this.petCv = document.createElement('canvas'); this.petCv.width = 64; this.petCv.height = 60; }
    cv.onpointerdown = e => this.tap(e);
    this.setMess(hooks.mess());
    this.draw();
    if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame(t => this.loop(t)); }
  },
  loop(now) {
    if (!this.cv || !this.cv.isConnected) { this.raf = 0; return; }
    const dt = Math.min(.05, (now - this.last) / 1000); this.last = now;
    this.step(dt); this.draw();
    this.raf = requestAnimationFrame(t => this.loop(t));
  },
  toLogical(e) { const r = this.cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; },

  /** Match the crumbs on the floor to the saved leftovers, keeping the ones already lying there. */
  setMess(list) {
    const pool = this.crumbs.filter(c => !c.done), out = [];
    list.forEach(type => {
      const j = pool.findIndex(c => c.type === type);
      out.push(j >= 0 ? pool.splice(j, 1)[0] : { type, x: rand(30, 126), y: rand(88, 104) });
    });
    this.crumbs = out;
  },

  /* ---------------------------------------------------------------- actions */
  say(text, dur = 3.2) { this.speech = { text, until: this.time + dur }; },
  jump(h = 8, dur = .5) { const p = this.pet; p.jumpT = dur; p.jumpDur = dur; p.jumpH = h; },
  walkTo(x, then, speed) { const p = this.pet; p.target = Math.max(14, Math.min(W - 14, x)); p.mode = 'walk'; p.onArrive = then || null; p.speed = speed || 30; },
  /** Feed the lunch waiting in the bowl, or (with a snack id) a snack cooked in the Kitchen. */
  feed(snack) {
    const p = this.pet;
    if (this.night) { this.say('Zzz… turn the lights on first.'); return; }
    if (p.mode === 'eat') return;
    const plate = snack ? this.hooks.snackFood(snack) : this.hooks.info().plate;
    if (!plate) { this.say(snack ? 'Hmm, that snack is gone.' : 'My lunch comes from your tray. Cook me a snack in the Kitchen?', 3.6); return; }
    this.walkTo(BOWL_X + 12, () => { this.food = plate; this.eating = snack || null; p.face = -1; p.mode = 'eat'; p.until = this.time + 2.4; p.eatStart = this.time; }, 44);
  },
  throwBall() {
    if (this.night) { this.say('It\'s bedtime. No ball now.'); return; }
    this.ball = { x: 10, y: 70, vx: rand(70, 105), vy: -rand(50, 80) };
    this.pet.mode = 'chase';
  },
  sweepAll() { this.crumbs.filter(c => !c.fly).forEach((c, i) => setTimeout(() => this.sweep(c), i * 120)); },
  sweep(c) { if (c.fly) return; c.fly = true; c.t = 0; c.sx = c.x; c.sy = c.y; },
  toggleNight() {
    this.night = !this.night;
    if (this.night) { this.walkTo(80, () => { this.pet.mode = 'sleep'; }); this.say('Night night.', 2); }
    else { this.pet.mode = 'happy'; this.pet.until = this.time + .9; this.jump(6); this.say('Morning!', 2); }
  },
  petLoopi() {
    const p = this.pet;
    if (p.mode === 'sleep') { this.heart(); return; }
    for (let i = 0; i < 3; i++) setTimeout(() => this.heart(), i * 140);
    p.mode = 'happy'; p.until = this.time + 1; this.jump(7);
    const doubleTap = this.time - this.lastTap < .35; this.lastTap = this.time;
    if (doubleTap) { this.jump(14, .7); this.say('Wheee!', 1.2); }
    this.hooks.pet();
  },
  heart() { const p = this.pet; this.hearts.push({ x: p.x + rand(-8, 8), y: FLOOR - 40 - p.y, life: 1.2 }); },

  /** Taps: crumbs get swept, Loopi gets petted, the floor sets where Loopi walks. */
  tap(e) {
    e.preventDefault();
    const L = this.toLogical(e), p = this.pet;
    const c = this.crumbs.find(c => !c.fly && Math.abs(c.x - L.x) < 6 && Math.abs(c.y - L.y) < 6);
    if (c) { this.sweep(c); return; }
    if (Math.abs(L.x - p.x) < 15 && L.y > FLOOR - 44 - p.y && L.y < FLOOR + 3) { this.petLoopi(); return; }
    if (L.x > BOWL_X - 10 && L.x < BOWL_X + 10 && L.y > 86 && this.hooks.info().plate) { this.feed(); return; }
    if (L.y > 74 && p.mode !== 'eat' && p.mode !== 'sleep') this.walkTo(L.x);
  },

  /* ---------------------------------------------------------------- simulation */
  step(dt) {
    const p = this.pet;
    this.time += dt; this.tick = Math.floor(this.time / .42);
    if (p.jumpT > 0) { p.jumpT = Math.max(0, p.jumpT - dt); p.y = Math.sin((1 - p.jumpT / p.jumpDur) * Math.PI) * p.jumpH; } else p.y = 0;
    const moveTo = (tx, speed) => { const dx = tx - p.x; if (Math.abs(dx) < 1.2) { p.x = tx; return true; } p.face = Math.sign(dx); p.x += Math.sign(dx) * Math.min(Math.abs(dx), speed * dt); return false; };
    if (p.mode === 'walk') { if (moveTo(p.target, p.speed || 30)) { p.mode = 'idle'; p.next = this.time + rand(2, 5); const cb = p.onArrive; p.onArrive = null; if (cb) cb(); } }
    else if (p.mode === 'eat') {
      if (this.time > p.until) {
        this.food = null; p.mode = 'happy'; p.until = this.time + .9; this.jump(6);
        const snack = this.eating; this.eating = null;
        const res = snack ? this.hooks.eatSnack(snack) : this.hooks.eat();
        if (res) this.say(snack ? (res.golden ? 'Golden! That was amazing!' : res.wasFull ? 'So full… but thank you!' : 'Yum, thanks for cooking!') : res.heart ? 'That was a good lunch. +1 heart!' : res.crumbs ? 'Thanks! Some of it ended up on the floor…' : 'Thanks for lunch!', 3);
      }
    }
    else if (p.mode === 'happy') { if (this.time > p.until) { p.mode = 'idle'; p.next = this.time + rand(1.5, 4); } }
    else if (p.mode === 'chase') {
      if (!this.ball) p.mode = 'idle';
      else if (moveTo(this.ball.x, 48) || (Math.abs(this.ball.x - p.x) < 7 && this.ball.y > FLOOR - 14)) {
        if (this.ball.y > FLOOR - 14) { this.ball = null; p.mode = 'happy'; p.until = this.time + 1; this.jump(10, .6); this.hooks.fetched(); }
      }
    } else if (p.mode === 'idle' && !this.night && this.time > p.next) { this.walkTo(rand(34, 126)); }
    if (this.ball) {
      const b = this.ball; b.vy += 230 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y > FLOOR - 3) { b.y = FLOOR - 3; b.vy *= -.55; b.vx *= .82; if (Math.abs(b.vy) < 14) b.vy = 0; }
      if (b.x < 6 || b.x > W - 6) { b.vx *= -.8; b.x = Math.max(6, Math.min(W - 6, b.x)); }
    }
    this.hearts.forEach(h => { h.y -= 16 * dt; h.life -= dt; });
    this.hearts = this.hearts.filter(h => h.life > 0);
    this.crumbs.forEach(c => { if (c.fly && !c.done) { c.t += dt * 1.6; const k = Math.min(1, c.t); c.x = c.sx + (BIN_X - c.sx) * k; c.y = c.sy + (80 - c.sy) * k - Math.sin(k * Math.PI) * 26; if (k >= 1) { c.done = true; this.hooks.swept(c.type); } } });
    this.crumbs = this.crumbs.filter(c => !c.done);
    if (this.speech && this.time > this.speech.until) this.speech = null;
    if (!this.speech && !this.night && p.mode === 'idle' && this.time > (this.nextChat || 3)) {
      const line = this.hooks.chatter && this.hooks.chatter();
      if (line) this.say(line, 3.6);
      this.nextChat = this.time + rand(14, 22);
    }
  },

  /* ---------------------------------------------------------------- drawing */
  draw() {
    const cv = this.cv, ctx = cv.getContext('2d'), n = this.night, p = this.pet, info = this.hooks.info();
    ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0); ctx.imageSmoothingEnabled = false;
    const R = (c, x, y, w, h) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
    // wall + window
    R(n ? '#363B5E' : '#FBF3E4', 0, 0, W, 72);
    for (let y = 6; y < 68; y += 12) for (let x = (y / 12) % 2 ? 4 : 10; x < W; x += 12) R(n ? '#40466C' : '#F2E3C8', x, y, 2, 2);
    R('#FFFFFF', 14, 10, 42, 32); R(n ? '#171C3E' : '#A8DDF7', 16, 12, 38, 28);
    if (n) { R('#F5F1D0', 22, 16, 6, 6); R('#171C3E', 25, 15, 4, 4); [[36, 18], [46, 26], [30, 32], [50, 15]].forEach(([x, y]) => R('#FFFFFF', x, y, 1, 1)); }
    else { R('#FFD60A', 44, 15, 6, 6); const cx = 18 + (this.time * 3) % 40; R('#FFFFFF', cx, 26, 10, 3); R('#FFFFFF', cx + 3, 24, 5, 2); }
    R('#FFFFFF', 34, 12, 2, 28); R('#FFFFFF', 16, 25, 38, 2);
    // picture frame with the school Green Tree
    R(n ? '#8A7B66' : '#C9A77C', 104, 16, 26, 20); R(n ? '#26324A' : '#EAF6EC', 106, 18, 22, 16);
    R('#2E9447', 113, 27, 8, 3); R('#34A853', 114, 24, 6, 3); R('#2E9447', 115, 21, 4, 3); R('#8B5E3C', 116, 30, 2, 3); R('#FF3B30', 114, 25, 1, 1); R('#FF3B30', 118, 28, 1, 1);
    // floor, rug
    R(n ? '#4E4038' : '#E8CFA6', 0, 72, W, H - 72);
    R(n ? '#2E3252' : '#E3C08E', 0, 70, W, 3);
    for (let y = 78; y < H; y += 8) R(n ? '#463A33' : '#DDBF92', 0, y, W, 1);
    ctx.fillStyle = n ? '#5E4466' : '#F5C2B2'; ctx.beginPath(); ctx.ellipse(84, 97, 50, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = n ? '#6E5277' : '#F8D3C7'; ctx.beginPath(); ctx.ellipse(84, 97, 40, 5, 0, 0, Math.PI * 2); ctx.fill();
    // plant: grows a stage for every five clean trays
    const lv = info.plant || 0, G1 = '#34C759', G2 = '#2E9447';
    R('#D9724F', 146, 58, 10, 12); R('#C45E3E', 145, 57, 12, 2);
    const stem = 6 + lv * 5;
    R(G2, 150, 57 - stem, 2, stem);
    for (let k = 0; k <= lv; k++) { const y = 54 - k * 5; R(G1, 146 - (k % 2), y, 4, 2); R(G1, 152, y - 2, 4 + (k % 2), 2); }
    if (lv >= 3) { R('#FF9F0A', 149, 55 - stem, 4, 3); R('#FFD60A', 150, 54 - stem, 2, 1); }
    if (lv >= 4) { R('#FF3B30', 146, 44 - lv, 2, 2); R('#FF3B30', 154, 41 - lv, 2, 2); }
    // food waste bin
    R('#636366', 131, 79, 20, 3); R('#8E8E93', 132, 82, 18, 17); R('#7C7C80', 132, 94, 18, 5);
    R('#C7C7CC', 136, 85, 1, 11); R('#C7C7CC', 140, 85, 1, 11); R('#C7C7CC', 144, 85, 1, 11);
    // bowl: today's lunch waits here until Loopi eats it
    const food = this.food || info.plate;
    if (food) {
      const left = this.food ? Math.max(0, 1 - (this.time - p.eatStart) / 2.2) : 1;
      const bits = Math.ceil(food.length * 2 * left);
      for (let i = 0; i < bits; i++) { const d = dish(food[i % food.length]); R(d.edge, BOWL_X - 6 + (i * 3) % 12, 91 - (i % 3), 3, 2); R(d.color, BOWL_X - 6 + (i * 3) % 12, 90 - (i % 3), 3, 1); }
      if (!this.food && Math.floor(this.time * 2) % 2) { R('#FFFFFF', BOWL_X - 3, 83, 1, 3); R('#FFFFFF', BOWL_X + 2, 82, 1, 3); }
    }
    R('#FFFFFF', BOWL_X - 8, 92, 16, 3); R('#E5E5EA', BOWL_X - 6, 95, 12, 2);
    // shadow + crumbs + ball
    ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.beginPath(); ctx.ellipse(p.x, FLOOR + 1, 12 - p.y * .4, 2, 0, 0, Math.PI * 2); ctx.fill();
    this.crumbs.forEach(c => { const d = dish(c.type); R('rgba(0,0,0,.14)', c.x - 2, c.y + 1, 5, 1); R(d.edge, c.x - 2, c.y - 1, 4, 2); R(d.color, c.x - 1, c.y - 2, 3, 2); });
    if (this.ball) { const b = this.ball; R('#FF3B30', b.x - 3, b.y - 3, 6, 6); R('#FFFFFF', b.x - 3, b.y - 1, 6, 2); R('#FF6961', b.x - 2, b.y - 4, 4, 1); }
    // Loopi
    const [fill, mid] = BODY[info.stage === 'egg' ? 'egg' : info.form] || BODY.leafy;
    let mood = info.mood;
    if (p.mode === 'eat') mood = this.tick % 2 ? 'joy' : 'meh';
    else if (p.mode === 'happy' || p.mode === 'chase') mood = 'joy';
    else if (p.mode === 'sleep' || this.night) mood = 'sleepy';
    PL.drawPet(this.petCv, { rows: 30, bg: 'none', noGround: true, t: p.mode === 'walk' || p.mode === 'chase' ? Math.floor(this.time / .16) : this.tick, stage: info.stage, form: info.form, mood, acc: info.acc, progress: info.progress, fill, mid, ink: '#2B2B2E' });
    ctx.save();
    const px = Math.round(p.x), py = Math.round(FLOOR - 52 - p.y);
    if (p.face < 0) { ctx.translate(px, 0); ctx.scale(-1, 1); ctx.drawImage(this.petCv, -32, py); }
    else ctx.drawImage(this.petCv, px - 32, py);
    ctx.restore();
    // hearts
    this.hearts.forEach(h => { const x = Math.round(h.x), y = Math.round(h.y); ctx.globalAlpha = Math.min(1, h.life * 1.5); [[1, 0], [3, 0], [0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [1, 2], [2, 2], [3, 2], [2, 3]].forEach(([a, b]) => R('#FF2D55', x + a - 2, y + b, 1, 1)); ctx.globalAlpha = 1; });
    if (n) { ctx.fillStyle = 'rgba(8,10,35,.28)'; ctx.fillRect(0, 0, W, H); }
    // speech bubble (HTML over the canvas, kept inside the room)
    if (this.sayEl) {
      if (this.speech) { this.sayEl.hidden = false; if (this.sayEl.textContent !== this.speech.text) this.sayEl.textContent = this.speech.text; const rw = this.cv.clientWidth, half = this.sayEl.offsetWidth / 2 + 8; this.sayEl.style.left = `${Math.max(half, Math.min(rw - half, p.x / W * rw))}px`; this.sayEl.style.bottom = `${(H - (FLOOR - 46 - p.y)) / H * 100}%`; }
      else this.sayEl.hidden = true;
    }
  },
};
})();

</script>
<script>
/* ---- js/student.js ---- */
/* Loopi, the student app for teens and university students: a Tamagotchi fed by real lunches.
   Loopi (the room: feed it the lunch you ate, sweep up your leftovers, play, grow it up, lay and hatch
   eggs), Lunch (the two scans, your tray, your plate and your week), Kitchen (cook snacks in recipe order,
   recipe cards, the Healthy Catch minigame), Ranks and Me (badges, history). Wardrobe

   Rules: js/game.js. Room: js/room.js. Drawings: js/visual.js. */
(() => {
'use strict';
const { $, $$, pct, esc, MENU, DISH, FORMS } = PL;
const G = PL.game, V = PL.V;

const ui = { tab: 'loopi', seg: 'class', kseg: 'cook', big: false, modal: null, sheet: null, ovenMsg: '', seenScan: 0 };
let root = null;

  feed: I('<path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M9 7c0-1.5 1-2 1-3.5M14 7c0-1.5 1-2 1-3.5"/>'),
  play: I('<circle cx="12" cy="12" r="8"/><path d="M4.5 9.5c4 1 11 1 15 0M4.5 14.5c4-1 11-1 15 0"/>'),
  sweep: I('<path d="M14 3l-4 9M6 21l2-9h8l2 9Z"/><path d="M10 16v5M14 16v5"/>'),

const TABS = { loopi: 'Loopi', lunch: 'Lunch', kitchen: 'Kitchen', ranks: 'Ranks', me: 'Me' };
const GEM = '<svg class="gem" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h8l3 4-7 8-7-8Z" fill="#5FB8E8" stroke="#2A6F99" stroke-width="1"/><path d="M1 6h14M6 2 5 6l3 8 3-8-1-4" fill="none" stroke="#2A6F99" stroke-width=".8"/></svg>';

  '<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 12h8"/>',
  '<path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 2-3 5-3 8h3v10"/>',
  '<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 12h8"/>',
  '<path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M9 7c0-1.5 1-2 1-3.5M14 7c0-1.5 1-2 1-3.5"/>',

const sum = o => Object.values(o).reduce((a, b) => a + b, 0);

/** Your own Loopi (the pixel pet) with a speech bubble. */

/* ================================================================ mount + frame */
function mount(el) {

/** First run: what Loopi is, how the two scans work, why it rewards the right portion, then the privacy choices. */

  PL.onboard($('#phone', root), 'loopi', [
    { art: V.loopi('wave', 150), title: 'Meet Loopi.', text: 'Loopi only eats the lunch you really eat. Whatever you finish goes into its bowl, and it grows up with you all year.' },
    { art: `<div class="onb-steps">${step('smile', 'Look at the camera', 'on the scanner, no card')}${step('scale', 'Place your tray', 'before and after lunch')}${step('check', 'Wait for the chime', 'about two seconds')}</div>`,
      title: 'Two quick scans.', text: 'Before lunch it sees what you were served. After lunch it sees what’s left. The difference is exactly what you ate.' },
    { art: V.loopi('cheer', 150), title: 'Take what you’ll finish.', text: 'This isn’t a clean-plate rule. A small plate you finish gives Loopi full energy, and you’re only ever compared with your own usual.' },
    { consent: true, art: V.icon('check', 'var(--tint)'), title: 'Your data, your choice.', cta: 'Start',
      body: `<div class="onb-prefs">
        <label class="onb-pref"><span><b>Sign in with my face</b><small>The scanner keeps a match code, never a photo. Off: type your class and register number instead.</small></span><input type="checkbox" role="switch" data-pref="face" ${st.faceOff ? '' : 'checked'}></label>

function paint(t) {

  $$('canvas[data-evo]', root).forEach(cv => PL.drawPet(cv, { rows: 30, t, ...PL.petOf(st), mood: 'joy' }));
}

/* ================================================================ Loopi: the Tamagotchi */
function loopiTab(st, g) {
  const max = G.hungerMax(g), req = G.heartsReq(g), next = PL.STAGES[g.stage + 1];
  const form = PL.formOf(st.pet), F = FORMS[form], joy = Math.round(st.pet.jo / 20);

function roomBlock(st, g, big) {

const roomHooks = {
  info: () => { const st = me(), g = G.ensure(st); return { ...PL.petOf(st), plate: g.plate && !g.plate.eaten ? g.plate.food : null, plant: G.plantOf(st) }; },
  mess: () => G.ensure(me()).mess,
  eat: () => { const p = act(() => G.serveLunch(me())); return p && { heart: p.heart, crumbs: p.crumbs.length }; },
  snackFood: id => { const sn = G.ensure(me()).snacks.find(x => x.id === id); if (!sn) return null; const rc = G.RECIPES.find(r => r.id === sn.recipe); return rc.seq.map(t => ({ rice: 'rice', veg: 'kailan', protein: 'chicken', fruit: 'melon' })[t]); },
  eatSnack: id => { const r = act(() => G.eatSnack(me(), id)); return r && { golden: r.snack.golden, wasFull: r.wasFull }; },
  pet: () => { const gems = act(() => G.petLoopi(me())); if (gems) PL.toast(`Loopi found ${gems} gems!`); },
  fetched: () => act(() => G.playBall(me())),
  swept: type => { act(() => G.sweep(me(), type)); if (!G.ensure(me()).mess.length) PL.Room.say('All clean. Thanks!', 2.4); },
  chatter: () => {
    const st = me(), g = G.ensure(st);

    const lines = ['Can we play ball?', null, null];
    if (!st.before) lines.push('Scan your tray before you eat!');
    else if (!st.after) lines.push('Scan your tray again after lunch.');
    if (st.pet.quest < 3) lines.push(`What does ${craving().name.replace('Stir-fried ', '').toLowerCase()} taste like?`);
    if (g.hunger <= 1) lines.push('My tummy is rumbling.');

};
function wireRoom() {
  $$('[data-room]', root).forEach(b => b.onclick = () => {
    const a = b.dataset.room;
    if (a === 'feed') PL.Room.feed();
    else if (a === 'play') PL.Room.throwBall();
    else if (a === 'sweep') { if (PL.Room.crumbs.length) PL.Room.sweepAll(); else PL.Room.say('Nothing to sweep.', 2); }
    else if (a === 'lights') { PL.Room.toggleNight(); render(true); }
    else if (a === 'expand') { ui.big = true; render(true); }
    else if (a === 'close') { ui.big = false; render(true); }
  });
  const big = $('#room-cv-big', root), small = $('#room-cv', root);
  if (big) PL.Room.attach(big, $('#room-say-big', root), roomHooks);
  else if (small) PL.Room.attach(small, $('#room-say', root), roomHooks);
}

/* ================================================================ Lunch: scans, tray, plate, week */
function journey(state, fed) {
  const steps = ['Scan your tray', 'Eat', 'Scan again', 'Feed Loopi'];
  const at = { none: 0, eating: 1, done: fed ? 4 : 3 }[state];
  return `<ol class="journey">${steps.map((s, i) => { const done = i < at; return `<li class="${done ? 'done' : i === at ? 'now' : ''}"><span>${done ? ICON.check : I(STEP_ICONS[i])}</span><small>${s}</small></li>`; }).join('')}</ol>`;
}
function lunchTab(st, g) {
  const state = PL.scanState(st), a = st.after, c = craving();
  const fed = g.plate && g.plate.eaten;
  let line;
  if (state === 'none') line = 'Look at the scanner and put your tray down before you eat. I\'m hungry!';
  else if (state === 'eating') line = st.pet.quest < 3 ? `Enjoy lunch! Try the ${c.name.toLowerCase()} first. It's this week's veggie to try.` : 'Enjoy lunch! Scan your tray again when you\'re done.';
  else if (a.w < .1) line = 'You finished almost everything! That\'s a full bowl for me.';
  else if (a.w < st.baseline) line = `Less left than usual (${pct(a.w)}, your usual is ${pct(st.baseline)}). Nice!`;
  else line = 'Some food came back today. A smaller portion is fine, and I\'ll get crumbs on my floor otherwise!';
  let out = `${petSays(st, line)}${journey(state, fed)}`;
  if (state === 'done' && !fed) out += `<button class="btn primary big" data-go="loopi">Your lunch is in Loopi's bowl. Go feed it</button>`;
  if (state !== 'done') {
    out += `<div class="vcard"><h3>Today's lunch <small>Friday</small></h3>${V.tray(MENU, null, { hi: st.pet.quest < 3 ? c.id : null, tag: d => d.id === c.id && st.pet.quest < 3 ? 'Try me' : '' })}</div>`;
  } else if (a.measured) {

    const leftG = Math.round(sum(a.measured));
    out += `<div class="vcard"><h3>What you ate <small>${pct(1 - a.w)} of your tray</small></h3>${V.tray(MENU, a)}</div>
    <div class="vcard"><h3>Your plate today</h3>${V.healthyPlate(V.plateShares(MENU, eaten))}</div>
    <div class="vcard"><h3>Nutrition</h3><div class="vrings">${V.ring(a.intake.kcal, PL.TARGET.kcal, 'Calories', 'kcal')}${V.ring(a.intake.p, PL.TARGET.p, 'Protein', 'g', 'aim')}${V.ring(a.intake.c, PL.TARGET.c, 'Carbs', 'g')}</div></div>
    <div class="vtips">
      ${a.co2 > 0 ? V.tip('cloud', 'good', `You saved ${a.co2} g of CO₂`, 'Food that isn\'t wasted doesn\'t have to be grown, cooked and thrown away again.') : ''}
      ${leftG > 20 ? V.tip('recycle', 'info', `${leftG} g went into the food waste bin`, 'It shows up as crumbs in Loopi\'s room until you sweep them.') : V.tip('check', 'good', 'Hardly anything left', 'Your tray grew a fruit on the school\'s Green Tree.')}
    </div>`;
  }
  const days = st.log.slice(0, 5).reverse(), tries = Math.min(3, st.pet.quest);
  out += `<div class="vcard"><h3>This week <small>share of lunch eaten</small></h3>${V.week(days.map(l => l.day), days.map(l => 1 - l.w), { today: days.findIndex(l => l.day.startsWith('Fri')) })}</div>
  <div class="vcard"><h3>${c.name.replace('Stir-fried ', '')} week <small>${tries} of 3 tries</small></h3><div class="tries">${[0, 1, 2].map(i => `<div class="${i < tries ? 'on' : ''}">${V.food(c, 42)}<span>${i < tries ? 'Tried!' : `Try ${i + 1}`}</span></div>`).join('')}</div></div>`;
  return out;
}

      const open = G.recipeUnlocked(g, rc), have = rc.unlock ? g.cards[rc.unlock] : 0;
      return `<div class="rcp ${open ? '' : 'locked'}"><span class="seq2">${rc.seq.map((t, i) => `${i ? '<i>›</i>' : ''}${ING(t, 26)}`).join('')}</span><div><b>${rc.name}</b><small>+${rc.hunger} food${open ? '' : ` · ${have} of ${rc.cost} cards`}</small></div>${open ? '<span class="pill green">Known</span>' : `<button class="btn small" data-unlock="${rc.unlock}" ${have >= rc.cost ? '' : 'disabled'}>Unlock</button>`}</div>`;

function catchTab(g) {

    </div>

    <p class="hint" style="margin-top:10px">Every 2 foods you catch become 1 ingredient. Golden cards unlock recipes. Best score: <b class="num">${g.best}</b></p></div>`;
