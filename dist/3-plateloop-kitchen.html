<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlateLoop Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Silkscreen&display=swap">
<style>
/* PlateLoop: Apple-style interface. System font stack (SF Pro on Apple devices, Inter elsewhere),
   iOS/iPadOS materials, one green tint, full light + dark themes. */
:root{
  --bg:#F5F5F7; --bg2:#FFFFFF; --fill:#F2F2F7; --fill2:#E5E5EA; --fill3:#D1D1D6;
  --label:#1D1D1F; --label2:#6E6E73; --label3:#8E8E93; --sep:rgba(60,60,67,.13);
  --tint:#34C759; --tint-ink:#248A3D; --tint-soft:#E6F7EA;
  --blue:#007AFF; --orange:#FF9500; --orange-soft:#FFF2E0; --red:#FF3B30; --red-soft:#FFE8E6; --yellow:#FFCC00; --purple:#AF52DE; --indigo:#5856D6; --teal:#30B0C7;
  --bar:rgba(245,245,247,.78); --bar2:rgba(255,255,255,.82);
  --shadow-s:0 1px 2px rgba(0,0,0,.05),0 1px 1px rgba(0,0,0,.03);
  --shadow:0 4px 12px rgba(0,0,0,.05),0 20px 40px -20px rgba(0,0,0,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
  --pixel:"Silkscreen",ui-monospace,monospace;
  /* names the shared renderers use */
  --ink:var(--label); --ink-2:var(--label2); --ink-3:var(--label3); --ground:var(--bg2); --surface:var(--bg2); --surface-2:var(--fill); --line:var(--sep);
  --mint:var(--tint); --mint-ink:var(--tint-ink); --mint-soft:var(--tint-soft); --persim:var(--orange); --persim-ink:var(--orange); --persim-soft:var(--orange-soft);
  --sun:var(--yellow); --sun-soft:#FFF8D6; --bad:var(--red); --bad-soft:var(--red-soft); --warn:#C77700; --gold:#C99A00;
  --steel:#D8DBDF; --steel-2:#EDEFF1; --steel-edge:#B8BCC2;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000; --bg2:#1C1C1E; --fill:#2C2C2E; --fill2:#3A3A3C; --fill3:#48484A;
    --label:#F5F5F7; --label2:#AEAEB2; --label3:#8E8E93; --sep:rgba(84,84,88,.6);
    --tint:#30D158; --tint-ink:#30D158; --tint-soft:rgba(48,209,88,.16);
    --blue:#0A84FF; --orange:#FF9F0A; --orange-soft:rgba(255,159,10,.16); --red:#FF453A; --red-soft:rgba(255,69,58,.16); --yellow:#FFD60A; --purple:#BF5AF2;
    --bar:rgba(22,22,24,.78); --bar2:rgba(28,28,30,.85);
    --shadow-s:none; --shadow:0 20px 40px -20px rgba(0,0,0,.8);
    --sun-soft:rgba(255,214,10,.14); --warn:#FFD60A; --gold:#FFD60A;
    --steel:#4A4D52; --steel-2:#3A3C40; --steel-edge:#63676D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --bg2:#1C1C1E; --fill:#2C2C2E; --fill2:#3A3A3C; --fill3:#48484A;
  --label:#F5F5F7; --label2:#AEAEB2; --label3:#8E8E93; --sep:rgba(84,84,88,.6);
  --tint:#30D158; --tint-ink:#30D158; --tint-soft:rgba(48,209,88,.16);
  --blue:#0A84FF; --orange:#FF9F0A; --orange-soft:rgba(255,159,10,.16); --red:#FF453A; --red-soft:rgba(255,69,58,.16); --yellow:#FFD60A; --purple:#BF5AF2;
  --bar:rgba(22,22,24,.78); --bar2:rgba(28,28,30,.85);
  --shadow-s:none; --shadow:0 20px 40px -20px rgba(0,0,0,.8);
  --sun-soft:rgba(255,214,10,.14); --warn:#FFD60A; --gold:#FFD60A;
  --steel:#4A4D52; --steel-2:#3A3C40; --steel-edge:#63676D;
}

/* ================================================================ base */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font:15px/1.47 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;padding-inline:0;padding-block:0 32px}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;letter-spacing:-.022em;text-wrap:balance;line-height:1.12}
h1{font-size:clamp(30px,5vw,40px);font-weight:700}
h2{font-size:28px;font-weight:700}
h3{font-size:17px;font-weight:600;letter-spacing:-.015em}
p{margin:0}
a{color:var(--blue);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--label2);line-height:1.4}
.muted{color:var(--label3)}
.eyebrow{font-size:12px;font-weight:600;color:var(--label3);text-transform:uppercase;letter-spacing:.04em}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.up{color:var(--tint-ink);font-weight:600;white-space:nowrap}
.page{max-width:1200px;margin:0 auto;padding:28px 20px 24px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head p{color:var(--label2);margin-top:6px;max-width:60ch;font-size:16px}
.card,.panel{background:var(--bg2);border-radius:20px;padding:18px;box-shadow:var(--shadow-s)}
.section-title{font-size:20px;font-weight:700;margin:28px 0 12px;font-family:var(--font-d);letter-spacing:-.02em}

/* ================================================================ controls */
.btn{border:0;background:var(--fill);color:var(--label);padding:9px 16px;border-radius:999px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,background .15s,opacity .15s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--fill2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--tint);color:#fff}
.btn.primary:hover{background:color-mix(in srgb,var(--tint) 88%,#000)}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.ghost:hover{background:var(--fill)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.big{width:100%;padding:13px 18px;font-size:16px;border-radius:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.linkish{border:0;background:none;padding:0;color:var(--blue);font-weight:600}
.seg{display:flex;background:var(--fill2);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--label);white-space:nowrap;transition:background .2s,box-shadow .2s}
.seg button[aria-pressed="true"]{background:var(--bg2);box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
select{font:inherit;width:100%;padding:9px 12px;border-radius:12px;border:0;background:var(--fill);color:var(--label);appearance:auto}
input[type=range]{width:100%;accent-color:var(--tint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--bg2);box-shadow:var(--shadow-s);border-radius:999px;padding:6px 12px 6px 6px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--label);color:var(--bg2)}
.chip canvas{width:28px;height:24px;image-rendering:pixelated;border-radius:7px;background:var(--lcd,#DDE4D4)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--fill);color:var(--label2);white-space:nowrap}
.pill.green,.pill.mint{background:var(--tint-soft);color:var(--tint-ink)}
.pill.orange{background:var(--orange-soft);color:var(--orange)}
.pill.red{background:var(--red-soft);color:var(--red)}
.flag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.flag.ok{background:var(--tint-soft);color:var(--tint-ink)}
.flag.mid{background:var(--orange-soft);color:var(--orange)}
.flag.low{background:var(--red-soft);color:var(--red)}
.bar{height:8px;border-radius:999px;background:var(--fill2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--tint)}
.bar.nu i{background:var(--yellow)} .bar.jo i{background:var(--orange)}
.stat{display:grid;grid-template-columns:78px 1fr 30px;gap:10px;align-items:center;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--label3);padding:8px 10px;border-bottom:.5px solid var(--sep);white-space:nowrap}
td{padding:10px;border-bottom:.5px solid var(--sep);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.table-wrap{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(29,29,31,.92);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);z-index:90;max-width:calc(100% - 32px);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);text-align:center}
canvas.px{image-rendering:pixelated;background:#DDE4D4;border-radius:10px;display:block}
.scanline{animation:scan 1.5s ease-in-out infinite}
@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(270px)}100%{transform:translateY(0)}}
.det-label{font:600 11px var(--font)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ================================================================ app bar (shared by all four) */
.appbar{position:sticky;top:0;z-index:50;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.appbar-in{max-width:1200px;margin:0 auto;padding:0 20px;height:52px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:8px;font:600 17px var(--font-d);color:var(--label);letter-spacing:-.02em}
.mark{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 200deg,var(--tint),#8BE0A4,var(--tint));position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.mark::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg2)}
.appnav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.appnav a{padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;color:var(--label2);white-space:nowrap;transition:background .15s,color .15s}
.appnav a:hover{color:var(--label);background:var(--fill)}
.appnav a[aria-current="page"]{color:var(--label);background:var(--fill2);font-weight:600}
.appbar-reset{border:0;background:none;color:var(--blue);font-size:14px;font-weight:500;padding:6px 8px;border-radius:8px;white-space:nowrap}
@media (max-width:720px){.appbar-in{gap:10px;padding:0 12px}.brand{font-size:0;gap:0}.appbar-reset{font-size:0;padding:0;width:0;overflow:hidden}}

/* ================================================================ leaderboards (student) */
.lb{display:flex;flex-direction:column;background:var(--bg2);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-s)}
.lb-row{display:grid;grid-template-columns:28px 40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 14px;position:relative}
.lb-row + .lb-row::before{content:"";position:absolute;left:94px;right:0;top:0;border-top:.5px solid var(--sep)}
.lb-row canvas{width:40px;height:34px;image-rendering:pixelated;border-radius:9px;background:#DDE4D4}
.lb-row.me{background:var(--tint-soft)}
.lb-rank{font:600 15px var(--font-d);color:var(--label3);text-align:center;font-variant-numeric:tabular-nums}
.lb-row.top1 .lb-rank{color:#D4A017}.lb-row.top2 .lb-rank{color:#9EA3A8}.lb-row.top3 .lb-rank{color:#C27C3E}
.lb-name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-sub{font-size:12.5px;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-val{font:600 16px var(--font-d);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lb-val small{display:block;font:400 11.5px var(--font);color:var(--label3)}
.lb-gap{text-align:center;color:var(--label3);font-size:12px;padding:4px;letter-spacing:.3em}
.lb-row .sch{width:40px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--fill);font:700 13px var(--font-d);color:var(--label2)}
.lb-bar{height:4px;background:var(--fill2);border-radius:999px;margin-top:5px;overflow:hidden}
.lb-bar i{display:block;height:100%;background:var(--tint);border-radius:999px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin-bottom:12px}
.podium div{background:var(--bg2);border-radius:16px;padding:10px 6px 12px;text-align:center;box-shadow:var(--shadow-s)}
.podium canvas{width:56px;height:47px;image-rendering:pixelated;border-radius:12px;background:#DDE4D4;display:block;margin:0 auto 6px}
.podium b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium small{font-size:12px;color:var(--label2)}
.podium .p1{padding-top:16px}.podium .medal{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font:700 12px var(--font-d);color:#fff;margin-bottom:6px}
.m1{background:linear-gradient(145deg,#F5C84C,#D4A017)}.m2{background:linear-gradient(145deg,#D5D8DC,#9EA3A8)}.m3{background:linear-gradient(145deg,#E3A56B,#C27C3E)}

/* ================================================================ STUDENT APP */
.stu{display:grid;grid-template-columns:minmax(0,1fr) 390px minmax(0,1fr);gap:32px;align-items:start;max-width:1200px;margin:0 auto;padding:28px 20px}
.stu-side{grid-column:1;justify-self:end;max-width:280px;display:flex;flex-direction:column;gap:14px;padding-top:24px}
.stu-side h2{font-size:24px}
.stu-note{font-size:13px;color:var(--label2);line-height:1.45}
.phone{grid-column:2;position:relative;background:var(--bg);border-radius:52px;height:min(820px,calc(100vh - 110px));min-height:640px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 11px #1D1D1F,0 0 0 13px #3A3A3C,0 40px 80px -30px rgba(0,0,0,.45)}
.phone::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:999px;background:#000;z-index:45}
.phone-top{display:flex;align-items:center;gap:10px;padding:52px 18px 10px;background:var(--bar2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep)}
.phone-top canvas{width:36px;height:30px;image-rendering:pixelated;border-radius:9px;background:#DDE4D4}
.phone-top b{font:700 20px var(--font-d);display:block;line-height:1.1;letter-spacing:-.02em}
.phone-top span{font-size:12px;color:var(--label2)}
.phone-top .pts{margin-left:auto;text-align:right}
.phone-top .pts b{font-size:17px}
.gems{display:inline-flex;align-items:center;gap:4px;background:var(--fill);border-radius:999px;padding:4px 10px 4px 7px;font-weight:600;font-size:14px}
.gem{width:15px;height:15px;flex:none}
.phone-body{flex:1;overflow-y:auto;padding:14px 14px 24px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;scrollbar-width:none}
.phone-tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--bar2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);padding:6px 4px 22px}
.phone-tabs button{border:0;background:transparent;padding:4px 2px;font-size:10.5px;font-weight:500;color:var(--label3);display:flex;flex-direction:column;align-items:center;gap:2px}
.phone-tabs button svg{width:24px;height:24px}
.phone-tabs button[aria-selected="true"]{color:var(--tint)}
.phone .card{padding:14px;border-radius:18px}
.phone .card h3{font-size:16px}
@media (max-width:1040px){.stu{grid-template-columns:minmax(0,1fr) 390px}.stu-side{justify-self:stretch;max-width:none}.phone{grid-column:2}}
@media (max-width:760px){
  .stu{grid-template-columns:1fr;gap:10px;padding:12px 14px 0}
  .stu-side{grid-column:1;padding-top:0}
  .stu-side .stu-note,.stu-side h2,.stu-side .eyebrow{display:none}
  .phone{grid-column:1;border-radius:0;height:auto;min-height:0;overflow:visible;box-shadow:none;background:transparent}
  .phone::before{display:none}
  .phone-top{padding:12px 14px;border-radius:18px;border:0;box-shadow:var(--shadow-s);background:var(--bg2)}
  .phone-body{overflow:visible;padding:12px 0 100px}
  .phone-tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
}
.egg{position:relative;width:196px;aspect-ratio:10/11.4;margin:6px auto 0;border-radius:50% 50% 46% 46% / 56% 56% 44% 44%;background:radial-gradient(110% 85% at 32% 22%,#FFFFFF 0%,#F2F2F5 55%,#DCDDE2 100%);box-shadow:inset -6px -10px 22px rgba(0,0,0,.08),inset 5px 6px 14px rgba(255,255,255,.9),0 18px 30px -16px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.egg .logo{font:600 9px var(--font);color:#8E8E93;letter-spacing:.3em}
.lcd-frame{background:#2C2C2E;padding:6px;border-radius:14px;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.lcd-frame canvas{display:block;width:124px;height:100px;border-radius:9px;image-rendering:pixelated;background:#DDE4D4;cursor:pointer}
.egg-btns{display:flex;gap:14px}
.egg-btns button{width:26px;height:26px;border-radius:50%;border:0;background:linear-gradient(180deg,#FFFFFF,#E5E5EA);box-shadow:0 2px 4px rgba(0,0,0,.18),inset 0 -1px 2px rgba(0,0,0,.08);font:600 9px var(--font);color:#8E8E93}
.egg-btns button[aria-pressed="true"]{background:linear-gradient(180deg,#E5E5EA,#FFFFFF);box-shadow:inset 0 1px 3px rgba(0,0,0,.2);color:var(--tint-ink)}
.meter{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;font-size:14px}
.meter .pips{display:flex;gap:4px;flex-wrap:wrap}
.meter .pips i{width:13px;height:13px;border-radius:4px;background:var(--fill2)}
.meter .pips i.on{background:var(--yellow)}
.hearts{display:flex;gap:3px;flex-wrap:wrap}
.hearts svg{width:17px;height:17px}
.rar{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--fill);color:var(--label2)}
.rar-rare{background:rgba(0,122,255,.12);color:var(--blue)}
.rar-epic{background:rgba(175,82,222,.14);color:var(--purple)}
.rar-legendary{background:rgba(255,204,0,.2);color:#B38600}
.crave{display:flex;gap:12px;align-items:center;background:var(--bg2);border-radius:18px;padding:12px;box-shadow:var(--shadow-s)}
.crave b{font:600 15px var(--font-d);display:block}
.pips.q{display:flex;gap:5px;margin-top:6px}
.pips.q i{width:24px;height:6px;border-radius:999px;background:var(--fill2)}
.pips.q i.on{background:var(--orange)}
.forms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.form{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;background:var(--fill);border-radius:12px;padding:6px 8px;font-size:12px;color:var(--label2)}
.form canvas{width:44px;height:37px;image-rendering:pixelated;border-radius:8px;background:#DDE4D4}
.form b{display:block;color:var(--label);font-size:13px}
.form.lead{background:var(--tint-soft);box-shadow:inset 0 0 0 1.5px var(--tint)}
details.how summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}
details.how summary::after{content:"›";float:right;color:var(--label3);transition:transform .2s}
details.how[open] summary::after{transform:rotate(90deg)}
details.how ul{margin:10px 0 0;padding-left:18px;color:var(--label2);display:flex;flex-direction:column;gap:5px;font-size:14px}
.snacks,.recipes{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.snack,.recipe{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--fill);border-radius:12px;padding:7px 9px}
.snack.golden{background:var(--sun-soft);box-shadow:inset 0 0 0 1.5px var(--yellow)}
.snack b,.recipe b{display:block;font-size:14px;font-weight:600}
.snack small,.recipe small{display:block;font-size:12px;color:var(--label2)}
.recipe.locked .seq{filter:grayscale(1);opacity:.45}
.seq{display:flex;gap:2px}
canvas.ing{width:24px;height:24px;image-rendering:pixelated}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ing-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.ing-cell{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--fill);border-radius:14px;padding:9px 4px;border:0;text-align:center;font:inherit;color:inherit}
.ing-cell canvas.ing{width:30px;height:30px}
.ing-cell b{font:700 17px var(--font-d)}
.ing-cell small{font-size:11px;color:var(--label2);line-height:1.2}
button.ing-cell:hover{background:var(--fill2)}
button.ing-cell:active{transform:scale(.96)}
button.ing-cell:disabled{opacity:.35;cursor:not-allowed}
.booth{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.bin{width:108px;margin:4px auto 0}
.bin-lid{height:9px;border-radius:6px 6px 2px 2px;background:var(--tint);margin:0 -5px}
.bin-body{height:110px;border-radius:0 0 16px 16px;position:relative;overflow:hidden;background:var(--fill)}
.bin-fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#8DE0A6,var(--tint));transition:height .5s cubic-bezier(.2,.8,.2,1)}
.booth-kg{font:700 30px var(--font-d);letter-spacing:-.02em}
.oven{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;background:#2C2C2E;border-radius:16px;padding:10px}
.slot{aspect-ratio:1;border-radius:11px;background:#3A3A3C;box-shadow:inset 0 2px 6px rgba(0,0,0,.4);display:grid;place-items:center;position:relative}
.slot canvas.ing{width:32px;height:32px}
.slot em{position:absolute;bottom:3px;font:600 9px var(--font);font-style:normal;color:#8BE0A4}
.oven-msg{min-height:20px;margin-top:8px;font-size:13.5px;color:var(--label2)}
.bin-items{display:flex;flex-wrap:wrap;gap:4px;min-height:36px;margin-block:10px;padding:8px;border-radius:12px;background:var(--fill)}
.catch-wrap{position:relative;margin-top:10px;border-radius:16px;overflow:hidden;touch-action:none}
.catch-wrap canvas{display:block;width:100%;height:auto;image-rendering:pixelated;aspect-ratio:5/6}
.catch-hud{position:absolute;top:8px;left:10px;right:10px;font:600 13px var(--font);color:#1D1D1F}
.catch-hud span{color:var(--red);letter-spacing:2px}
.catch-cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);color:#1D1D1F;text-align:center;padding:16px}
.catch-cover .btn{width:auto;padding-inline:34px}
.catch-cover small{font-size:12px;color:#6E6E73}
.catch-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.catch-ctrl .btn{font-size:17px;user-select:none;touch-action:none;border-radius:14px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-block:10px 6px;font-size:12.5px;color:var(--label2)}
.legend span{display:inline-flex;align-items:center;gap:3px}
.legend canvas{width:20px;height:20px;image-rendering:pixelated}
#stu-layer{position:absolute;inset:0;pointer-events:none;z-index:44}
#stu-layer > *{pointer-events:auto}
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;animation:sheetin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet header{display:flex;align-items:center;gap:10px;padding:54px 16px 12px;background:var(--bar2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep)}
.sheet header h3{flex:1;font-size:20px;font-weight:700}
.sheet-body{flex:1;overflow-y:auto;padding:14px 14px 24px;display:flex;flex-direction:column;gap:12px}
.crates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.crate{border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;background:var(--bg2);box-shadow:var(--shadow-s)}
.crate b{font-size:13px;font-weight:600}
.crate small{font-size:10.5px;color:var(--label2)}
.crate-epic{background:linear-gradient(180deg,rgba(175,82,222,.12),var(--bg2))}
.crate-legendary{background:linear-gradient(180deg,rgba(255,204,0,.18),var(--bg2))}
.acc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acc{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:var(--bg2);border-radius:16px;padding:9px 4px;font:inherit;color:inherit;box-shadow:var(--shadow-s)}
.acc canvas{width:62px;height:52px;image-rendering:pixelated;border-radius:10px;background:#DDE4D4}
.acc b{font-size:12.5px;font-weight:600}
.acc.locked{cursor:default}
.acc.locked canvas{filter:grayscale(1) brightness(.75);opacity:.45}
.acc.on{box-shadow:0 0 0 2px var(--tint)}
.barn-total{display:flex;justify-content:space-between;align-items:center;background:var(--tint-soft);border-radius:14px;padding:12px 14px;font-weight:600}
.barn-total b{font:700 22px var(--font-d)}
.barn{display:flex;flex-direction:column;gap:6px}
.barn-pet{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--bg2);border-radius:14px;padding:7px 10px;box-shadow:var(--shadow-s)}
.barn-pet.active{box-shadow:inset 0 0 0 1.5px var(--tint)}
.barn-pet canvas{width:56px;height:47px;image-rendering:pixelated;border-radius:10px;background:#DDE4D4}
.barn-pet b{display:block;font-size:14px}
.barn-pet small{font-size:12px;color:var(--label2)}
.pmodal{position:absolute;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:22px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pmodal-card{background:var(--bg2);border-radius:22px;padding:20px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
.pmodal-card h3{text-align:center;font-size:20px;font-weight:700}
.big-num{font:700 46px var(--font-d);text-align:center;line-height:1;letter-spacing:-.03em}
.got{display:flex;flex-direction:column;gap:6px}
.got > div{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:12px;padding:7px 10px;font-size:14px}
.got canvas{width:28px;height:28px;image-rendering:pixelated}
canvas.reveal{display:block;margin:0 auto;width:150px;height:125px;image-rendering:pixelated;border-radius:16px;background:#DDE4D4;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.badge{text-align:center;font-size:11px;font-weight:500;color:var(--label2)}
.badge .em{width:54px;height:54px;border-radius:50%;margin:0 auto 5px;display:grid;place-items:center;background:linear-gradient(145deg,#FFE9A8,#FFCC00);box-shadow:inset 0 -2px 4px rgba(0,0,0,.1)}
.badge .em svg{width:26px;height:26px;color:#7A5A00!important}
.badge.locked{color:var(--label3)}
.badge.locked .em{background:var(--fill)}
.badge.locked .em svg{color:var(--label3)!important;opacity:.6}
.quest-card{border-radius:18px;padding:14px;background:var(--bg2);box-shadow:var(--shadow-s)}
.quest-card.big{background:linear-gradient(135deg,#FFB340,#FF9500);color:#fff}
.quest-card.big .eyebrow{color:rgba(255,255,255,.8)}
.quest-card b{font:600 17px var(--font-d);display:block;margin-block:2px 4px}
.qdone{font-size:13px;font-weight:600;color:var(--tint-ink)}
.menu-list{display:flex;flex-direction:column;margin-top:8px}
.menu-list div{display:flex;align-items:center;gap:10px;font-size:14px;padding:7px 0;border-bottom:.5px solid var(--sep)}
.menu-list div:last-child{border-bottom:0}
.menu-list i{width:12px;height:12px;border-radius:50%;flex:none}
.menu-list span{margin-left:auto;color:var(--label2);font-size:12.5px}
.scanstat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scanstat div{background:var(--bg2);border-radius:16px;padding:12px;box-shadow:var(--shadow-s)}
.scanstat .k{font-size:12px;color:var(--label2);display:flex;align-items:center;gap:6px}
.scanstat .k i{width:8px;height:8px;border-radius:50%;background:var(--fill3)}
.scanstat .ok .k i{background:var(--tint)}
.scanstat b{font:700 20px var(--font-d);display:block;margin-top:2px}
.scanstat small{font-size:12px;color:var(--label2)}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini-stats div{background:var(--bg2);border-radius:14px;padding:10px;font-size:12px;color:var(--label2);box-shadow:var(--shadow-s)}
.mini-stats b{display:block;font:700 20px var(--font-d);color:var(--label)}
.optin{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--label2);padding:4px 2px}
.optin input{width:20px;height:20px;accent-color:var(--tint)}
@media (max-width:760px){#stu-layer,.sheet,.pmodal{position:fixed}.sheet header{padding-top:16px}}

/* ================================================================ SCANNER SCREEN (a white kiosk: one look) */
.kio-page{max-width:1080px;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column;gap:18px}
.kiosk{background:#1D1D1F;border-radius:36px;padding:16px;box-shadow:0 0 0 1.5px #3A3A3C,0 40px 80px -40px rgba(0,0,0,.6)}
.kio-screen{container-type:inline-size;background:#FFFFFF;color:#1D1D1F;border-radius:22px;aspect-ratio:16/10;overflow:hidden;position:relative;font-family:var(--font)}
.kio-screen:fullscreen{border-radius:0}
.kio-status{position:absolute;top:2cqw;left:3cqw;right:3cqw;display:flex;justify-content:space-between;font:600 1.4cqw var(--font);color:#8E8E93}
.kio-status span:last-child{display:flex;align-items:center;gap:.6cqw}
.kio-status i{width:.8cqw;height:.8cqw;border-radius:50%;background:#34C759;display:inline-block}
.kio-main{position:absolute;left:0;right:0;top:0;bottom:24%;display:grid;grid-template-columns:38% 62%;align-items:center;padding:4cqw 4cqw 1cqw}
.kio-left{display:flex;flex-direction:column;align-items:center;gap:1.4cqw}
.kio-left canvas{width:26cqw;height:21.5cqw;image-rendering:pixelated;border-radius:2.4cqw;background:#DDE4D4;box-shadow:0 0 0 .9cqw #F2F2F7}
.kio-left .cap{font-size:1.5cqw;color:#8E8E93;text-align:center}
.kio-right{display:flex;flex-direction:column;gap:1.4cqw;padding-left:2cqw}
.kio-kicker{font:600 1.6cqw var(--font);color:#34C759;letter-spacing:.01em}
.kio-title{font:700 5cqw/1.04 var(--font-d);letter-spacing:-.035em}
.kio-sub{font-size:2cqw;color:#6E6E73;line-height:1.35;max-width:40ch}
.kio-tray{width:100%;max-width:34cqw}
.kio-tray svg{width:100%;height:auto;display:block}
.kio-tray svg rect[fill="url(#kt)"]{fill:#E5E7EA}
.kio-big{display:flex;align-items:baseline;gap:1.4cqw}
.kio-big b{font:700 7.5cqw/1 var(--font-d);letter-spacing:-.04em}
.kio-big span{font-size:1.8cqw;color:#6E6E73;line-height:1.3}
.kio-chips{display:flex;gap:.8cqw;flex-wrap:wrap}
.kio-chips span{background:#F2F2F7;border-radius:99cqw;padding:.6cqw 1.3cqw;font:600 1.55cqw var(--font);color:#1D1D1F}
.kio-chips em{font-style:normal;color:#248A3D}
.kio-rank{font-size:1.75cqw;color:#1D1D1F;display:flex;flex-direction:column;gap:.4cqw}
.kio-rank b{color:#248A3D}
.kio-bubble{background:#F2F2F7;border-radius:2cqw;padding:1.3cqw 1.8cqw;font:600 2cqw/1.3 var(--font-d);letter-spacing:-.01em;position:relative;max-width:44cqw}
.kio-meta{display:flex;gap:2.4cqw}
.kio-meta div{font-size:1.5cqw;color:#8E8E93}
.kio-meta b{display:block;font:700 3cqw var(--font-d);color:#1D1D1F;letter-spacing:-.02em}
.kio-steps{display:flex;flex-direction:column;gap:.5cqw;font-size:1.8cqw;color:#8E8E93}
.kio-steps .on{color:#1D1D1F;font-weight:600}.kio-steps .done{color:#34C759}
/* instruction banner */
.kio-banner{position:absolute;left:2.4cqw;right:2.4cqw;bottom:2.4cqw;height:19%;background:#F5F5F7;border-radius:2.4cqw;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:0 1.5cqw;overflow:hidden}
.kio-banner.solo{grid-template-columns:1fr}
.kstep{display:flex;align-items:center;gap:1.4cqw;padding:1cqw 1.4cqw;border-radius:1.8cqw;color:#8E8E93;transition:background .35s,color .35s}
.kstep .ic{width:6.2cqw;height:6.2cqw;border-radius:1.6cqw;background:#FFFFFF;display:grid;place-items:center;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:background .35s}
.kstep .ic svg{width:4.2cqw;height:4.2cqw;overflow:visible}
.kstep b{display:block;font:600 1.9cqw var(--font-d);letter-spacing:-.01em;color:inherit}
.kstep small{font-size:1.35cqw;color:#8E8E93}
.kstep .n{font:700 1.3cqw var(--font);color:#C7C7CC}
.kstep.on{background:#FFFFFF;color:#1D1D1F;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.kstep.on .ic{background:#34C759;color:#fff}
.kstep.on .n{color:#34C759}
.kstep.on .a-card{animation:kcard 1.6s ease-in-out infinite}
.kstep.on .a-tray{animation:ktray 1.6s ease-in-out infinite}
.kstep.on .a-wave{animation:kwave 1.2s ease-out infinite}
.kstep.on .a-wave.w2{animation-delay:.3s}
.kstep.on .a-drop{animation:kdrop 1.4s ease-in infinite}
.kstep.on .a-check{stroke-dasharray:30;animation:kcheck 1.6s ease-out infinite}
@keyframes kcard{0%,100%{transform:translate(0,0)}45%,60%{transform:translate(0,4px)}}
@keyframes ktray{0%{transform:translateY(-6px);opacity:.3}50%,100%{transform:translateY(0);opacity:1}}
@keyframes kwave{0%{opacity:0;transform:scale(.7)}40%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
@keyframes kdrop{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(6px);opacity:0}}
@keyframes kcheck{0%{stroke-dashoffset:30}50%,100%{stroke-dashoffset:0}}
.a-card,.a-tray,.a-wave,.a-drop{transform-box:fill-box;transform-origin:center}
.kio-progress{position:absolute;left:0;bottom:0;height:.45cqw;background:#34C759;border-radius:0 1cqw 1cqw 0;animation:kprog 10s linear forwards}
@keyframes kprog{from{width:100%}to{width:0}}
.kio-done{position:absolute;right:4cqw;top:4cqw;border:0;background:#F2F2F7;color:#1D1D1F;font:600 1.6cqw var(--font);padding:.9cqw 2cqw;border-radius:99cqw}
.kio-demo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:end}
.kio-demo label{display:block;font-size:12px;font-weight:600;color:var(--label3);margin-bottom:6px}
.kio-note{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:.5px solid var(--sep)}
@media (max-width:860px){.kio-demo{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.kio-demo{grid-template-columns:1fr}.kiosk{padding:8px;border-radius:22px}.kio-screen{border-radius:14px}}

/* ================================================================ KITCHEN APP (iPadOS layout) */
.kit{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 53px)}
.kit-side{background:var(--bg2);border-right:.5px solid var(--sep);padding:20px 12px;position:sticky;top:53px;height:calc(100vh - 53px);display:flex;flex-direction:column;gap:4px}
.kit-side .who{padding:4px 10px 14px}
.kit-side .who b{display:block;font:700 22px var(--font-d);letter-spacing:-.02em}
.kit-side .who span{font-size:13px;color:var(--label2)}
.kit-side button{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:10px;color:var(--label)}
.kit-side button:hover{background:var(--fill)}
.kit-side button[aria-current="page"]{background:var(--tint);color:#fff}
.kit-side button svg{width:20px;height:20px;flex:none;color:var(--tint)}
.kit-side button[aria-current="page"] svg{color:#fff}
.kit-side .live{margin-top:auto;padding:10px}
.kit-main{padding:28px 32px 48px;min-width:0}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--tint-ink)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--tint);box-shadow:0 0 0 4px var(--tint-soft);animation:livep 2s ease-in-out infinite}
@keyframes livep{50%{box-shadow:0 0 0 7px transparent}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--bg2);border-radius:18px;padding:16px;box-shadow:var(--shadow-s)}
.kpi .k{font-size:13px;color:var(--label2);font-weight:500}
.kpi .v{font:700 30px var(--font-d);letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--label3)}
.kpi .v.good{color:var(--tint-ink)}
.kgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.kgrid + .kgrid,.kgrid + .card,.card + .kgrid,.card + .card{margin-top:16px}
.card h3 + .hint{margin-top:2px}
.chart svg{width:100%;height:auto;display:block;margin-top:10px}
.axis{font:500 11px var(--font);fill:var(--label3)}
.gridline{stroke:var(--sep);stroke-width:1}
.feed{max-height:380px;overflow-y:auto;margin-top:6px}
.frow{display:grid;grid-template-columns:52px 66px 60px 1fr auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:.5px solid var(--sep);font-size:14px}
.frow:last-child{border-bottom:0}
.frow.new{animation:flash 2.4s ease-out}
@keyframes flash{from{background:var(--tint-soft)}to{background:transparent}}
.kind{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;text-align:center}
.kind.before{background:rgba(0,122,255,.12);color:var(--blue)}
.kind.after{background:var(--tint-soft);color:var(--tint-ink)}
.frow .t,.frow .tr{color:var(--label2);font-variant-numeric:tabular-nums}
.frow .val{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-block:12px 8px}
.controls label{font-size:12px;font-weight:600;color:var(--label3);display:block;margin-bottom:6px}
.savings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.save{border-radius:16px;padding:14px;background:var(--tint-soft)}
.save .k{font-size:13px;color:var(--tint-ink);font-weight:600}
.save .v{font:700 26px var(--font-d);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.save .s{font-size:12.5px;color:var(--label2)}
.trust{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--label2);flex-wrap:wrap}
.trust .bar{flex:1;min-width:80px;max-width:180px}
.diff{color:var(--tint-ink);font-weight:600}
.approve{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
.report{font-size:16px;line-height:1.6;color:var(--label);max-width:68ch}
.report p + p{margin-top:12px}
.insights{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.insight{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--fill);border-radius:14px;padding:12px}
.insight .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}
.insight .ic svg{width:18px;height:18px}
.insight b{display:block;font-size:15px}
.insight span{font-size:13.5px;color:var(--label2)}
.mix{display:flex;height:12px;border-radius:999px;overflow:hidden;margin-top:10px;background:var(--fill2)}

<body>
<div id="root"></div>
<noscript>PlateLoop needs JavaScript to run.</noscript>
<script>
/* ---- js/core.js ---- */
/* PlateLoop core: shared data, before/after scans, state store (synced across tabs and files),
   pixel pet + tray renderers. The four apps (model, scanner, kitchen, student) all use PL.store. */
(() => {
'use strict';
const PL = window.PL = { apps: {} };

/* ------------------------------------------------------------ utils */
const $ = PL.$ = (s, r = document) => r.querySelector(s);
PL.$$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = PL.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
PL.pct = v => Math.round(v * 100) + '%';
PL.fmt1 = v => (Math.round(v * 10) / 10).toFixed(1);
PL.money = v => '$' + Math.round(v).toLocaleString('en-US');
PL.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
PL.reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rng = PL.rng = seed => { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
PL.toast = msg => {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3600);
};

/* ------------------------------------------------------------ constants */
const MENU = PL.MENU = [
  { id: 'spinach', n: { c: .04, p: .03, f: .035 }, name: 'Spinach namul', group: 'veg', g: { S: 30, M: 45, L: 60 }, kcal: .55, price: .009, color: '#3F7D32', edge: '#2A5A22', slot: [0, 0] },
  { id: 'kimchi', n: { c: .04, p: .015, f: .005 }, name: 'Kimchi', group: 'veg', g: { S: 25, M: 35, L: 45 }, kcal: .3, price: .0045, color: '#D5502F', edge: '#A23A20', slot: [1, 0] },
  { id: 'apple', n: { c: .14, p: .003, f: .002 }, name: 'Apple slices', group: 'fruit', g: { S: 50, M: 70, L: 90 }, kcal: .52, price: .005, color: '#F1DDA4', edge: '#C9A95E', slot: [2, 0] },
  { id: 'rice', n: { c: .32, p: .03, f: .003 }, name: 'Multigrain rice', group: 'grain', g: { S: 130, M: 180, L: 230 }, kcal: 1.45, price: .0032, color: '#F3EDDA', edge: '#BFB28E', slot: [0, 1] },
  { id: 'bulgogi', n: { c: .08, p: .18, f: .12 }, name: 'Beef bulgogi', group: 'protein', g: { S: 60, M: 90, L: 120 }, kcal: 2.1, price: .019, color: '#7A4424', edge: '#4F2A15', slot: [1, 1] },
  { id: 'soup', n: { c: .04, p: .03, f: .015 }, name: 'Soybean paste soup', group: 'soup', g: { S: 150, M: 200, L: 250 }, kcal: .4, price: .0021, color: '#C0843F', edge: '#8E5E28', slot: [2, 1] },
];
const DISH = PL.DISH = Object.fromEntries(MENU.map(d => [d.id, d]));
/* nutrition: per-lunch targets for a grade 3 student (illustrative, about a third of the daily need) */
PL.TARGET = { kcal: 580, c: 85, p: 25, f: 16 };
PL.NUTRIENTS = [['kcal', 'Calories', 'kcal'], ['c', 'Carbs', 'g'], ['p', 'Protein', 'g'], ['f', 'Fat', 'g']];
PL.nutrientsOf = grams => {
  const o = { kcal: 0, c: 0, p: 0, f: 0 };
  MENU.forEach(d => { const g = grams[d.id] || 0; o.kcal += g * d.kcal; o.c += g * d.n.c; o.p += g * d.n.p; o.f += g * d.n.f; });
  return { kcal: Math.round(o.kcal), c: Math.round(o.c), p: Math.round(o.p), f: Math.round(o.f) };
};
/** Nuvilab-style status for one nutrient against the lunch target. */
PL.nStatus = (k, v) => { const r = v / PL.TARGET[k]; return r < .8 ? 'low' : r > 1.3 ? 'high' : 'ok'; };
/* environment equivalents (illustrative factors: 2.5 kg CO2e per kg food, a pine tree absorbs ~6.6 kg CO2 a year, a car emits ~0.17 kg CO2 per km) */
PL.env = kg => { const co2 = kg * 2.5; return { kg, co2, trees: co2 / 6.6, km: co2 / .17 }; };
PL.CRAVING = 'spinach';
const TYPICAL_LEFT = PL.TYPICAL_LEFT = { spinach: .50, kimchi: .44, apple: .10, rice: .13, bulgogi: .05, soup: .38 };
PL.FORMS = {
  leafy: { name: 'Leafy', why: 'veggies tried', key: 'veg' },
  crystal: { name: 'Crystal', why: 'low-waste lunches', key: 'lowWaste' },
  guardian: { name: 'Guardian', why: 'balanced plates', key: 'balanced' },
  explorer: { name: 'Explorer', why: 'quests done', key: 'quests' },
};
const STAGES = PL.STAGES = [{ id: 'egg', name: 'Egg', at: 0 }, { id: 'baby', name: 'Baby', at: 40 }, { id: 'child', name: 'Child', at: 160 }, { id: 'adult', name: 'Adult', at: 400 }];
PL.SCHOOL_BASELINE = 0.29;
PL.CO2_PER_KG = 2.5; // illustrative kgCO2e per kg of food not wasted; swap for an EPA WARM / WRAP factor
PL.PRESETS = {
  'Picky eater': { rice: 70, bulgogi: 100, soup: 30, spinach: 0, kimchi: 10, apple: 100 },
  'Just right': { rice: 100, bulgogi: 100, soup: 85, spinach: 90, kimchi: 80, apple: 100 },
  'Tried everything': { rice: 95, bulgogi: 100, soup: 70, spinach: 60, kimchi: 55, apple: 100 },
  'Not hungry': { rice: 40, bulgogi: 60, soup: 20, spinach: 10, kimchi: 0, apple: 80 },
};

/* ------------------------------------------------------------ seed data */
const NAMED = [
  { id: 's1', name: 'Minji', baseline: .24, xp: 262, c: { veg: 14, lowWaste: 9, balanced: 11, quests: 3 }, en: 72, nu: 80, jo: 66, streak: 3, book: ['crystal'], week: 168 },
  { id: 's2', name: 'Joon', baseline: .38, xp: 96, c: { veg: 2, lowWaste: 5, balanced: 4, quests: 1 }, en: 48, nu: 42, jo: 55, streak: 1, book: [], week: 121 },
  { id: 's3', name: 'Aria', baseline: .19, xp: 455, c: { veg: 8, lowWaste: 22, balanced: 12, quests: 4 }, en: 88, nu: 70, jo: 81, streak: 9, book: ['leafy', 'guardian'], week: 204 },
  { id: 's4', name: 'Leo', baseline: .41, xp: 24, c: { veg: 1, lowWaste: 1, balanced: 1, quests: 0 }, en: 35, nu: 40, jo: 50, streak: 0, book: [], week: 88 },
  { id: 's5', name: 'Sora', baseline: .27, xp: 318, c: { veg: 6, lowWaste: 8, balanced: 9, quests: 7 }, en: 64, nu: 61, jo: 77, streak: 2, book: ['explorer'], week: 176 },
  { id: 's6', name: 'Daniel', baseline: .22, xp: 540, c: { veg: 9, lowWaste: 12, balanced: 21, quests: 3 }, en: 90, nu: 88, jo: 73, streak: 5, book: ['crystal', 'leafy'], week: 159 },
];
const EXTRA = ['Hana', 'Yuna', 'Seojun', 'Jiho', 'Eunwoo', 'Doyun', 'Haeun', 'Siwoo', 'Jimin', 'Yejun', 'Chaewon', 'Minseo', 'Juwon', 'Gaeun', 'Taeyang', 'Somin', 'Hyunwoo', 'Dahye', 'Ian', 'Mia', 'Noah', 'Ella'];
const CLASS_SEED = [
  { id: '3-1', base: .30, served: 61.6, ret: 12.9, form: 'leafy', xp: 380, streak: 4 },
  { id: '3-2', base: .31, served: 46.2, ret: 8.9, form: 'explorer', xp: 350, streak: 3 },
  { id: '3-3', base: .27, served: 62.0, ret: 14.6, form: 'guardian', xp: 240, streak: 1 },
  { id: '3-4', base: .33, served: 60.8, ret: 13.4, form: 'crystal', xp: 410, streak: 2 },
  { id: '3-5', base: .29, served: 63.1, ret: 11.7, form: 'crystal', xp: 460, streak: 5 },
  { id: '3-6', base: .26, served: 59.9, ret: 16.2, form: 'leafy', xp: 120, streak: 0 },
];
const SCHOOLS = [
  { id: 'bora', name: 'Bora Elementary', red: .34, acc: .93, kg: 1510 },
  { id: 'saebit', name: 'Saebit Elementary', red: .27, acc: .91, kg: 1122 },
  { id: 'dasom', name: 'Dasom Elementary', red: .22, acc: .89, kg: 864 },
  { id: 'nuri', name: 'Nuri Middle School', red: .19, acc: .90, kg: 1390 },
  { id: 'hangang', name: 'Hangang Elementary', red: .12, acc: .86, kg: 402 },
];
const DAYS = ['Mon 21', 'Tue 22', 'Wed 23', 'Thu 24'];

function seedLog(baseline, r) {
  return DAYS.map(d => {
    const w = clamp(baseline * (0.55 + r() * 0.7), 0.02, 0.6);
    const portion = r() < .3 ? 'S' : r() < .85 ? 'M' : 'L';
    const std = PL.nutrientsOf(Object.fromEntries(MENU.map(x => [x.id, x.g[portion]])));
    const k = 1 - w * (.8 + r() * .4);
    return { day: d, portion, w, pts: Math.round(22 + (baseline - w) / baseline * 14 + r() * 8), n: { kcal: Math.round(std.kcal * k), c: Math.round(std.c * k), p: Math.round(std.p * k * (.85 + r() * .3)), f: Math.round(std.f * k) } };
  }).reverse();
}
function freshState() {
  const r = rng(42);
  const dish = {};
  MENU.forEach(d => { const served = 140 * d.g.M * (0.92 + r() * .1); dish[d.id] = { served, ret: served * TYPICAL_LEFT[d.id] * (0.85 + r() * .25) }; });
  const students = NAMED.map(s => ({
    id: s.id, name: s.name, cls: '3-2', baseline: s.baseline, week: s.week, scanned: false, named: true,
    pet: { xp: s.xp, c: { ...s.c }, en: s.en, nu: s.nu, jo: s.jo, streak: s.streak, book: [...s.book], quest: 1 }, log: seedLog(s.baseline, r),
  }));
  EXTRA.forEach((name, i) => {
    const baseline = .18 + r() * .24, xp = Math.round(20 + r() * 520);
    students.push({
      id: 'x' + i, name, cls: '3-2', baseline, week: Math.round(70 + r() * 130), scanned: false, named: false,
      pet: { xp, c: { veg: Math.round(r() * 14), lowWaste: Math.round(r() * 16), balanced: Math.round(r() * 16), quests: Math.round(r() * 6) }, en: 40 + Math.round(r() * 50), nu: 40 + Math.round(r() * 50), jo: 40 + Math.round(r() * 50), streak: Math.floor(r() * 7), book: [], quest: Math.floor(r() * 3) },
      log: seedLog(baseline, r),
    });
  });
  return {
    v: 7,
    students,
    classes: CLASS_SEED.map(c => ({ ...c })),
    today: { trays: 140, zero: 17, dish, servedNow: Object.fromEntries(MENU.map(d => [d.id, dish[d.id].served])), eating: 0, feed: [], clock: 11 * 60 + 48, trayNo: 412 },
    term: { kg: 1284, meals: 41210, zero: 6120 },
    zeroWeek: [.11, .14, .13, .16],
    order: { approved: null },
    me: 's1',
  };
}

/* ------------------------------------------------------------ store (localStorage + cross-tab sync) */
const KEY = 'plateloop-final-v7';
const chan = 'BroadcastChannel' in window ? new BroadcastChannel('plateloop') : null;
const subs = new Set();
function readStored() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); return s && s.v === 7 ? s : null; } catch (e) { return null; } }
PL.S = readStored() || freshState();
PL.store = {
  save(kind = 'update') {
    try { localStorage.setItem(KEY, JSON.stringify(PL.S)); } catch (e) {}
    if (chan) chan.postMessage(kind);
    subs.forEach(fn => fn(kind, true));
  },
  subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
  reset() { PL.S = freshState(); this.save('reset'); },
};
const pull = kind => { const s = readStored(); if (s) { PL.S = s; subs.forEach(fn => fn(kind || 'update', false)); } };
// Both: BroadcastChannel is instant between tabs, and the storage event also covers pages opened as local files.
if (chan) chan.onmessage = e => pull(e.data);
addEventListener('storage', e => { if (e.key === KEY) pull('update'); });

/* ------------------------------------------------------------ lookups + leaderboards */
PL.student = id => PL.S.students.find(s => s.id === id);
PL.stageOf = xp => [...STAGES].reverse().find(s => xp >= s.at);
PL.nextStage = xp => STAGES.find(s => s.at > xp);
PL.formOf = pet => Object.entries({ leafy: pet.c.veg, crystal: pet.c.lowWaste, guardian: pet.c.balanced, explorer: pet.c.quests * 2 }).sort((a, b) => b[1] - a[1])[0][0];
PL.moodOf = pet => { const a = (pet.en + pet.nu + pet.jo) / 3; return a < 40 ? 'sleepy' : a < 62 ? 'happy' : 'joy'; };
PL.clock = () => { const m = Math.round(PL.S.today.clock); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; };
PL.classStats = c => { const w = c.ret / c.served; return { w, red: (c.base - w) / c.base }; };
PL.classRows = () => PL.S.classes.map(c => ({ c, ...PL.classStats(c) })).sort((a, b) => b.red - a.red);
PL.studentRows = () => [...PL.S.students].sort((a, b) => b.week - a.week || a.name.localeCompare(b.name));
PL.streakRows = () => [...PL.S.students].sort((a, b) => b.pet.streak - a.pet.streak || b.week - a.week);
PL.cls32Scanned = () => PL.S.students.filter(s => s.cls === '3-2' && s.scanned).length;
PL.schoolRows = () => {
  const cr = PL.S.classes.map(PL.classStats);
  const us = { id: 'haneul', name: 'Haneul Elementary', us: true, red: cr.reduce((a, c) => a + c.red, 0) / cr.length, acc: .93, kg: PL.S.term.kg };
  return [us, ...SCHOOLS].sort((a, b) => b.red - a.red);
};
PL.todayTotals = () => { let sv = 0, lf = 0, val = 0; MENU.forEach(d => { const x = PL.S.today.dish[d.id]; sv += x.served; lf += x.ret; val += x.ret * d.price; }); return { sv, lf, val, w: lf / sv }; };

/* ------------------------------------------------------------ one scanner, two scans per tray
   BEFORE lunch: the tray is weighed and photographed full, which records what was served.
   AFTER lunch: the same scanner measures what is left. eaten = before − after. */
const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
const STANDARD_M = Object.fromEntries(MENU.map(d => [d.id, d.g.M]));
PL.portionOf = served => { const r = sum(served) / sum(STANDARD_M); return r < .87 ? 'S' : r > 1.12 ? 'L' : 'M'; };
PL.scanState = st => st.scanned ? 'done' : st.before ? 'eating' : 'none';

function scoreMeal(st, served, measured, portion) {
  const pet = st.pet;
  const total = sum(served), left = sum(measured);
  const w = left / total;
  const improvement = (st.baseline - w) / st.baseline;
  let energy = clamp(Math.round(10 + 14 * improvement), 2, 25);
  const rightSized = portion === 'S' && w < .12;
  if (rightSized) energy = 25;
  const eaten = id => 1 - measured[id] / served[id];
  const groups = ['grain', 'protein', 'veg', 'fruit'].filter(g => MENU.some(d => d.group === g && eaten(d.id) >= .5));
  const nutrition = groups.length * 5;
  const vegTried = MENU.some(d => d.group === 'veg' && eaten(d.id) >= .5);
  const tasted = eaten(PL.CRAVING) >= .2;
  const questDone = tasted && pet.quest < 3;
  const lowWaste = w < .15;
  const streak = lowWaste ? pet.streak + 1 : 0;
  const joy = 4 + (streak >= 3 ? 6 : 0) + (questDone ? 15 : 0);
  const xp = energy + nutrition + joy;
  const mood = w < .12 ? 'joy' : w < .3 ? 'happy' : 'meh';
  let line;
  if (rightSized) line = 'Perfect portion! A small plate, all eaten. Full energy for me!';
  else if (questDone) line = `You tasted the ${DISH[PL.CRAVING].name.toLowerCase()}! Quest ${pet.quest + 1} of 3 done!`;
  else if (improvement > .3) line = 'Way less left than usual. I feel super strong!';
  else if (w < .3) line = 'Yum, thanks for lunch! Nice job.';
  else line = 'Lots came back today. Take a smaller portion tomorrow and I still get full energy!';
  return { w, served: total, left, improvement, energy, nutrition, joy, xp, groups, vegTried, questDone, lowWaste, streak, mood, line, rightSized };
}

/** BEFORE lunch. portion: what the kitchen served (S/M/L); the scanner measures the real grams. */
PL.scanBefore = (sid, portion, method = 'card') => {
  const st = PL.student(sid), T = PL.S.today;
  const served = Object.fromEntries(MENU.map(d => [d.id, Math.round(d.g[portion] * (.94 + Math.random() * .12))]));
  const tray = ++T.trayNo;
  T.clock += .2;
  st.before = { served, t: PL.clock(), tray, method };
  MENU.forEach(d => { T.servedNow[d.id] += served[d.id]; });
  T.eating += 1;
  const total = sum(served);
  T.feed.unshift({ kind: 'before', t: PL.clock(), tray, cls: st.cls, sid, method, portion: PL.portionOf(served), served: total });
  T.feed = T.feed.slice(0, 60);
  PL.S.lastScan = { sid, at: Date.now(), kind: 'before' };
  return { served, total, n: PL.nutrientsOf(served), kcal: PL.nutrientsOf(served).kcal, portion: PL.portionOf(served), tray, method };
};

/** AFTER lunch. eatPct: dish id → % eaten (0–100). Without a before scan the standard portion is assumed. */
PL.scanAfter = (sid, eatPct, method = 'card') => {
  const st = PL.student(sid), pet = st.pet, T = PL.S.today;
  const clsRankBefore = PL.classRows().findIndex(r => r.c.id === st.cls) + 1;
  const meRankBefore = PL.studentRows().findIndex(s => s.id === sid) + 1;
  let served = st.before && st.before.served, estimated = false, tray = st.before && st.before.tray;
  if (!served) { served = { ...STANDARD_M }; estimated = true; tray = ++T.trayNo; MENU.forEach(d => { T.servedNow[d.id] += served[d.id]; }); }
  else T.eating = Math.max(0, T.eating - 1);
  const portion = PL.portionOf(served);
  const measured = Object.fromEntries(MENU.map(d => {
    const g = served[d.id], tru = g * (1 - eatPct[d.id] / 100);
    return [d.id, tru < 1 ? 0 : clamp(tru + (Math.random() * 4 - 2), 0, g)];
  }));
  const r = scoreMeal(st, served, measured, portion);
  pet.xp += r.xp;
  pet.en = clamp(Math.round(pet.en * .55 + r.energy * 4 * .45), 5, 100);
  pet.nu = clamp(Math.round(pet.nu * .55 + r.nutrition * 5 * .45), 5, 100);
  pet.jo = clamp(Math.round(pet.jo * .6 + (40 + r.joy * 3) * .4), 5, 100);
  pet.streak = r.streak;
  if (r.vegTried) pet.c.veg++;
  if (r.lowWaste) pet.c.lowWaste++;
  if (r.groups.length >= 3) pet.c.balanced++;
  if (r.questDone) { pet.c.quests++; pet.quest++; }
  st.week += r.xp;
  st.scanned = true;
  r.intake = PL.nutrientsOf(Object.fromEntries(MENU.map(d => [d.id, served[d.id] - measured[d.id]])));
  r.zero = r.w < .05;
  if (r.zero) { T.zero = (T.zero || 0) + 1; PL.S.term.zero = (PL.S.term.zero || 0) + 1; }
  st.after = { t: (T.clock += .35, PL.clock()), left: r.left, w: r.w, intake: r.intake, zero: r.zero };
  st.log.unshift({ day: 'Fri 25', portion, w: r.w, pts: r.xp, n: r.intake });
  st.log = st.log.slice(0, 6);
  r.game = PL.game ? PL.game.feedLunch(st, r) : null; // hunger, hearts, Eco Booth kg, gems
  // completed trays feed the kitchen's waste numbers and the class league
  MENU.forEach(d => { T.dish[d.id].served += served[d.id]; T.dish[d.id].ret += measured[d.id]; });
  T.trays++;
  const c = PL.S.classes.find(c => c.id === st.cls);
  c.served += r.served / 1000; c.ret += r.left / 1000; c.xp += Math.max(2, Math.round((c.base - r.w) * 40));
  PL.S.term.meals++;
  PL.S.term.kg += Math.max(0, r.served / 1000 * (PL.SCHOOL_BASELINE - r.w));
  T.feed.unshift({ kind: 'after', t: PL.clock(), tray, cls: st.cls, sid, method, portion, w: r.w, xp: r.xp, served: r.served, left: r.left, estimated, zero: r.zero, kcal: r.intake.kcal });
  T.feed = T.feed.slice(0, 60);
  Object.assign(r, { clsRank: PL.classRows().findIndex(x => x.c.id === st.cls) + 1, clsRankBefore, meRank: PL.studentRows().findIndex(s => s.id === sid) + 1, meRankBefore, measured, portion, sid, tray, estimated });
  PL.S.lastScan = { sid, at: Date.now(), kind: 'after', xp: r.xp, line: r.line };
  return r;
};
/** Both scans in one go (used to simulate the rest of the class). */
PL.scanTray = (sid, portion, eatPct) => { if (!PL.student(sid).before) PL.scanBefore(sid, portion); return PL.scanAfter(sid, eatPct); };
PL.zeroRate = () => { const t = PL.S.today; return t.trays ? t.zero / t.trays : 0; };
/** Simulate everyone in class 3-2 who hasn't finished both scans yet. */
PL.scanRestOfClass = () => {
  let n = 0;
  PL.S.students.filter(s => s.cls === '3-2' && !s.scanned).forEach(s => {
    const p = Math.random() < .3 ? 'S' : Math.random() < .8 ? 'M' : 'L';
    const f = (s.baseline / .3) * (.5 + Math.random() * .6);
    PL.scanTray(s.id, p, Object.fromEntries(MENU.map(d => [d.id, Math.round(clamp(1 - TYPICAL_LEFT[d.id] * f, 0, 1) * 100)])));
    n++;
  });
  return n;
};

/* ------------------------------------------------------------ any element with data-reset restarts the demo lunch */
document.addEventListener('click', e => { if (e.target.closest('[data-reset]')) { PL.store.reset(); PL.toast('Demo reset to the start of lunch.'); } });

/* ------------------------------------------------------------ pixel pet renderer (LCD style) */
const LCD = PL.LCD = { bg: '#DDE4D4', ink: '#1D1D1F', mid: '#9AA592' };
const ACC_SLOT = { cap: 'head', crown: 'head', halo: 'head', headphones: 'head', bow: 'side', flower: 'side', glasses: 'face', scarf: 'neck', wings: 'back', aura: 'aura' };
PL.drawPet = (cv, o) => {
  // o.ink / o.mid recolour the outline and shading; o.fill paints the body (for the full-colour room)
  const INK = o.ink || LCD.ink, MID = o.mid || LCD.mid, FILL = o.fill || null;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

const today = () => new Date().toISOString().slice(0, 10);
const r2 = v => Math.round(v * 100) / 100;
const pickWeighted = (w, rnd = Math.random) => { const e = Object.entries(w), tot = e.reduce((a, [, v]) => a + v, 0); let x = rnd() * tot; for (const [k, v] of e) { if (x < v) return k; x -= v; } return e[0][0]; };
const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const blank = () => ({ rice: 0, veg: 0, protein: 0, fruit: 0 });

/* ---------------------------------------------------------------- setup */
G.init = st => {
  const r = rng(hash(st.id)), stage = PL.STAGES.indexOf(PL.stageOf(st.pet.xp)), req = G.HEARTS_REQ[stage];
  const named = st.named;
  const g = {
    name: 'Loopi', rarity: 'common', stage,
    hunger: Math.round(G.HUNGER_MAX[stage] * (.4 + r() * .3)),
    hearts: named ? req - 1 : Math.floor(r() * req), meals: named ? 1 : Math.floor(r() * 2), ready: false,
    gems: Math.round(40 + r() * 140), eco: r2(.1 + r() * .3),
    ing: { rice: 1 + Math.floor(r() * 4), veg: 1 + Math.floor(r() * 4), protein: Math.floor(r() * 3), fruit: 1 + Math.floor(r() * 3) },
    grown: blank(), bin: [], oven: [], snacks: [],
    unlocked: { kimbap: false, rainbow: false }, cards: { kimbap: 1 + Math.floor(r() * 2), rainbow: Math.floor(r() * 2) },
    acc: [], eq: null, barn: [], eggs: [],
    plays: { d: today(), n: 0 }, drops: { d: today(), n: 0 }, best: 0,
  };
  ['veg', 'rice', 'fruit'].slice(0, 1 + Math.floor(r() * 3)).forEach(x => g.bin.push(x));
  if (named) g.snacks.push({ id: 's' + Math.floor(r() * 1e6), recipe: 'bibimbap', name: 'Bibimbap', hunger: 3, golden: false });
  (st.pet.book || []).forEach((form, i) => g.barn.push({ id: 'b' + i, name: 'Loopi ' + (i + 1), form, rarity: r() < .6 ? 'common' : 'rare', stage: 3 }));
  if (named) { g.acc.push('cap'); if (r() < .5) g.acc.push('bow'); }
  if (st.id === 's3') { g.acc.push('crown'); g.eq = 'crown'; }
  if (st.id === 's6') { g.acc.push('headphones'); g.eq = 'headphones'; }
  return g;
};
G.ensure = st => { if (!st.game) st.game = G.init(st); return st.game; };
const ensureAll = () => PL.S.students.forEach(G.ensure);
ensureAll();
PL.store.subscribe(ensureAll);

/* ---------------------------------------------------------------- lookups */
G.hungerMax = g => G.HUNGER_MAX[g.stage];
G.heartsReq = g => G.HEARTS_REQ[g.stage];
G.playsLeft = g => { if (g.plays.d !== today()) g.plays = { d: today(), n: 0 }; return G.PLAYS_PER_DAY - g.plays.n; };
G.multiplier = g => {
  const pets = [...g.barn, { rarity: g.rarity, stage: g.stage, id: 'active' }];
  const val = p => 1 + G.RARITY_BONUS[p.rarity] * (p.stage / 3);
  const best = pets.reduce((a, p) => val(p) > val(a) ? p : a, pets[0]);
  return val(best) + pets.filter(p => p !== best).reduce((a, p) => a + G.MENTOR_BONUS * (p.stage / 3), 0);
};
G.recipeUnlocked = (g, rc) => !rc.unlock || g.unlocked[rc.unlock];

/* ---------------------------------------------------------------- meals, hearts, evolution */
function registerMeal(g) {
  g.meals += 1;
  if (g.meals < G.MEALS_PER_HEART) return false;
  g.meals -= G.MEALS_PER_HEART;
  const req = G.heartsReq(g);
  if (g.hearts >= req) return false;
  g.hearts += 1;
  if (g.hearts === req) g.ready = true;
  return true;
}
/** A real lunch scan feeds Loopi and fills the Eco Booth with the food you SAVED vs. your usual. */
G.feedLunch = (st, r) => {
  const g = G.ensure(st), max = G.hungerMax(g);
  const gain = 1 + (r.w < .3 ? 1 : 0) + (r.w < .12 ? 1 : 0);
  const wasFull = g.hunger >= max;
  g.hunger = Math.min(max, g.hunger + gain);
  const heart = wasFull ? false : registerMeal(g);
  const eco = r2(Math.max(0, st.baseline * r.served - r.left) / 1000 + .03);
  g.eco = r2(g.eco + eco);
  const gems = gain * 5 + 5;
  g.gems += gems;
  return { hunger: gain, eco, gems, heart, ready: g.ready };
};
G.eatSnack = (st, snackId) => {
  const g = G.ensure(st), i = g.snacks.findIndex(s => s.id === snackId);
  if (i < 0) return null;
  const [s] = g.snacks.splice(i, 1), max = G.hungerMax(g), wasFull = g.hunger >= max;
  g.hunger = Math.min(max, g.hunger + s.hunger);
  let heart = false;
  if (!wasFull) { heart = registerMeal(g); if (s.golden) heart = registerMeal(g) || heart; }
  g.gems += s.hunger * 2;
  return { snack: s, heart, wasFull, ready: g.ready };
};
/** Evolve when hearts are full. A fully grown Loopi lays an egg instead. */
G.evolve = st => {
  const g = G.ensure(st);
  if (!g.ready) return null;
  g.ready = false; g.hearts = 0; g.meals = 0;
  if (g.stage < 3) { g.stage += 1; return { type: 'evolve', stage: PL.STAGES[g.stage] }; }
  const rarity = pickWeighted(G.EGG_WEIGHTS);
  g.eggs.push(rarity);
  return { type: 'egg', rarity };
};
/** Hatching retires the current Loopi to the barn (it keeps boosting the Eco Booth) and starts a new egg. */
G.hatch = st => {
  const g = G.ensure(st);
  if (!g.eggs.length) return null;
  const rarity = g.eggs.shift();
  g.barn.push({ id: 'b' + Date.now(), name: g.name, form: PL.formOf(st.pet), rarity: g.rarity, stage: g.stage, acc: g.eq });
  Object.assign(g, { name: 'Loopi ' + (g.barn.length + 1), rarity, stage: 0, hunger: 2, hearts: 0, meals: 0, ready: false, eq: null });
  st.pet.c = { veg: 0, lowWaste: 0, balanced: 0, quests: 0 };
  return rarity;
};

/* ---------------------------------------------------------------- Eco Booth */
G.boothSearch = st => {
  const g = G.ensure(st), mult = G.multiplier(g);
  const raw = g.eco / G.BOOTH_KG_PER_ING * mult;
  let draws = Math.floor(raw); if (Math.random() < raw - draws) draws++;
  const got = blank();
  for (let i = 0; i < draws; i++) { const t = pickWeighted({ rice: 35, veg: 30, fruit: 20, protein: 15 }); got[t]++; g.ing[t]++; }
  let gems = 0;
  for (let i = 0, n = Math.floor(g.eco / G.BOOTH_KG_PER_GEM); i < n; i++) gems += G.BOOTH_GEM[0] + Math.floor(Math.random() * (G.BOOTH_GEM[1] - G.BOOTH_GEM[0] + 1));
  gems = Math.round(gems * mult);
  g.gems += gems;
  const kg = g.eco; g.eco = 0;
  return { got, gems, kg, mult };
};

/* ---------------------------------------------------------------- cooking */
G.ovenAdd = (st, type) => {
  const g = G.ensure(st);
  let grown = false;
  if (g.grown[type] > 0) { g.grown[type]--; grown = true; }
  else if (g.ing[type] > 0) g.ing[type]--;
  else return { result: 'none' };
  g.oven.push({ t: type, grown });
  const seq = g.oven.map(o => o.t);
  const open = G.RECIPES.filter(rc => G.recipeUnlocked(g, rc));
  const match = open.find(rc => rc.seq.length === seq.length && rc.seq.every((x, i) => x === seq[i]));
  if (match) {
    const grownN = g.oven.filter(o => o.grown).length;
    if (Math.random() < G.SPOIL_CHANCE) { dump(g); return { result: 'spoiled', recipe: match }; }
    const golden = grownN > 0 && Math.random() < G.GOLDEN_BASE + G.GOLDEN_PER_GROWN * grownN;
    const snack = { id: 's' + Date.now() + Math.floor(Math.random() * 1e4), recipe: match.id, name: (golden ? 'Golden ' : '') + match.name, hunger: match.hunger + (golden ? G.GOLDEN_HUNGER : 0), golden };
    g.snacks.push(snack); g.oven = []; g.gems += 3;
    return { result: 'cooked', snack };
  }
  const prefix = open.some(rc => rc.seq.length > seq.length && seq.every((x, i) => rc.seq[i] === x));
  if (!prefix || seq.length >= G.OVEN_CAP) { dump(g); return { result: 'rejected' }; }
  return { result: 'pending' };
};
function dump(g) { g.oven.forEach(o => g.bin.push(o.t)); g.oven = []; }
G.emptyOven = st => { const g = G.ensure(st); const n = g.oven.length; dump(g); return n; };

/* ---------------------------------------------------------------- compost worm farm */
G.compost = st => {
  const g = G.ensure(st);
  if (!g.bin.length) return { error: 'The compost bin is empty.' };
  if (g.gems < G.COMPOST_COST) return { error: `Turning the compost costs ${G.COMPOST_COST} gems.` };
  g.gems -= G.COMPOST_COST;
  const worms = Math.random() < G.WORM_CHANCE, got = blank(), n = g.bin.length;
  g.bin.forEach(t => { if (Math.random() < G.COMPOST_RECOVER || (worms && Math.random() < .5)) { got[t]++; g.grown[t]++; } });
  g.bin = [];
  return { got, n, worms };
};

/* ---------------------------------------------------------------- recipes, petting, wardrobe */
G.unlock = (st, key) => {
  const g = G.ensure(st), rc = G.RECIPES.find(x => x.unlock === key);
  if (!rc || g.unlocked[key] || g.cards[key] < rc.cost) return false;
  g.cards[key] -= rc.cost; g.unlocked[key] = true; return true;
};
G.petLoopi = st => {
  const g = G.ensure(st);
  if (g.drops.d !== today()) g.drops = { d: today(), n: 0 };
  if (g.drops.n >= G.PET_GEM.cap || Math.random() >= G.PET_GEM.chance) return 0;
  const gems = G.PET_GEM.min + Math.floor(Math.random() * (G.PET_GEM.max - G.PET_GEM.min + 1));
  g.gems += gems; g.drops.n++; return gems;
};
G.openCrate = (st, tier) => {
  const g = G.ensure(st), c = G.CRATES[tier];
  if (g.gems < c.cost) return { error: `The ${c.name.toLowerCase()} costs ${c.cost} gems.` };
  g.gems -= c.cost;
  const rarity = pickWeighted(c.w), pool = G.ACCESSORIES.filter(a => a.rarity === rarity);
  const acc = pool[Math.floor(Math.random() * pool.length)], dup = g.acc.includes(acc.id);
  let refund = 0;
  if (dup) { refund = Math.round(c.cost * G.DUP_REFUND); g.gems += refund; } else g.acc.push(acc.id);
  return { acc, dup, refund };
};
G.equip = (st, id) => { const g = G.ensure(st); if (id && !g.acc.includes(id)) return; g.eq = g.eq === id ? null : id; };

/* ---------------------------------------------------------------- Loopi's room: ball play and crumbs */
G.BALLS_PER_DAY = 5;
/** Fetch with Loopi: +3 Joy, up to 5 times a day (after that it's just for fun). */
G.playBall = st => {
  const g = G.ensure(st);
  if (!g.balls || g.balls.d !== today()) g.balls = { d: today(), n: 0 };
  if (g.balls.n >= G.BALLS_PER_DAY) return false;
  g.balls.n++;
  st.pet.jo = Math.min(100, st.pet.jo + 3);
  return true;
};
/** A swept crumb goes into the compost bin, where the worm farm can grow it back. */
G.compostCrumb = (st, type) => {
  const g = G.ensure(st);
  g.bin.push(type);
  g.swept = (g.swept || 0) + 1;
  return g.swept;
};

/* ---------------------------------------------------------------- Healthy Catch */
G.catchStart = st => { const g = G.ensure(st); if (G.playsLeft(g) <= 0) return false; g.plays.n++; return true; };
G.catchEnd = (st, res) => {
  const g = G.ensure(st), got = blank();
  Object.keys(got).forEach(t => { got[t] = Math.floor((res.caught[t] + 1) / 2); g.ing[t] += got[t]; });
  Object.keys(res.cards).forEach(k => { g.cards[k] += res.cards[k]; });
  const gems = Math.floor(res.score / 4);
  g.gems += gems;
  const best = res.score > g.best; if (best) g.best = res.score;
  return { got, gems, best };
};

/* ---------------------------------------------------------------- pixel sprites (ingredients, catch items) */
G.SPRITES = {
  rice: { p: ['..wwww..', '.wwwwww.', 'bbbbbbbb', '.bbbbbb.', '..bbbb..'], c: { w: '#FFFFFF', b: '#3E74C9' } },
  veg: { p: ['..gg.gg.', '.gggggg.', '.gdggdg.', '..gggg..', '...dd...', '...dd...'], c: { g: '#3C9A48', d: '#23602D' } },
  protein: { p: ['..wwww..', '.wwwwww.', '.wwyyww.', '.wyyyyw.', '.wwyyww.', '..wwww..'], c: { w: '#FFFFFF', y: '#F4B400' } },
  fruit: { p: ['....sl..', '..rrsrr.', '.rrrrrrr', '.rrrrrrr', '.rrrrrrr', '..rrrrr.'], c: { r: '#E0453A', s: '#6B4A2B', l: '#3C9A48' } },
  soda: { p: ['..kkkk..', '..cccc..', '..ckcc..', '..cccc..', '..cccc..', '..kkkk..'], c: { c: '#B8322A', k: '#D9D9D9' } },
  candy: { p: ['p......p', 'pp.pp.pp', 'pppppppp', 'pp.pp.pp', 'p......p'], c: { p: '#E86FB0' } },
  card: { p: ['.tttttt.', '.tkkkkt.', '.tttttt.', '.tkkktt.', '.tttttt.'], c: { t: '#F1DFAE', k: '#6B4A2B' } },
};
G.drawSprite = (ctx, name, x, y, s) => {
  const sp = G.SPRITES[name];
  sp.p.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') { ctx.fillStyle = sp.c[ch]; ctx.fillRect(Math.round(x + i * s), Math.round(y + j * s), s, s); } }));
};
/** Paint every <canvas data-ing="rice|veg|…"> inside root. */
G.paintIcons = root => PL.$$('canvas[data-ing]', root).forEach(cv => {
  const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, cv.width, cv.height); ctx.imageSmoothingEnabled = false;
  const s = Math.floor(Math.min(cv.width, cv.height) / 8);
  const rows = G.SPRITES[cv.dataset.ing].p.length;
  G.drawSprite(ctx, cv.dataset.ing, (cv.width - 8 * s) / 2, (cv.height - rows * s) / 2, s);
});
})();

</script>
<script>
/* ---- js/kitchen.js ---- */
/* PlateLoop Kitchen: every before/after scan arrives here. Today (live), Dishes, Nutrition,
   Environment (Green Tree dashboard), Plan & order (the plan → order → cook → serve cycle), Report. */
(() => {
'use strict';
const { $, $$, pct, fmt1, money, esc, MENU, rng, clamp } = PL;

const HISTORY = (() => { const r = rng(11); return Array.from({ length: 30 }, (_, i) => i < 10 ? .29 + (r() - .5) * .04 : clamp(.29 - (i - 9) * .0065 + (r() - .5) * .03, .12, .35)); })();
const TREND = { spinach: [.46, +17, 'Spinach Week quest is working: 46% → 63% eaten on quest days.'], kimchi: [.55, +1, 'Serve 25 g by default and let students take more.'], apple: [.88, +1, 'Popular. Keep it.'], rice: [.82, +4, 'More students choose Small since portion sizes started.'], bulgogi: [.94, +2, 'Most popular dish. Keep the portion.'], soup: [.58, -2, 'Cut the default ladle from 200 to 150 ml.'] };
const TOMORROW = [
  { id: 'rice', name: 'Rice', std: 180, learned: 148, err: .05, tags: ['grain'], bom: [['Rice (raw)', .42, 2.2]] },
  { id: 'curry', name: 'Pork & vegetable curry', std: 150, learned: 131, err: .06, tags: ['protein'], bom: [['Pork shoulder', .20, 9.0], ['Potato', .22, 1.6], ['Carrot', .10, 1.8], ['Onion', .14, 1.4], ['Curry roux', .07, 7.0]] },
  { id: 'soup', name: 'Seaweed soup', std: 200, learned: 122, err: .09, tags: ['soup'], bom: [['Dried seaweed', .012, 30], ['Beef brisket', .03, 18], ['Soy sauce', .02, 3.0]] },
  { id: 'tofu', name: 'Fried tofu', std: 70, learned: 55, err: .08, tags: ['protein'], bom: [['Firm tofu', .9, 3.2], ['Cooking oil', .05, 2.5]] },

  { id: 'kimchi', name: 'Kimchi', std: 40, learned: 22, err: .10, tags: ['veg'], bom: [['Kimchi', 1.0, 4.5]] },

const INVENTORY = { 'Rice (raw)': 60, 'Kimchi': 12, 'Onion': 8, 'Soy sauce': 10, 'Cooking oil': 15, 'Sesame oil': 2 };
const ENROLLED = 840;
const MAPE = TOMORROW.reduce((a, d) => a + d.err, 0) / TOMORROW.length;
const SEED_MIX = { S: 35, M: 84, L: 21 }; // portion sizes of the 140 trays scanned before the demo starts

const ui = { view: 'overview', plan: { att: 812, weather: 'sunny', event: 'normal' }, seen: null };
let root = null;
const SV = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const NAV = [
  ['overview', 'Overview', SV('<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>')],
  ['dishes', 'Dishes', SV('<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>')],
  ['nutrition', 'Nutrition', SV('<path d="M12 21c-4.5-2.5-8-6-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 11c0 4-3.5 7.5-8 10Z"/>')],
  ['environment', 'Environment', SV('<path d="M12 22V12M12 12C8 12 5 9 5 5c4 0 7 3 7 7ZM12 14c3 0 6-2.5 6-6-3 0-6 2.5-6 6Z"/>')],
  ['plan', 'Plan & order', SV('<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>')],
  ['report', 'Daily report', SV('<path d="M4 5h16M4 10h16M4 15h10M4 20h7"/>')],
];

function mount(el) {

  ui.seen = PL.S.today.feed.length ? PL.S.today.feed[0].t + PL.S.today.feed[0].tray + PL.S.today.feed[0].kind : null;
  el.innerHTML = `
  <div class="kit">
    <aside class="kit-side">
      <div class="who"><span class="kit-logo" aria-hidden="true"></span><div><b>PlateLoop Kitchen</b><span>Haneul Elementary</span></div></div>
      ${NAV.map(([id, label, ic]) => `<button data-view="${id}">${ic}${label}</button>`).join('')}
      <div class="kit-foot"><div id="kit-live"></div><button class="linkish" data-reset style="font-size:13px">Reset demo</button></div>
    </aside>
    <main class="kit-main" id="kit-main"></main>
  </div>`;
  $$('.kit-side button', el).forEach(b => b.onclick = () => { ui.view = b.dataset.view; render(); scrollTo({ top: 0 }); });
  render();
}
function render() {
  if (!root) return;
  $$('.kit-side button', root).forEach(b => b.dataset.view === ui.view ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  $('#kit-live', root).innerHTML = `<span class="live"><i></i>Live from the scanner · ${PL.clock()}</span>`;
  const main = $('#kit-main', root);
  main.innerHTML = ({ overview, dishes, nutrition, environment, plan, report })[ui.view]();
  wire(main);
}

/* ---------------------------------------------------------------- data helpers */
const T = () => PL.S.today;
const dishStats = () => MENU.map(d => { const x = T().dish[d.id]; return { d, served: x.served, left: x.ret, eaten: x.served - x.ret, e: 1 - x.ret / x.served }; });
function portionMix() {
  const m = { ...SEED_MIX };
  T().feed.filter(f => f.kind === 'before').forEach(f => { m[f.portion]++; });
  const tot = m.S + m.M + m.L;
  return { m, tot };
}

/* ---------------------------------------------------------------- Overview */
function overview() {
  const t = T(), tot = PL.todayTotals(), good = tot.w < PL.SCHOOL_BASELINE;
  const kpis = [
    ['Trays served', (t.trays + t.eating).toLocaleString('en-US'), `${t.eating} eating now`, ''],
    ['Plate waste', pct(tot.w), `baseline ${pct(PL.SCHOOL_BASELINE)}`, good ? 'good' : ''],
    ['Food left', `${fmt1(tot.lf / 1000)} kg`, `≈ ${money(tot.val)} of ingredients`, ''],
    ['Zero leftover', pct(PL.zeroRate()), `${t.zero} clean trays today`, 'good'],
  ];
  const key = f => f.t + f.tray + f.kind;
  const seenIdx = t.feed.findIndex(f => key(f) === ui.seen);
  const fresh = seenIdx === -1 ? t.feed.length : seenIdx;
  ui.seen = t.feed.length ? key(t.feed[0]) : null;
  return `
  <div class="page-head"><div><h1>Today</h1><p>Friday 25 September · every tray is scanned before and after lunch.</p></div></div>
  <div class="kpis">${kpis.map(([k, v, s, c]) => `<div class="kpi"><div class="k">${k}</div><div class="v ${c}">${v}</div><div class="s">${s}</div></div>`).join('')}</div>
  <div class="kgrid">
    <div class="card"><div class="row spread"><h3>Live scans</h3><span class="hint">Tray numbers, not names</span></div>
      <div class="feed">${t.feed.length ? t.feed.map((f, i) => `<div class="frow ${i < fresh ? 'new' : ''}"><span class="t">${f.t}</span><span class="kind ${f.kind}">${f.kind === 'before' ? 'Before' : 'After'}</span><span class="tr">#${String(f.tray).padStart(4, '0')}</span><span class="cls">Class ${f.cls}${f.method && f.method !== 'card' ? ` · ${f.method === 'qr' ? 'QR' : 'Face'}` : ''}</span><span class="val">${f.kind === 'before' ? `${Math.round(f.served)} g served` : f.zero ? '<span style="color:var(--tint-ink)">Zero leftover</span>' : `<span style="color:${f.w > .3 ? 'var(--orange)' : 'inherit'}">${pct(f.w)} left</span>`}</span></div>`).join('')
        : `<p class="hint" style="padding:22px 2px">Class 3-2 is about to eat. Scans from the PlateLoop scanner appear here the moment they happen.</p>`}</div></div>
    <div class="card chart"><h3>Eaten by dish</h3><p class="hint">Share of each dish eaten on finished trays</p>${chartDish()}</div>
  </div>
  <div class="card chart"><h3>Plate waste, last 30 school days</h3><p class="hint">Food left ÷ food served, whole school</p>${chartTrend()}</div>`;
}
function chartDish() {
  const W = 520, rowH = 36, top = 6, left = 150, right = 50, rows = dishStats().sort((a, b) => b.e - a.e), H = top + rows.length * rowH + 24, iw = W - left - right;

/* ---------------------------------------------------------------- Nutrition (Nuvilab-style intake status) */
function intakeStats() {
  const done = PL.S.students.filter(s => s.log[0] && s.log[0].n);
  const recent = PL.S.students.map(s => s.scanned ? s.after.intake : s.log[0].n);
  const avg = Object.fromEntries(PL.NUTRIENTS.map(([k]) => [k, Math.round(recent.reduce((a, n) => a + n[k], 0) / recent.length)]));

  return { avg, low, n: recent.length, done: done.length };
}
