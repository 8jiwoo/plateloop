  tofu: (c, e) => `<path d="M10 20 24 13l14 7v14l-14 7-14-7Z" fill="${c}" stroke="${e}" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 20l14 7 14-7M24 27v14" fill="none" stroke="${e}" stroke-width="1.5"/>`,
  egg: (c, e) => `<ellipse cx="17" cy="26" rx="10" ry="13" fill="#fff" stroke="#D9CBB0" stroke-width="1.6"/><circle cx="17" cy="28" r="5.5" fill="#F7B733"/><ellipse cx="32" cy="24" rx="10" ry="13" fill="#fff" stroke="#D9CBB0" stroke-width="1.6"/><circle cx="32" cy="26" r="5.5" fill="#F7B733"/>`,
  greens: (c, e) => `<path d="M24 42C12 36 8 22 14 10c9 6 12 18 10 32Z" fill="${c}" stroke="${e}" stroke-width="1.6"/><path d="M24 42c12-6 16-20 10-32-9 6-12 18-10 32Z" fill="${c}" stroke="${e}" stroke-width="1.6" opacity=".92"/><path d="M24 42c-1-10 0-20 1-30" fill="none" stroke="${e}" stroke-width="1.6"/><path d="M14 10c3 8 6 18 10 32M34 10c-3 8-6 18-10 32" fill="none" stroke="#fff" stroke-width="1" opacity=".35"/>`,
  broccoli: (c, e) => `<path d="M21 30h6l2 12h-10Z" fill="#9CCB6B" stroke="#6A9440" stroke-width="1.5"/><circle cx="16" cy="22" r="8" fill="${c}"/><circle cx="32" cy="22" r="8" fill="${c}"/><circle cx="24" cy="15" r="9" fill="${c}"/><circle cx="24" cy="24" r="7" fill="${c}"/><circle cx="20" cy="14" r="2" fill="#fff" opacity=".25"/>`,
  tomato: (c, e) => `<circle cx="17" cy="28" r="10" fill="${c}"/><circle cx="31" cy="25" r="10" fill="${c}"/><path d="M17 18l-3-3M17 18l3-3M17 18v-4M31 15l-3-3M31 15l3-3M31 15v-4" stroke="#3F7D32" stroke-width="2" stroke-linecap="round"/><circle cx="14" cy="25" r="2" fill="#fff" opacity=".4"/><circle cx="28" cy="22" r="2" fill="#fff" opacity=".4"/>`,
  cucumber: (c, e) => [[14, 20], [30, 18], [22, 32]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="9" fill="${e}"/><circle cx="${x}" cy="${y}" r="7" fill="#DDF0C0"/><circle cx="${x}" cy="${y}" r="2.5" fill="${c}" opacity=".6"/>`).join(''),
  beans: (c, e) => [0, 1, 2].map(i => `<path d="M${9 + i * 4} ${36 - i * 3}c8-14 18-22 30-24" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round"/>`).join(''),
  melon: (c, e) => `<path d="M6 16h36a18 18 0 0 1-36 0Z" fill="#5BA84A"/><path d="M9 16h30a15 15 0 0 1-30 0Z" fill="${c}"/>${[[17, 22], [24, 26], [31, 22], [21, 19], [28, 19]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="1.2" ry="1.9" fill="#1F2A1D"/>`).join('')}`,
  papaya: (c, e) => `<path d="M24 6c10 0 16 10 16 20s-7 16-16 16S8 36 8 26 14 6 24 6Z" fill="${c}" stroke="${e}" stroke-width="1.8"/><ellipse cx="24" cy="28" rx="6" ry="9" fill="#FCE3B8"/>${[[22, 24], [26, 26], [23, 30], [26, 32]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.4" fill="#1F2A1D"/>`).join('')}`,
  banana: (c, e) => `<path d="M8 16c4 16 18 24 34 18-12 0-22-8-26-20Z" fill="${c}" stroke="${e}" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 16l-2-4" stroke="#7A5A20" stroke-width="2.5" stroke-linecap="round"/>`,
  dragon: (c, e) => `<circle cx="24" cy="26" r="15" fill="${c}"/><circle cx="24" cy="26" r="11" fill="#fff" opacity=".9"/>${[[20, 22], [27, 21], [24, 27], [19, 29], [29, 29], [23, 32]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1" fill="#1F2A1D"/>`).join('')}<path d="M12 18l-4-3M36 18l4-3M24 11V6" stroke="#5BA84A" stroke-width="2.5" stroke-linecap="round"/>`,
  berry: (c, e) => [[16, 28], [30, 28], [23, 18]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="8" fill="${c}"/><path d="M${x - 2} ${y - 6}l2 2 2-2" stroke="#1F2A1D" stroke-width="1.2" fill="none"/>`).join(''),
  cup: (c, e) => `<path d="M13 12h22l-3 28H16Z" fill="${c}" stroke="${e}" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 20h20" stroke="${e}" stroke-width="1.5"/>`,
  potato: (c, e) => `<path d="M8 28c0-9 8-16 18-16s14 6 14 12-8 14-18 14-14-4-14-10Z" fill="${c}" stroke="${e}" stroke-width="1.8"/><circle cx="19" cy="24" r="1.3" fill="${e}"/><circle cx="29" cy="28" r="1.3" fill="${e}"/>`,
  dumpling: (c, e) => [[16, 28], [32, 24]].map(([x, y]) => `<path d="M${x - 11} ${y + 3}c0-8 5-13 11-13s11 5 11 13Z" fill="${c}" stroke="${e}" stroke-width="1.6"/><path d="M${x - 5} ${y - 7}l1 4M${x} ${y - 9}v4M${x + 5} ${y - 7}l-1 4" stroke="${e}" stroke-width="1.3"/>`).join(''),
  sauce: (c, e) => `<ellipse cx="24" cy="30" rx="16" ry="7" fill="#fff" stroke="#D9D2C3" stroke-width="2"/><ellipse cx="24" cy="29" rx="11" ry="4" fill="${c}"/>`,
  plate: (c, e) => `<circle cx="24" cy="24" r="16" fill="${c}" stroke="${e}" stroke-width="2"/>`,
};
const KIND = [
  [/laksa|noodle|udon/i, 'noodles'], [/congee|porridge|rice/i, 'rice'], [/soup|broth/i, 'soup'],
  [/chicken/i, 'chicken'], [/fish/i, 'fish'], [/tofu/i, 'tofu'], [/egg/i, 'egg'], [/broccoli/i, 'broccoli'],
  [/tomato/i, 'tomato'], [/cucumber/i, 'cucumber'], [/long bean|sprout/i, 'beans'], [/kailan|spinach|cabbage|greens|salad/i, 'greens'],
  [/watermelon|melon/i, 'melon'], [/papaya/i, 'papaya'], [/banana/i, 'banana'], [/dragon/i, 'dragon'], [/berr/i, 'berry'],
  [/milk|yogurt/i, 'cup'], [/potato/i, 'potato'], [/wonton|dumpling/i, 'dumpling'], [/chilli|sambal|sauce/i, 'sauce'],
];
V.kindOf = d => (KIND.find(([re]) => re.test(d.name)) || [, 'plate'])[1];
V.food = (d, size = 44) => `<svg class="food" width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true">${SHAPES[V.kindOf(d)](d.color, d.edge)}</svg>`;

/* ---------------------------------------------------------------- the tray: each dish, and how much was eaten */
/** rec: optional scanned meal { served, measured }. Without it the tray shows what's on the menu. */
V.tray = (menu, rec, opts = {}) => `<div class="vtray" style="--cols:${Math.min(3, Math.ceil(menu.length / 2))}">${menu.map(d => {
  const ate = rec ? Math.round((1 - rec.measured[d.id] / rec.served[d.id]) * 100) : null;
  const name = opts.name ? opts.name(d) : d.name;
  return `<div class="vcell ${opts.hi === d.id ? 'hi' : ''}">
    <div class="vfood ${rec ? 'scored' : ''}" style="--p:${ate ?? 0};--c:${ate === null ? 'var(--tint)' : ate >= 75 ? 'var(--tint)' : ate >= 40 ? '#FFB23F' : '#FF6B5B'}">${V.food(d, opts.size || 40)}</div>
    <span>${esc(name)}</span>${ate === null ? (opts.tag && opts.tag(d) ? `<em>${opts.tag(d)}</em>` : '') : `<b class="num">${ate}%</b>`}</div>`;
}).join('')}</div>`;

/* ---------------------------------------------------------------- My Healthy Plate (Health Promotion Board, Singapore)
   half fruit and vegetables, a quarter wholegrains, a quarter protein */
const GROUP = { veg: 'fv', fruit: 'fv', grain: 'g', protein: 'p' };
V.plateShares = (menu, grams) => {
  const t = { fv: 0, g: 0, p: 0 };
  menu.forEach(d => { const k = GROUP[d.group]; if (k) t[k] += grams[d.id] || 0; });
  const sum = t.fv + t.g + t.p || 1;
  return { fv: t.fv / sum, g: t.g / sum, p: t.p / sum };
};
const PLATE_COL = { fv: '#4CAF50', g: '#F2B33D', p: '#E4674B' };
const arc = (cx, cy, r, a0, a1) => { const p = a => [cx + r * Math.sin(a * 2 * Math.PI), cy - r * Math.cos(a * 2 * Math.PI)]; const [x0, y0] = p(a0), [x1, y1] = p(a1); return `M${cx} ${cy}L${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1 - a0 > .5 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z`; };
const pie = (s, size, label) => {
  let a = 0;
  const parts = ['fv', 'g', 'p'].map(k => { const w = Math.max(0, Math.min(.9999, s[k])); const d = w > 0 ? arc(50, 50, 38, a, a + w) : ''; a += w; return d ? `<path d="${d}" fill="${PLATE_COL[k]}"/>` : ''; }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" role="img" aria-label="${label}"><circle cx="50" cy="50" r="48" fill="#fff" stroke="#E6E1D6" stroke-width="2"/><circle cx="50" cy="50" r="41" fill="none" stroke="#F1EDE4" stroke-width="2"/>${parts}<circle cx="50" cy="50" r="38" fill="none" stroke="#fff" stroke-width="1.5"/></svg>`;
};
V.healthyPlate = (s, opts = {}) => {
  const ideal = { fv: .5, g: .25, p: .25 };
  const tips = [];
  if (s.fv < .38) tips.push('more fruit and vegetables');
  if (s.g > .38) tips.push('a smaller rice or noodle portion');
  if (s.p < .15) tips.push('a little more protein');
  const verdict = tips.length ? `Next time: ${tips.join(', ')}.` : 'Close to My Healthy Plate. Well balanced!';
  return `<div class="hplate">
    <figure>${pie(s, opts.size || 104, 'What you ate')}<figcaption>${opts.you || 'Your plate'}</figcaption></figure>
    <figure class="ideal">${pie(ideal, (opts.size || 104) * .78, 'My Healthy Plate')}<figcaption>My Healthy Plate</figcaption></figure>
    <ul class="hlegend">${[['fv', 'Fruit and veg', '½'], ['g', 'Wholegrains', '¼'], ['p', 'Protein', '¼']].map(([k, n, i]) => `<li><i style="background:${PLATE_COL[k]}"></i><span>${n}</span><b class="num">${Math.round(s[k] * 100)}%</b><small>aim ${i}</small></li>`).join('')}</ul>
    ${opts.noVerdict ? '' : `<p class="hverdict">${verdict}</p>`}</div>`;
};

/* ---------------------------------------------------------------- ring gauge: value against target */
/** kind: 'aim' (reach it), 'limit' (stay under it), 'range' (near it). */
V.ring = (value, target, label, unit, kind = 'range') => {
  const r = value / target, p = Math.min(100, Math.round(r * 100));
  const good = kind === 'limit' ? r <= 1.05 : kind === 'aim' ? r >= .85 : r >= .8 && r <= 1.25;
  const col = good ? 'var(--tint)' : kind === 'limit' || r > 1.25 ? '#FF6B5B' : '#FFB23F';
  return `<div class="vring"><div class="vr" style="--p:${p};--c:${col}"><div><b class="num">${Math.round(value).toLocaleString('en-US')}</b><small>/ ${Math.round(target).toLocaleString('en-US')}${unit === 'kcal' ? '' : ' ' + unit}</small></div></div><span>${label}</span></div>`;
};

/** A share (0..1) as a ring, e.g. how much of a meal was eaten. */
V.pctRing = (frac, label, good = .75) => { const p = Math.round(frac * 100); return `<div class="vring"><div class="vr" style="--p:${p};--c:${frac >= good ? 'var(--tint)' : frac >= .5 ? '#FFB23F' : '#FF6B5B'}"><div><b class="num">${p}%</b></div></div><span>${label}</span></div>`; };

/* ---------------------------------------------------------------- a week of plates: how much was eaten each day */
V.week = (days, fracs, opts = {}) => `<div class="vweek">${days.map((d, i) => `<div class="${opts.today === i ? 'today' : ''}"><i style="--p:${Math.round(fracs[i] * 100)};--c:${fracs[i] >= (opts.good || .75) ? 'var(--tint)' : fracs[i] >= .5 ? '#FFB23F' : '#FF6B5B'}"></i><b class="num">${Math.round(fracs[i] * 100)}%</b><span>${d.slice(0, 3)}</span></div>`).join('')}</div>`;

/* ---------------------------------------------------------------- avatar: initials on a colour picked from the name */
const AV = ['#FF9F0A', '#34C759', '#0A84FF', '#AF52DE', '#FF375F', '#30B0C7', '#5E5CE6', '#E8A317'];
V.avatar = (s, size = 36) => { const h = [...s.name].reduce((a, c) => a + c.charCodeAt(0), 0); return `<span class="av-circle" style="--av:${AV[h % AV.length]};width:${size}px;height:${size}px;font-size:${Math.round(size * .38)}px" aria-hidden="true">${esc(s.name.split(' ').map(w => w[0]).join('').slice(0, 2))}</span>`; };

/* ---------------------------------------------------------------- small illustrated tip card */
const TIPICON = {
  leaf: '<path d="M6 30C6 14 16 6 32 6c0 16-8 26-26 24Zm0 0 14-14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',
  drop: '<path d="M18 4s10 11 10 18a10 10 0 0 1-20 0C8 15 18 4 18 4Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>',
  bolt: '<path d="M20 3 7 20h10l-2 13 13-17H18Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>',
  scale: '<path d="M6 10h24M18 6v24M10 30h16M6 10l-4 9h8ZM30 10l-4 9h8Z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
  muscle: '<path d="M6 26c2-10 8-16 14-16 4 0 5 3 3 5-2 1-5 1-6 3 6-1 11 2 12 7 1 6-5 8-11 8-6 0-11-2-12-7Z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>',
  plate: '<circle cx="18" cy="18" r="13" fill="none" stroke="currentColor" stroke-width="3"/><path d="M18 5v26M18 18h13" stroke="currentColor" stroke-width="2.6"/>',
  warn: '<path d="M18 4 3 31h30Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M18 14v8M18 26v.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',
  check: '<circle cx="18" cy="18" r="14" fill="none" stroke="currentColor" stroke-width="3"/><path d="M11 18.5l5 5 9-10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',
  salt: '<path d="M12 12h12l3 20H9Z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M13 12c0-5 10-5 10 0M15 7h.1M18 6h.1M21 7h.1" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>',
  recycle: '<path d="M13 8l5-4 5 4M18 4v12M8 28l-3-6 6-2M5 22l9 5M28 28l3-6-6-2M31 22l-9 5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
  cloud: '<path d="M10 28a7 7 0 0 1-1-14 9 9 0 0 1 17-2 7 7 0 0 1 1 16Z" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/>',
  smile: '<circle cx="18" cy="18" r="14" fill="none" stroke="currentColor" stroke-width="3"/><path d="M12 21c3.5 4 8.5 4 12 0M13 14h.1M23 14h.1" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>',
  heart: '<path d="M18 31 6 19a7 7 0 0 1 12-9 7 7 0 0 1 12 9Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>',
  bowl: '<path d="M4 16h28a14 12 0 0 1-28 0Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M13 10c0-2 2-3 2-5M21 10c0-2 2-3 2-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>',
};
V.icon = (name, color) => `<span class="vicon" style="--ic:${color}"><svg viewBox="0 0 36 36" aria-hidden="true">${TIPICON[name] || TIPICON.leaf}</svg></span>`;
/** tone: good | warn | info */
V.tip = (icon, tone, title, text) => `<div class="vtip ${tone}">${V.icon(icon, { good: 'var(--tint)', warn: '#F28C28', info: 'var(--blue)', bad: '#FF6B5B' }[tone])}<div><b>${title}</b>${text ? `<span>${text}</span>` : ''}</div></div>`;
})();

</script>
<script>
/* ---- js/game.js ---- */
/* Loopi's rules, adapted from the team's tomogatchi prototype and tied to real school lunches.
   The core: a tray scanned back feeds Loopi the food you ate; a tray with less left than your usual earns
   a heart; full hearts grow Loopi from egg to adult, and a grown Loopi lays an egg (rarity odds shown) that
   hatches a new one while the old one retires to the Barn. Your real leftovers become crumbs to sweep into
   the food waste bin. Around it: gems, ingredients from the food groups you actually ate, oven cooking in
   recipe order (burnt or wrong dishes are thrown away; now and then a dish comes out golden), recipe cards
   from the Healthy Catch minigame, and wardrobe crates (earned gems only, odds shown). Hearts only ever come from real trays, so the game can't be won without eating well. */
(() => {
'use strict';
const { MENU } = PL;
const G = PL.game = {};
const V = 3; // bump when the saved game changes shape

/* ---------------------------------------------------------------- tuning */
G.HUNGER_MAX = [4, 6, 9, 13];
G.HEARTS_REQ = [3, 5, 7, 9];
G.PLAYS_PER_DAY = 3;          // Healthy Catch games a day
G.BALLS_PER_DAY = 5;          // fetch throws that add Joy
G.PETS_PER_DAY = 5;           // pats that add Joy
G.PET_GEM = { chance: .25, min: 2, max: 8, cap: 3 };
G.OVEN_CAP = 4;
G.SPOIL_CHANCE = .1;          // a correct recipe can still burn; it's thrown away
G.GOLDEN_CHANCE = .15; G.GOLDEN_HUNGER = 2; // a cooked dish sometimes comes out golden
G.RARITY_BONUS = { common: .4, rare: 1, epic: 1.7, legendary: 2.5 };
G.MENTOR_BONUS = .1;
G.EGG_WEIGHTS = { common: 50, rare: 30, epic: 15, legendary: 5 };
G.DUP_REFUND = .2;

G.INGREDIENTS = {
  rice: { name: 'Rice', draw: { name: 'Rice', color: '#F3EDDA', edge: '#BFB28E' } },
  veg: { name: 'Greens', draw: { name: 'Greens', color: '#3F9A48', edge: '#2A5A22' } },
  protein: { name: 'Chicken', draw: { name: 'Chicken', color: '#C98A4B', edge: '#8E5E28' } },
  fruit: { name: 'Fruit', draw: { name: 'Watermelon', color: '#F2545B', edge: '#B8323A' } },
};
/** Which ingredient each lunch food group gives when you eat at least half of it. */
const GROUP_ING = { grain: 'rice', veg: 'veg', protein: 'protein', fruit: 'fruit' };
G.RECIPES = [
  { id: 'chickenrice', name: 'Chicken rice', seq: ['rice', 'protein', 'veg'], hunger: 3, unlock: null },
  { id: 'vegsoup', name: 'Veggie soup', seq: ['veg', 'veg', 'rice'], hunger: 2, unlock: null },
  { id: 'fruitcup', name: 'Fruit cup', seq: ['fruit', 'fruit', 'veg'], hunger: 2, unlock: null },
  { id: 'nasilemak', name: 'Nasi lemak', seq: ['rice', 'protein', 'veg', 'rice'], hunger: 4, unlock: 'nasi', cost: 3 },
  { id: 'rainbow', name: 'Rainbow bowl', seq: ['rice', 'protein', 'veg', 'fruit'], hunger: 6, unlock: 'rainbow', cost: 5 },
];
G.CARD_NAME = { nasi: 'Nasi lemak card', rainbow: 'Rainbow bowl card' };
G.ACCESSORIES = [
  { id: 'cap', name: 'Cap', rarity: 'normal' }, { id: 'bow', name: 'Bow', rarity: 'normal' },
  { id: 'glasses', name: 'Glasses', rarity: 'normal' }, { id: 'scarf', name: 'Scarf', rarity: 'normal' },
  { id: 'flower', name: 'Flower', rarity: 'normal' }, { id: 'headphones', name: 'Headphones', rarity: 'epic' },
  { id: 'halo', name: 'Halo', rarity: 'epic' }, { id: 'wings', name: 'Wings', rarity: 'epic' },
  { id: 'crown', name: 'Crown', rarity: 'legendary' }, { id: 'aura', name: 'Sparkle aura', rarity: 'legendary' },
];
G.CRATES = {
  normal: { name: 'Basic crate', cost: 40, w: { normal: 85, epic: 14, legendary: 1 } },
  epic: { name: 'Epic crate', cost: 120, w: { normal: 40, epic: 50, legendary: 10 } },
  legendary: { name: 'Legendary crate', cost: 300, w: { normal: 10, epic: 50, legendary: 40 } },
};

const today = () => new Date().toISOString().slice(0, 10);
const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const blank = () => ({ rice: 0, veg: 0, protein: 0, fruit: 0 });
const pickWeighted = w => { const e = Object.entries(w), tot = e.reduce((a, [, v]) => a + v, 0); let x = Math.random() * tot; for (const [k, v] of e) { if (x < v) return k; x -= v; } return e[0][0]; };
const daily = g => { if (!g.day || g.day.d !== today()) g.day = { d: today(), balls: 0, pets: 0, drops: 0, plays: 0 }; return g.day; };
/** Leftovers become crumbs: one per 20 g left of a dish, at most 3 per dish. */
const crumbsFrom = (left, menu = MENU) => menu.flatMap(d => Array(Math.min(3, Math.floor((left[d.id] || 0) / 20))).fill(d.id));
/** The tray is "good" when less is left than 15%, or a quarter less than the student's usual. */
G.heartLine = st => Math.max(.15, st.baseline * .75);

/* ---------------------------------------------------------------- setup */
G.init = st => {
  const r = PL.rng(hash(st.id)), stage = PL.STAGES.indexOf(PL.stageOf(st.pet.xp)), req = G.HEARTS_REQ[stage];
  const n = Math.min(4, Math.round(st.log[0].w * 12));
  const g = {
    v: V, name: 'Loopi', rarity: 'common', stage,
    hunger: Math.round(G.HUNGER_MAX[stage] * (.4 + r() * .3)),
    hearts: st.named ? req - 1 : Math.floor(r() * req), ready: false,
    plate: null, mess: ['kailan', 'cabbage', 'soup', 'rice'].slice(0, n), composted: Math.round(15 + r() * 50),
    gems: Math.round(40 + r() * 140),
    ing: { rice: 1 + Math.floor(r() * 4), veg: 1 + Math.floor(r() * 4), protein: Math.floor(r() * 3), fruit: 1 + Math.floor(r() * 3) },
    grown: blank(), bin: ['veg', 'rice', 'fruit'].slice(0, 1 + Math.floor(r() * 3)), oven: [], snacks: [],
    unlocked: { nasi: false, rainbow: false }, cards: { nasi: 1 + Math.floor(r() * 2), rainbow: Math.floor(r() * 2) },
    acc: [], eq: null, barn: [], eggs: [], best: 0,
    day: { d: today(), balls: 0, pets: 0, drops: 0, plays: 0 },
  };
  if (st.named) g.snacks.push({ id: 's' + Math.floor(r() * 1e6), recipe: 'chickenrice', name: 'Chicken rice', hunger: 3, golden: false });
  (st.pet.book || []).forEach((form, i) => g.barn.push({ id: 'b' + i, name: 'Loopi ' + (i + 1), form, rarity: r() < .6 ? 'common' : 'rare', stage: 3 }));
  if (st.id === 's3') { g.acc.push('crown'); g.eq = 'crown'; }
  if (st.id === 's6') { g.acc.push('headphones'); g.eq = 'headphones'; }
  return g;
};
G.ensure = st => { if (!st.game || st.game.v !== V) st.game = G.init(st); return st.game; };
const ensureAll = () => PL.S.students.forEach(G.ensure);
ensureAll();
PL.store.subscribe(ensureAll);

/* ---------------------------------------------------------------- lookups */
G.hungerMax = g => G.HUNGER_MAX[g.stage];
G.heartsReq = g => G.HEARTS_REQ[g.stage];
G.plantOf = st => Math.min(4, Math.floor(st.pet.c.lowWaste / 5));
G.playsLeft = g => G.PLAYS_PER_DAY - daily(g).plays;
G.recipeUnlocked = (g, rc) => !rc.unlock || g.unlocked[rc.unlock];
/** Barn bonus on the gems each lunch earns: your best Loopi (active or retired) sets it; every other grown Loopi adds a little. */
G.multiplier = g => {
  const pets = [...g.barn, { rarity: g.rarity, stage: g.stage }];
  const val = p => 1 + G.RARITY_BONUS[p.rarity] * (p.stage / 3);
  const best = pets.reduce((a, p) => val(p) > val(a) ? p : a, pets[0]);
  return val(best) + pets.filter(p => p !== best).reduce((a, p) => a + G.MENTOR_BONUS * (p.stage / 3), 0);
};

/* ---------------------------------------------------------------- lunch: the heart of it */
/** Called after the second scan. Hunger, hearts, gems and ingredients change right away; the food waits in the bowl. */
G.feedLunch = (st, r, menu = MENU) => {
  const g = G.ensure(st), max = G.hungerMax(g), req = G.heartsReq(g);
  if (g.plate && !g.plate.eaten) g.mess.push(...g.plate.crumbs); // yesterday's uneaten plate still counts
  const gain = 1 + (r.w < .3 ? 1 : 0) + (r.w < .12 ? 1 : 0);
  g.hunger = Math.min(max, g.hunger + gain);
  let heart = false;
  if (r.w < G.heartLine(st) && g.hearts < req) {
    g.hearts++; heart = true;
    if (g.hearts === req) g.ready = true;
  }
  // one ingredient for each food group you ate at least half of
  const got = blank();
  menu.forEach(d => { const k = GROUP_ING[d.group]; if (k && r.servedBy[d.id] && r.measured[d.id] <= r.servedBy[d.id] * .5) got[k] = 1; });
  Object.keys(got).forEach(k => { g.ing[k] += got[k]; });
  const gems = Math.round((gain * 5 + 5) * G.multiplier(g));
  g.gems += gems;
  g.plate = {
    eaten: false, heart, gain,
    food: menu.filter(d => r.servedBy[d.id] - r.measured[d.id] > 10).map(d => d.id),
    crumbs: crumbsFrom(r.measured, menu),
  };
  return { hunger: gain, heart, ready: g.ready, crumbs: g.plate.crumbs.length, gems, ing: got };
};
/** Loopi eats what's in the bowl; the tray's leftovers land on the floor. */
G.serveLunch = st => {
  const g = G.ensure(st), p = g.plate;
  if (!p || p.eaten) return null;
  p.eaten = true;
  g.mess.push(...p.crumbs);
  return p;
};
/** Swept crumbs are your real leftovers: they go in the food waste bin and are counted, but never turned into ingredients. */
G.sweep = (st, dish) => {
  const g = G.ensure(st), i = g.mess.indexOf(dish);
  if (i >= 0) { g.mess.splice(i, 1); g.composted++; }
  return g.mess.length;
};
/** A cooked snack fills Food and cheers Loopi up (golden: more of both). Hearts only come from real trays. */
G.eatSnack = (st, snackId) => {
  const g = G.ensure(st), i = g.snacks.findIndex(s => s.id === snackId);
  if (i < 0) return null;
  const [s] = g.snacks.splice(i, 1), max = G.hungerMax(g), wasFull = g.hunger >= max;
  g.hunger = Math.min(max, g.hunger + s.hunger);
  st.pet.jo = Math.min(100, st.pet.jo + (s.golden ? 12 : 5));
  g.gems += s.hunger * 2;
  return { snack: s, wasFull, heart: false };
};

/* ---------------------------------------------------------------- growing up, eggs and the Barn */
/** Full hearts: grow a stage. A fully grown Loopi lays an egg instead. */
G.evolve = st => {
  const g = G.ensure(st);
  if (!g.ready) return null;
  g.ready = false; g.hearts = 0;
  if (g.stage < 3) { g.stage += 1; return { type: 'grow', stage: PL.STAGES[g.stage] }; }
  const rarity = pickWeighted(G.EGG_WEIGHTS);
  g.eggs.push(rarity);
  return { type: 'egg', rarity };
};
/** Hatching retires the grown Loopi to the Barn (it keeps boosting your gems) and starts a new one. */
G.hatch = st => {
  const g = G.ensure(st);
  if (!g.eggs.length) return null;
  const rarity = g.eggs.shift();
  g.barn.push({ id: 'b' + Date.now(), name: g.name, form: PL.formOf(st.pet), rarity: g.rarity, stage: g.stage, acc: g.eq });
  Object.assign(g, { name: 'Loopi ' + (g.barn.length + 1), rarity, stage: 0, hunger: 2, hearts: 0, ready: false, eq: null });
  return rarity;
};

/* ---------------------------------------------------------------- cooking */
function dump(g) { g.oven.forEach(o => g.bin.push(o.t)); g.oven = []; }
G.ovenAdd = (st, type) => {
  const g = G.ensure(st);
  let grown = false;
  if (g.grown[type] > 0) { g.grown[type]--; grown = true; }
  else if (g.ing[type] > 0) g.ing[type]--;
  else return { result: 'none' };
  g.oven.push({ t: type, grown });
  const seq = g.oven.map(o => o.t), open = G.RECIPES.filter(rc => G.recipeUnlocked(g, rc));
  const match = open.find(rc => rc.seq.length === seq.length && rc.seq.every((x, i) => x === seq[i]));
  if (match) {
    if (Math.random() < G.SPOIL_CHANCE) { dump(g); return { result: 'spoiled', recipe: match }; }
    const golden = Math.random() < G.GOLDEN_CHANCE;
    const snack = { id: 's' + Date.now() + Math.floor(Math.random() * 1e4), recipe: match.id, name: (golden ? 'Golden ' : '') + match.name, hunger: match.hunger + (golden ? G.GOLDEN_HUNGER : 0), golden };
    g.snacks.push(snack); g.oven = []; g.gems += 3;
    return { result: 'cooked', snack };
  }
  const prefix = open.some(rc => rc.seq.length > seq.length && seq.every((x, i) => rc.seq[i] === x));
  if (!prefix || seq.length >= G.OVEN_CAP) { dump(g); return { result: 'rejected' }; }
  return { result: 'pending' };
};
G.emptyOven = st => { const g = G.ensure(st), n = g.oven.length; dump(g); return n; };

G.unlock = (st, key) => {
  const g = G.ensure(st), rc = G.RECIPES.find(x => x.unlock === key);
  if (!rc || g.unlocked[key] || g.cards[key] < rc.cost) return false;
  g.cards[key] -= rc.cost; g.unlocked[key] = true; return true;
};

/* ---------------------------------------------------------------- play, petting */
G.playBall = st => {
  const g = G.ensure(st), d = daily(g);
  if (d.balls >= G.BALLS_PER_DAY) return false;
  d.balls++; st.pet.jo = Math.min(100, st.pet.jo + 3); return true;
};
/** A pat adds Joy, and now and then Loopi finds a few gems (at most 3 times a day). */
G.petLoopi = st => {
  const g = G.ensure(st), d = daily(g);
  if (d.pets < G.PETS_PER_DAY) { d.pets++; st.pet.jo = Math.min(100, st.pet.jo + 1); }
  if (d.drops >= G.PET_GEM.cap || Math.random() >= G.PET_GEM.chance) return 0;
  const gems = G.PET_GEM.min + Math.floor(Math.random() * (G.PET_GEM.max - G.PET_GEM.min + 1));
  g.gems += gems; d.drops++; return gems;
};

/* ---------------------------------------------------------------- Healthy Catch */
G.catchStart = st => { const g = G.ensure(st), d = daily(g); if (d.plays >= G.PLAYS_PER_DAY) return false; d.plays++; return true; };
G.catchEnd = (st, res) => {
  const g = G.ensure(st), got = blank();
  Object.keys(got).forEach(t => { got[t] = Math.floor((res.caught[t] + 1) / 2); g.ing[t] += got[t]; });
  Object.keys(res.cards).forEach(k => { g.cards[k] += res.cards[k]; });
  const gems = Math.floor(res.score / 4);
  g.gems += gems;
  const best = res.score > g.best; if (best) g.best = res.score;
  return { got, gems, best };
};

/* ---------------------------------------------------------------- wardrobe: badges and crates */
G.BADGES = [
  { id: 'first', name: 'First scan', item: 'cap', how: 'Scan a lunch tray', test: st => st.log.length > 0 },
  { id: 'small', name: 'Small and clean', item: 'bow', how: 'Finish a small portion', test: st => st.log.some(l => l.portion === 'S' && l.w < .12) },
  { id: 'streak', name: 'Three in a row', item: 'scarf', how: '3 clean trays in a row', test: st => st.pet.streak >= 3 },
  { id: 'veg', name: 'Veggie explorer', item: 'flower', how: 'Try the veggies 10 times', test: st => st.pet.c.veg >= 10 },
  { id: 'kailan', name: 'Kailan week', item: 'glasses', how: 'Taste the kailan 3 times', test: st => st.pet.quest >= 3 },
  { id: 'balanced', name: 'Balanced plate', item: 'halo', how: 'Eat from every food group 5 times', test: st => st.pet.c.balanced >= 5 },
  { id: 'class', name: 'Team goal', item: 'wings', how: 'Your class goes under 20% waste', test: st => { const c = PL.S.classes.find(c => c.id === st.cls); return c ? c.ret / c.served < .2 : false; } },
  { id: 'top3', name: 'Podium', item: 'headphones', how: 'Be top 3 in your class', test: st => PL.studentRows().findIndex(s => s.id === st.id) < 3 },
  { id: 'adult', name: 'All grown up', item: 'crown', how: 'Grow Loopi into an adult', test: st => G.ensure(st).stage === 3 || G.ensure(st).barn.length > 0 },
];
G.earned = st => G.BADGES.filter(b => b.test(st));
/** Everything Loopi can wear: won in crates, or unlocked by a badge. */
G.owned = st => new Set([...G.ensure(st).acc, ...G.earned(st).map(b => b.item)]);
G.wear = (st, item) => { const g = G.ensure(st); if (item && !G.owned(st).has(item)) return; g.eq = g.eq === item ? null : item; };
G.openCrate = (st, tier) => {
  const g = G.ensure(st), c = G.CRATES[tier];
  if (g.gems < c.cost) return { error: `The ${c.name.toLowerCase()} costs ${c.cost} gems.` };
  g.gems -= c.cost;
  const rarity = pickWeighted(c.w), pool = G.ACCESSORIES.filter(a => a.rarity === rarity);
  const acc = pool[Math.floor(Math.random() * pool.length)], dup = G.owned(st).has(acc.id);
  let refund = 0;
  if (dup) { refund = Math.round(c.cost * G.DUP_REFUND); g.gems += refund; } else g.acc.push(acc.id);
  return { acc, dup, refund };
};

/* ---------------------------------------------------------------- pixel sprites for the catch game */
G.SPRITES = {
  rice: { p: ['..wwww..', '.wwwwww.', 'bbbbbbbb', '.bbbbbb.', '..bbbb..'], c: { w: '#FFFFFF', b: '#3E74C9' } },
  veg: { p: ['..gg.gg.', '.gggggg.', '.gdggdg.', '..gggg..', '...dd...', '...dd...'], c: { g: '#3C9A48', d: '#23602D' } },
  protein: { p: ['...bb...', '..bbbb..', '.bbbbbb.', '.bbbbbb.', '..bbbb..', '...ww...', '..w..w..'], c: { b: '#C98A4B', w: '#FFF8EC' } },
  fruit: { p: ['gggggggg', '.rrrrrr.', '.rkrrkr.', '..rrrr..', '...rr...'], c: { g: '#5BA84A', r: '#F2545B', k: '#1F2A1D' } },
  soda: { p: ['..kkkk..', '..cccc..', '..ckcc..', '..cccc..', '..cccc..', '..kkkk..'], c: { c: '#B8322A', k: '#D9D9D9' } },
  candy: { p: ['p......p', 'pp.pp.pp', 'pppppppp', 'pp.pp.pp', 'p......p'], c: { p: '#E86FB0' } },
  card: { p: ['.tttttt.', '.tkkkkt.', '.tttttt.', '.tkkktt.', '.tttttt.'], c: { t: '#F1DFAE', k: '#6B4A2B' } },
};
G.drawSprite = (ctx, name, x, y, s) => {
  const sp = G.SPRITES[name];
  sp.p.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') { ctx.fillStyle = sp.c[ch]; ctx.fillRect(Math.round(x + i * s), Math.round(y + j * s), s, s); } }));
};
})();

</script>

function mount(el) {

const VIEWS = () => ({ overview, dishes, nutrition, carbon, plan, report });
/** A new view renders fresh (and slides in); live updates to the overview patch it in place. */
function render(force) {

  if (!force && main.dataset.view === ui.view && ui.view === 'overview') { const tmp = document.createElement('div'); tmp.innerHTML = html; morph(main, tmp); }
  else {
    const changed = main.dataset.view !== ui.view;
    main.innerHTML = html; main.dataset.view = ui.view;
    if (changed && main.animate && !PL.reduceMotion && ui.dir) main.animate([{ opacity: 0, transform: `translateX(${ui.dir * 28}px)` }, { opacity: 1, transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' });
    PL.motion(main, 'kitchen:' + ui.view, { force: !!force });
  }
  wire(main);

}
/** Make `a` look like `b`, keeping the nodes that stay the same so bars and numbers move smoothly. */
function morph(a, b) {
  const an = [...a.childNodes], bn = [...b.childNodes];
  if (an.length !== bn.length) { a.innerHTML = b.innerHTML; return; }
  an.forEach((x, i) => {
    const y = bn[i];
    if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName) { a.replaceChild(y.cloneNode(true), x); return; }
    if (x.nodeType === 3) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; return; }
    if (x.nodeType !== 1) return;
    [...x.attributes].forEach(at => { if (!y.hasAttribute(at.name)) x.removeAttribute(at.name); });
    [...y.attributes].forEach(at => { if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value); });
    morph(x, y);
  });
}

function flashChanges(main) {
  $$('[data-live]', main).forEach(n => {
    const k = n.dataset.live, v = n.textContent;
    if (ui.prev[k] !== undefined && ui.prev[k] !== v && !PL.reduceMotion) { n.classList.remove('upd'); void n.offsetWidth; n.classList.add('upd'); }

}

function chartTrend() {
  const W = 640, H = 250, l = 44, r = 16, t = 14, b = 28, iw = W - l - r, ih = H - t - b, max = .35;

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Plate waste over 30 school days">`;
  s += `<rect x="${l}" y="${t}" width="${X(9.5) - l}" height="${ih}" rx="8" fill="var(--fill)"/><text class="axis" x="${l + 10}" y="${t + 18}">Before PlateLoop</text>`;
  [0, .1, .2, .3].forEach(v => { s += `<line class="gridline" x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${l - 8}" y="${Y(v) + 4}" text-anchor="end">${v * 100}%</text>`; });
  s += `<line x1="${l}" x2="${W - r}" y1="${Y(.15)}" y2="${Y(.15)}" stroke="var(--orange)" stroke-width="1.5" stroke-dasharray="5 5"/><text class="axis" x="${X(10.5)}" y="${Y(.15) + 16}" style="fill:var(--orange)">Goal 15%</text>`;
  const line = HISTORY.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');

  s += `<path d="${line} L${X(29)},${Y(0)} L${X(0)},${Y(0)} Z" fill="url(#tg1)"/><path d="${line}" fill="none" stroke="var(--tint)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<circle cx="${X(29)}" cy="${Y(HISTORY[29])}" r="5" fill="var(--tint)" stroke="var(--bg2)" stroke-width="2.5"/><text x="${X(29) - 10}" y="${Y(HISTORY[29]) - 12}" text-anchor="end" style="font:600 13px var(--font);fill:var(--label)">${pct(HISTORY[29])}</text>`;

  return s + '</svg>';
}

/* ================================================================ Nutrition: what people ate, against the lunch target */
function intakeStats() {
  const done = PL.S.students.filter(s => s.log[0] && s.log[0].n);
  const recent = PL.S.students.map(s => s.scanned ? s.after.intake : s.log[0].n);
  const avg = Object.fromEntries(PL.NUTRIENTS.map(([k]) => [k, Math.round(recent.reduce((a, n) => a + n[k], 0) / recent.length)]));
  const low = PL.S.students.map(s => { const n = s.scanned ? s.after.intake : s.log[0].n; return { s, n, r: n.kcal / PL.TARGET.kcal }; }).filter(x => x.r < .6).sort((a, b) => a.r - b.r);
  return { avg, low, n: recent.length, done: done.length };
}

  const { avg, low, n } = intakeStats(), word = { low: 'Low', ok: 'Adequate', high: 'Too much' };
  const left = Object.fromEntries(MENU.map(d => [d.id, T().dish[d.id].ret])), served = Object.fromEntries(MENU.map(d => [d.id, T().dish[d.id].served]));
  const L = PL.nutrientsOf(left), S = PL.nutrientsOf(served), maxLost = Math.max(...PL.NUTRIENTS.map(([k]) => L[k] / S[k]));
  return `${head('Latest lunch', 'Nutrition')}
  ${card('Average intake per student', `Class 3B · ${n} students · target per lunch for Secondary 3`, `<div class="kx-list">${PL.NUTRIENTS.map(([k, label, unit]) => { const st = PL.nStatus(k, avg[k]);
    return `<div class="kx-nut"><b>${label}</b>${range(k, avg[k])}<span class="kx-nut-v">${avg[k]}${unit === 'g' ? ' g' : ''}<small> / ${PL.TARGET[k]}</small></span><span class="kx-tag ${st}">${word[st]}</span></div>`; }).join('')}</div>
    <div class="kx-key"><span><i style="background:rgba(255,159,10,.45)"></i>Low</span><span><i style="background:rgba(48,209,88,.45)"></i>Adequate</span><span><i style="background:rgba(255,69,58,.4)"></i>Too much</span></div>`)}
  <section class="kx-duo">
    ${card('People to check on', 'Under 60% of the calorie target at their last lunch. Only the dietitian and form teacher see names.', low.length ? `<div class="kx-list">${low.slice(0, 7).map(x => `<div class="kx-li">${PL.V.avatar(x.s, 32)}<div><b>${esc(x.s.name)} · ${x.s.cls}</b><span>${x.n.kcal} kcal · ${x.n.p} g protein</span></div><span class="kx-tag low">${pct(x.r)}</span></div>`).join('')}</div>` : `<p class="kx-empty">${IC.check}Nobody under 60% right now.</p>`, `<span class="kx-count">${low.length}</span>`)}
    ${card('Nutrients left on trays', 'Served but not eaten today, all finished trays', `<div class="kx-list">${PL.NUTRIENTS.map(([k, label, unit]) => `<div class="kx-row2"><b>${label}</b>${bar(L[k] / S[k] / maxLost, ORANGE)}<em>${pct(L[k] / S[k])}</em><span>${unit === 'g' ? fmt1(L[k] / 1000) + ' kg' : Math.round(L[k] / 1000).toLocaleString('en-US') + 'k kcal'}</span></div>`).join('')}</div>
      <p class="kx-note">Vegetables carry most of the lost fibre and vitamins. The Kailan Week quest targets this.</p>`)}
  </section>`;
}

/* ================================================================ Carbon: the canteen's whole footprint */
const EF_FOOD = { rice: 2.7, chicken: 6.1, kailan: 1.2, cabbage: .6, melon: .5, soup: 1.8 };
const EF_DISPOSAL = .58;
const OPS = [['Electricity', 'kitchen, fridges, dishwashers', 9800, 'kWh', .41], ['Cooking gas', 'stoves and steamers', 1450, 'm³', 2.2], ['Water', 'cooking and washing', 310, 'm³', .34], ['Deliveries', '22 supplier trips', 396, 'truck-km', .9]];
const DAYS_PER_MONTH = 20, BEFORE = 1.18, GOAL = .12;
const CARBON_TREND = [1.16, 1.12, 1.07, 1.05, 1.02, 1];
function carbonData() {
  const w = PL.todayTotals().w, meals = ENROLLED * .97 * DAYS_PER_MONTH;
  const food = MENU.map(d => { const kg = d.g.M / 1000 * meals; return { d, kg, t: kg * EF_FOOD[d.id] / 1000 }; });
  const foodT = food.reduce((a, x) => a + x.t, 0);
  const wastedKg = food.reduce((a, x) => a + x.kg * (T().dish[x.d.id].ret / T().dish[x.d.id].served), 0);
  const disposalT = wastedKg * EF_DISPOSAL / 1000;
  const ops = OPS.map(([name, what, qty, unit, f]) => ({ name, what, qty, unit, t: qty * f / 1000 }));
  const opsT = ops.reduce((a, x) => a + x.t, 0);
  const total = foodT + disposalT + opsT;
  const hidden = food.reduce((a, x) => a + x.t * (T().dish[x.d.id].ret / T().dish[x.d.id].served), 0);
  return { w, meals, food, foodT, wastedKg, disposalT, ops, opsT, total, hidden, perMeal: total * 1000 / meals, before: total * BEFORE };
}
function carbon() {
  const c = carbonData(), cut = 1 - c.total / c.before;
  const parts = [['Ingredients', c.foodT, ORANGE], ['Food waste', c.disposalT, RED], ['Energy, water and transport', c.opsT, BLUE]];
  const meat = c.food.find(x => x.d.id === 'chicken');
  const actions = [
    ['Cut plate waste from ' + pct(c.w) + ' to 20%', Math.max(0, (c.w - .2) / c.w) * (c.disposalT + c.hidden) * 10, 'Using the dish-by-dish waste data'],
    ['Go meat-free with tofu one day a week', meat.t * .2 * (1 - 3 / 6.1) * 10, 'Chicken is ' + pct(meat.t / c.foodT) + ' of ingredient emissions'],
    ['Cook to the forecast, not to enrolment', c.foodT * .06 * 10, 'Purchasing already plans about 6% less food'],
    ['Run dishwashers full and off-peak', c.ops[0].t * .08 * 10, 'About 8% less electricity'],
  ].sort((a, b) => b[1] - a[1]);
  const months = ['Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep'], maxT = c.total * 1.25, goalT = c.before * (1 - GOAL);
  const src = [...c.food.map(x => [x.d.name, x.t, 'ingredient']), ...c.ops.map(o => [o.name, o.t, o.what]), ['Food waste disposal', c.disposalT, `${Math.round(c.wastedKg).toLocaleString('en-US')} kg to the bin`]].sort((a, b) => b[1] - a[1]), maxS = src[0][1];
  return `${head('September', 'Carbon', '<button class="kx-btn" id="copy-carbon">Copy monthly report</button>')}
  <section class="kx-widgets">
    ${widget(IC.cloud, CYAN, 'This month', c.total.toFixed(1), 't', 'CO₂e, all sources')}
    ${widget(IC.tray, BLUE, 'Per meal', c.perMeal.toFixed(2), 'kg', `${Math.round(c.meals).toLocaleString('en-US')} meals`)}
    ${widget(IC.down, GREEN, 'Vs before PlateLoop', '−' + Math.round(cut * 100), '%', `goal −${pct(GOAL)} this year`)}
    ${widget(IC.leaf, GREEN, 'Saved today', ((T().co2 || 0) / 1000).toFixed(1), 'kg', 'live, from trays scanned')}
  </section>
  <section class="kx-duo">
    ${card('Where it comes from', `Food thrown away also wastes the ${c.hidden.toFixed(1)} t it took to grow it`, `<div class="kx-mix big">${parts.map(([, v, col]) => `<i style="flex:${v};background:${col}"></i>`).join('')}</div>
      <div class="kx-list">${parts.map(([nm, v, col]) => `<div class="kx-li"><span class="kx-dot" style="background:${col}"></span><div><b>${nm}</b></div><em>${v.toFixed(1)} t · ${pct(v / c.total)}</em></div>`).join('')}</div>`)}
    ${card('Monthly emissions', 't CO₂e, all sources · dashed line is this year’s goal', `<div class="kx-cols">${CARBON_TREND.map((k, i) => `<div class="kx-col${i === 5 ? ' now' : ''}"><div class="kx-col-b"><i style="height:${(c.total * k / maxT * 100).toFixed(1)}%"><em>${(c.total * k).toFixed(1)}</em></i><s style="bottom:${(goalT / maxT * 100).toFixed(1)}%"></s></div><span>${months[i]}</span></div>`).join('')}</div>`)}
  </section>
  <section class="kx-duo">
    ${card('Biggest cuts toward carbon-neutral', 'Tonnes CO₂e a school year', `<div class="kx-list">${actions.map(([t2, v, s], i) => `<div class="kx-li"><span class="kx-ic" style="--c:${[GREEN, BLUE, ORANGE, PURPLE][i]}">${IC.down}</span><div><b>${t2}</b><span>${s}</span></div><em class="good">−${v.toFixed(1)} t</em></div>`).join('')}</div>`)}
    ${card('Every source', 'This month', `<div class="kx-list">${src.map(([nm, t2, what]) => `<div class="kx-row2"><b>${esc(nm)}</b>${bar(t2 / maxS, what === 'ingredient' ? ORANGE : nm.startsWith('Food waste') ? RED : BLUE)}<em>${t2.toFixed(2)} t</em><span>${esc(what)}</span></div>`).join('')}</div>`)}
  </section>
  <p class="kx-foot">Illustrative factors: ${Object.entries(EF_FOOD).map(([k, v]) => `${PL.DISH[k].name.toLowerCase()} ${v}`).join(', ')} kg CO₂e per kg; disposal ${EF_DISPOSAL}; electricity 0.41 per kWh (Singapore grid); gas 2.2 per m³. Replace with published factors before reporting.</p>`;
}
function carbonReport() {
  const c = carbonData();
  return `Carbon report, September. The canteen produced ${c.total.toFixed(1)} t CO₂e this month (${c.perMeal.toFixed(2)} kg per meal): ${c.foodT.toFixed(1)} t from ingredients, ${c.disposalT.toFixed(1)} t from food waste disposal, and ${c.opsT.toFixed(1)} t from energy, water and deliveries. That is ${pct(1 - c.total / c.before)} below the level before PlateLoop, against a goal of ${pct(GOAL)} this year. Plate waste is ${pct(c.w)}; food thrown away also carried ${c.hidden.toFixed(1)} t of ingredient emissions.`;
}

/* ================================================================ the forecast behind Purchasing */
function forecast() {
  const p = ui.plan, att = p.att - (p.event === 'trip' ? 138 : 0);
  const rows = TOMORROW.map(d => {
    let k = 1;
    if (p.weather === 'rainy' && d.id === 'soup') k *= 1.10;
    if (p.weather === 'hot' && d.id === 'soup') k *= .9;
    if (p.weather === 'hot' && d.id === 'fruit') k *= 1.08;
    if (p.event === 'sports' && (d.tags.includes('grain') || d.tags.includes('protein'))) k *= 1.10;
    return { d, stdKg: ENROLLED * d.std / 1000, newKg: att * d.learned * k * (1 + Math.max(.04, d.err + .01)) / 1000 };
  });
  const need = {}, needStd = {};
  rows.forEach(r => r.d.bom.forEach(([ing, ratio, price]) => { need[ing] = need[ing] || { kg: 0, price }; need[ing].kg += r.newKg * ratio; needStd[ing] = (needStd[ing] || 0) + r.stdKg * ratio; }));
  let cost = 0, costStd = 0, orderTotal = 0;
  const orders = Object.entries(need).map(([ing, o]) => { const inv = INVENTORY[ing] || 0, order = Math.max(0, o.kg - inv); cost += o.kg * o.price; costStd += needStd[ing] * o.price; orderTotal += order * o.price; return { ing, kg: o.kg, inv, order, price: o.price }; });
  return { att, rows, orders, cost, costStd, orderTotal, tStd: rows.reduce((a, r) => a + r.stdKg, 0), tNew: rows.reduce((a, r) => a + r.newKg, 0) };
}

/* ================================================================ Reports: written from today's scans */
function reportData() {
  const t = T(), tot = PL.todayTotals(), rows = dishStats().sort((a, b) => a.e - b.e), f = forecast(), mix = portionMix();
  const worst = rows[0], best = rows[rows.length - 1], diff = (PL.SCHOOL_BASELINE - tot.w) * 100;
  const cls = PL.classRows()[0], is = intakeStats();
  const text = [
    ['Today', `${t.trays.toLocaleString('en-US')} trays were scanned before and after lunch, and ${t.eating} people are still eating. Plate waste is ${pct(tot.w)}, ${diff >= 0 ? `${diff.toFixed(0)} points below` : `${(-diff).toFixed(0)} points above`} the ${pct(PL.SCHOOL_BASELINE)} baseline, leaving ${fmt1(tot.lf / 1000)} kg of food (about ${money(tot.val)} of ingredients).`],
    ['Dishes', `${best.d.name} was the most eaten dish (${pct(best.e)}). ${worst.d.name} came back the most, with only ${pct(worst.e)} eaten. ${TREND[worst.d.id][2]}`],
    ['People', `Class ${cls.c.id} leads Secondary 3 with ${pct(cls.red)} less waste than when it started. ${pct(PL.zeroRate())} of trays had zero leftovers, and ${pct(mix.m.S / mix.tot)} were Small portions.`],
    ['Nutrition', `The average student ate ${is.avg.kcal} kcal and ${is.avg.p} g of protein at lunch (targets ${PL.TARGET.kcal} kcal and ${PL.TARGET.p} g). ${is.low.length} ate less than 60% of their calorie target and are flagged for the dietitian.`],
    ['Tomorrow', `The plan cooks ${fmt1(f.tNew)} kg instead of ${fmt1(f.tStd)} kg, saving about ${money(f.costStd - f.cost)} in ingredients. The supplier order totals ${money(f.orderTotal)}.`],
  ];
  return { text, worst, best, f, tot };
}
function report() {
  const { text, worst, f, tot } = reportData();
  const soup = dishStats().find(r => r.d.id === 'soup');
  const tips = [
    [ORANGE, IC.down, `Serve less ${worst.d.name.toLowerCase()}`, TREND[worst.d.id][2]],
    [BLUE, IC.tray, 'Soup is taken, not eaten', `${fmt1(soup.left / 1000)} kg of soup came back today. A 150 ml ladle would cut most of it.`],
    [GREEN, IC.leaf, 'Kailan Week is working', 'Tasting kailan for the quest raised the share eaten by 17 points.'],
    [PURPLE, IC.cart, `Order ${money(f.orderTotal)} for Monday`, `${fmt1(f.tStd - f.tNew)} kg less food cooked than the standard plan.`],
  ];
  return `${head('Friday 25 September', 'Daily report', '<button class="kx-btn" id="copy-report">Copy summary</button>')}
  <section class="kx-widgets">
    ${widget(IC.tray, GREEN, 'Trays', T().trays + T().eating, '', 'scanned today')}
    ${widget(IC.bin, ORANGE, 'Plate waste', Math.round(tot.w * 100), '%', `${fmt1(tot.lf / 1000)} kg left`)}
    ${widget(IC.cart, BLUE, 'Tomorrow’s order', money(f.orderTotal), '', PL.S.order.approved ? 'approved' : 'waiting for approval')}
    ${widget(IC.cloud, CYAN, 'CO₂ avoided', ((T().co2 || 0) / 1000).toFixed(1), 'kg', 'today')}
  </section>
  <section class="kx-duo">
    ${card('Summary', 'Written automatically, updates as trays come in', `<div class="kx-report">${text.map(([h, p]) => `<div><b>${h}</b><p>${p}</p></div>`).join('')}</div>`)}
    ${card('Suggestions', '', `<div class="kx-list">${tips.map(([c, ic, t2, s]) => `<div class="kx-li"><span class="kx-ic" style="--c:${c}">${ic}</span><div><b>${esc(t2)}</b><span>${esc(s)}</span></div></div>`).join('')}</div>`)}
  </section>`;
}

/* ---------------------------------------------------------------- wiring */
function wireOrder(scope) {
  const ap = $('#approve', scope); if (ap) ap.onclick = () => { PL.S.order.approved = { at: PL.clock(), total: forecast().orderTotal }; PL.store.save('order'); };
  const un = $('#unapprove', scope); if (un) un.onclick = () => { PL.S.order.approved = null; PL.store.save('order'); };
}
function refreshPlan() { const out = $('#plan-out'); if (!out) return; out.innerHTML = planOut(); wireOrder(out); }
function wire(main) {
  const att = $('#att', main);
  if (att) {
    att.oninput = e => { ui.plan.att = +e.target.value; $('#att-v').textContent = `${ui.plan.att} of ${ENROLLED}`; refreshPlan(); };
    $$('#weather button', main).forEach(b => b.onclick = () => { ui.plan.weather = b.dataset.w; $$('#weather button', main).forEach(x => x.setAttribute('aria-pressed', String(x === b))); refreshPlan(); });
    $('#event', main).onchange = e => { ui.plan.event = e.target.value; refreshPlan(); };
  }
  wireOrder(main);
  $$('[data-go]', main).forEach(b => b.onclick = () => go(b.dataset.go));
  $$('[data-todo]', main).forEach(b => b.onclick = () => {
    const id = b.dataset.todo, t = T(); if (b.dataset.go) return;
    if (id === 'sc2') { t.sc2 = 'restarting'; PL.store.save('kitchen'); setTimeout(() => { T().sc2 = 'online'; PL.store.save('kitchen'); PL.toast('Scanner 2 is back online. 6 queued trays synced.'); }, 2600); }
    if (id === 'remind') { t.remind = true; PL.store.save('kitchen'); PL.toast('The scanner now reminds students to scan their tray back.'); }
  });
  PL.paintPets(main);
  const cc = $('#copy-carbon', main);
  if (cc) cc.onclick = () => (navigator.clipboard ? navigator.clipboard.writeText(carbonReport()) : Promise.reject()).then(() => PL.toast('Carbon report copied.'), () => PL.toast('Copy is not available here. Select the text instead.'));
  const cp = $('#copy-report', main);
  if (cp) cp.onclick = () => {
    const txt = reportData().text.join('\n\n');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => PL.toast('Summary copied.'), () => PL.toast('Copy isn\'t available here. Select the text instead.'));
  };
}

PL.apps.kitchen = {
  title: 'PlateLoop Kitchen',
  mount,
  unmount() { removeEventListener('scroll', ui.onScroll); removeEventListener('keydown', ui.onKey); ui.dock = false; root = null; },
  update() { if (!root) return; const y = scrollY, fid = document.activeElement && document.activeElement.id; if (ui.view === 'plan' && fid === 'att') return; render(); if (ui.view !== 'overview') scrollTo({ top: y }); if (fid && $('#' + fid)) $('#' + fid).focus(); },
  tick(t) { if (root && t % 20 === 0) $$('.kx-live', root).forEach(l => { l.outerHTML = liveChip(); }); },
};
})();

<script>
(() => {
  const APP = 'kitchen', FILES = {'model': '1-plateloop-scanner-3d.html', 'kitchen': '3-plateloop-kitchen.html', 'student': '4-loopi-student-app.html', 'care': '5-loopi-care-hospital.html', 'work': '7-loopi-work-office.html', 'lunch': '8-plateloop-lunch-rush-3d.html'};
  const go = n => { location.href = FILES[n]; };
  PL.open = go;
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]'); if (!a) return;
    const n = a.getAttribute('href').slice(1); if (FILES[n]) { e.preventDefault(); go(n); }
  });
  if (/[?&]demo=lunch\b/.test(location.search) && PL.cls32Scanned() === 0) { PL.scanRestOfClass(); PL.store.save('scan'); }
  const app = PL.apps[APP];
  document.body.dataset.app = APP;
  app.mount(document.getElementById('root'));
  PL.store.subscribe((kind, fromSelf) => { if (app.update) app.update(kind, fromSelf); });
  let t = 0; setInterval(() => { t++; if (app.tick) app.tick(t); }, 480);
})();
</script>
