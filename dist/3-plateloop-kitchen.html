.room-actions button svg{width:24px;height:24px;color:var(--tint)}
.room-actions button:active{transform:scale(.95)}
/* full screen: the room is no longer limited to the phone */
.room-full{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.74);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;padding:20px;animation:fade .2s}
.room-full-in{width:min(1100px,100%,calc((100vh - 230px) * 160 / 110));display:flex;flex-direction:column;gap:12px}
.room-full .room{border-radius:26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.room-full .room-hud span{font-size:14px;padding:5px 12px}
.room-full .room-say{font-size:17px;padding:9px 15px;border-radius:16px}
.room-full .room-actions button{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;font-size:13px}
.room-full .room-actions button svg{color:#30D158}

/* ================================================================ Loopi app: grouped lists (iOS Settings style) */
.phone-top .pts span{display:block}
.group{background:var(--bg2);border-radius:14px;box-shadow:var(--shadow-s);display:flex;flex-direction:column;overflow:hidden;flex:none}
.group > * + *{border-top:.5px solid var(--sep)}
.sec{font:600 13px var(--font);color:var(--label2);margin:8px 4px -4px;letter-spacing:0}
.foot{font-size:12.5px;color:var(--label2);margin:-4px 4px 0;line-height:1.4}
.center{text-align:center}
.g-row{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:10px 14px;font-size:14px}
.g-k{color:var(--label2)}
.g-v{color:var(--label2);font-size:13px;text-align:right;white-space:nowrap}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:14px;height:14px;border-radius:4px;background:var(--fill2)}
.pips.food i.on{background:#FFB800}
.pips.joy i.on{background:#FF9F0A}
.pips.q{flex-wrap:nowrap;flex:none}
.pips.q i{width:22px;height:7px;border-radius:999px}
.pips.q i.on{background:var(--tint)}
.hearts{display:flex;gap:3px;flex-wrap:wrap}
.hearts svg{width:17px;height:17px}
.grow{flex-direction:row;align-items:center;gap:12px;padding:10px 14px}
.grow > * + *{border-top:0}
.grow canvas{width:56px;height:47px;image-rendering:pixelated;border-radius:10px;background:#DDE4D4;flex:none}
.grow b{display:block;font-size:15px}
.grow span{font-size:13px;color:var(--label2);line-height:1.35}
.room-actions button.hot{background:var(--tint);color:#fff}
.room-actions button.hot svg{color:#fff}
.room-full .room-actions button.hot{background:#30D158;color:#fff}
.room-full .room-actions button.hot svg{color:#fff}
.room-full .room-hud{right:56px}
/* Lunch */
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;padding:11px 14px}
.step-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--font);background:var(--fill);color:var(--label2)}
.step.done .step-n{background:var(--tint);color:#fff}
.step-n svg{width:16px;height:16px}
.step b{display:block;font-size:15px;font-weight:600}
.step span{font-size:13px;color:var(--label2)}
.group.qr{flex-direction:row;align-items:center;gap:16px;padding:14px}
.group.qr > * + *{border-top:0}
.group.qr canvas{width:108px;height:108px;border-radius:8px;flex:none;image-rendering:pixelated;box-shadow:0 0 0 1px var(--sep)}
.group.qr b{display:block;font-size:15px}
.group.qr span{font-size:13px;color:var(--label2)}
.dish{display:grid;grid-template-columns:12px minmax(0,1fr) 64px 64px;gap:10px;align-items:center;padding:10px 14px;font-size:14px}
.dish > i{width:12px;height:12px;border-radius:50%;border:1.5px solid}
.dish > span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dish:not(:has(.dbar)){grid-template-columns:12px minmax(0,1fr) auto}
.dbar{height:6px;border-radius:999px;background:var(--fill2);overflow:hidden}
.dbar i{display:block;height:100%;background:var(--tint);border-radius:999px}
.tag{font-style:normal;font-size:11px;font-weight:600;color:var(--tint-ink);background:var(--tint-soft);padding:1px 7px;border-radius:999px;margin-left:4px}
.group.health-top{flex-direction:row;padding:14px}
.group.health-top > * + *{border-top:0}
.group.chart{padding:10px 14px 12px}
.group.chart > * + *{border-top:0}
.goal{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px}
.goal b{display:block;font-size:15px;font-weight:600}
.goal span{font-size:13px;color:var(--label2)}
.ok-mark{width:24px;height:24px;border-radius:50%;background:var(--tint);color:#fff;display:grid;place-items:center;flex:none}
.ok-mark svg{width:14px;height:14px}
/* Me */
.group.profile{flex-direction:row;align-items:center;gap:14px;padding:14px}
.group.profile > * + *{border-top:0}
.group.profile canvas{width:96px;height:80px;image-rendering:pixelated;border-radius:14px;background:#DDE4D4;flex:none}
.group.profile b{display:block;font:700 22px var(--font-d);letter-spacing:-.02em}
.group.profile span{font-size:13px;color:var(--label2)}
.me-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.me-stats div{background:var(--bg2);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow-s)}
.me-stats b{display:block;font:700 22px var(--font-d);letter-spacing:-.02em}
.me-stats span{font-size:12px;color:var(--label2)}
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{border:0;background:var(--bg2);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:var(--shadow-s);text-align:center;font:inherit;color:inherit}
.bdg canvas{width:60px;height:50px;image-rendering:pixelated;border-radius:10px;background:#DDE4D4}
.bdg b{font-size:12.5px;font-weight:600;line-height:1.2}
.bdg span{font-size:11px;color:var(--label2);line-height:1.25}
.bdg.on{box-shadow:inset 0 0 0 2px var(--tint)}
.bdg.on span{color:var(--tint-ink);font-weight:600}
.bdg.locked{cursor:default}
.bdg.locked canvas{filter:grayscale(1);opacity:.35}
.bdg.locked b{color:var(--label2)}
.bdg:not(.locked):active{transform:scale(.97)}
.g-row.hist{grid-template-columns:62px 1fr auto 40px}
.g-row.hist b{text-align:right;color:var(--tint-ink);font-size:13px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;font-size:14px}
.switch-row input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--fill2);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.switch-row input::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch-row input:checked{background:var(--tint)}
.switch-row input:checked::after{transform:translateX(18px)}

/* ================================================================ Kiosk: face sign-in (the only way to identify) */
.kio-face{grid-column:1/-1;display:flex;align-items:center;gap:5cqw;padding-left:4cqw}
.kio-finder{position:relative;width:24cqw;aspect-ratio:1;border-radius:3cqw;background:#F2F2F7;overflow:hidden;flex:none}
.kio-finder svg{position:absolute;inset:8%;width:84%;height:84%;fill:none;stroke:#34C759;stroke-width:3.2;stroke-linecap:round}
.kio-finder .head{stroke:#C7C7CC;stroke-width:2.2}
.kio-sweep{position:absolute;left:12%;right:12%;height:.3cqw;border-radius:9px;background:#34C759;box-shadow:0 0 1.4cqw .4cqw rgba(52,199,89,.45);animation:ksweep 1.1s ease-in-out infinite alternate}
@keyframes ksweep{from{top:16%}to{top:84%}}
.a-scan{transform-box:fill-box;transform-origin:center}
.kstep.on .a-scan{animation:kscan 1.3s ease-in-out infinite alternate}
@keyframes kscan{from{transform:translateY(-9px)}to{transform:translateY(9px)}}
.face-ic{width:52px;height:52px;border-radius:14px;background:var(--tint-soft);color:var(--tint-ink);display:grid;place-items:center;flex:none}
.face-ic svg{width:30px;height:30px}
.kio-face > div:last-child{display:flex;flex-direction:column;gap:1.4cqw}

/* ================================================================ Loopi Care (hospital) + Loopi Kids (kindergarten) */
.chip.plain{padding:7px 14px}
.demo-box{display:flex;flex-direction:column;gap:8px;background:var(--bg2);border-radius:14px;padding:12px;box-shadow:var(--shadow-s)}
.demo-box label{font-size:12px;font-weight:600;color:var(--label2)}
.care-icon{background:linear-gradient(145deg,#E8F3FF,#CFE3F7)}
.kids-icon{background:linear-gradient(145deg,#FFF4D6,#FFE1A8)}
.phone-tabs.three{grid-template-columns:repeat(3,1fr)}
.phone-tabs.two{grid-template-columns:repeat(2,1fr)}
.care .phone-tabs button[aria-selected="true"]{color:var(--blue)}
.care-alert{display:flex;gap:10px;align-items:flex-start;background:var(--orange-soft);color:var(--label);border-radius:14px;padding:11px 14px;font-size:13.5px;line-height:1.4;flex:none}
.care-alert svg{width:20px;height:20px;color:var(--orange);flex:none;margin-top:1px}
.care-alert.ok{background:var(--tint-soft)}
.care-alert.ok svg{color:var(--tint-ink)}
.group.companion{flex-direction:row;align-items:center;gap:14px;padding:14px}
.group.companion > * + *{border-top:0}
.group.companion canvas{width:84px;height:70px;image-rendering:pixelated;border-radius:14px;background:#DDE4D4;flex:none}
.group.companion b{display:block;font-size:15px}
.group.companion span{font-size:13.5px;color:var(--label2);line-height:1.35}
.meal-dots{display:flex;align-items:center;gap:5px;margin-top:8px}
.meal-dots i{width:22px;height:8px;border-radius:999px;background:var(--fill2)}
.meal-dots i.on{background:var(--tint)}
.meal-dots i.part{background:var(--orange)}
.meal-dots small{font-size:12px;color:var(--label2);margin-left:6px}
.group.pad{padding:6px 14px 12px}
.group.pad > * + *{border-top:0}
.hrow.wide{grid-template-columns:62px minmax(0,1fr) auto;margin-top:8px}
.hrow.wide b{font-size:13px;white-space:nowrap}
.hrow.wide b small{font-weight:500;color:var(--label3);font-size:11.5px}
.rep-head{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.rep-head > * + *{border-top:0}
.rep-head b{display:block;font:700 18px var(--font-d);letter-spacing:-.02em}
.rep-head span:not(.pill){font-size:12.5px;color:var(--label2)}
.rep-kpis{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.rep-kpis b{display:block;font:700 22px var(--font-d);letter-spacing:-.02em}
.rep-kpis span{font-size:12.5px;color:var(--label2)}
.finding{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:start;padding:10px 14px;font-size:14px;line-height:1.4}
.finding i{width:8px;height:8px;border-radius:50%;margin-top:6px}
.g-row.two-col{grid-template-columns:minmax(0,1fr) auto}
.g-row.two-col .g-v{max-width:220px;white-space:normal}
.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{padding:12px 14px}
.note > * + *{border-top:0}
.note p{font-size:14.5px;line-height:1.45}
.note span{display:block;font-size:12px;color:var(--label2);margin-top:6px}
.gate-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gate-opts .btn{font-size:22px;padding:14px 0;border-radius:16px}
/* kids: bigger, rounder, fewer words */
.kids .phone-tabs button[aria-selected="true"]{color:#FF9F0A}
.kid-actions button{padding:14px 4px;border-radius:20px;font-size:14px}
.kid-actions button svg{width:34px;height:34px;color:#FF9F0A}
.kid-actions button.hot{background:#FF9F0A;color:#fff}
.kid-actions button.hot svg{color:#fff}
.rainbow,.stickers{padding:14px;gap:10px;align-items:center;text-align:center}
.rainbow > * + *,.stickers > * + *{border-top:0}
.rainbow b,.stickers b{font:700 17px var(--font-d)}
.rainbow > span{font-size:14px;color:var(--label2)}
.rb-dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rb{width:40px;height:40px;border-radius:50%;border:3px dashed color-mix(in srgb,var(--c) 70%,transparent);display:grid;place-items:center;color:#fff}
.rb.on{background:var(--c);border:3px solid var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.rb svg{width:20px;height:20px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.sticker{display:flex;flex-direction:column;align-items:center;gap:3px}
.st-food{position:relative;width:48px;height:48px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--e),0 3px 8px rgba(0,0,0,.18);transform:rotate(-6deg)}
.st-food i{position:absolute;top:17px;width:5px;height:6px;border-radius:50%;background:#1D1D1F}
.st-food i:first-child{left:15px}.st-food i:nth-child(2){right:15px}
.st-food em{position:absolute;left:50%;top:27px;width:12px;height:6px;margin-left:-6px;border-bottom:2.5px solid #1D1D1F;border-radius:0 0 12px 12px}
.sticker small{font-size:12px;font-weight:600;text-transform:capitalize}
.sticker .stars{font-size:11px;color:#FFB800;letter-spacing:1px;min-height:14px}
.sticker.empty .st-food{background:var(--fill2);box-shadow:0 0 0 3px var(--bg2),0 0 0 4.5px var(--fill3);transform:none}
.sticker.empty .st-food i,.sticker.empty .st-food em{opacity:.25}
.sticker.empty small{color:var(--label3)}
@media print{.stu-side,.phone-tabs,.demo-switch,.phone-top,.two-btn{display:none!important}.phone{box-shadow:none!important;height:auto!important;overflow:visible!important}.phone-body{overflow:visible!important}}
.grow-btn{background:#FF9F0A;animation:pop .5s ease-out}
.grow-btn:hover{background:#F08F00}
/* Kitchen: carbon breakdown */
.cstack{display:flex;height:14px;border-radius:999px;overflow:hidden;margin-top:14px;gap:2px}
.cstack i{display:block;height:100%}
.clist{display:flex;flex-direction:column;margin-top:10px}
.clist div{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:.5px solid var(--sep);font-size:14px}
.clist div:last-child{border-bottom:0}
.clist b{font-weight:600}
.clist .dot{width:10px;height:10px}

/* ================================================================ Loopi Work (office cafeterias) */
.work-icon{background:linear-gradient(145deg,#EEF0FF,#D6DAF7)}
.work .phone-tabs button[aria-selected="true"]{color:var(--indigo)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--indigo);color:#fff;display:grid;place-items:center;font:700 13px var(--font);flex:none}
.demo-box .check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--label)}
.demo-box .check input{width:18px;height:18px;accent-color:var(--tint)}
.pick{padding:0}
.pick > * + *{border-top:.5px solid var(--sep)}
.pick-head{display:flex;flex-direction:column;gap:3px;padding:14px}
.pick-head .pill{align-self:flex-start;margin-bottom:4px}
.pick-head b{font:700 20px var(--font-d);letter-spacing:-.02em}
.pick-head > span:last-child{font-size:13px;color:var(--label2)}
.tweaks{list-style:none;margin:0;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.tweaks li{display:flex;gap:8px;align-items:center;font-size:14px}
.tweaks svg{width:16px;height:16px;color:var(--tint);flex:none}
.pad-in{padding:4px 14px 12px}
.fit{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.fit.good{background:var(--tint-soft);color:var(--tint-ink)}
.fit.ok{background:rgba(0,122,255,.12);color:var(--blue)}
.fit.mid{background:var(--orange-soft);color:var(--orange)}
.fit.bad{background:var(--red-soft);color:var(--red)}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal-opt{border:0;background:var(--bg2);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow-s);font:inherit;color:inherit}
.goal-opt b{font-size:15px}
.goal-opt span{font-size:12px;color:var(--label2);line-height:1.35}
.goal-opt.on{box-shadow:inset 0 0 0 2px var(--indigo);background:color-mix(in srgb,var(--indigo) 8%,var(--bg2))}
.form > * + *{border-top:.5px solid var(--sep)}
.f-row{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;padding:9px 14px;font-size:14px}
.f-row.col{grid-template-columns:1fr;gap:8px}
.f-row input{font:inherit;width:100%;padding:8px 10px;border-radius:10px;border:0;background:var(--fill);color:var(--label);text-align:right}
.finding b{font-weight:600}

/* ================================================================ Visual toolkit (js/visual.js) */
.loopi{display:block;overflow:visible;flex:none}
.loopi .lp-body{animation:lpbob 3.2s ease-in-out infinite;transform-origin:60px 120px}
.loopi .lp-eye{animation:lpblink 5.5s infinite;transform-box:fill-box;transform-origin:center}
.loopi .lp-wave{animation:lpwave 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
.loopi .lp-leaf{animation:lpleaf 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
.lp-cheer .lp-body{animation:lpjump 1.4s ease-in-out infinite}
@keyframes lpbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes lpjump{0%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}55%{transform:translateY(0)}}
@keyframes lpblink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes lpwave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
@keyframes lpleaf{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
.guide{display:flex;align-items:flex-end;gap:10px;flex:none}
.guide .bubble{position:relative;flex:1;min-width:0;background:var(--bg2);border-radius:20px 20px 20px 6px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.guide .bubble p{margin:0;font-size:15px;line-height:1.4;font-weight:500;flex:1}
.guide.big .bubble p{font-size:17px}
.guide .speak{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--tint);color:#fff;display:grid;place-items:center}
.guide .speak svg{width:18px;height:18px}
/* food + tray */
svg.food{display:block}
.vtray{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:8px;padding:10px;border-radius:22px;background:linear-gradient(145deg,#EEF1F3,#DDE2E6);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(0,0,0,.06)}
.vcell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:16px;background:rgba(255,255,255,.72);box-shadow:inset 0 1px 3px rgba(0,0,0,.06);text-align:center;color:#1D1D1F}
.vcell.hi{background:#fff;box-shadow:0 0 0 2.5px var(--tint),0 6px 16px -6px rgba(52,199,89,.5)}
.vcell span{font-size:11.5px;font-weight:600;line-height:1.2}
.vcell b{font-size:13px;color:#3A3A3C}
.vcell em{font-style:normal;font-size:10.5px;font-weight:700;color:#fff;background:var(--tint);border-radius:999px;padding:1px 7px}
.vfood{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#fff;position:relative}
.vfood.scored{background:conic-gradient(var(--c) calc(var(--p) * 1%),#E5E5EA 0)}
.vfood.scored::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
.vfood .food{position:relative}
/* My Healthy Plate */
.hplate{display:grid;grid-template-columns:auto auto 1fr;gap:4px 14px;align-items:center}
.hplate figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.hplate figcaption{font-size:11.5px;font-weight:600;color:var(--label2)}
.hplate .ideal{opacity:.85}
.hlegend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.hlegend li{display:grid;grid-template-columns:10px 1fr auto;column-gap:6px;align-items:center}
.hlegend i{width:10px;height:10px;border-radius:3px}
.hlegend b{font-size:13px}
.hlegend small{grid-column:2 / 4;color:var(--label3);font-size:11px;margin-top:-3px}
.hverdict{grid-column:1 / -1;margin:6px 0 0;font-size:13.5px;font-weight:500;background:var(--fill);border-radius:12px;padding:8px 11px}
@media (max-width:420px){.hplate{grid-template-columns:auto 1fr}.hplate .ideal{display:none}}
/* rings */
.vrings{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:10px}
.vring{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.vr{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--fill2) 0);display:grid;place-items:center;position:relative}
.vr::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg2)}
.vr > div{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.vr b{font:700 18px var(--font-d);letter-spacing:-.02em}
.vr small{font-size:10.5px;color:var(--label3)}
.vring > span{font-size:12.5px;font-weight:600;color:var(--label2)}
/* week of plates */
.vweek{display:flex;justify-content:space-between;gap:6px}
.vweek > div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.vweek i{width:100%;max-width:46px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--fill2) 0);position:relative;box-shadow:0 0 0 3px var(--bg2),0 0 0 4px var(--sep)}
.vweek i::after{content:"";position:absolute;inset:30%;border-radius:50%;background:var(--bg2)}
.vweek b{font-size:12px}
.vweek span{font-size:11px;color:var(--label3);font-weight:600}
.vweek .today span{color:var(--tint-ink)}
/* tips */
.vicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--ic) 14%,transparent);color:var(--ic)}
.vicon svg{width:22px;height:22px}
.vtip{display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.vtip b{display:block;font-size:14.5px;line-height:1.3}
.vtip span{display:block;font-size:13px;color:var(--label2);line-height:1.4;margin-top:2px}
.vcard{background:var(--bg2);border-radius:20px;padding:16px;box-shadow:var(--shadow-s);flex:none}
.vcard > h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.vcard > h3 small{font:500 12px var(--font);color:var(--label3)}
.vtips{background:var(--bg2);border-radius:20px;box-shadow:var(--shadow-s);overflow:hidden;flex:none}
.vtips > * + *{border-top:.5px solid var(--sep)}

/* ================================================================ warm, always-light theme for the children's apps */
.warm{--bg:#FFF6EA;--bg2:#FFFFFF;--fill:#FFF1DE;--fill2:#F3E6D2;--fill3:#E4D3BA;--label:#2B2118;--label2:#7A6A58;--label3:#A8977F;--sep:rgba(120,90,50,.14);--tint:#3DB85A;--tint-ink:#2B8C43;--tint-soft:#E3F6E5;--bar2:rgba(255,250,242,.9);--shadow-s:0 2px 10px rgba(120,80,30,.07);color-scheme:light;color:var(--label)}
.warm .phone{background:var(--bg)}
.warm .phone-top{background:rgba(255,250,242,.92)}
.warm .phone-tabs{background:rgba(255,250,242,.94)}
.warm .phone-tabs button[aria-selected="true"]{color:var(--tint-ink)}
.warm .seg{background:var(--fill2)}
.warm .seg button[aria-pressed="true"]{background:#fff}
.warm .btn{background:var(--fill);color:var(--label)}
.warm .btn.primary{background:var(--tint);color:#fff}
.warm .vr::before{background:#fff}
.warm .vweek i::after{background:#fff}
/* ================================================================ Loopi (students) */
.av-circle{border-radius:50%;background:var(--av);color:#fff;display:inline-grid;place-items:center;font-weight:700;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.loopi-icon svg{display:block}
.journey{list-style:none;margin:0;padding:12px 8px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg2);border-radius:20px;box-shadow:var(--shadow-s);position:relative;flex:none}
.journey li{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.journey li + li::before{content:"";position:absolute;top:19px;right:calc(50% + 22px);width:calc(100% - 44px);height:3px;border-radius:3px;background:var(--fill2)}
.journey li.done + li::before,.journey li.done + li.done::before{background:var(--tint)}
.journey span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--label3)}
.journey span svg{width:20px;height:20px}
.journey li.now span{background:#fff;color:var(--tint-ink);box-shadow:0 0 0 3px var(--tint);animation:pulse 1.8s ease-in-out infinite}
.journey li.done span{background:var(--tint);color:#fff}
.journey small{font-size:11px;font-weight:600;color:var(--label2);line-height:1.2}
.journey li.now small{color:var(--label)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--tint)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--tint) 25%,transparent)}}
.tries{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tries div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:var(--fill);font-size:12px;font-weight:600;color:var(--label3)}
.tries div .food{filter:grayscale(1);opacity:.35}
.tries div.on{background:var(--tint-soft);color:var(--tint-ink)}
.tries div.on .food{filter:none;opacity:1}
.goalbar{height:14px;border-radius:999px;background:var(--fill2);overflow:hidden;position:relative}
.goalbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFB23F,var(--tint))}
.goalbar.done i{background:var(--tint)}
.podium2{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;flex:none}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pod b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod small{font-size:11.5px;color:var(--label2)}
.pod .step{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:center;font:700 20px var(--font-d);color:#fff;margin-top:4px}
.pod.p1 .step{height:70px;background:linear-gradient(180deg,#F7C948,#E0A800)}
.pod.p2 .step{height:48px;background:linear-gradient(180deg,#C9CED4,#9EA4AB)}
.pod.p3 .step{height:36px;background:linear-gradient(180deg,#E6A673,#C27C3E)}
.warm .lb{background:var(--bg2);box-shadow:var(--shadow-s)}
.warm .lb-row.me{background:var(--tint-soft)}
.lb-row .av-circle{justify-self:center}
.schools{padding:6px 14px}
.sch-row{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--sep)}
.sch-row:last-child{border-bottom:0}
.sch-row > span{color:var(--label3);font-weight:700;text-align:center}
.sch-row b{font-size:14px}
.sch-row.us b:first-child{color:var(--tint-ink)}
.sbar{height:8px;border-radius:999px;background:var(--fill2);margin-top:5px;overflow:hidden}
.sbar i{display:block;height:100%;border-radius:999px;background:var(--tint)}
.profile2{display:flex;align-items:center;gap:14px}
.profile2 b{display:block;font:700 22px var(--font-d);letter-spacing:-.02em}
.profile2 span{font-size:13px;color:var(--label2)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none}
.statgrid div{background:var(--bg2);border-radius:18px;padding:12px;box-shadow:var(--shadow-s);display:flex;flex-direction:column;gap:6px}
.statgrid b{font:700 24px var(--font-d);letter-spacing:-.02em;line-height:1}
.statgrid span{font-size:12px;color:var(--label2);line-height:1.25}
.hist2{display:flex;flex-direction:column}
.hist2 div{display:grid;grid-template-columns:30px 1fr auto 40px;gap:10px;align-items:center;padding:8px 0;border-bottom:.5px solid var(--sep);font-size:14px}
.hist2 div:last-child{border-bottom:0}
.hist2 i{width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--tint) calc(var(--p) * 1%),var(--fill2) 0);position:relative}
.hist2 i::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg2)}
.hist2 b{font-size:13px;color:var(--label2);font-weight:500}
.hist2 em{font-style:normal;font-weight:700;color:var(--tint-ink);font-size:13px;text-align:right}
.phone-top .av-circle{box-shadow:none}
/* ================================================================ Loopi Kids */
.kidcard h3{font-size:18px}
.kids .vcell span{font-size:12.5px}
.rb-dots.big{gap:10px}
.rb-dots.big .rb{width:46px;height:46px}
.kidline{text-align:center;margin:10px 0 0;font-size:15px;font-weight:600;color:var(--label2)}
.note2{background:#FFF9E8;border:1px dashed #E8CF8A}
.note2 p{margin:0;font-size:15px;line-height:1.45;font-style:italic}
.note2 span{display:block;margin-top:6px;font-size:12.5px;color:var(--label2)}
.kio-left .loopi{width:24cqw;height:auto}
/* ================================================================ Loopi Care visuals */
.meals3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mealc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 12px;border-radius:16px;background:var(--fill);text-align:center}
.mealc.next{background:var(--bg2);box-shadow:inset 0 0 0 2px var(--blue)}
.mealc-top{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.mealc-top b{font-size:13.5px}
.mealc-top small{font-size:11px;color:var(--label3)}
.mealc-food{display:flex;flex-wrap:wrap;justify-content:center;gap:0;max-width:64px}
.mealc-ring{width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--fill2) 0);display:grid;place-items:center;position:relative}
.mealc-ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg2)}
.mealc-ring b{position:relative;font-size:13px}
.mealc-wait{width:52px;height:52px;border-radius:50%;border:2px dashed var(--fill3);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--label3)}
.mealc.next .mealc-wait{border-color:var(--blue);color:var(--blue)}
.mealc > span{font-size:11px;color:var(--label2);line-height:1.25}
.vtips.alert{background:var(--orange-soft)}
.leftlist{display:flex;flex-direction:column}
.leftlist div{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:.5px solid var(--sep);font-size:14px}
.leftlist div:last-child{border-bottom:0}
.leftlist b{font-size:13px;color:#E4674B}
/* the tray in dark mode (the children's apps stay light) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) :not(.warm) > .vcard .vtray,:root:not([data-theme="light"]) .vcard:not(.warm .vcard) .vtray{background:linear-gradient(145deg,#2C2C2E,#232325);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  :root:not([data-theme="light"]) .vcard:not(.warm .vcard) .vcell{background:rgba(255,255,255,.06);color:var(--label);box-shadow:none}
  :root:not([data-theme="light"]) .vcard:not(.warm .vcard) .vcell b{color:var(--label2)}
  :root:not([data-theme="light"]) .vcard:not(.warm .vcard) .vfood.scored::before{background:#2C2C2E}
  :root:not([data-theme="light"]) .vcard:not(.warm .vcard) .vfood{background:#3A3A3C}
  :root:not([data-theme="light"]) .hverdict{background:var(--fill)}
}
/* ================================================================ Loopi Work visuals */
.pick2 .vtray{margin-bottom:10px}
.pick2 .tweaks{padding:0 2px 12px}
.lines2{display:flex;flex-direction:column}
.lines2 > div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:.5px solid var(--sep)}
.lines2 > div:last-child{border-bottom:0}
.lines2 b{display:block;font-size:14px}
.lines2 small{font-size:12px;color:var(--label2)}
.lthumbs{display:flex;background:var(--fill);border-radius:12px;padding:3px 4px}
.lthumbs .food{margin:0 -3px}
.goal-opt .vicon{margin-bottom:4px}
.phone-body > *{flex-shrink:0}
.warm .seg button[aria-pressed="true"]{background:#fff!important;color:var(--label);box-shadow:0 1px 3px rgba(120,80,30,.15)}
.warm .seg button{color:var(--label2)}
/* ================================================================ Loopi (teens and uni): Tamagotchi screens */
.petstats{background:var(--bg2);border-radius:20px;box-shadow:var(--shadow-s);overflow:hidden;flex:none}
.petstats > div{display:grid;grid-template-columns:38px 58px 1fr auto;gap:10px;align-items:center;padding:9px 14px}
.petstats > div + div{border-top:.5px solid var(--sep)}
.petstats span{font-size:14px;color:var(--label2)}
.petstats b{font-size:13px;color:var(--label2)}
.petstats .pips i{width:15px;height:15px;border-radius:5px}
.growcard .stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.growcard .stages div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--label3)}
.growcard .stages canvas{width:56px;height:47px;image-rendering:pixelated;border-radius:12px;background:#DDE4D4;opacity:.45;filter:grayscale(.6)}
.growcard .stages .past canvas{opacity:.8;filter:none}
.growcard .stages .now canvas{opacity:1;filter:none;box-shadow:0 0 0 3px var(--tint)}
.growcard .stages .now{color:var(--tint-ink)}
.growcard p{margin:0;font-size:13.5px;color:var(--label2);line-height:1.4}
.growcard p b{color:var(--label)}
.petguide canvas{width:84px;height:70px;image-rendering:pixelated;border-radius:18px;background:#DDE4D4;flex:none;margin-bottom:18px}
.pfpet{width:84px;height:70px;image-rendering:pixelated;border-radius:16px;background:#DDE4D4;flex:none}
.pod canvas{image-rendering:pixelated;border-radius:12px;background:#DDE4D4}

/* ================================================================ Loopi game: kitchen, wardrobe, barn */
.phone-tabs.five{grid-template-columns:repeat(5,1fr)}
.phone-top .gems{display:inline-flex;align-items:center;gap:4px;background:var(--fill);border-radius:999px;padding:4px 10px 4px 7px;font-weight:600;font-size:14px;margin-left:8px}
.gems{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.gem{width:15px;height:15px;flex:none;vertical-align:-2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .btn{border-radius:14px;padding:10px;justify-content:flex-start}
.two .btn .vicon{width:30px;height:30px;border-radius:9px}
.two .btn .vicon svg{width:18px;height:18px}
.snackrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.snk{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:var(--fill);border-radius:14px;padding:9px 11px;text-align:left;font:inherit;color:inherit;min-width:120px}
.snk.golden{background:linear-gradient(145deg,#FFF3C4,#FFE08A);color:#5A4300;box-shadow:inset 0 0 0 1.5px #F2C94C}
.snk-ic{display:flex;margin:-2px -3px 2px}
.snk-ic svg.food{margin-right:-4px}
.snk b{font-size:13.5px}
.snk small{font-size:12px;color:var(--tint-ink);font-weight:600}
.snk:active{transform:scale(.97)}
.eggbtn{display:flex;gap:10px;align-items:center;justify-content:center;background:var(--bg2);box-shadow:var(--shadow-s)}
.egg-ic,.egg-reveal{display:inline-block;width:22px;height:28px;border-radius:50% 50% 46% 46% / 58% 58% 42% 42%;background:radial-gradient(circle at 35% 30%,#fff,var(--egg) 70%);box-shadow:inset 0 -3px 5px rgba(0,0,0,.12)}
.egg-reveal{display:block;width:84px;height:108px;margin:6px auto 4px;animation:pop .5s ease-out}
.egg-ic.common,.egg-reveal.common{--egg:#E9E4D8}.egg-ic.rare,.egg-reveal.rare{--egg:#8CC4F5}.egg-ic.epic,.egg-reveal.epic{--egg:#C79AF0}.egg-ic.legendary,.egg-reveal.legendary{--egg:#F7C948}
.rar{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--fill);color:var(--label2)}
.rar-rare{background:rgba(0,122,255,.12);color:var(--blue)}
.rar-epic{background:rgba(175,82,222,.14);color:var(--purple)}
.rar-legendary{background:rgba(255,204,0,.2);color:#B38600}
/* kitchen */
.pantry{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pan{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px;border-radius:14px;background:var(--fill);border:0;font:inherit;color:inherit;text-align:center}
.pan b{font:700 17px var(--font-d)}
.pan small{font-size:11px;color:var(--label2);line-height:1.2}
button.pan:hover{background:var(--fill2)}
button.pan:active{transform:scale(.95)}
button.pan:disabled{opacity:.35;cursor:not-allowed}
.oven2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:linear-gradient(180deg,#3A3A3C,#2C2C2E);border-radius:18px;padding:10px;box-shadow:inset 0 2px 8px rgba(0,0,0,.4)}
.slot2{aspect-ratio:1;border-radius:12px;background:radial-gradient(circle at 50% 70%,#5A3A2A,#3A2A22);box-shadow:inset 0 2px 6px rgba(0,0,0,.5);display:grid;place-items:center;position:relative}
.slot2 > span{color:rgba(255,255,255,.25);font:700 16px var(--font-d)}
.slot2 em{position:absolute;bottom:3px;font:600 9px var(--font);font-style:normal;color:#8BE0A4}
.oven-msg{min-height:20px;margin:10px 0;font-size:13.5px;color:var(--label2)}
.recipes2{display:flex;flex-direction:column;gap:8px}
.rcp{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--fill);border-radius:14px;padding:8px 10px}
.rcp b{display:block;font-size:14px}
.rcp small{font-size:12px;color:var(--label2)}
.rcp.locked .seq2{filter:grayscale(1);opacity:.45}
.seq2{display:flex;align-items:center}
.seq2 i{font-style:normal;color:var(--label3);margin:0 1px;font-size:12px}
.binbox{display:flex;flex-wrap:wrap;gap:2px;min-height:44px;padding:8px;border-radius:14px;background:linear-gradient(180deg,#6B4A2B,#4A3220)}
.binbox .hint{color:#E8D6BE}
.catch-wrap{position:relative;border-radius:16px;overflow:hidden;touch-action:none}
.catch-wrap canvas{display:block;width:100%;height:auto;image-rendering:pixelated;aspect-ratio:5/6}
.catch-hud{position:absolute;top:8px;left:10px;right:10px;font:600 13px var(--font);color:#1D1D1F}
.catch-hud span{color:var(--red);letter-spacing:2px}
.catch-cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);color:#1D1D1F;text-align:center;padding:18px}
.catch-cover .btn{width:auto;padding-inline:36px}
.catch-cover small{font-size:12px;color:#3A3A3C;max-width:30ch}
.catch-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.catch-ctrl .btn{font-size:17px;user-select:none;touch-action:none;border-radius:14px}
.got2{display:flex;flex-direction:column;gap:6px}
.got2 > div{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:12px;padding:6px 10px;font-size:14px}
.cardic{width:24px;height:30px;border-radius:5px;background:linear-gradient(145deg,#F7E3A1,#E8C25C);box-shadow:inset 0 0 0 2px #fff,0 1px 3px rgba(0,0,0,.2)}
/* sheets */
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;animation:sheetin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet header{display:flex;align-items:center;gap:10px;padding:54px 16px 12px;background:var(--bar2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep)}
.sheet header h3{flex:1;font-size:20px;font-weight:700}
.sheet-body{flex:1;overflow-y:auto;padding:14px 14px 24px;display:flex;flex-direction:column;gap:12px}
.sheet-body > *{flex-shrink:0}
.crates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.crate{border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;background:var(--bg2);box-shadow:var(--shadow-s)}
.crate-box{width:40px;height:32px;border-radius:6px;background:linear-gradient(180deg,#C8904F 0 30%,#A8733A 30%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.15);margin-bottom:4px;position:relative}
.crate-box::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:rgba(255,255,255,.25)}
.crate-epic .crate-box{background:linear-gradient(180deg,#B57AE6 0 30%,#8E4FC7 30%)}
.crate-legendary .crate-box{background:linear-gradient(180deg,#F7D35A 0 30%,#E0A800 30%)}
.crate b{font-size:13px}
.crate small{font-size:10.5px;color:var(--label2)}
.acc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acc{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:var(--bg2);border-radius:16px;padding:9px 4px;font:inherit;color:inherit;box-shadow:var(--shadow-s)}
.acc canvas{width:62px;height:52px;image-rendering:pixelated;border-radius:10px;background:#DDE4D4}
.acc b{font-size:12.5px}
.acc.locked{cursor:default}
.acc.locked canvas{filter:grayscale(1) brightness(.75);opacity:.45}
.acc.on{box-shadow:0 0 0 2px var(--tint)}
.barn-total{display:flex;justify-content:space-between;align-items:center;background:var(--tint-soft);border-radius:14px;padding:12px 14px;font-weight:600}
.barn-total b{font:700 22px var(--font-d)}
.barn{display:flex;flex-direction:column;gap:6px}
.barn-pet{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--bg2);border-radius:14px;padding:7px 10px;box-shadow:var(--shadow-s)}
.barn-pet.active{box-shadow:inset 0 0 0 1.5px var(--tint)}
.barn-pet canvas{width:56px;height:47px;image-rendering:pixelated;border-radius:10px;background:#DDE4D4}
.barn-pet b{display:block;font-size:14px}
.barn-pet small{font-size:12px;color:var(--label2)}
@media (max-width:760px){.sheet{position:fixed;z-index:60}.sheet header{padding-top:16px}}

/* ================================================================ Loopi Kids v2: animated scene, sounds, parents + teachers */
.mute{margin-left:auto;width:40px;height:40px;border-radius:50%;border:0;background:var(--fill);color:var(--tint-ink);display:grid;place-items:center}
.mute svg{width:22px;height:22px}
.kscene{position:relative;height:300px;border-radius:26px;overflow:hidden;flex:none;background:linear-gradient(180deg,#8FD3FF 0%,#C9ECFF 55%,#E8F7FF 100%);box-shadow:var(--shadow-s)}
.k-sun{position:absolute;right:22px;top:18px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle,#FFE36B 55%,#FFC93C 56%);box-shadow:0 0 0 10px rgba(255,217,90,.28),0 0 0 22px rgba(255,217,90,.14);animation:ksun 6s ease-in-out infinite}
@keyframes ksun{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.k-cloud{position:absolute;width:72px;height:24px;border-radius:999px;background:#fff;opacity:.92;animation:kcloud linear infinite}
.k-cloud::before,.k-cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.k-cloud::before{width:32px;height:32px;left:12px;top:-15px}
.k-cloud::after{width:24px;height:24px;left:36px;top:-10px}
.k-cloud.c1{top:34px;animation-duration:28s;animation-delay:-6s}
.k-cloud.c2{top:88px;transform:scale(.7);animation-duration:36s;animation-delay:-20s}
.k-cloud.c3{top:58px;transform:scale(.85);animation-duration:44s;animation-delay:-33s}
@keyframes kcloud{from{left:-90px}to{left:110%}}
.k-hill{position:absolute;bottom:-40px;border-radius:50%}
.k-hill.h1{left:-20%;width:90%;height:120px;background:#7ED67A}
.k-hill.h2{right:-25%;width:95%;height:140px;background:#5CC26A}
.k-bubble{position:absolute;left:14px;right:14px;top:14px;background:#fff;border-radius:22px;padding:12px 12px 12px 16px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 6px 18px rgba(0,60,120,.12);animation:kpop .45s cubic-bezier(.2,1.4,.4,1)}
.k-bubble::after{content:"";position:absolute;left:50%;bottom:-10px;width:20px;height:20px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:4px}
.k-bubble p{margin:0;flex:1;font:600 17px/1.35 var(--font);color:#2B2118}
.k-speak{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--tint);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 #2B8C43}
.k-speak svg{width:20px;height:20px}
.k-speak:active{transform:translateY(2px);box-shadow:0 1px 0 #2B8C43}
.k-loopi{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.k-loopi.boing{animation:kboing .6s cubic-bezier(.3,1.6,.4,1)}
@keyframes kboing{0%{transform:translateX(-50%) scale(1)}30%{transform:translateX(-50%) scale(1.15,.85)}60%{transform:translateX(-50%) scale(.92,1.1) translateY(-14px)}100%{transform:translateX(-50%) scale(1)}}
@keyframes kpop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.kfoods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kfood{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px 10px;border:0;border-radius:20px;background:#fff;box-shadow:0 4px 0 #EFE2CE,0 6px 14px rgba(120,80,30,.08);font:inherit;color:#2B2118;animation:kpop .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--d)}
.kfood b{font-size:13px;line-height:1.2}
.kfood:active{transform:translateY(3px);box-shadow:0 1px 0 #EFE2CE}
.kfood.try{box-shadow:0 0 0 3px var(--tint),0 4px 0 #2B8C43}
.kfood em{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--tint);border-radius:999px;padding:2px 9px;white-space:nowrap;animation:ktry 1.4s ease-in-out infinite}
@keyframes ktry{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}
.kf-pic{width:66px;height:66px;border-radius:50%;background:#FFF6EA;display:grid;place-items:center}
.kfood.wiggle .kf-pic{animation:kwig .5s ease-in-out}
@keyframes kwig{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.1)}50%{transform:rotate(10deg) scale(1.1)}75%{transform:rotate(-6deg)}}
.kstars{font-size:17px;letter-spacing:1px;color:#FFB800;line-height:1}
.kstars i{font-style:normal;color:#EADFCB}
.rbcard{text-align:center}
.rainbow2{width:100%;max-width:300px;display:block;margin:0 auto}
.rainbow2 .arc{stroke:#EDE3D2;stroke-dasharray:3 7}
.rainbow2 .arc.on{stroke:var(--c);stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:kdraw .6s ease-out forwards;animation-delay:calc(.35s + var(--i) * .42s)}
.rainbow2:not(.done) .arc{opacity:.9}
@keyframes kdraw{to{stroke-dashoffset:0}}
.rb-cloud circle{fill:#fff;stroke:#E6DCC8;stroke-width:1.5}
.confetti{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;z-index:5;animation:kfall linear forwards}
@keyframes kfall{to{transform:translate(var(--dx),330px) rotate(var(--r));opacity:.9}}
.role-seg{flex:none}
.role-seg button{padding:9px 10px;font-size:14px}
.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rkid{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border:0;border-radius:16px;background:var(--fill);font:inherit;color:inherit}
.rkid b{font-size:13px}
.rkid.on{background:#fff;box-shadow:0 0 0 2.5px var(--tint)}
.rkid.low{background:#FFF0EC}
.rring{width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--fill2) 0);display:grid;place-items:center;position:relative}
.rring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
.rring i{position:relative;font-style:normal;font-size:10.5px;font-weight:700}
.rwait{height:40px;display:grid;place-items:center;font-size:11px;color:var(--label3)}
.rkid .alg,.rkid .nt{position:absolute;top:6px;font-style:normal;font-size:9.5px;font-weight:700;border-radius:999px;padding:1px 6px}
.rkid .alg{right:6px;background:#FFE3DE;color:#C8321E}
.rkid .nt{left:6px;background:var(--tint-soft);color:var(--tint-ink)}
.vcard.focus{box-shadow:0 0 0 2px var(--tint),var(--shadow-s)}
.vcard.focus h3{justify-content:flex-start}
.vcard.focus h3 small{margin-left:auto}
.note-edit{display:flex;flex-direction:column;gap:6px;margin:12px 0 10px;font-size:13px;font-weight:600;color:var(--label2)}
.note-edit textarea{font:inherit;font-size:14px;font-weight:400;color:var(--label);border:0;border-radius:12px;background:var(--fill);padding:10px 12px;resize:vertical}

/* ================================================================ Lunch Rush: 3D first-person PS1-style canteen game */
body[data-app="lunch"]{background:#0B0D10}
.g3{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;box-sizing:border-box;background:#0B0D10}
.g3-view{position:relative;width:min(100%,calc((100vh - 70px) * 4 / 3));aspect-ratio:4/3;background:#000;overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px #22262C,0 30px 80px -30px #000;user-select:none;-webkit-user-select:none;touch-action:none}
.g3-view [hidden]{display:none!important}
#g3-cv{position:absolute;inset:0;width:100%;height:100%;outline:0;cursor:crosshair}

.g3-help{margin:0;max-width:720px;text-align:center;font:500 12px/1.5 var(--font);color:#7C828A}
.g3-view,.g3-view button{font-family:var(--font)}
.g3-hud{position:absolute;inset:0;pointer-events:none;color:#fff;text-shadow:2px 2px 0 #000}
.g3-hud button{pointer-events:auto}
.g3-obj{position:absolute;left:14px;top:12px;max-width:58%;display:flex;flex-direction:column;gap:3px;padding:8px 11px;background:rgba(10,14,20,.62);border-left:4px solid #FFD60A}
.g3-obj span{font-size:10px;letter-spacing:.14em;color:#FFD60A}
.g3-obj b{font-size:13px;font-weight:400;line-height:1.35}
.g3-cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;background:#fff;box-shadow:0 0 0 1px #000}
.g3-cross.on{width:14px;height:14px;margin:-7px 0 0 -7px;background:none;border:2px solid #34C759;box-shadow:0 0 0 1px #000}
.g3-prompt{position:absolute;left:50%;top:calc(50% + 26px);transform:translateX(-50%);white-space:nowrap;font-size:13px;padding:5px 10px;background:rgba(10,14,20,.66)}
.g3-prompt b{display:inline-block;min-width:18px;padding:1px 5px;margin-right:6px;background:#fff;color:#111;text-shadow:none;text-align:center;font-weight:400}
.g3-msg{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:max-content;max-width:84%;text-align:center;font-size:13px;line-height:1.45;padding:8px 14px;background:rgba(10,14,20,.72);border:2px solid #34C759;animation:g3in .25s steps(3)}
.g3-msg b{color:#FFD60A;font-weight:400}
@keyframes g3in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.g3-eat{position:absolute;right:12px;top:12px;width:190px;display:flex;flex-direction:column;gap:8px;padding:10px;background:rgba(10,14,20,.66)}
.g3-dishes{display:flex;flex-direction:column;gap:5px}
.g3-dishes div{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:7px;font-size:10.5px}
.g3-dishes i{width:10px;height:10px;box-shadow:0 0 0 1px #000}
.g3-dishes b{font-weight:400;color:#FFD60A}
.g3-eat button,.g3-use{border:0;padding:9px 10px;background:#34C759;color:#0B1A10;font-size:12px;box-shadow:0 3px 0 #1C7A34;cursor:pointer;text-shadow:none}
.g3-eat button:active,.g3-use:active{transform:translateY(2px);box-shadow:0 1px 0 #1C7A34}
.g3-mute{position:absolute;right:12px;bottom:12px;border:0;padding:5px 8px;font-size:10px;background:rgba(10,14,20,.66);color:#fff;cursor:pointer}
.g3-mute.off{color:#FF6B5E;text-decoration:line-through}
.g3-touch{position:absolute;inset:0;pointer-events:none}
.g3-stick{position:absolute;width:100px;height:100px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:none}
.g3-stick.on{display:block}
.g3-stick i{position:absolute;left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.45)}
.g3-use{position:absolute;right:16px;bottom:48px;width:72px;height:72px;border-radius:50%;font-size:14px;padding:0}
.g3-menu{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding:14px;background:rgba(6,8,12,.55);color:#fff;overflow:auto}
.g3-menu:empty{display:none}
.g3-panel{width:min(100%,460px);display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 20px;box-sizing:border-box;text-align:center;background:#12161C;border:2px solid #2C333C;box-shadow:6px 6px 0 #000}
.g3-panel h2{margin:0;font-size:20px;font-weight:400;letter-spacing:.06em;color:#FFD60A;text-shadow:2px 2px 0 #000}
.g3-panel p{margin:0}
.g3-logo{display:flex;flex-direction:column;align-items:center;gap:4px}
.g3-logo span{font-size:12px;letter-spacing:.3em;color:#34C759}
.g3-logo b{font-size:clamp(28px,7vw,42px);font-weight:400;line-height:1;color:#FFD60A;text-shadow:3px 3px 0 #B8321E,6px 6px 0 #000}
.g3-sub2{font-size:12px;color:#B8BEC6}
.g3-label{font-size:11px;letter-spacing:.2em;color:#7C828A}
.g3-say{font-size:14px;color:#E8F5EA}
.g3-tip{font-size:11px;line-height:1.5;color:#8E959E}
.g3-students{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.g3-students button,.g3-choices button{display:flex;flex-direction:column;gap:3px;align-items:center;padding:10px 6px;border:2px solid #2C333C;background:#1A2028;color:#fff;cursor:pointer;box-shadow:3px 3px 0 #000}
.g3-students button b,.g3-choices button b{font-size:13px;font-weight:400}
.g3-students button small,.g3-choices button small{font-size:9.5px;color:#8E959E}
.g3-students button:hover:not(:disabled),.g3-choices button:hover{border-color:#34C759;background:#1E2A22}
.g3-students button:disabled{opacity:.45;cursor:default}
.g3-choices{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g3-choices.two{grid-template-columns:repeat(2,1fr)}
.g3-link{border:0;background:none;padding:0;color:#34C759;text-decoration:underline;cursor:pointer;font-size:11px}
.g3-grade{width:78px;height:78px;display:grid;place-items:center;font-size:48px;border:3px solid currentColor;box-shadow:4px 4px 0 #000}
.g3-grade.gS{color:#FFD60A}.g3-grade.gA{color:#34C759}.g3-grade.gB{color:#5AC8FA}.g3-grade.gC{color:#FF9F0A}
.g3-stats{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.g3-stats div{display:flex;flex-direction:column;gap:3px;padding:8px 4px;background:#1A2028}
.g3-stats span{font-size:9.5px;color:#8E959E}
.g3-stats b{font-size:14px;font-weight:400;color:#fff}
@media (max-width:560px){.g3{padding:8px}.g3-view{aspect-ratio:auto;width:100%;height:calc(100svh - 90px)}.g3-obj{max-width:calc(100% - 28px)}.g3-obj b{font-size:11px}.g3-eat{top:auto;bottom:130px;right:8px;width:160px}.g3-choices{grid-template-columns:1fr}.g3-stats{grid-template-columns:repeat(2,1fr)}}

/* Lunch Rush v2: subtitles, choices, chapter card */
.g3-sub{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:min(86%,640px);text-align:center;pointer-events:auto;cursor:pointer;font:500 17px/1.45 var(--font);color:#fff;text-shadow:0 0 3px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.g3-sub b{font-weight:700;color:#FFE08A;margin-right:6px}
.g3-sub.amb{pointer-events:none;font-size:15px;opacity:.92}
.g3-sub.amb .g3-opts{display:none}
.g3-opts{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:10px}
.g3-opts button{font:500 14px/1.3 var(--font);color:#fff;background:rgba(8,10,14,.62);border:1px solid rgba(255,255,255,.28);padding:7px 14px;min-width:240px;text-align:left;cursor:pointer;text-shadow:none}
.g3-opts button:hover{background:rgba(43,140,67,.75);border-color:#7FE0A0}
.g3-opts button i{font-style:normal;display:inline-block;width:20px;color:#FFE08A;font-weight:700}
.g3-opts small{font:400 11px var(--font);color:rgba(255,255,255,.6);text-shadow:0 0 2px #000}
.g3-obj.pulse{animation:g3pulse 1.2s ease-out}
@keyframes g3pulse{0%{background:rgba(255,214,10,.45)}100%{background:rgba(10,14,20,.62)}}
.g3-card{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#000;color:#fff;font-family:Georgia,'Times New Roman',serif;transition:opacity 1.2s ease}
.g3-card.out{opacity:0}
.g3-card b{font-size:clamp(26px,5vw,40px);font-weight:400;letter-spacing:.08em}
.g3-card span{font-size:clamp(13px,2.4vw,17px);letter-spacing:.12em;color:#D8D2C4}
.g3-card small{font-size:12px;letter-spacing:.1em;color:#8E8A82;margin-top:10px}
.g3-prompt{top:calc(50% + 22px)}
@media (max-width:560px){.g3-sub{font-size:14px;bottom:128px;width:92%}.g3-opts button{min-width:0;width:100%}}
.g3-hud.focus .g3-prompt{top:auto;bottom:4%}.g3-hud.focus .g3-cross{display:none}.g3-hud.focus .g3-sub{bottom:12%}

/* Lunch Rush v3: clean type, quieter HUD */
.g3-hud{text-shadow:0 1px 3px rgba(0,0,0,.8)}
.g3-obj{border-left-width:3px;background:rgba(10,12,14,.45);padding:7px 11px}
.g3-obj span{font-size:10px;font-weight:600;letter-spacing:.16em}
.g3-obj b{font-size:14px;font-weight:500}
.g3-prompt{font-size:14px;background:rgba(10,12,14,.5);border-radius:4px}
.g3-prompt b{border-radius:3px;font-weight:700}
.g3-msg{font-size:14px;border-width:1px;border-color:rgba(255,255,255,.35);background:rgba(10,12,14,.55);border-radius:4px}
.g3-eat{background:rgba(10,12,14,.5);border-radius:4px}
.g3-dishes div{font-size:12px}
.g3-eat button,.g3-use{font-weight:700;border-radius:4px}
.g3-panel{border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6);border-color:#2A2F36}
.g3-panel h2{font-family:Georgia,'Times New Roman',serif;font-weight:400;text-shadow:none;color:#F2EBDD}
.g3-logo b{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:.06em;color:#F2EBDD;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.g3-logo span{font-weight:600}
.g3-students button,.g3-choices button{border-radius:4px;box-shadow:none}
.g3-students button b,.g3-choices button b{font-weight:600}
.g3-stats div{border-radius:4px}
.g3-grade{border-radius:6px;box-shadow:none;font-family:Georgia,'Times New Roman',serif}
.g3-mute{border-radius:4px}
.g3-cross{width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.g3-cross.on{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border:1.5px solid #7FE0A0;background:none;box-shadow:0 0 0 1px rgba(0,0,0,.45)}

/* ================================================================ motion (see PL.motion in core.js) */
@property --p{syntax:'<number>';inherits:true;initial-value:0}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
.toast.out{opacity:0;transform:translate(-50%,10px);transition:opacity .25s,transform .25s}
/* rings sweep round from zero when a view opens */
@keyframes ringfill{from{--p:0}}
[data-enter] .vr,[data-enter] .vweek i,[data-enter] .hist2 i,[data-enter] .vfood.scored{animation:ringfill 1s cubic-bezier(.2,.8,.2,1) .15s backwards}
/* everything you can press gives a little */
.btn,.chip,.seg button,.phone-tabs button,.kit-side button,.demo-switch button,.kio-done{transition:transform .14s cubic-bezier(.3,.7,.4,1.4),background .15s,color .15s,box-shadow .2s,opacity .15s}
.btn:active:not(:disabled),.chip:active,.seg button:active,.kit-side button:active,.kio-done:active{transform:scale(.95)}
.phone-tabs button:active svg{transform:scale(.86)}
.phone-tabs button svg{transition:transform .18s}
.phone-tabs button[aria-selected="true"] svg{animation:tabpop .42s cubic-bezier(.3,.7,.4,1.6)}
@keyframes tabpop{0%{transform:scale(.8)}60%{transform:scale(1.14) translateY(-2px)}100%{transform:none}}
@media (hover:hover){
  .vcard,.card,.kpi{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
  .kit-main .card:hover,.kit-main .kpi:hover{transform:translateY(-2px);box-shadow:0 8px 24px -12px rgba(0,0,0,.25)}
}
/* a soft shimmer for things that are loading or being measured */
.pl-shimmer{background:linear-gradient(100deg,var(--fill) 30%,var(--fill2) 50%,var(--fill) 70%);background-size:300% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}

/* ================================================================ kiosk: when something goes wrong */
.kio-kicker.warn{color:#E07A00}
.kio-choices{display:flex;gap:1.4cqw;margin-top:.6cqw}
.kio-choice{border:0;background:#F2F2F7;color:#1D1D1F;border-radius:1.8cqw;padding:1.5cqw 2.2cqw;font:700 2.2cqw var(--font-d);text-align:left;display:flex;flex-direction:column;gap:.3cqw;transition:transform .14s,background .15s}
.kio-choice small{font:500 1.45cqw var(--font);color:#6E6E73}
.kio-choice.primary{background:#34C759;color:#fff}.kio-choice.primary small{color:rgba(255,255,255,.85)}
.kio-choice:active{transform:scale(.96)}
.kio-alt{position:absolute;right:3.2cqw;bottom:25.5%;border:0;background:#F2F2F7;color:#1D1D1F;border-radius:99cqw;padding:.8cqw 1.6cqw .8cqw 1cqw;font:600 1.45cqw var(--font);display:flex;align-items:center;gap:.7cqw}
.kio-alt svg{width:2.4cqw;height:2.4cqw}
.kio-codewrap{grid-column:1/-1;display:grid;grid-template-columns:1.25fr 1fr;gap:4cqw;align-items:center;padding:0 2cqw}
.kio-codeinfo{display:flex;flex-direction:column;gap:1.1cqw}
.kio-codeinfo .kio-title{font-size:4cqw}
.kio-cls{display:flex;gap:.7cqw;flex-wrap:wrap}
.kio-cls button{border:0;background:#F2F2F7;color:#1D1D1F;border-radius:99cqw;padding:.6cqw 1.5cqw;font:600 1.6cqw var(--font)}
.kio-cls button[aria-pressed="true"]{background:#1D1D1F;color:#fff}
.kio-code{display:flex;align-items:baseline;gap:1.4cqw;font:700 6cqw var(--font-d);letter-spacing:.06em}
.kio-code span{font-size:3cqw;color:#8E8E93;letter-spacing:0}
.kio-code b.ph{color:#D1D1D6}
.kio-code-err{color:#D70015;font:600 1.6cqw var(--font);margin:0}
.kio-demo-hint{font-size:1.35cqw;color:#8E8E93;margin:0}
.kio-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:1cqw}
.kio-keys button{border:0;background:#F2F2F7;color:#1D1D1F;border-radius:1.6cqw;aspect-ratio:1.55;font:600 2.8cqw var(--font-d);transition:transform .1s,background .15s}
.kio-keys button.ok{background:#34C759;color:#fff;font-size:2.2cqw}
.kio-keys button.del{background:transparent;font-size:2.4cqw}
.kio-keys button:active{transform:scale(.9);background:#D1D1D6}
.kio-keys button.hit{animation:khit .32s ease-out}
@keyframes khit{0%{transform:scale(.88);background:#C7C7CC}100%{transform:none}}
.kio-handic{width:12cqw;height:12cqw;color:#E07A00}
.kio-handic svg{width:100%;height:100%;overflow:visible}
.a-lift{transform-box:fill-box;transform-origin:center;animation:klift 1.3s ease-in-out infinite}
@keyframes klift{0%,100%{transform:translateY(0)}50%{transform:translateY(-22%)}}
.kstep.on .a-lift{animation:klift 1.3s ease-in-out infinite}
.kio-est{background:#FFF4E0;color:#7A4B00;border-radius:1.4cqw;padding:1cqw 1.4cqw;font-size:1.45cqw;line-height:1.35}
.kio-edge{margin-top:12px;padding-top:12px;border-top:.5px dashed var(--sep)}
.kio-drawer .kio-demo.kio-edge{grid-template-columns:1.3fr 1fr 1.2fr}
.kio-check{display:flex;align-items:center;min-height:36px}
.switch-line{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--label)!important;margin:0!important;cursor:pointer}
.switch-line input{width:18px;height:18px;accent-color:var(--tint)}
@media (max-width:980px){.kio-drawer .kio-demo.kio-edge{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.kio-drawer .kio-demo.kio-edge{grid-template-columns:1fr}}

/* ================================================================ first-run intro (PL.onboard) */
.onb{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:54px 22px calc(26px + env(safe-area-inset-bottom,0px));animation:onbin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes onbin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.onb-top{display:grid;grid-template-columns:40px 1fr 56px;align-items:center}
.onb-back{border:0;background:var(--fill);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--label)}
.onb-skip{border:0;background:none;color:var(--label2);font-weight:600;font-size:14px;justify-self:end}
.onb-dots{display:flex;gap:6px;justify-content:center}
.onb-dots i{width:7px;height:7px;border-radius:99px;background:var(--fill2);transition:width .35s cubic-bezier(.2,.8,.2,1),background .35s}
.onb-dots i.on{width:22px;background:var(--tint)}.onb-dots i.past{background:color-mix(in srgb,var(--tint) 45%,var(--fill2))}
.onb-page{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;overflow-y:auto;padding:10px 0}
.onb-page h2{font-size:27px;letter-spacing:-.03em}
.onb-page > p{color:var(--label2);font-size:15.5px;line-height:1.45;max-width:31ch}
.onb-art{min-height:120px;display:grid;place-items:center;margin-bottom:6px}
.onb-art > .vicon{width:88px;height:88px;border-radius:26px}
.onb-art > .vicon svg{width:50px;height:50px}
.onb-art .vrings{gap:14px}
.onb-steps{display:flex;flex-direction:column;gap:10px;width:100%;max-width:290px}
.onb-steps > div{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;text-align:left;background:var(--bg2);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow-s)}
.onb-steps .vicon{grid-row:1/3}.onb-steps b{font-size:15px}.onb-steps span{font-size:12.5px;color:var(--label2)}
.onb-steps > div{animation:onbstep .5s cubic-bezier(.2,.8,.2,1) backwards}
.onb-steps > div:nth-child(2){animation-delay:.12s}.onb-steps > div:nth-child(3){animation-delay:.24s}
@keyframes onbstep{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.onb-prefs{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;margin-top:4px}
.onb-pref{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow-s);cursor:pointer}
.onb-pref span{flex:1;display:flex;flex-direction:column;gap:2px}.onb-pref b{font-size:14.5px}.onb-pref small{font-size:12px;color:var(--label2);line-height:1.35}
.onb-pref input,.switch-row input[role="switch"]{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:var(--fill2);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.onb-pref input::after,.switch-row input[role="switch"]::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,.7,.4,1.3)}
.onb-pref input:checked,.switch-row input[role="switch"]:checked{background:var(--tint)}
.onb-pref input:checked::after,.switch-row input[role="switch"]:checked::after{transform:translateX(18px)}
.onb-agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--label2);line-height:1.4;padding:8px 4px 0;cursor:pointer}
.onb-agree input{width:20px;height:20px;accent-color:var(--tint);flex:none;margin:0}
.onb-list{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.onb-list li{background:var(--bg2);border-radius:12px;padding:9px 12px;font-size:13.5px;color:var(--label2);box-shadow:var(--shadow-s)}
.onb-list b{color:var(--label)}
.onb-goals{display:flex;flex-direction:column;gap:7px;width:100%;text-align:left}
.onb-goals label{display:flex;gap:10px;align-items:flex-start;background:var(--bg2);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow-s);cursor:pointer;transition:box-shadow .2s,transform .15s}
.onb-goals input{accent-color:var(--indigo);margin-top:3px;flex:none}
.onb-goals span{display:flex;flex-direction:column;gap:1px}.onb-goals b{font-size:14.5px}.onb-goals small{font-size:12px;color:var(--label2);line-height:1.35}
.onb-goals label:has(input:checked){box-shadow:0 0 0 2px var(--indigo)}
.onb-foot{padding-top:12px}
.onb-next{width:100%;padding:14px;font-size:17px;border-radius:16px}
.onb-next:disabled{opacity:.4}
.care .onb-dots i.on,.care .onb-pref input:checked{background:var(--blue)}
.work .onb-dots i.on,.work .onb-pref input:checked{background:var(--indigo)}
.sw-sub{display:block;font-size:12px;color:var(--label3);font-weight:400;margin-top:1px}
.care .phone.lg .phone-body{zoom:1.16}
@media (max-width:760px){.onb{position:fixed;padding-top:64px}}

/* ================================================================ Loopi Care: nurse station (demo sidebar) */
.ward{background:var(--bg2);border-radius:14px;padding:12px;box-shadow:var(--shadow-s);display:flex;flex-direction:column;gap:8px}
.ward-h{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.ward-n{background:#FF9F0A;color:#fff;font-weight:700;font-size:11.5px;padding:2px 8px;border-radius:99px;animation:wardp 1.8s ease-in-out infinite}
@keyframes wardp{50%{box-shadow:0 0 0 5px rgba(255,159,10,.18)}}
.ward-ok{color:var(--tint-ink);font-weight:600;font-size:12px}
.ward-row{border-radius:12px;padding:6px;transition:background .25s}
.ward-row.alarm{background:color-mix(in srgb,#FF9F0A 11%,transparent)}
.ward-who{width:100%;border:0;background:none;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:9px;row-gap:5px;align-items:center;text-align:left;padding:2px;border-radius:10px}
.ward-who[aria-pressed="true"] b{color:var(--blue)}
.ward-who .av-circle{grid-row:1/3}
.ward-who span{display:flex;flex-direction:column}.ward-who b{font-size:13.5px}.ward-who small{font-size:11.5px;color:var(--label2)}
.wbar{height:4px;border-radius:99px;background:var(--fill2);overflow:hidden;display:block}
.wbar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.ward-al{font-size:12px;color:#C25E00;font-weight:600;margin:6px 2px 6px 39px}
.ward-acts{display:flex;flex-wrap:wrap;gap:5px;margin-left:37px}
.ward-acts .btn{font-size:11.5px;padding:5px 9px}
.ward-done{font-size:12px;color:var(--tint-ink);font-weight:600;margin:6px 2px 2px 39px;animation:fade .4s}

/* ================================================================ Kitchen: needs attention */
.inbox{margin-bottom:16px}
.tasks{display:flex;flex-direction:column;margin-top:8px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:.5px solid var(--sep);transition:opacity .3s}
.task:first-child{border-top:0}
.task b{display:block;font-size:14.5px}.task span{font-size:13px;color:var(--label2);line-height:1.4}
.task-dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.task[data-tone="blue"]{--c:var(--blue)}.task[data-tone="orange"]{--c:var(--orange)}.task[data-tone="yellow"]{--c:#E8B400}.task[data-tone="red"]{--c:var(--red)}
.task:not(.done) .task-dot{box-shadow:0 0 0 0 var(--c);animation:taskp 2s ease-out infinite}
@keyframes taskp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 50%,transparent)}80%,100%{box-shadow:0 0 0 7px transparent}}
.task.done{opacity:.62}.task.done .task-dot{background:var(--tint)}
.task-ok{width:26px;height:26px;border-radius:50%;background:var(--tint-soft);color:var(--tint-ink);display:grid;place-items:center;font-weight:700;animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
.task.doing{opacity:.5;transform:translateX(6px);transition:opacity .25s,transform .25s}
@media (max-width:640px){.task{grid-template-columns:auto 1fr}.task .btn,.task .task-ok{grid-column:2;justify-self:start}}
/* Kiosk: the kitchen's reminder while trays are still out */
.kio-remind{position:absolute;left:50%;transform:translateX(-50%);top:1.2cqw;white-space:nowrap;display:flex;align-items:center;gap:1cqw;background:#FFF6D6;color:#5A4300;border-radius:99cqw;padding:.7cqw 1.6cqw .7cqw 1cqw;font-size:1.45cqw;animation:kremind 2.4s ease-in-out infinite}
.kio-remind svg{width:2.6cqw;height:2.6cqw}
@keyframes kremind{0%,100%{box-shadow:0 0 0 0 rgba(255,204,0,.5)}50%{box-shadow:0 0 0 .8cqw rgba(255,204,0,0)}}

/* ================================================================ in-phone notification (PL.notify) */
.pnote{position:absolute;left:10px;right:10px;top:52px;z-index:70;border:0;text-align:left;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:20px;background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 12px 32px -10px rgba(0,0,0,.45),0 0 0 .5px var(--sep);color:var(--label);animation:pnotein .55s cubic-bezier(.2,.9,.25,1.15)}
.pnote.out{transform:translateY(-130%);opacity:0;transition:transform .3s ease-in,opacity .3s}
@keyframes pnotein{from{transform:translateY(-140%)}to{transform:none}}
.pnote-ic{width:38px;height:38px;border-radius:10px;background:var(--tint-soft);display:grid;place-items:center;flex:none;overflow:hidden}
.pnote-ic svg{width:34px;height:34px}
.pnote-tx{display:flex;flex-direction:column;min-width:0}
.pnote-app{font-size:11px;color:var(--label3);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between}
.pnote-app em{font-style:normal;text-transform:none;letter-spacing:0}
.pnote b{font-size:14px}.pnote-tx > span:last-child:not(.pnote-app){font-size:12.5px;color:var(--label2);line-height:1.35}
@media (max-width:760px){.pnote{position:fixed;top:60px}}
.frow .est{font-size:11px;font-weight:700;color:var(--orange);background:var(--orange-soft);padding:1px 6px;border-radius:99px;margin-left:4px}


/* ================================================================ PlateLoop Prototype: the scanner, as a product launch */
body.xp-body{overflow:hidden;padding:0;background:#070908}
.xp{position:fixed;inset:0;overflow:hidden;color:#F2F4F3;font-family:"Inter",var(--font);
  background:radial-gradient(90% 70% at 50% 42%,#1B1F1D 0%,#0E100F 55%,#050606 100%);-webkit-user-select:none;user-select:none}
.xp::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 50% 100%,rgba(52,199,89,.06),transparent 70%)}
.xp-gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
.xp-gl:active{cursor:grabbing}
.kiosk-on .xp-gl{cursor:default}
.xp-title{position:absolute;left:0;right:0;top:clamp(22px,4.2vh,44px);margin:0;text-align:center;font-size:clamp(20px,2.1vw,30px);font-weight:300;letter-spacing:-.01em;z-index:3;pointer-events:none;
  opacity:0;transform:translateY(-8px);transition:opacity 1.6s cubic-bezier(.2,.8,.2,1) .5s,transform 1.6s cubic-bezier(.2,.8,.2,1) .5s}
.xp-title b{font-weight:600;letter-spacing:-.025em}
.xp-title span{color:#8F9793}
.xp.ready .xp-title{opacity:1;transform:none}
.xp.kiosk-on .xp-title{opacity:0;transition-delay:0s}
.xp-gl{opacity:0;transition:opacity 1.4s ease .1s}.xp.ready .xp-gl{opacity:1}

/* hotspots: tiny lights on the hardware */
.xp-hots{position:absolute;inset:0;pointer-events:none;z-index:2}
.xp-hot{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border:0;padding:0;background:none;cursor:pointer;pointer-events:none;opacity:0;transition:opacity .45s}
.xp-hot.show{opacity:1;pointer-events:auto}
.xp-hot i{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#7CFFB5;box-shadow:0 0 6px 2px rgba(61,255,142,.75),0 0 18px 5px rgba(61,255,142,.25)}
.xp-hot i::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(124,255,181,.55);animation:xpping 2.6s cubic-bezier(.2,.7,.3,1) infinite}
.xp-hot:nth-child(2n) i::after{animation-delay:.9s}.xp-hot:nth-child(3n) i::after{animation-delay:1.7s}
@keyframes xpping{0%{transform:scale(.4);opacity:.9}70%,100%{transform:scale(1.6);opacity:0}}
.xp-hot span{position:absolute;left:24px;top:50%;transform:translate(-4px,-50%);white-space:nowrap;font-size:12.5px;font-weight:500;letter-spacing:.01em;color:#E9EDEB;
  background:rgba(20,24,22,.55);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);padding:5px 10px;border-radius:99px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14);
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.xp-hot:hover span,.xp-hot:focus-visible span{opacity:1;transform:translate(0,-50%)}
.xp-hot:hover i{transform:scale(1.35)}.xp-hot i{transition:transform .25s}
.xp-hot.sel i::after{animation:none;opacity:0}
.xp-hot:focus-visible{outline:none}.xp-hot:focus-visible i{box-shadow:0 0 0 3px rgba(255,255,255,.7),0 0 18px 5px rgba(61,255,142,.4)}

/* the floating glass panel */
.xp-panel{position:absolute;right:clamp(20px,4vw,64px);top:50%;width:min(390px,34vw);z-index:4;padding:26px 26px 18px;border-radius:26px;
  background:linear-gradient(160deg,rgba(40,44,42,.86),rgba(16,18,17,.9));backdrop-filter:blur(30px) saturate(1.3) brightness(.7);-webkit-backdrop-filter:blur(30px) saturate(1.3) brightness(.7);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px -30px rgba(0,0,0,.8);
  transform:translate(24px,-50%);opacity:0;transition:opacity .5s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1);max-height:calc(100vh - 120px);overflow:auto;-webkit-user-select:text;user-select:text}
.xp-panel.in{opacity:1;transform:translate(0,-50%);transition-delay:.35s}
.xp-panel .xp-pk{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6FE39F}
.xp-panel h2{font-size:32px;font-weight:600;letter-spacing:-.03em;margin:8px 0 14px;color:#FFFFFF}
.xp-panel dl{margin:0;display:flex;flex-direction:column;gap:12px}
.xp-panel dt{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9CA4A0}
.xp-panel dd{margin:3px 0 0;font-size:14.5px;line-height:1.5;color:#E3E7E5}
.xp-panel.in dl > *{animation:xprise .7s cubic-bezier(.2,.8,.2,1) both}
.xp-panel.in dt:nth-of-type(1),.xp-panel.in dd:nth-of-type(1){animation-delay:.45s}
.xp-panel.in dt:nth-of-type(2),.xp-panel.in dd:nth-of-type(2){animation-delay:.55s}
.xp-panel.in dt:nth-of-type(3),.xp-panel.in dd:nth-of-type(3){animation-delay:.65s}
@keyframes xprise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.xp-spec{margin-top:16px;padding-top:14px;border-top:.5px solid rgba(255,255,255,.12);font-size:12.5px;color:#9AA29E;letter-spacing:.01em}
.xp-cta{margin-top:16px;width:100%;border:0;border-radius:14px;padding:13px 16px;font:600 15px "Inter",var(--font);color:#04160B;background:linear-gradient(180deg,#7CFFB5,#3DDC84);
  display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 30px -10px rgba(61,220,132,.6);transition:transform .15s,box-shadow .2s}
.xp-cta:hover{box-shadow:0 14px 36px -10px rgba(61,220,132,.8)}.xp-cta:active{transform:scale(.97)}
.xp-x{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#DDE2DF;display:grid;place-items:center}
.xp-x svg,.xp-pnav svg{width:16px;height:16px}
.xp-x:hover{background:rgba(255,255,255,.16)}
.xp-pnav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:12px;color:#8C9490}
.xp-pnav button{border:0;background:none;color:#C9CFCC;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.xp-pnav button:hover{background:rgba(255,255,255,.08)}

/* hint */
.xp-hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:12.5px;letter-spacing:.02em;color:#838B87;z-index:2;pointer-events:none;
  opacity:0;animation:xphint 1.2s ease 2.8s forwards;transition:opacity 1.2s}
.xp-hint.gone{opacity:0!important;animation:none}
@keyframes xphint{to{opacity:1}}

/* kiosk mode: the real kiosk lies exactly on the 3D screen; its demo controls float in a glass panel */
.xp-kiosk{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;transition:opacity .7s ease}
.xp-kiosk.in{opacity:1}
.xp-kiosk .kio-app{display:contents}
.xp-kiosk .kio-head{display:none}

.xp-kiosk .kio-drawer{position:absolute;left:clamp(16px,2.4vw,36px);top:50%;transform:translateY(-50%);width:min(360px,calc(100vw - 32px));max-height:calc(100vh - 110px);overflow:auto;pointer-events:auto;
  --bg2:rgba(24,27,25,.55);--label:#F0F3F1;--label2:#A7AEAA;--label3:#858C88;--fill:rgba(255,255,255,.08);--fill2:rgba(255,255,255,.16);--sep:rgba(255,255,255,.12);color-scheme:dark;color:var(--label);
  background:linear-gradient(160deg,rgba(40,44,42,.86),rgba(16,18,17,.9));backdrop-filter:blur(30px) saturate(1.3) brightness(.7);-webkit-backdrop-filter:blur(30px) saturate(1.3) brightness(.7);

.xp-kiosk .kio-drawer select{width:100%;background:rgba(255,255,255,.07);color:var(--label);border:0;border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}

.xp-kexit{position:absolute;right:clamp(16px,2.4vw,32px);top:clamp(20px,4vh,40px);pointer-events:auto;border:0;border-radius:99px;padding:9px 16px;font:500 13.5px "Inter",var(--font);color:#E9EDEB;
  background:rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16)}

  .xp-panel.in{transform:none}
  .xp-panel h2{font-size:26px}
