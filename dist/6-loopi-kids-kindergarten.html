<script>
/* ---- js/game.js ---- */
/* Loopi's rules, adapted from the team's tomogatchi prototype and tied to real school lunches.
   The core: a tray scanned back feeds Loopi the food you ate; a tray with less left than your usual earns
   a heart; full hearts grow Loopi from egg to adult, and a grown Loopi lays an egg (rarity odds shown) that
   hatches a new one while the old one retires to the Barn. Your real leftovers become crumbs to sweep into
   the compost. Around it: gems, ingredients from the food groups you actually ate, oven cooking in recipe
   order (burnt or wrong dishes go to the compost; compost-grown ingredients can make golden snacks), the
   worm farm, recipe cards from the Healthy Catch minigame, and wardrobe crates (earned gems only, odds
   shown). Hearts only ever come from real trays, so the game can't be won without eating well. */
(() => {
'use strict';
const { MENU } = PL;
const G = PL.game = {};
const V = 3; // bump when the saved game changes shape

/* ---------------------------------------------------------------- tuning */
G.HUNGER_MAX = [4, 6, 9, 13];
G.HEARTS_REQ = [3, 5, 7, 9];
G.PLAYS_PER_DAY = 3;          // Healthy Catch games a day
G.BALLS_PER_DAY = 5;          // fetch throws that add Joy
G.PETS_PER_DAY = 5;           // pats that add Joy
G.PET_GEM = { chance: .25, min: 2, max: 8, cap: 3 };
G.OVEN_CAP = 4;
G.SPOIL_CHANCE = .1;          // a correct recipe can still burn; it goes to the compost
G.GOLDEN_BASE = .2; G.GOLDEN_PER_GROWN = .2; G.GOLDEN_HUNGER = 2;
G.COMPOST_COST = 15; G.COMPOST_RECOVER = .35; G.WORM_CHANCE = .3;
G.RARITY_BONUS = { common: .4, rare: 1, epic: 1.7, legendary: 2.5 };
G.MENTOR_BONUS = .1;
G.EGG_WEIGHTS = { common: 50, rare: 30, epic: 15, legendary: 5 };
G.DUP_REFUND = .2;

G.INGREDIENTS = {
  rice: { name: 'Rice', draw: { name: 'Rice', color: '#F3EDDA', edge: '#BFB28E' } },
  veg: { name: 'Greens', draw: { name: 'Greens', color: '#3F9A48', edge: '#2A5A22' } },
  protein: { name: 'Chicken', draw: { name: 'Chicken', color: '#C98A4B', edge: '#8E5E28' } },
  fruit: { name: 'Fruit', draw: { name: 'Watermelon', color: '#F2545B', edge: '#B8323A' } },
};
/** Which ingredient each lunch food group gives when you eat at least half of it. */
const GROUP_ING = { grain: 'rice', veg: 'veg', protein: 'protein', fruit: 'fruit' };
G.RECIPES = [
  { id: 'chickenrice', name: 'Chicken rice', seq: ['rice', 'protein', 'veg'], hunger: 3, unlock: null },
  { id: 'vegsoup', name: 'Veggie soup', seq: ['veg', 'veg', 'rice'], hunger: 2, unlock: null },
  { id: 'fruitcup', name: 'Fruit cup', seq: ['fruit', 'fruit', 'veg'], hunger: 2, unlock: null },
  { id: 'nasilemak', name: 'Nasi lemak', seq: ['rice', 'protein', 'veg', 'rice'], hunger: 4, unlock: 'nasi', cost: 3 },
  { id: 'rainbow', name: 'Rainbow bowl', seq: ['rice', 'protein', 'veg', 'fruit'], hunger: 6, unlock: 'rainbow', cost: 5 },
];
G.CARD_NAME = { nasi: 'Nasi lemak card', rainbow: 'Rainbow bowl card' };
G.ACCESSORIES = [
  { id: 'cap', name: 'Cap', rarity: 'normal' }, { id: 'bow', name: 'Bow', rarity: 'normal' },
  { id: 'glasses', name: 'Glasses', rarity: 'normal' }, { id: 'scarf', name: 'Scarf', rarity: 'normal' },
  { id: 'flower', name: 'Flower', rarity: 'normal' }, { id: 'headphones', name: 'Headphones', rarity: 'epic' },
  { id: 'halo', name: 'Halo', rarity: 'epic' }, { id: 'wings', name: 'Wings', rarity: 'epic' },
  { id: 'crown', name: 'Crown', rarity: 'legendary' }, { id: 'aura', name: 'Sparkle aura', rarity: 'legendary' },
];
G.CRATES = {
  normal: { name: 'Basic crate', cost: 40, w: { normal: 85, epic: 14, legendary: 1 } },
  epic: { name: 'Epic crate', cost: 120, w: { normal: 40, epic: 50, legendary: 10 } },
  legendary: { name: 'Legendary crate', cost: 300, w: { normal: 10, epic: 50, legendary: 40 } },
};

const today = () => new Date().toISOString().slice(0, 10);
const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const blank = () => ({ rice: 0, veg: 0, protein: 0, fruit: 0 });
const pickWeighted = w => { const e = Object.entries(w), tot = e.reduce((a, [, v]) => a + v, 0); let x = Math.random() * tot; for (const [k, v] of e) { if (x < v) return k; x -= v; } return e[0][0]; };
const daily = g => { if (!g.day || g.day.d !== today()) g.day = { d: today(), balls: 0, pets: 0, drops: 0, plays: 0 }; return g.day; };
/** Leftovers become crumbs: one per 20 g left of a dish, at most 3 per dish. */
const crumbsFrom = (left, menu = MENU) => menu.flatMap(d => Array(Math.min(3, Math.floor((left[d.id] || 0) / 20))).fill(d.id));
/** The tray is "good" when less is left than 15%, or a quarter less than the student's usual. */
G.heartLine = st => Math.max(.15, st.baseline * .75);

/* ---------------------------------------------------------------- setup */
G.init = st => {
  const r = PL.rng(hash(st.id)), stage = PL.STAGES.indexOf(PL.stageOf(st.pet.xp)), req = G.HEARTS_REQ[stage];
  const n = Math.min(4, Math.round(st.log[0].w * 12));
  const g = {
    v: V, name: 'Loopi', rarity: 'common', stage,
    hunger: Math.round(G.HUNGER_MAX[stage] * (.4 + r() * .3)),
    hearts: st.named ? req - 1 : Math.floor(r() * req), ready: false,
    plate: null, mess: ['kailan', 'cabbage', 'soup', 'rice'].slice(0, n), composted: Math.round(15 + r() * 50),
    gems: Math.round(40 + r() * 140),
    ing: { rice: 1 + Math.floor(r() * 4), veg: 1 + Math.floor(r() * 4), protein: Math.floor(r() * 3), fruit: 1 + Math.floor(r() * 3) },
    grown: blank(), bin: ['veg', 'rice', 'fruit'].slice(0, 1 + Math.floor(r() * 3)), oven: [], snacks: [],
    unlocked: { nasi: false, rainbow: false }, cards: { nasi: 1 + Math.floor(r() * 2), rainbow: Math.floor(r() * 2) },
    acc: [], eq: null, barn: [], eggs: [], best: 0,
    day: { d: today(), balls: 0, pets: 0, drops: 0, plays: 0 },
  };
  if (st.named) g.snacks.push({ id: 's' + Math.floor(r() * 1e6), recipe: 'chickenrice', name: 'Chicken rice', hunger: 3, golden: false });
  (st.pet.book || []).forEach((form, i) => g.barn.push({ id: 'b' + i, name: 'Loopi ' + (i + 1), form, rarity: r() < .6 ? 'common' : 'rare', stage: 3 }));
  if (st.id === 's3') { g.acc.push('crown'); g.eq = 'crown'; }
  if (st.id === 's6') { g.acc.push('headphones'); g.eq = 'headphones'; }
  return g;
};
G.ensure = st => { if (!st.game || st.game.v !== V) st.game = G.init(st); return st.game; };
const ensureAll = () => PL.S.students.forEach(G.ensure);
ensureAll();
PL.store.subscribe(ensureAll);

/* ---------------------------------------------------------------- lookups */
G.hungerMax = g => G.HUNGER_MAX[g.stage];
G.heartsReq = g => G.HEARTS_REQ[g.stage];
G.plantOf = st => Math.min(4, Math.floor(st.pet.c.lowWaste / 5));
G.playsLeft = g => G.PLAYS_PER_DAY - daily(g).plays;
G.recipeUnlocked = (g, rc) => !rc.unlock || g.unlocked[rc.unlock];
/** Barn bonus on the gems each lunch earns: your best Loopi (active or retired) sets it; every other grown Loopi adds a little. */
G.multiplier = g => {
  const pets = [...g.barn, { rarity: g.rarity, stage: g.stage }];
  const val = p => 1 + G.RARITY_BONUS[p.rarity] * (p.stage / 3);
  const best = pets.reduce((a, p) => val(p) > val(a) ? p : a, pets[0]);
  return val(best) + pets.filter(p => p !== best).reduce((a, p) => a + G.MENTOR_BONUS * (p.stage / 3), 0);
};

/* ---------------------------------------------------------------- lunch: the heart of it */
/** Called after the second scan. Hunger, hearts, gems and ingredients change right away; the food waits in the bowl. */
G.feedLunch = (st, r, menu = MENU) => {
  const g = G.ensure(st), max = G.hungerMax(g), req = G.heartsReq(g);
  if (g.plate && !g.plate.eaten) g.mess.push(...g.plate.crumbs); // yesterday's uneaten plate still counts
  const gain = 1 + (r.w < .3 ? 1 : 0) + (r.w < .12 ? 1 : 0);
  g.hunger = Math.min(max, g.hunger + gain);
  let heart = false;
  if (r.w < G.heartLine(st) && g.hearts < req) {
    g.hearts++; heart = true;
    if (g.hearts === req) g.ready = true;
  }
  // one ingredient for each food group you ate at least half of
  const got = blank();
  menu.forEach(d => { const k = GROUP_ING[d.group]; if (k && r.servedBy[d.id] && r.measured[d.id] <= r.servedBy[d.id] * .5) got[k] = 1; });
  Object.keys(got).forEach(k => { g.ing[k] += got[k]; });
  const gems = Math.round((gain * 5 + 5) * G.multiplier(g));
  g.gems += gems;
  g.plate = {
    eaten: false, heart, gain,
    food: menu.filter(d => r.servedBy[d.id] - r.measured[d.id] > 10).map(d => d.id),
    crumbs: crumbsFrom(r.measured, menu),
  };
  return { hunger: gain, heart, ready: g.ready, crumbs: g.plate.crumbs.length, gems, ing: got };
};
/** Loopi eats what's in the bowl; the tray's leftovers land on the floor. */
G.serveLunch = st => {
  const g = G.ensure(st), p = g.plate;
  if (!p || p.eaten) return null;
  p.eaten = true;
  g.mess.push(...p.crumbs);
  return p;
};
/** Swept crumbs are your real leftovers: they're composted and counted, but never turned into ingredients. */
G.sweep = (st, dish) => {
  const g = G.ensure(st), i = g.mess.indexOf(dish);
  if (i >= 0) { g.mess.splice(i, 1); g.composted++; }
  return g.mess.length;
};
/** A cooked snack fills Food and cheers Loopi up (golden: more of both). Hearts only come from real trays. */
G.eatSnack = (st, snackId) => {
  const g = G.ensure(st), i = g.snacks.findIndex(s => s.id === snackId);
  if (i < 0) return null;
  const [s] = g.snacks.splice(i, 1), max = G.hungerMax(g), wasFull = g.hunger >= max;
  g.hunger = Math.min(max, g.hunger + s.hunger);
  st.pet.jo = Math.min(100, st.pet.jo + (s.golden ? 12 : 5));
  g.gems += s.hunger * 2;
  return { snack: s, wasFull, heart: false };
};

/* ---------------------------------------------------------------- growing up, eggs and the Barn */
/** Full hearts: grow a stage. A fully grown Loopi lays an egg instead. */
G.evolve = st => {
  const g = G.ensure(st);
  if (!g.ready) return null;
  g.ready = false; g.hearts = 0;
  if (g.stage < 3) { g.stage += 1; return { type: 'grow', stage: PL.STAGES[g.stage] }; }
  const rarity = pickWeighted(G.EGG_WEIGHTS);
  g.eggs.push(rarity);
  return { type: 'egg', rarity };
};
/** Hatching retires the grown Loopi to the Barn (it keeps boosting your gems) and starts a new one. */
G.hatch = st => {
  const g = G.ensure(st);
  if (!g.eggs.length) return null;
  const rarity = g.eggs.shift();
  g.barn.push({ id: 'b' + Date.now(), name: g.name, form: PL.formOf(st.pet), rarity: g.rarity, stage: g.stage, acc: g.eq });
  Object.assign(g, { name: 'Loopi ' + (g.barn.length + 1), rarity, stage: 0, hunger: 2, hearts: 0, ready: false, eq: null });
  return rarity;
};

/* ---------------------------------------------------------------- cooking */
function dump(g) { g.oven.forEach(o => g.bin.push(o.t)); g.oven = []; }
G.ovenAdd = (st, type) => {
  const g = G.ensure(st);
  let grown = false;
  if (g.grown[type] > 0) { g.grown[type]--; grown = true; }
  else if (g.ing[type] > 0) g.ing[type]--;
  else return { result: 'none' };
  g.oven.push({ t: type, grown });
  const seq = g.oven.map(o => o.t), open = G.RECIPES.filter(rc => G.recipeUnlocked(g, rc));
  const match = open.find(rc => rc.seq.length === seq.length && rc.seq.every((x, i) => x === seq[i]));
  if (match) {
    const grownN = g.oven.filter(o => o.grown).length;
    if (Math.random() < G.SPOIL_CHANCE) { dump(g); return { result: 'spoiled', recipe: match }; }
    const golden = grownN > 0 && Math.random() < G.GOLDEN_BASE + G.GOLDEN_PER_GROWN * grownN;
    const snack = { id: 's' + Date.now() + Math.floor(Math.random() * 1e4), recipe: match.id, name: (golden ? 'Golden ' : '') + match.name, hunger: match.hunger + (golden ? G.GOLDEN_HUNGER : 0), golden };
    g.snacks.push(snack); g.oven = []; g.gems += 3;
    return { result: 'cooked', snack };
  }
  const prefix = open.some(rc => rc.seq.length > seq.length && seq.every((x, i) => rc.seq[i] === x));
  if (!prefix || seq.length >= G.OVEN_CAP) { dump(g); return { result: 'rejected' }; }
  return { result: 'pending' };
};
G.emptyOven = st => { const g = G.ensure(st), n = g.oven.length; dump(g); return n; };

/* ---------------------------------------------------------------- worm farm: kitchen scraps grow back */
G.compost = st => {
  const g = G.ensure(st);
  if (!g.bin.length) return { error: 'The compost bin is empty.' };
  if (g.gems < G.COMPOST_COST) return { error: `Turning the compost costs ${G.COMPOST_COST} gems.` };
  g.gems -= G.COMPOST_COST;
  const worms = Math.random() < G.WORM_CHANCE, got = blank(), n = g.bin.length;
  g.bin.forEach(t => { if (Math.random() < G.COMPOST_RECOVER || (worms && Math.random() < .5)) { got[t]++; g.grown[t]++; } });
  g.bin = [];
  return { got, n, worms };
};
G.unlock = (st, key) => {
  const g = G.ensure(st), rc = G.RECIPES.find(x => x.unlock === key);
  if (!rc || g.unlocked[key] || g.cards[key] < rc.cost) return false;
  g.cards[key] -= rc.cost; g.unlocked[key] = true; return true;
};

/* ---------------------------------------------------------------- play, petting */
G.playBall = st => {
  const g = G.ensure(st), d = daily(g);
  if (d.balls >= G.BALLS_PER_DAY) return false;
  d.balls++; st.pet.jo = Math.min(100, st.pet.jo + 3); return true;
};
/** A pat adds Joy, and now and then Loopi finds a few gems (at most 3 times a day). */
G.petLoopi = st => {
  const g = G.ensure(st), d = daily(g);
  if (d.pets < G.PETS_PER_DAY) { d.pets++; st.pet.jo = Math.min(100, st.pet.jo + 1); }
  if (d.drops >= G.PET_GEM.cap || Math.random() >= G.PET_GEM.chance) return 0;
  const gems = G.PET_GEM.min + Math.floor(Math.random() * (G.PET_GEM.max - G.PET_GEM.min + 1));
  g.gems += gems; d.drops++; return gems;
};

/* ---------------------------------------------------------------- Healthy Catch */
G.catchStart = st => { const g = G.ensure(st), d = daily(g); if (d.plays >= G.PLAYS_PER_DAY) return false; d.plays++; return true; };
G.catchEnd = (st, res) => {
  const g = G.ensure(st), got = blank();
  Object.keys(got).forEach(t => { got[t] = Math.floor((res.caught[t] + 1) / 2); g.ing[t] += got[t]; });
  Object.keys(res.cards).forEach(k => { g.cards[k] += res.cards[k]; });
  const gems = Math.floor(res.score / 4);
  g.gems += gems;
  const best = res.score > g.best; if (best) g.best = res.score;
  return { got, gems, best };
};

/* ---------------------------------------------------------------- wardrobe: badges and crates */
G.BADGES = [
  { id: 'first', name: 'First scan', item: 'cap', how: 'Scan a lunch tray', test: st => st.log.length > 0 },
  { id: 'small', name: 'Small and clean', item: 'bow', how: 'Finish a small portion', test: st => st.log.some(l => l.portion === 'S' && l.w < .12) },
  { id: 'streak', name: 'Three in a row', item: 'scarf', how: '3 clean trays in a row', test: st => st.pet.streak >= 3 },
  { id: 'veg', name: 'Veggie explorer', item: 'flower', how: 'Try the veggies 10 times', test: st => st.pet.c.veg >= 10 },
  { id: 'kailan', name: 'Kailan week', item: 'glasses', how: 'Taste the kailan 3 times', test: st => st.pet.quest >= 3 },
  { id: 'balanced', name: 'Balanced plate', item: 'halo', how: 'Eat from every food group 5 times', test: st => st.pet.c.balanced >= 5 },
  { id: 'class', name: 'Team goal', item: 'wings', how: 'Your class goes under 20% waste', test: st => { const c = PL.S.classes.find(c => c.id === st.cls); return c ? c.ret / c.served < .2 : false; } },
  { id: 'top3', name: 'Podium', item: 'headphones', how: 'Be top 3 in your class', test: st => PL.studentRows().findIndex(s => s.id === st.id) < 3 },
  { id: 'adult', name: 'All grown up', item: 'crown', how: 'Grow Loopi into an adult', test: st => G.ensure(st).stage === 3 || G.ensure(st).barn.length > 0 },
];
G.earned = st => G.BADGES.filter(b => b.test(st));
/** Everything Loopi can wear: won in crates, or unlocked by a badge. */
G.owned = st => new Set([...G.ensure(st).acc, ...G.earned(st).map(b => b.item)]);
G.wear = (st, item) => { const g = G.ensure(st); if (item && !G.owned(st).has(item)) return; g.eq = g.eq === item ? null : item; };
G.openCrate = (st, tier) => {
  const g = G.ensure(st), c = G.CRATES[tier];
  if (g.gems < c.cost) return { error: `The ${c.name.toLowerCase()} costs ${c.cost} gems.` };
  g.gems -= c.cost;
  const rarity = pickWeighted(c.w), pool = G.ACCESSORIES.filter(a => a.rarity === rarity);
  const acc = pool[Math.floor(Math.random() * pool.length)], dup = G.owned(st).has(acc.id);
  let refund = 0;
  if (dup) { refund = Math.round(c.cost * G.DUP_REFUND); g.gems += refund; } else g.acc.push(acc.id);
  return { acc, dup, refund };
};

/* ---------------------------------------------------------------- pixel sprites for the catch game */
G.SPRITES = {
  rice: { p: ['..wwww..', '.wwwwww.', 'bbbbbbbb', '.bbbbbb.', '..bbbb..'], c: { w: '#FFFFFF', b: '#3E74C9' } },
  veg: { p: ['..gg.gg.', '.gggggg.', '.gdggdg.', '..gggg..', '...dd...', '...dd...'], c: { g: '#3C9A48', d: '#23602D' } },
  protein: { p: ['...bb...', '..bbbb..', '.bbbbbb.', '.bbbbbb.', '..bbbb..', '...ww...', '..w..w..'], c: { b: '#C98A4B', w: '#FFF8EC' } },
  fruit: { p: ['gggggggg', '.rrrrrr.', '.rkrrkr.', '..rrrr..', '...rr...'], c: { g: '#5BA84A', r: '#F2545B', k: '#1F2A1D' } },
  soda: { p: ['..kkkk..', '..cccc..', '..ckcc..', '..cccc..', '..cccc..', '..kkkk..'], c: { c: '#B8322A', k: '#D9D9D9' } },
  candy: { p: ['p......p', 'pp.pp.pp', 'pppppppp', 'pp.pp.pp', 'p......p'], c: { p: '#E86FB0' } },
  card: { p: ['.tttttt.', '.tkkkkt.', '.tttttt.', '.tkkktt.', '.tttttt.'], c: { t: '#F1DFAE', k: '#6B4A2B' } },
};
G.drawSprite = (ctx, name, x, y, s) => {
  const sp = G.SPRITES[name];
  sp.p.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.') { ctx.fillStyle = sp.c[ch]; ctx.fillRect(Math.round(x + i * s), Math.round(y + j * s), s, s); } }));
};
})();

</script>
<script>
/* ---- js/health.js ---- */
/* PlateLoop beyond schools: hospital wards and kindergartens. The same scanner pairs each person by face,
   scans the tray before and after the meal, and turns the difference into a personal healthcare report:
   what they ate, their nutrient intake against their own targets, and their eating habits over time.
   This file holds the menus, the demo people, the meal scan and the report building blocks.
   Loopi Care (js/care.js) and Loopi Kids (js/kids.js) draw on it. */
(() => {
'use strict';
const { clamp, rng, esc, pct } = PL;
const H = PL.health = {};

/* ---------------------------------------------------------------- menus (nutrients per gram; na = sodium mg per gram) */
const dish = (id, name, g, n, color, edge, group, extra) => ({ id, name, g, n, color, edge, group, ...extra });
H.WARD_MENU = {
  breakfast: [
    dish('h_congee', 'Chicken congee', 300, { kcal: .46, c: .10, p: .012, f: .002, na: 1.1 }, '#F3EDDA', '#BFB28E', 'grain'),
    dish('h_egg', 'Steamed egg', 70, { kcal: 1.3, c: .01, p: .11, f: .09, na: 2.4 }, '#F6D365', '#C9A13B', 'protein'),
    dish('h_spinach', 'Stir-fried spinach', 40, { kcal: .55, c: .04, p: .03, f: .035, na: 3.5 }, '#3F7D32', '#2A5A22', 'veg'),
    dish('h_milk', 'Milk', 200, { kcal: .64, c: .05, p: .033, f: .035, na: .4 }, '#FFFFFF', '#C7C7CC', 'dairy'),
    dish('h_banana', 'Banana', 100, { kcal: .89, c: .23, p: .011, f: .003, na: 0 }, '#F7DC6F', '#C9A13B', 'fruit'),
  ],
  lunch: [
    dish('h_rice', 'Brown rice', 210, { kcal: 1.45, c: .32, p: .03, f: .003, na: 0 }, '#F3EDDA', '#BFB28E', 'grain'),
    dish('h_fish', 'Steamed fish with ginger', 100, { kcal: 1.4, c: .01, p: .2, f: .065, na: 1.5 }, '#EDE3D1', '#B8A88A', 'protein'),
    dish('h_vegsoup', 'Clear vegetable soup', 200, { kcal: .15, c: .01, p: .012, f: .005, na: 3.0 }, '#EFE6C4', '#BFB28E', 'soup'),
    dish('h_kailan', 'Stir-fried kailan', 50, { kcal: 1.0, c: .05, p: .03, f: .03, na: 3.2 }, '#5E9E3A', '#3B6E22', 'veg'),
    dish('h_papaya', 'Papaya', 80, { kcal: .43, c: .11, p: .005, f: .003, na: 0 }, '#F6A24B', '#C4731F', 'fruit'),
  ],
  dinner: [
    dish('h_rice2', 'Brown rice', 210, { kcal: 1.45, c: .32, p: .03, f: .003, na: 0 }, '#F3EDDA', '#BFB28E', 'grain'),
    dish('h_chicken', 'Braised chicken and potato', 150, { kcal: 1.5, c: .08, p: .20, f: .06, na: 3.2 }, '#B5652D', '#7A3F17', 'protein'),
    dish('h_tofu', 'Pan-fried tofu', 80, { kcal: 1.9, c: .03, p: .09, f: .13, na: .2 }, '#F4E7C8', '#C9B48A', 'protein'),
    dish('h_lotus', 'Lotus root soup', 200, { kcal: .35, c: .05, p: .02, f: .01, na: 3.2 }, '#D9B98C', '#A0845A', 'soup'),
    dish('h_longbean', 'Stir-fried long beans', 50, { kcal: .8, c: .04, p: .015, f: .03, na: 2.6 }, '#9CC56B', '#6A9440', 'veg'),
  ],
};
H.MEALS = [['breakfast', 'Breakfast', '07:50'], ['lunch', 'Lunch', '12:10'], ['dinner', 'Dinner', '17:40']];
/* each diet sets daily targets and changes what's served (portion multipliers, low-salt cooking) */
H.DIETS = {
  regular: { name: 'Regular', target: { kcal: 1900, p: 70, c: 240, f: 55, na: 2000 }, mult: {}, na: 1, note: 'No restrictions.' },

H.nutrientRows = (n, target, keys, mins = []) => keys.map(k => {

  return `<div class="hrow wide"><span>${H.NAMES[k][0]}</span><div class="zbar">${zones}<i class="${st}" style="width:${pos(n[k])}%"></i></div><b class="num ${st}">${n[k].toLocaleString('en-US')}<small> / ${t.toLocaleString('en-US')} ${H.NAMES[k][1]}</small></b></div>`;

H.dayBars = (days, vals, label, goal = 1, max = 1.3) => {

   Sounds are made with the Web Audio API, so there are no audio files. */
(() => {

        <label for="kid-preset">Lunch at the scanner</label>
        <select id="kid-preset">${Object.keys(H.PRESETS).map(p => `<option>${p}</option>`).join('')}</select>
        <button class="btn primary" id="kid-lunch"></button>
        <button class="btn small" id="kid-rest">Scan the rest of the class</button>
      </div>
      <button class="linkish" data-reset style="font-size:13px;text-align:left">Reset demo</button>
    </aside>
    <div class="phone warm">
      <header class="phone-top" id="kid-top"></header>
      <div class="phone-body" id="kid-body"></div>
      <nav class="phone-tabs two" role="tablist" aria-label="Loopi Kids">
        <button role="tab" data-tab="kid">${ICON.kid}Loopi</button>
        <button role="tab" data-tab="grown">${ICON.grown}Grown-ups</button>
      </nav>
      <div id="kid-layer"></div>
    </div>
  </div>`;
  $$('.phone-tabs button', el).forEach(b => b.onclick = () => {
    SFX.tap();
    if (b.dataset.tab === 'grown' && !ui.adult) { gate(); return; }
    ui.tab = b.dataset.tab; render(); $('#kid-body').scrollTop = 0;
  });
  $('#kid-preset', el).onchange = e => { ui.preset = e.target.value; };
  $('#kid-lunch', el).onclick = () => {
    const K = me(); if (scannedToday(K)) return;
    const r = H.scanKidLunch(K, ui.preset);
    ui.celebrate = true; ui.tab = ui.adult ? ui.tab : 'kid';
    PL.store.save('kids');
    PL.toast(`${K.name}'s tray scanned: ${pct(1 - r.w)} eaten.`);
  };
  $('#kid-rest', el).onclick = () => { const n = H.scanRestOfKids(); PL.store.save('kids'); PL.toast(n ? `${n} more trays scanned in Sunflower class.` : 'Everyone\'s lunch is already scanned.'); };
  render();
}
function render(keep) {
  if (!root) return;
  clearTimers();
  const K = me(), body = $('#kid-body', root), y = body.scrollTop;
  $('#kid-who', root).innerHTML = kids().filter(k => k.named).map(k => `<button class="chip plain" data-kid="${k.id}" aria-pressed="${k.id === K.id}">${esc(k.name)}</button>`).join('');
  $$('#kid-who button', root).forEach(b => b.onclick = () => { ui.focus = null; PL.S.care.me.kid = b.dataset.kid; PL.store.save('me'); });
  const lb = $('#kid-lunch', root); lb.textContent = scannedToday(K) ? `${K.name}'s lunch is done` : `Scan ${K.name}'s lunch tray`; lb.disabled = scannedToday(K);
  $('#kid-preset', root).value = ui.preset;
  $('#kid-rest', root).disabled = kids().filter(k => !k.named).every(scannedToday);
  $('#kid-top', root).innerHTML = ui.tab === 'kid'
    ? `${V.avatar(K, 36)}<div><b>${esc(K.name)}</b><span>Sunflower class · age ${K.age}</span></div><button class="mute" id="mute" aria-label="${SFX.muted ? 'Turn sound on' : 'Turn sound off'}">${SFX.muted ? ICON.mute : ICON.sound}</button>`
    : `<span class="av-circle" style="--av:#8E8E93;width:36px;height:36px;font-size:13px">${ui.role === 'teacher' ? 'MF' : esc(K.name[0])}</span><div><b>${ui.role === 'teacher' ? 'Ms. Farah' : `${esc(K.name)}'s family`}</b><span>${ui.role === 'teacher' ? 'Teacher · Sunflower class' : 'Parent view'}</span></div>`;
  $$('.phone-tabs button', root).forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === ui.tab)));
  body.innerHTML = ui.tab === 'kid' ? kid(K) : grown(K);
  wire(K);
  if (keep) body.scrollTop = y;
  layer();
  if (ui.tab === 'kid' && ui.celebrate && scannedToday(K)) { ui.celebrate = false; celebrate(K); }
}

/* ================================================================ for the child */
function kid(K) {
  const done = scannedToday(K), rec = K.log[0], picky = pickyOf(K);
  const ate = done ? coloursEaten(K, rec) : new Set();
  let expr, line;
  if (!done) { expr = 'wave'; line = `Hi ${K.name}! It's lunch time! Can you try one bite of ${short(K, picky).toLowerCase()} today?`; }
  else if (ate.size >= 5) { expr = 'cheer'; line = `Wow, ${K.name}! You ate ${ate.size} colours. A whole rainbow!`; }
  else if (1 - rec.w >= .6) { expr = 'happy'; line = `Yummy lunch, ${K.name}! You ate ${ate.size} colours today.`; }
  else { expr = 'calm'; line = `That's okay, ${K.name}. Tomorrow let's try a little more.`; }
  const cards = MENU.map((d, i) => {
    const f = done ? ateFrac(rec, d) : null, s = done ? stars(f) : 0;
    return `<button class="kfood ${!done && d.id === picky.id ? 'try' : ''}" style="--d:${i * 90}ms" data-food="${d.id}">
      ${!done && d.id === picky.id ? '<em>Try me!</em>' : ''}
      <span class="kf-pic">${V.food(d, 58)}</span><b>${esc(short(K, d))}</b>
      ${done ? `<span class="kstars" aria-label="${s} stars">${'★'.repeat(s)}<i>${'★'.repeat(3 - s)}</i></span>` : ''}
    </button>`;
  }).join('');
  return `
  <div class="kscene">
    <i class="k-sun"></i><i class="k-cloud c1"></i><i class="k-cloud c2"></i><i class="k-cloud c3"></i><i class="k-hill h1"></i><i class="k-hill h2"></i>
    <div class="k-bubble"><p id="k-line">${esc(line)}</p><button class="k-speak" data-say="${esc(line)}" aria-label="Read aloud">${ICON.speak}</button></div>
    <button class="k-loopi" id="k-loopi" aria-label="Tap Loopi" data-expr="${expr}">${V.loopi(expr, 150)}</button>
  </div>
  <div class="vcard kidcard"><h3>${done ? 'My lunch' : 'Today\'s lunch'} <small>tap a food</small></h3><div class="kfoods">${cards}</div></div>
  <div class="vcard kidcard rbcard"><h3>${done ? 'My food rainbow' : 'Eat a food rainbow'}</h3>${rainbow(ate, done)}
    <p class="kidline">${done ? `${ate.size} of ${RAINBOW_ORDER.length} colours!` : 'Every colour helps your body in a different way.'}</p></div>`;
}
/** A rainbow made of the colours of today's food. Eaten colours draw in; the rest stay dotted. */
function rainbow(ate, done) {
  const cx = 130, cy = 128;
  const arcs = RAINBOW_ORDER.map((c, i) => {
    const r = 108 - i * 13, len = (Math.PI * r).toFixed(1), on = ate.has(c);
    return `<path d="M${cx - r} ${cy}A${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke-width="11" stroke-linecap="round" class="${on ? 'arc on' : 'arc'}" style="--c:${H.RAINBOW[c]};--len:${len};--i:${ate.size ? [...RAINBOW_ORDER].filter(x => ate.has(x)).indexOf(c) : 0}"/>`;
  }).join('');
  return `<svg class="rainbow2 ${done ? 'done' : ''}" viewBox="0 0 260 140" role="img" aria-label="${ate.size} colours eaten">${arcs}
    <g class="rb-cloud"><circle cx="22" cy="128" r="16"/><circle cx="40" cy="124" r="13"/><circle cx="8" cy="132" r="10"/></g>
    <g class="rb-cloud"><circle cx="238" cy="128" r="16"/><circle cx="220" cy="124" r="13"/><circle cx="252" cy="132" r="10"/></g></svg>`;
}
/** After lunch: each eaten colour chimes in turn, then a fanfare and confetti for a big rainbow. */
function celebrate(K) {
  const n = coloursEaten(K, K.log[0]).size;
  for (let i = 0; i < n; i++) later(() => SFX.chime(i), 350 + i * 420);
  later(() => {
    if (n >= 4) { SFX.fanfare(); confetti(); } else SFX.pop();
    const line = $('#k-line', root); if (line) say(line.textContent);
  }, 350 + n * 420 + 150);
}
function confetti() {
  const box = $('.kscene', root); if (!box) return;
  const cols = ['#FF6B5B', '#FFB23F', '#F4C542', '#3DB85A', '#4DA3FF', '#D6246E'];
  for (let i = 0; i < 44; i++) {
    const p = document.createElement('i');
    p.className = 'confetti';
    p.style.cssText = `left:${Math.random() * 100}%;background:${cols[i % cols.length]};--dx:${(Math.random() - .5) * 120}px;--r:${Math.random() * 720 - 360}deg;animation-delay:${Math.random() * .4}s;animation-duration:${1.6 + Math.random()}s`;
    box.appendChild(p);
  }
  later(() => $$('.confetti', root).forEach(p => p.remove()), 3200);
}

/* ================================================================ for grown-ups */
function grown(K) {
  const seg = `<div class="seg role-seg" id="role-seg"><button data-role="parent" aria-pressed="${ui.role === 'parent'}">Parents</button><button data-role="teacher" aria-pressed="${ui.role === 'teacher'}">Teachers</button></div>`;
  return seg + (ui.role === 'teacher' ? teacher() : parent(K));
}
/** Parents: one child's lunch report. */
function parent(K) {
  const today = scannedToday(K), rec = K.log[0], T = H.KIDS_TARGET;
  const days = [...K.log].reverse();
  const ranked = MENU.map(d => ({ d, a: avgEaten(K, d.id) })).sort((a, b) => b.a - a.a);
  const fav = ranked.slice(0, 2), picky = ranked[ranked.length - 1];
  const vegDays = K.log.filter(l => MENU.some(d => d.group === 'veg' && l.eaten[d.id] >= l.served[d.id] * .5)).length;
  const allergen = MENU.find(d => d.allergen && d.allergen === K.allergy);
  return `
  ${V.guide('calm', `${today ? 'Today' : `On ${rec.day}`}, ${esc(K.name)} ate ${pct(1 - rec.w)} of lunch.${K.allergy ? ` Every tray this week was checked for ${esc(K.allergy.toLowerCase())}.` : ''}`)}
  ${K.allergy ? `<div class="vtips">${V.tip('check', 'good', `${esc(K.allergy)} allergy: safe tray`, `${allergen ? `${esc(K.name)} was served ${esc(allergen.safe.toLowerCase())}. ` : ''}No ${esc(K.allergy.toLowerCase())} on the tray this week.`)}</div>` : ''}
  <div class="vcard"><h3>What ${esc(K.name)} ate <small>${today ? 'today' : rec.day}</small></h3>${V.tray(MENU, rec, { name: d => dishName(K, d) })}</div>
  <div class="vcard"><h3>Nutrition <small>lunch for age ${K.age}</small></h3><div class="vrings">${V.ring(rec.n.kcal, T.kcal, 'Energy', 'kcal')}${V.ring(rec.n.p, T.p, 'Protein', 'g', 'aim')}${V.ring(rec.n.c, T.c, 'Carbs', 'g')}</div></div>
  <div class="vcard"><h3>Plate balance</h3>${V.healthyPlate(V.plateShares(MENU, rec.eaten), { you: `${esc(K.name)}'s plate` })}</div>
  <div class="vcard"><h3>This week <small>share of lunch eaten</small></h3>${V.week(days.map(l => l.day), days.map(l => 1 - l.w), { today: today ? days.length - 1 : -1 })}</div>
  <div class="vtips">
    ${V.tip('check', 'good', `Favourites: ${fav.map(x => x.d.name.toLowerCase()).join(' and ')}`, `Usually ${fav.map(x => pct(x.a)).join(' and ')} eaten.`)}
    ${V.tip('leaf', picky.d.group === 'veg' ? 'warn' : 'info', `Least eaten: ${picky.d.name.toLowerCase()} (${pct(picky.a)})`, picky.d.group === 'veg' ? 'Small pieces and offering it again at home both help. It can take many tries to like a new vegetable.' : 'Worth a gentle try at home too.')}
    ${V.tip('plate', 'info', `Vegetables on ${vegDays} of ${K.log.length} days`, 'Days when at least half the vegetables were eaten.')}
  </div>
  <div class="vcard note2"><p>${K.note ? `“${esc(K.note)}”` : 'No note from the teacher yet today.'}</p><span>Ms. Farah, Sunflower class</span></div>
  <div class="two-btn"><button class="btn" data-lock>Back to Loopi</button><button class="btn" data-print>Print report</button></div>
  <p class="foot">Measured by the preschool scanner before and after lunch. The teacher helps each child look at the camera. Targets are illustrative.</p>`;
}
/** Teachers: the whole class today, who needs a check-in, allergies, the week, and notes for parents. */
function teacher() {
  const all = kids(), done = all.filter(scannedToday), recs = done.map(k => k.log[0]);
  const avgEat = recs.length ? recs.reduce((s, r) => s + (1 - r.w), 0) / recs.length : 0;
  const veg = MENU.filter(d => d.group === 'veg');
  const vegEat = recs.length ? recs.reduce((s, r) => s + veg.reduce((a, d) => a + ateFrac(r, d), 0) / veg.length, 0) / recs.length : 0;
  const check = done.filter(k => 1 - k.log[0].w < .5);
  const allergic = all.filter(k => k.allergy);
  const foodAvg = MENU.map(d => ({ d, a: recs.length ? recs.reduce((s, r) => s + ateFrac(r, d), 0) / recs.length : 0 })).sort((a, b) => a.a - b.a);
  const weekDays = ['Mon 21', 'Tue 22', 'Wed 23', 'Thu 24', H.TODAY];
  const weekVals = weekDays.map(day => { const rs = all.map(k => k.log.find(l => l.day === day)).filter(Boolean); return rs.length ? rs.reduce((s, r) => s + (1 - r.w), 0) / rs.length : 0; });
  const F = ui.focus && H.kid(ui.focus);
  return `
  ${V.guide('calm', `Sunflower class: ${done.length} of ${all.length} lunches scanned today.${check.length ? ` ${check.length} ${check.length === 1 ? 'child ate' : 'children ate'} less than half.` : ' Everyone scanned so far ate well.'}`)}
  <div class="vcard"><h3>Class today</h3><div class="vrings">${V.pctRing(done.length / all.length, 'Scanned', .99)}${V.pctRing(avgEat, 'Lunch eaten')}${V.pctRing(vegEat, 'Veg eaten', .6)}</div></div>
  ${F ? childPanel(F) : ''}
  <div class="vcard"><h3>Children <small>tap one for details and a note</small></h3><div class="roster">${all.map(k => {
    const r = scannedToday(k) ? k.log[0] : null, f = r ? 1 - r.w : 0;
    return `<button class="rkid ${ui.focus === k.id ? 'on' : ''} ${r && f < .5 ? 'low' : ''}" data-focus="${k.id}">
      ${V.avatar(k, 38)}<b>${esc(k.name)}</b>
      ${r ? `<span class="rring" style="--p:${Math.round(f * 100)};--c:${f >= .75 ? 'var(--tint)' : f >= .5 ? '#FFB23F' : '#FF6B5B'}"><i class="num">${pct(f)}</i></span>` : '<span class="rwait">not yet</span>'}
      ${k.allergy ? `<em class="alg">${esc(k.allergy)}</em>` : ''}${k.note ? '<em class="nt">note</em>' : ''}
    </button>`;
  }).join('')}</div></div>
  <div class="vtips">
    ${check.length ? V.tip('warn', 'warn', `Check in with ${check.map(k => k.name).join(', ')}`, 'They ate less than half of lunch today.') : V.tip('check', 'good', 'No one needs a check-in', 'Every scanned child ate at least half of lunch.')}
    ${V.tip('check', 'good', `${allergic.length} children with allergies, all trays safe`, allergic.map(k => `${k.name} (${k.allergy.toLowerCase()})`).join(', ') + '. Egg-free corn soup was served where needed.')}
    ${recs.length ? V.tip('leaf', 'info', `Least eaten today: ${foodAvg[0].d.name.toLowerCase()} (${pct(foodAvg[0].a)})`, `Most eaten: ${foodAvg[foodAvg.length - 1].d.name.toLowerCase()} (${pct(foodAvg[foodAvg.length - 1].a)}).`) : ''}
  </div>
  <div class="vcard"><h3>Class this week <small>share of lunch eaten</small></h3>${V.week(weekDays, weekVals, { today: 4 })}</div>
  <div class="two-btn"><button class="btn primary" id="send-parents">Send today's reports to parents</button><button class="btn" data-print>Print class sheet</button></div>
  <p class="foot">Only Sunflower class staff see this page. Parents only see their own child.</p>`;
}
function childPanel(K) {
  const r = scannedToday(K) ? K.log[0] : null;
  return `<div class="vcard focus"><h3>${V.avatar(K, 30)} ${esc(K.name)} <small>${r ? `${pct(1 - r.w)} eaten today` : 'lunch not scanned yet'}</small></h3>
    ${r ? V.tray(MENU, r, { name: d => dishName(K, d), size: 32 }) : ''}
    <label class="note-edit"><span>Note for ${esc(K.name)}'s family</span><textarea id="note-text" rows="3" placeholder="What did ${esc(K.name)} try or enjoy today?">${esc(K.note || '')}</textarea></label>
    <div class="two-btn"><button class="btn primary" id="save-note">Save note</button><button class="btn" data-open-parent="${K.id}">Open parent report</button></div></div>`;
}

/* ================================================================ grown-up check */
function gate() {
  const a = 2 + Math.floor(Math.random() * 6), b = 2 + Math.floor(Math.random() * 6), ans = a + b;
  ui.gate = { a, b, ans, opts: [ans, ans + 2, ans - 1].sort(() => Math.random() - .5) }; layer();
}
function layer() {
  const el = $('#kid-layer', root); if (!el) return;
  if (!ui.gate) { el.innerHTML = ''; return; }
  const { a, b, opts } = ui.gate;
  el.innerHTML = `<div class="pmodal" role="dialog" aria-label="Grown-ups only"><div class="pmodal-card"><h3>Grown-ups only</h3><p class="center hint">What is ${a} + ${b}?</p><div class="gate-opts">${opts.map(o => `<button class="btn" data-ans="${o}">${o}</button>`).join('')}</div><button class="btn ghost" data-cancel>Cancel</button></div></div>`;
  $$('[data-ans]', el).forEach(bt => bt.onclick = () => { if (+bt.dataset.ans === ui.gate.ans) { ui.adult = true; ui.tab = 'grown'; } else { SFX.soft(); PL.toast('Not quite. Ask a grown-up!'); } ui.gate = null; render(); });
  $('[data-cancel]', el).onclick = () => { ui.gate = null; layer(); };
}

/* ================================================================ wiring */
function wire(K) {
  const body = $('#kid-body', root);
  const mute = $('#mute', root); if (mute) mute.onclick = () => { SFX.toggle(); render(true); };
  $$('[data-say]', body).forEach(b => b.onclick = () => { SFX.pop(); say(b.dataset.say); });
  const lp = $('#k-loopi', body);
  if (lp) lp.onclick = () => {
    const line = TAPS[Math.floor(Math.random() * TAPS.length)];
    lp.innerHTML = V.loopi('cheer', 150); lp.classList.remove('boing'); void lp.offsetWidth; lp.classList.add('boing');
    SFX.giggle(); $('#k-line', body).textContent = line; $('.k-speak', body).dataset.say = line; say(line);
    later(() => { if (lp.isConnected) lp.innerHTML = V.loopi(lp.dataset.expr, 150); }, 1400);
  };
  $$('[data-food]', body).forEach(b => b.onclick = () => {
    const d = MENU.find(x => x.id === b.dataset.food), fact = `${short(K, d)}! ${FACTS[d.id]}`;
    b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle');
    SFX.boop(); $('#k-line', body).textContent = fact; $('.k-speak', body).dataset.say = fact; say(fact);
  });
  $$('#role-seg button', body).forEach(b => b.onclick = () => { SFX.tap(); ui.role = b.dataset.role; render(); $('#kid-body').scrollTop = 0; });
  $$('[data-focus]', body).forEach(b => b.onclick = () => { SFX.tap(); ui.focus = ui.focus === b.dataset.focus ? null : b.dataset.focus; render(true); });
  const sn = $('#save-note', body);
  if (sn) sn.onclick = () => { const k = H.kid(ui.focus); k.note = $('#note-text', body).value.trim(); PL.store.save('kids'); PL.toast(`Note saved. ${k.name}'s family will see it in their report.`); };
  $$('[data-open-parent]', body).forEach(b => b.onclick = () => { PL.S.care.me.kid = b.dataset.openParent; ui.role = 'parent'; ui.focus = null; PL.store.save('me'); $('#kid-body').scrollTop = 0; });
  const sp = $('#send-parents', body); if (sp) sp.onclick = () => PL.toast(`Reports sent to ${kids().filter(scannedToday).length} families (demo, nothing was sent).`);
  $$('[data-lock]', body).forEach(b => b.onclick = () => { ui.adult = false; ui.tab = 'kid'; render(); });
  $$('[data-print]', body).forEach(b => b.onclick = () => print());
}

PL.apps.kids = {
  title: 'Loopi Kids',
  mount,
  unmount() { clearTimers(); ui.adult = false; ui.tab = 'kid'; ui.gate = null; ui.focus = null; root = null; if ('speechSynthesis' in window) speechSynthesis.cancel(); },
  update(kind) { const f = document.activeElement; if (f && f.id === 'note-text') return; render(kind !== 'me'); },
};
})();

</script>
<script>
(() => {
  const APP = 'kids', FILES = {'model': '1-plateloop-scanner-3d.html', 'scanner': '2-plateloop-kiosk.html', 'kitchen': '3-plateloop-kitchen.html', 'student': '4-loopi-student-app.html', 'care': '5-loopi-care-hospital.html', 'kids': '6-loopi-kids-kindergarten.html', 'work': '7-loopi-work-office.html', 'lunch': '8-plateloop-lunch-rush-3d.html'};
  const go = n => { location.href = FILES[n]; };
  PL.open = go;
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]'); if (!a) return;
    const n = a.getAttribute('href').slice(1); if (FILES[n]) { e.preventDefault(); go(n); }
  });
  if (/[?&]demo=lunch\b/.test(location.search) && PL.cls32Scanned() === 0) { PL.scanRestOfClass(); PL.store.save('scan'); }
  const app = PL.apps[APP];
  document.body.dataset.app = APP;
  app.mount(document.getElementById('root'));
  PL.store.subscribe((kind, fromSelf) => { if (app.update) app.update(kind, fromSelf); });
  let t = 0; setInterval(() => { t++; if (app.tick) app.tick(t); }, 480);
})();
</script>
