@media print{.stu-side,.phone-tabs,.demo-switch,.phone-top,.two-btn{display:none!important}.phone{box-shadow:none!important;height:auto!important;overflow:visible!important}.phone-body{overflow:visible!important}}
.grow-btn{background:#FF9F0A;animation:pop .5s ease-out}
.grow-btn:hover{background:#F08F00}
/* Kitchen: carbon breakdown */
.cstack{display:flex;height:14px;border-radius:999px;overflow:hidden;margin-top:14px;gap:2px}
.cstack i{display:block;height:100%}
.clist{display:flex;flex-direction:column;margin-top:10px}
.clist div{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:.5px solid var(--sep);font-size:14px}
.clist div:last-child{border-bottom:0}
.clist b{font-weight:600}
.clist .dot{width:10px;height:10px}

/* ================================================================ Loopi Work (office cafeterias) */
.work-icon{background:linear-gradient(145deg,#EEF0FF,#D6DAF7)}
.work .phone-tabs button[aria-selected="true"]{color:var(--indigo)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--indigo);color:#fff;display:grid;place-items:center;font:700 13px var(--font);flex:none}
.demo-box .check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--label)}
.demo-box .check input{width:18px;height:18px;accent-color:var(--tint)}
.pick{padding:0}
.pick > * + *{border-top:.5px solid var(--sep)}
.pick-head{display:flex;flex-direction:column;gap:3px;padding:14px}
.pick-head .pill{align-self:flex-start;margin-bottom:4px}
.pick-head b{font:700 20px var(--font-d);letter-spacing:-.02em}
.pick-head > span:last-child{font-size:13px;color:var(--label2)}
.tweaks{list-style:none;margin:0;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.tweaks li{display:flex;gap:8px;align-items:center;font-size:14px}
.tweaks svg{width:16px;height:16px;color:var(--tint);flex:none}
.pad-in{padding:4px 14px 12px}
.fit{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.fit.good{background:var(--tint-soft);color:var(--tint-ink)}
.fit.ok{background:rgba(0,122,255,.12);color:var(--blue)}
.fit.mid{background:var(--orange-soft);color:var(--orange)}
.fit.bad{background:var(--red-soft);color:var(--red)}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal-opt{border:0;background:var(--bg2);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow-s);font:inherit;color:inherit}
.goal-opt b{font-size:15px}
.goal-opt span{font-size:12px;color:var(--label2);line-height:1.35}
.goal-opt.on{box-shadow:inset 0 0 0 2px var(--indigo);background:color-mix(in srgb,var(--indigo) 8%,var(--bg2))}
.form > * + *{border-top:.5px solid var(--sep)}
.f-row{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;padding:9px 14px;font-size:14px}
.f-row.col{grid-template-columns:1fr;gap:8px}
.f-row input{font:inherit;width:100%;padding:8px 10px;border-radius:10px;border:0;background:var(--fill);color:var(--label);text-align:right}
.finding b{font-weight:600}

/* ================================================================ Visual toolkit (js/visual.js) */
.loopi{display:block;overflow:visible;flex:none}
.loopi .lp-body{animation:lpbob 3.2s ease-in-out infinite;transform-origin:60px 120px}
.loopi .lp-eye{animation:lpblink 5.5s infinite;transform-box:fill-box;transform-origin:center}
.loopi .lp-wave{animation:lpwave 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
.loopi .lp-leaf{animation:lpleaf 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
.lp-cheer .lp-body{animation:lpjump 1.4s ease-in-out infinite}
@keyframes lpbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes lpjump{0%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}55%{transform:translateY(0)}}
@keyframes lpblink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes lpwave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
@keyframes lpleaf{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
.guide{display:flex;align-items:flex-end;gap:10px;flex:none}
.guide .bubble{position:relative;flex:1;min-width:0;background:var(--bg2);border-radius:20px 20px 20px 6px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.guide .bubble p{margin:0;font-size:15px;line-height:1.4;font-weight:500;flex:1}
.guide.big .bubble p{font-size:17px}
.guide .speak{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--tint);color:#fff;display:grid;place-items:center}
.guide .speak svg{width:18px;height:18px}
/* food + tray */
svg.food{display:block}
.vtray{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:8px;padding:10px;border-radius:22px;background:linear-gradient(145deg,#EEF1F3,#DDE2E6);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(0,0,0,.06)}
.vcell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:16px;background:rgba(255,255,255,.72);box-shadow:inset 0 1px 3px rgba(0,0,0,.06);text-align:center;color:#1D1D1F}
.vcell.hi{background:#fff;box-shadow:0 0 0 2.5px var(--tint),0 6px 16px -6px rgba(52,199,89,.5)}
.vcell span{font-size:11.5px;font-weight:600;line-height:1.2}
.vcell b{font-size:13px;color:#3A3A3C}
.vcell em{font-style:normal;font-size:10.5px;font-weight:700;color:#fff;background:var(--tint);border-radius:999px;padding:1px 7px}
.vfood{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#fff;position:relative}
.vfood.scored{background:conic-gradient(var(--c) calc(var(--p) * 1%),#E5E5EA 0)}
.vfood.scored::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
.vfood .food{position:relative}
/* My Healthy Plate */
.hplate{display:grid;grid-template-columns:auto auto 1fr;gap:4px 14px;align-items:center}
.hplate figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.hplate figcaption{font-size:11.5px;font-weight:600;color:var(--label2)}
.hplate .ideal{opacity:.85}
.hlegend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.hlegend li{display:grid;grid-template-columns:10px 1fr auto;column-gap:6px;align-items:center}
.hlegend i{width:10px;height:10px;border-radius:3px}
.hlegend b{font-size:13px}
.hlegend small{grid-column:2 / 4;color:var(--label3);font-size:11px;margin-top:-3px}
.hverdict{grid-column:1 / -1;margin:6px 0 0;font-size:13.5px;font-weight:500;background:var(--fill);border-radius:12px;padding:8px 11px}
@media (max-width:420px){.hplate{grid-template-columns:auto 1fr}.hplate .ideal{display:none}}
/* rings */
.vrings{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:10px}
.vring{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.vr{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--fill2) 0);display:grid;place-items:center;position:relative}
.vr::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg2)}
.vr > div{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.vr b{font:700 18px var(--font-d);letter-spacing:-.02em}
.vr small{font-size:10.5px;color:var(--label3)}
.vring > span{font-size:12.5px;font-weight:600;color:var(--label2)}
/* week of plates */
.vweek{display:flex;justify-content:space-between;gap:6px}
.vweek > div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.vweek i{width:100%;max-width:46px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--fill2) 0);position:relative;box-shadow:0 0 0 3px var(--bg2),0 0 0 4px var(--sep)}
.vweek i::after{content:"";position:absolute;inset:30%;border-radius:50%;background:var(--bg2)}
.vweek b{font-size:12px}
.vweek span{font-size:11px;color:var(--label3);font-weight:600}
.vweek .today span{color:var(--tint-ink)}
/* tips */
.vicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--ic) 14%,transparent);color:var(--ic)}
.vicon svg{width:22px;height:22px}
.vtip{display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.vtip b{display:block;font-size:14.5px;line-height:1.3}
.vtip span{display:block;font-size:13px;color:var(--label2);line-height:1.4;margin-top:2px}
.vcard{background:var(--bg2);border-radius:20px;padding:16px;box-shadow:var(--shadow-s);flex:none}
.vcard > h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.vcard > h3 small{font:500 12px var(--font);color:var(--label3)}
.vtips{background:var(--bg2);border-radius:20px;box-shadow:var(--shadow-s);overflow:hidden;flex:none}
.vtips > * + *{border-top:.5px solid var(--sep)}

/* ================================================================ warm, always-light theme for the children's apps */
.warm{--bg:#FFF6EA;--bg2:#FFFFFF;--fill:#FFF1DE;--fill2:#F3E6D2;--fill3:#E4D3BA;--label:#2B2118;--label2:#7A6A58;--label3:#A8977F;--sep:rgba(120,90,50,.14);--tint:#3DB85A;--tint-ink:#2B8C43;--tint-soft:#E3F6E5;--bar2:rgba(255,250,242,.9);--shadow-s:0 2px 10px rgba(120,80,30,.07);color-scheme:light;color:var(--label)}
.warm .phone{background:var(--bg)}
.warm .phone-top{background:rgba(255,250,242,.92)}
.warm .phone-tabs{background:rgba(255,250,242,.94)}
.warm .phone-tabs button[aria-selected="true"]{color:var(--tint-ink)}
.warm .seg{background:var(--fill2)}
.warm .seg button[aria-pressed="true"]{background:#fff}
.warm .btn{background:var(--fill);color:var(--label)}
.warm .btn.primary{background:var(--tint);color:#fff}
.warm .vr::before{background:#fff}
.warm .vweek i::after{background:#fff}
/* ================================================================ Loopi (students) */
.av-circle{border-radius:50%;background:var(--av);color:#fff;display:inline-grid;place-items:center;font-weight:700;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.loopi-icon svg{display:block}
.journey{list-style:none;margin:0;padding:12px 8px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg2);border-radius:20px;box-shadow:var(--shadow-s);position:relative;flex:none}
.journey li{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.journey li + li::before{content:"";position:absolute;top:19px;right:calc(50% + 22px);width:calc(100% - 44px);height:3px;border-radius:3px;background:var(--fill2)}
.journey li.done + li::before,.journey li.done + li.done::before{background:var(--tint)}
.journey span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--label3)}
.journey span svg{width:20px;height:20px}
.journey li.now span{background:#fff;color:var(--tint-ink);box-shadow:0 0 0 3px var(--tint);animation:pulse 1.8s ease-in-out infinite}
.journey li.done span{background:var(--tint);color:#fff}
.journey small{font-size:11px;font-weight:600;color:var(--label2);line-height:1.2}
.journey li.now small{color:var(--label)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--tint)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--tint) 25%,transparent)}}
.tries{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tries div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:var(--fill);font-size:12px;font-weight:600;color:var(--label3)}
.tries div .food{filter:grayscale(1);opacity:.35}
.tries div.on{background:var(--tint-soft);color:var(--tint-ink)}
.tries div.on .food{filter:none;opacity:1}
.goalbar{height:14px;border-radius:999px;background:var(--fill2);overflow:hidden;position:relative}
.goalbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFB23F,var(--tint))}
.goalbar.done i{background:var(--tint)}
.podium2{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;flex:none}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pod b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod small{font-size:11.5px;color:var(--label2)}
.pod .step{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:center;font:700 20px var(--font-d);color:#fff;margin-top:4px}
.pod.p1 .step{height:70px;background:linear-gradient(180deg,#F7C948,#E0A800)}
.pod.p2 .step{height:48px;background:linear-gradient(180deg,#C9CED4,#9EA4AB)}
.pod.p3 .step{height:36px;background:linear-gradient(180deg,#E6A673,#C27C3E)}
.warm .lb{background:var(--bg2);box-shadow:var(--shadow-s)}
.warm .lb-row.me{background:var(--tint-soft)}
.lb-row .av-circle{justify-self:center}
.schools{padding:6px 14px}
.sch-row{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--sep)}
.sch-row:last-child{border-bottom:0}
.sch-row > span{color:var(--label3);font-weight:700;text-align:center}
.sch-row b{font-size:14px}
.sch-row.us b:first-child{color:var(--tint-ink)}
.sbar{height:8px;border-radius:999px;background:var(--fill2);margin-top:5px;overflow:hidden}
.sbar i{display:block;height:100%;border-radius:999px;background:var(--tint)}
.profile2{display:flex;align-items:center;gap:14px}
.profile2 b{display:block;font:700 22px var(--font-d);letter-spacing:-.02em}
.profile2 span{font-size:13px;color:var(--label2)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none}
.statgrid div{background:var(--bg2);border-radius:18px;padding:12px;box-shadow:var(--shadow-s);display:flex;flex-direction:column;gap:6px}
.statgrid b{font:700 24px var(--font-d);letter-spacing:-.02em;line-height:1}
.statgrid span{font-size:12px;color:var(--label2);line-height:1.25}
.hist2{display:flex;flex-direction:column}
.hist2 div{display:grid;grid-template-columns:30px 1fr auto 40px;gap:10px;align-items:center;padding:8px 0;border-bottom:.5px solid var(--sep);font-size:14px}
.hist2 div:last-child{border-bottom:0}
.hist2 i{width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--tint) calc(var(--p) * 1%),var(--fill2) 0);position:relative}
.hist2 i::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg2)}
.hist2 b{font-size:13px;color:var(--label2);font-weight:500}
.hist2 em{font-style:normal;font-weight:700;color:var(--tint-ink);font-size:13px;text-align:right}
.phone-top .av-circle{box-shadow:none}
/* ================================================================ Loopi Kids */
.kidcard h3{font-size:18px}
.kids .vcell span{font-size:12.5px}
.rb-dots.big{gap:10px}
.rb-dots.big .rb{width:46px;height:46px}
.kidline{text-align:center;margin:10px 0 0;font-size:15px;font-weight:600;color:var(--label2)}
.note2{background:#FFF9E8;border:1px dashed #E8CF8A}
.note2 p{margin:0;font-size:15px;line-height:1.45;font-style:italic}
.note2 span{display:block;margin-top:6px;font-size:12.5px;color:var(--label2)}
.kio-left .loopi{width:24cqw;height:auto}
/* ================================================================ Loopi Care visuals */
.meals3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mealc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 12px;border-radius:16px;background:var(--fill);text-align:center}
.mealc.next{background:var(--bg2);box-shadow:inset 0 0 0 2px var(--blue)}
.mealc-top{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.mealc-top b{font-size:13.5px}
.mealc-top small{font-size:11px;color:var(--label3)}
.mealc-food{display:flex;flex-wrap:wrap;justify-content:center;gap:0;max-width:64px}
.mealc-ring{width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--fill2) 0);display:grid;place-items:center;position:relative}
.mealc-ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg2)}
.mealc-ring b{position:relative;font-size:13px}
.mealc-wait{width:52px;height:52px;border-radius:50%;border:2px dashed var(--fill3);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--label3)}
.mealc.next .mealc-wait{border-color:var(--blue);color:var(--blue)}
.mealc > span{font-size:11px;color:var(--label2);line-height:1.25}
.vtips.alert{background:var(--orange-soft)}
.leftlist{display:flex;flex-direction:column}
.leftlist div{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:.5px solid var(--sep);font-size:14px}
.leftlist div:last-child{border-bottom:0}
.leftlist b{font-size:13px;color:#E4674B}
/* the tray in dark mode (the children's apps stay light) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) :not(.warm) > .vcard .vtray,:root:not([data-theme="light"]) .vcard:not(.warm .vcard) .vtray{background:linear-gradient(145deg,#2C2C2E,#232325);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  :root:not([data-theme="light"]) .vcard:not(.warm .vcard) .vcell{background:rgba(255,255,255,.06);color:var(--label);box-shadow:none}
  :root:not([data-theme="light"]) .vcard:not(.warm .vcard) .vcell b{color:var(--label2)}
  :root:not([data-theme="light"]) .vcard:not(.warm .vcard) .vfood.scored::before{background:#2C2C2E}
  :root:not([data-theme="light"]) .vcard:not(.warm .vcard) .vfood{background:#3A3A3C}
  :root:not([data-theme="light"]) .hverdict{background:var(--fill)}
}
/* ================================================================ Loopi Work visuals */
.pick2 .vtray{margin-bottom:10px}
.pick2 .tweaks{padding:0 2px 12px}
.lines2{display:flex;flex-direction:column}
.lines2 > div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:.5px solid var(--sep)}
.lines2 > div:last-child{border-bottom:0}
.lines2 b{display:block;font-size:14px}
.lines2 small{font-size:12px;color:var(--label2)}
.lthumbs{display:flex;background:var(--fill);border-radius:12px;padding:3px 4px}
.lthumbs .food{margin:0 -3px}
.goal-opt .vicon{margin-bottom:4px}
.phone-body > *{flex-shrink:0}
.warm .seg button[aria-pressed="true"]{background:#fff!important;color:var(--label);box-shadow:0 1px 3px rgba(120,80,30,.15)}
.warm .seg button{color:var(--label2)}
/* ================================================================ Loopi (teens and uni): Tamagotchi screens */
.petstats{background:var(--bg2);border-radius:20px;box-shadow:var(--shadow-s);overflow:hidden;flex:none}
.petstats > div{display:grid;grid-template-columns:38px 58px 1fr auto;gap:10px;align-items:center;padding:9px 14px}
.petstats > div + div{border-top:.5px solid var(--sep)}
.petstats span{font-size:14px;color:var(--label2)}
.petstats b{font-size:13px;color:var(--label2)}
.petstats .pips i{width:15px;height:15px;border-radius:5px}
.growcard .stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.growcard .stages div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--label3)}
.growcard .stages canvas{width:56px;height:47px;image-rendering:pixelated;border-radius:12px;background:#DDE4D4;opacity:.45;filter:grayscale(.6)}
.growcard .stages .past canvas{opacity:.8;filter:none}
.growcard .stages .now canvas{opacity:1;filter:none;box-shadow:0 0 0 3px var(--tint)}
.growcard .stages .now{color:var(--tint-ink)}
.growcard p{margin:0;font-size:13.5px;color:var(--label2);line-height:1.4}
.growcard p b{color:var(--label)}
.petguide canvas{width:84px;height:70px;image-rendering:pixelated;border-radius:18px;background:#DDE4D4;flex:none;margin-bottom:18px}
.pfpet{width:84px;height:70px;image-rendering:pixelated;border-radius:16px;background:#DDE4D4;flex:none}
.pod canvas{image-rendering:pixelated;border-radius:12px;background:#DDE4D4}

/* ================================================================ Loopi game: kitchen, wardrobe, barn */
.phone-tabs.five{grid-template-columns:repeat(5,1fr)}
.phone-top .gems{display:inline-flex;align-items:center;gap:4px;background:var(--fill);border-radius:999px;padding:4px 10px 4px 7px;font-weight:600;font-size:14px;margin-left:8px}
.gems{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.gem{width:15px;height:15px;flex:none;vertical-align:-2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .btn{border-radius:14px;padding:10px;justify-content:flex-start}
.two .btn .vicon{width:30px;height:30px;border-radius:9px}
.two .btn .vicon svg{width:18px;height:18px}
.snackrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.snk{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:var(--fill);border-radius:14px;padding:9px 11px;text-align:left;font:inherit;color:inherit;min-width:120px}
.snk.golden{background:linear-gradient(145deg,#FFF3C4,#FFE08A);color:#5A4300;box-shadow:inset 0 0 0 1.5px #F2C94C}
.snk-ic{display:flex;margin:-2px -3px 2px}
.snk-ic svg.food{margin-right:-4px}
.snk b{font-size:13.5px}
.snk small{font-size:12px;color:var(--tint-ink);font-weight:600}
.snk:active{transform:scale(.97)}
.eggbtn{display:flex;gap:10px;align-items:center;justify-content:center;background:var(--bg2);box-shadow:var(--shadow-s)}
.egg-ic,.egg-reveal{display:inline-block;width:22px;height:28px;border-radius:50% 50% 46% 46% / 58% 58% 42% 42%;background:radial-gradient(circle at 35% 30%,#fff,var(--egg) 70%);box-shadow:inset 0 -3px 5px rgba(0,0,0,.12)}
.egg-reveal{display:block;width:84px;height:108px;margin:6px auto 4px;animation:pop .5s ease-out}
.egg-ic.common,.egg-reveal.common{--egg:#E9E4D8}.egg-ic.rare,.egg-reveal.rare{--egg:#8CC4F5}.egg-ic.epic,.egg-reveal.epic{--egg:#C79AF0}.egg-ic.legendary,.egg-reveal.legendary{--egg:#F7C948}
.rar{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--fill);color:var(--label2)}
.rar-rare{background:rgba(0,122,255,.12);color:var(--blue)}
.rar-epic{background:rgba(175,82,222,.14);color:var(--purple)}
.rar-legendary{background:rgba(255,204,0,.2);color:#B38600}
/* kitchen */
.pantry{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pan{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px;border-radius:14px;background:var(--fill);border:0;font:inherit;color:inherit;text-align:center}
.pan b{font:700 17px var(--font-d)}
.pan small{font-size:11px;color:var(--label2);line-height:1.2}
button.pan:hover{background:var(--fill2)}
button.pan:active{transform:scale(.95)}
button.pan:disabled{opacity:.35;cursor:not-allowed}
.oven2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:linear-gradient(180deg,#3A3A3C,#2C2C2E);border-radius:18px;padding:10px;box-shadow:inset 0 2px 8px rgba(0,0,0,.4)}
.slot2{aspect-ratio:1;border-radius:12px;background:radial-gradient(circle at 50% 70%,#5A3A2A,#3A2A22);box-shadow:inset 0 2px 6px rgba(0,0,0,.5);display:grid;place-items:center;position:relative}
.slot2 > span{color:rgba(255,255,255,.25);font:700 16px var(--font-d)}
.slot2 em{position:absolute;bottom:3px;font:600 9px var(--font);font-style:normal;color:#8BE0A4}
.oven-msg{min-height:20px;margin:10px 0;font-size:13.5px;color:var(--label2)}
.recipes2{display:flex;flex-direction:column;gap:8px}
.rcp{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--fill);border-radius:14px;padding:8px 10px}
.rcp b{display:block;font-size:14px}
.rcp small{font-size:12px;color:var(--label2)}
.rcp.locked .seq2{filter:grayscale(1);opacity:.45}
.seq2{display:flex;align-items:center}
.seq2 i{font-style:normal;color:var(--label3);margin:0 1px;font-size:12px}
.binbox{display:flex;flex-wrap:wrap;gap:2px;min-height:44px;padding:8px;border-radius:14px;background:linear-gradient(180deg,#6B4A2B,#4A3220)}
.binbox .hint{color:#E8D6BE}
.catch-wrap{position:relative;border-radius:16px;overflow:hidden;touch-action:none}
.catch-wrap canvas{display:block;width:100%;height:auto;image-rendering:pixelated;aspect-ratio:5/6}
.catch-hud{position:absolute;top:8px;left:10px;right:10px;font:600 13px var(--font);color:#1D1D1F}
.catch-hud span{color:var(--red);letter-spacing:2px}
.catch-cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);color:#1D1D1F;text-align:center;padding:18px}
.catch-cover .btn{width:auto;padding-inline:36px}
.catch-cover small{font-size:12px;color:#3A3A3C;max-width:30ch}
.catch-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.catch-ctrl .btn{font-size:17px;user-select:none;touch-action:none;border-radius:14px}
.got2{display:flex;flex-direction:column;gap:6px}
.got2 > div{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:12px;padding:6px 10px;font-size:14px}
.cardic{width:24px;height:30px;border-radius:5px;background:linear-gradient(145deg,#F7E3A1,#E8C25C);box-shadow:inset 0 0 0 2px #fff,0 1px 3px rgba(0,0,0,.2)}
/* sheets */
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;animation:sheetin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet header{display:flex;align-items:center;gap:10px;padding:54px 16px 12px;background:var(--bar2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep)}
.sheet header h3{flex:1;font-size:20px;font-weight:700}
.sheet-body{flex:1;overflow-y:auto;padding:14px 14px 24px;display:flex;flex-direction:column;gap:12px}
.sheet-body > *{flex-shrink:0}
.crates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.crate{border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;background:var(--bg2);box-shadow:var(--shadow-s)}
.crate-box{width:40px;height:32px;border-radius:6px;background:linear-gradient(180deg,#C8904F 0 30%,#A8733A 30%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.15);margin-bottom:4px;position:relative}
.crate-box::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:rgba(255,255,255,.25)}
.crate-epic .crate-box{background:linear-gradient(180deg,#B57AE6 0 30%,#8E4FC7 30%)}
.crate-legendary .crate-box{background:linear-gradient(180deg,#F7D35A 0 30%,#E0A800 30%)}
.crate b{font-size:13px}
.crate small{font-size:10.5px;color:var(--label2)}
.acc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acc{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:var(--bg2);border-radius:16px;padding:9px 4px;font:inherit;color:inherit;box-shadow:var(--shadow-s)}
.acc canvas{width:62px;height:52px;image-rendering:pixelated;border-radius:10px;background:#DDE4D4}
.acc b{font-size:12.5px}
.acc.locked{cursor:default}
.acc.locked canvas{filter:grayscale(1) brightness(.75);opacity:.45}
.acc.on{box-shadow:0 0 0 2px var(--tint)}
.barn-total{display:flex;justify-content:space-between;align-items:center;background:var(--tint-soft);border-radius:14px;padding:12px 14px;font-weight:600}
.barn-total b{font:700 22px var(--font-d)}
.barn{display:flex;flex-direction:column;gap:6px}
.barn-pet{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--bg2);border-radius:14px;padding:7px 10px;box-shadow:var(--shadow-s)}
.barn-pet.active{box-shadow:inset 0 0 0 1.5px var(--tint)}
.barn-pet canvas{width:56px;height:47px;image-rendering:pixelated;border-radius:10px;background:#DDE4D4}
.barn-pet b{display:block;font-size:14px}
.barn-pet small{font-size:12px;color:var(--label2)}
@media (max-width:760px){.sheet{position:fixed;z-index:60}.sheet header{padding-top:16px}}

/* ================================================================ Loopi Kids v2: animated scene, sounds, parents + teachers */
.mute{margin-left:auto;width:40px;height:40px;border-radius:50%;border:0;background:var(--fill);color:var(--tint-ink);display:grid;place-items:center}
.mute svg{width:22px;height:22px}
.kscene{position:relative;height:300px;border-radius:26px;overflow:hidden;flex:none;background:linear-gradient(180deg,#8FD3FF 0%,#C9ECFF 55%,#E8F7FF 100%);box-shadow:var(--shadow-s)}
.k-sun{position:absolute;right:22px;top:18px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle,#FFE36B 55%,#FFC93C 56%);box-shadow:0 0 0 10px rgba(255,217,90,.28),0 0 0 22px rgba(255,217,90,.14);animation:ksun 6s ease-in-out infinite}
@keyframes ksun{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.k-cloud{position:absolute;width:72px;height:24px;border-radius:999px;background:#fff;opacity:.92;animation:kcloud linear infinite}
.k-cloud::before,.k-cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.k-cloud::before{width:32px;height:32px;left:12px;top:-15px}
.k-cloud::after{width:24px;height:24px;left:36px;top:-10px}
.k-cloud.c1{top:34px;animation-duration:28s;animation-delay:-6s}
.k-cloud.c2{top:88px;transform:scale(.7);animation-duration:36s;animation-delay:-20s}
.k-cloud.c3{top:58px;transform:scale(.85);animation-duration:44s;animation-delay:-33s}
@keyframes kcloud{from{left:-90px}to{left:110%}}
.k-hill{position:absolute;bottom:-40px;border-radius:50%}
.k-hill.h1{left:-20%;width:90%;height:120px;background:#7ED67A}
.k-hill.h2{right:-25%;width:95%;height:140px;background:#5CC26A}
.k-bubble{position:absolute;left:14px;right:14px;top:14px;background:#fff;border-radius:22px;padding:12px 12px 12px 16px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 6px 18px rgba(0,60,120,.12);animation:kpop .45s cubic-bezier(.2,1.4,.4,1)}
.k-bubble::after{content:"";position:absolute;left:50%;bottom:-10px;width:20px;height:20px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:4px}
.k-bubble p{margin:0;flex:1;font:600 17px/1.35 var(--font);color:#2B2118}
.k-speak{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--tint);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 #2B8C43}
.k-speak svg{width:20px;height:20px}
.k-speak:active{transform:translateY(2px);box-shadow:0 1px 0 #2B8C43}
.k-loopi{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.k-loopi.boing{animation:kboing .6s cubic-bezier(.3,1.6,.4,1)}
@keyframes kboing{0%{transform:translateX(-50%) scale(1)}30%{transform:translateX(-50%) scale(1.15,.85)}60%{transform:translateX(-50%) scale(.92,1.1) translateY(-14px)}100%{transform:translateX(-50%) scale(1)}}
@keyframes kpop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.kfoods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kfood{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px 10px;border:0;border-radius:20px;background:#fff;box-shadow:0 4px 0 #EFE2CE,0 6px 14px rgba(120,80,30,.08);font:inherit;color:#2B2118;animation:kpop .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--d)}
.kfood b{font-size:13px;line-height:1.2}
.kfood:active{transform:translateY(3px);box-shadow:0 1px 0 #EFE2CE}
.kfood.try{box-shadow:0 0 0 3px var(--tint),0 4px 0 #2B8C43}
.kfood em{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--tint);border-radius:999px;padding:2px 9px;white-space:nowrap;animation:ktry 1.4s ease-in-out infinite}
@keyframes ktry{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}
.kf-pic{width:66px;height:66px;border-radius:50%;background:#FFF6EA;display:grid;place-items:center}
.kfood.wiggle .kf-pic{animation:kwig .5s ease-in-out}
@keyframes kwig{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.1)}50%{transform:rotate(10deg) scale(1.1)}75%{transform:rotate(-6deg)}}
.kstars{font-size:17px;letter-spacing:1px;color:#FFB800;line-height:1}
.kstars i{font-style:normal;color:#EADFCB}
.rbcard{text-align:center}
.rainbow2{width:100%;max-width:300px;display:block;margin:0 auto}
.rainbow2 .arc{stroke:#EDE3D2;stroke-dasharray:3 7}
.rainbow2 .arc.on{stroke:var(--c);stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:kdraw .6s ease-out forwards;animation-delay:calc(.35s + var(--i) * .42s)}
.rainbow2:not(.done) .arc{opacity:.9}
@keyframes kdraw{to{stroke-dashoffset:0}}
.rb-cloud circle{fill:#fff;stroke:#E6DCC8;stroke-width:1.5}
.confetti{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;z-index:5;animation:kfall linear forwards}
@keyframes kfall{to{transform:translate(var(--dx),330px) rotate(var(--r));opacity:.9}}
.role-seg{flex:none}
.role-seg button{padding:9px 10px;font-size:14px}
.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rkid{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border:0;border-radius:16px;background:var(--fill);font:inherit;color:inherit}
.rkid b{font-size:13px}
.rkid.on{background:#fff;box-shadow:0 0 0 2.5px var(--tint)}
.rkid.low{background:#FFF0EC}
.rring{width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--fill2) 0);display:grid;place-items:center;position:relative}
.rring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
.rring i{position:relative;font-style:normal;font-size:10.5px;font-weight:700}
.rwait{height:40px;display:grid;place-items:center;font-size:11px;color:var(--label3)}
.rkid .alg,.rkid .nt{position:absolute;top:6px;font-style:normal;font-size:9.5px;font-weight:700;border-radius:999px;padding:1px 6px}
.rkid .alg{right:6px;background:#FFE3DE;color:#C8321E}
.rkid .nt{left:6px;background:var(--tint-soft);color:var(--tint-ink)}
.vcard.focus{box-shadow:0 0 0 2px var(--tint),var(--shadow-s)}
.vcard.focus h3{justify-content:flex-start}
.vcard.focus h3 small{margin-left:auto}
.note-edit{display:flex;flex-direction:column;gap:6px;margin:12px 0 10px;font-size:13px;font-weight:600;color:var(--label2)}
.note-edit textarea{font:inherit;font-size:14px;font-weight:400;color:var(--label);border:0;border-radius:12px;background:var(--fill);padding:10px 12px;resize:vertical}

/* ================================================================ Lunch Rush: 3D first-person PS1-style canteen game */
body[data-app="lunch"]{background:#0B0D10}
.g3{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;box-sizing:border-box;background:#0B0D10}
.g3-view{position:relative;width:min(100%,calc((100vh - 70px) * 4 / 3));aspect-ratio:4/3;background:#000;overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px #22262C,0 30px 80px -30px #000;user-select:none;-webkit-user-select:none;touch-action:none}
.g3-view [hidden]{display:none!important}
#g3-cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;outline:0;cursor:crosshair}
.g3-view::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}
.g3-help{margin:0;max-width:720px;text-align:center;font:500 12px/1.5 var(--font);color:#7C828A}
.g3-view,.g3-view button{font-family:'Silkscreen',monospace}
.g3-hud{position:absolute;inset:0;pointer-events:none;color:#fff;text-shadow:2px 2px 0 #000}
.g3-hud button{pointer-events:auto}
.g3-obj{position:absolute;left:14px;top:12px;max-width:58%;display:flex;flex-direction:column;gap:3px;padding:8px 11px;background:rgba(10,14,20,.62);border-left:4px solid #FFD60A}
.g3-obj span{font-size:10px;letter-spacing:.14em;color:#FFD60A}
.g3-obj b{font-size:13px;font-weight:400;line-height:1.35}
.g3-cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;background:#fff;box-shadow:0 0 0 1px #000}
.g3-cross.on{width:14px;height:14px;margin:-7px 0 0 -7px;background:none;border:2px solid #34C759;box-shadow:0 0 0 1px #000}
.g3-prompt{position:absolute;left:50%;top:calc(50% + 26px);transform:translateX(-50%);white-space:nowrap;font-size:13px;padding:5px 10px;background:rgba(10,14,20,.66)}
.g3-prompt b{display:inline-block;min-width:18px;padding:1px 5px;margin-right:6px;background:#fff;color:#111;text-shadow:none;text-align:center;font-weight:400}
.g3-msg{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);width:max-content;max-width:84%;text-align:center;font-size:13px;line-height:1.45;padding:8px 14px;background:rgba(10,14,20,.72);border:2px solid #34C759;animation:g3in .25s steps(3)}
.g3-msg b{color:#FFD60A;font-weight:400}
@keyframes g3in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.g3-eat{position:absolute;right:12px;top:12px;width:190px;display:flex;flex-direction:column;gap:8px;padding:10px;background:rgba(10,14,20,.66)}
.g3-dishes{display:flex;flex-direction:column;gap:5px}
.g3-dishes div{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:7px;font-size:10.5px}
.g3-dishes i{width:10px;height:10px;box-shadow:0 0 0 1px #000}
.g3-dishes b{font-weight:400;color:#FFD60A}
.g3-eat button,.g3-use{border:0;padding:9px 10px;background:#34C759;color:#0B1A10;font-size:12px;box-shadow:0 3px 0 #1C7A34;cursor:pointer;text-shadow:none}
.g3-eat button:active,.g3-use:active{transform:translateY(2px);box-shadow:0 1px 0 #1C7A34}
.g3-mute{position:absolute;right:12px;bottom:12px;border:0;padding:5px 8px;font-size:10px;background:rgba(10,14,20,.66);color:#fff;cursor:pointer}
.g3-mute.off{color:#FF6B5E;text-decoration:line-through}
.g3-touch{position:absolute;inset:0;pointer-events:none}
.g3-stick{position:absolute;width:100px;height:100px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:none}
.g3-stick.on{display:block}
.g3-stick i{position:absolute;left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.45)}
.g3-use{position:absolute;right:16px;bottom:48px;width:72px;height:72px;border-radius:50%;font-size:14px;padding:0}
.g3-menu{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding:14px;background:rgba(6,8,12,.55);color:#fff;overflow:auto}
.g3-menu:empty{display:none}
.g3-panel{width:min(100%,460px);display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 20px;box-sizing:border-box;text-align:center;background:#12161C;border:2px solid #2C333C;box-shadow:6px 6px 0 #000}
.g3-panel h2{margin:0;font-size:20px;font-weight:400;letter-spacing:.06em;color:#FFD60A;text-shadow:2px 2px 0 #000}
.g3-panel p{margin:0}
.g3-logo{display:flex;flex-direction:column;align-items:center;gap:4px}
.g3-logo span{font-size:12px;letter-spacing:.3em;color:#34C759}
.g3-logo b{font-size:clamp(28px,7vw,42px);font-weight:400;line-height:1;color:#FFD60A;text-shadow:3px 3px 0 #B8321E,6px 6px 0 #000}
.g3-sub{font-size:12px;color:#B8BEC6}
.g3-label{font-size:11px;letter-spacing:.2em;color:#7C828A}
.g3-say{font-size:14px;color:#E8F5EA}
.g3-tip{font-size:11px;line-height:1.5;color:#8E959E}
.g3-students{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.g3-students button,.g3-choices button{display:flex;flex-direction:column;gap:3px;align-items:center;padding:10px 6px;border:2px solid #2C333C;background:#1A2028;color:#fff;cursor:pointer;box-shadow:3px 3px 0 #000}
.g3-students button b,.g3-choices button b{font-size:13px;font-weight:400}
.g3-students button small,.g3-choices button small{font-size:9.5px;color:#8E959E}
.g3-students button:hover:not(:disabled),.g3-choices button:hover{border-color:#34C759;background:#1E2A22}
.g3-students button:disabled{opacity:.45;cursor:default}
.g3-choices{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g3-choices.two{grid-template-columns:repeat(2,1fr)}
.g3-link{border:0;background:none;padding:0;color:#34C759;text-decoration:underline;cursor:pointer;font-size:11px}
.g3-grade{width:78px;height:78px;display:grid;place-items:center;font-size:48px;border:3px solid currentColor;box-shadow:4px 4px 0 #000}
.g3-grade.gS{color:#FFD60A}.g3-grade.gA{color:#34C759}.g3-grade.gB{color:#5AC8FA}.g3-grade.gC{color:#FF9F0A}

<body>
<div id="root"></div>
<noscript>PlateLoop needs JavaScript to run.</noscript>
<script>
/* ---- js/core.js ---- */
/* PlateLoop core: shared data, before/after scans, state store (synced across tabs and files),
   pixel pet + tray renderers. The four apps (model, scanner, kitchen, student) all use PL.store. */
(() => {
'use strict';
const PL = window.PL = { apps: {} };

/* ------------------------------------------------------------ utils */
const $ = PL.$ = (s, r = document) => r.querySelector(s);
PL.$$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = PL.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
PL.pct = v => Math.round(v * 100) + '%';
PL.fmt1 = v => (Math.round(v * 10) / 10).toFixed(1);
PL.money = v => 'S$' + Math.round(v).toLocaleString('en-US');
PL.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
PL.reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rng = PL.rng = seed => { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
PL.toast = msg => {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3600);
};

/* ------------------------------------------------------------ constants */
const MENU = PL.MENU = [
  { id: 'kailan', n: { c: .04, p: .03, f: .04 }, name: 'Stir-fried kailan', group: 'veg', g: { S: 30, M: 45, L: 60 }, kcal: .6, price: .009, color: '#3F7D32', edge: '#2A5A22', slot: [0, 0] },
  { id: 'cabbage', n: { c: .05, p: .012, f: .02 }, name: 'Braised cabbage', group: 'veg', g: { S: 25, M: 35, L: 45 }, kcal: .4, price: .004, color: '#D8E6A8', edge: '#9DB36A', slot: [1, 0] },
  { id: 'melon', n: { c: .08, p: .006, f: .002 }, name: 'Watermelon', group: 'fruit', g: { S: 50, M: 70, L: 90 }, kcal: .3, price: .004, color: '#F2545B', edge: '#B8323A', slot: [2, 0] },
  { id: 'rice', n: { c: .32, p: .03, f: .003 }, name: 'Brown rice mix', group: 'grain', g: { S: 170, M: 230, L: 290 }, kcal: 1.45, price: .0032, color: '#F3EDDA', edge: '#BFB28E', slot: [0, 1] },
  { id: 'chicken', n: { c: .03, p: .22, f: .08 }, name: 'Soy sauce chicken', group: 'protein', g: { S: 80, M: 115, L: 150 }, kcal: 1.75, price: .012, color: '#9C5A2E', edge: '#6B3A1A', slot: [1, 1] },
  { id: 'soup', n: { c: .04, p: .02, f: .01 }, name: 'ABC soup', group: 'soup', g: { S: 150, M: 200, L: 250 }, kcal: .3, price: .0021, color: '#E8A25C', edge: '#B8722F', slot: [2, 1] },
];
const DISH = PL.DISH = Object.fromEntries(MENU.map(d => [d.id, d]));
/* nutrition: per-lunch targets for a Secondary 3 student (illustrative, about a third of the daily need) */
PL.TARGET = { kcal: 700, c: 100, p: 30, f: 22 };
PL.NUTRIENTS = [['kcal', 'Calories', 'kcal'], ['c', 'Carbs', 'g'], ['p', 'Protein', 'g'], ['f', 'Fat', 'g']];
PL.nutrientsOf = grams => {
  const o = { kcal: 0, c: 0, p: 0, f: 0 };
  MENU.forEach(d => { const g = grams[d.id] || 0; o.kcal += g * d.kcal; o.c += g * d.n.c; o.p += g * d.n.p; o.f += g * d.n.f; });
  return { kcal: Math.round(o.kcal), c: Math.round(o.c), p: Math.round(o.p), f: Math.round(o.f) };
};
/** Nuvilab-style status for one nutrient against the lunch target. */
PL.nStatus = (k, v) => { const r = v / PL.TARGET[k]; return r < .8 ? 'low' : r > 1.3 ? 'high' : 'ok'; };
/* environment equivalents (illustrative factors: 2.5 kg CO2e per kg food, a pine tree absorbs ~6.6 kg CO2 a year, a car emits ~0.17 kg CO2 per km) */
PL.env = kg => { const co2 = kg * 2.5; return { kg, co2, trees: co2 / 6.6, km: co2 / .17 }; };
PL.CRAVING = 'kailan';
PL.SCHOOL = 'Harbourlight Secondary'; // fictional demo school
const TYPICAL_LEFT = PL.TYPICAL_LEFT = { kailan: .50, cabbage: .44, melon: .10, rice: .13, chicken: .05, soup: .38 };
PL.FORMS = {
  leafy: { name: 'Leafy', why: 'veggies tried', key: 'veg' },
  crystal: { name: 'Crystal', why: 'low-waste lunches', key: 'lowWaste' },
  guardian: { name: 'Guardian', why: 'balanced plates', key: 'balanced' },
  explorer: { name: 'Explorer', why: 'quests done', key: 'quests' },
};
const STAGES = PL.STAGES = [{ id: 'egg', name: 'Egg', at: 0 }, { id: 'baby', name: 'Baby', at: 40 }, { id: 'child', name: 'Child', at: 160 }, { id: 'adult', name: 'Adult', at: 400 }];
PL.SCHOOL_BASELINE = 0.29;
PL.CO2_PER_KG = 2.5; // illustrative kgCO2e per kg of food not wasted; swap for an EPA WARM / WRAP factor
PL.PRESETS = {
  'Picky eater': { rice: 70, chicken: 100, soup: 30, kailan: 0, cabbage: 10, melon: 100 },
  'Just right': { rice: 100, chicken: 100, soup: 85, kailan: 90, cabbage: 80, melon: 100 },
  'Tried everything': { rice: 95, chicken: 100, soup: 70, kailan: 60, cabbage: 55, melon: 100 },
  'Not hungry': { rice: 40, chicken: 60, soup: 20, kailan: 10, cabbage: 0, melon: 80 },
};

/* ------------------------------------------------------------ seed data */
const NAMED = [
  { id: 's1', name: 'Wei Ling', baseline: .24, xp: 262, c: { veg: 14, lowWaste: 9, balanced: 11, quests: 3 }, en: 72, nu: 80, jo: 66, streak: 3, book: ['crystal'], week: 168 },
  { id: 's2', name: 'Arjun', baseline: .38, xp: 96, c: { veg: 2, lowWaste: 5, balanced: 4, quests: 1 }, en: 48, nu: 42, jo: 55, streak: 1, book: [], week: 121 },
  { id: 's3', name: 'Aisyah', baseline: .19, xp: 455, c: { veg: 8, lowWaste: 22, balanced: 12, quests: 4 }, en: 88, nu: 70, jo: 81, streak: 9, book: ['leafy', 'guardian'], week: 204 },
  { id: 's4', name: 'Ethan', baseline: .41, xp: 24, c: { veg: 1, lowWaste: 1, balanced: 1, quests: 0 }, en: 35, nu: 40, jo: 50, streak: 0, book: [], week: 88 },
  { id: 's5', name: 'Mei Xin', baseline: .27, xp: 318, c: { veg: 6, lowWaste: 8, balanced: 9, quests: 7 }, en: 64, nu: 61, jo: 77, streak: 2, book: ['explorer'], week: 176 },
  { id: 's6', name: 'Daniel', baseline: .22, xp: 540, c: { veg: 9, lowWaste: 12, balanced: 21, quests: 3 }, en: 90, nu: 88, jo: 73, streak: 5, book: ['crystal', 'leafy'], week: 159 },
];
const EXTRA = ['Jun Hao', 'Nur Iman', 'Priya', 'Ryan', 'Zi Xuan', 'Hafiz', 'Kai Xin', 'Siti', 'Rohan', 'Chloe', 'Jia Hui', 'Irfan', 'Ananya', 'Marcus', 'Xin Yi', 'Farhan', 'Divya', 'Isaac', 'Hui Min', 'Adam', 'Sarah', 'Kavin'];
const CLASS_SEED = [
  { id: '3A', base: .30, served: 61.6, ret: 12.9, form: 'leafy', xp: 380, streak: 4 },
  { id: '3B', base: .31, served: 46.2, ret: 8.9, form: 'explorer', xp: 350, streak: 3 },
  { id: '3C', base: .27, served: 62.0, ret: 14.6, form: 'guardian', xp: 240, streak: 1 },
  { id: '3D', base: .33, served: 60.8, ret: 13.4, form: 'crystal', xp: 410, streak: 2 },
  { id: '3E', base: .29, served: 63.1, ret: 11.7, form: 'crystal', xp: 460, streak: 5 },
  { id: '3F', base: .26, served: 59.9, ret: 16.2, form: 'leafy', xp: 120, streak: 0 },
];
const SCHOOLS = [
  // fictional schools for the demo
  { id: 'maple', name: 'Maple Bay Secondary', red: .34, acc: .93, kg: 1510 },
  { id: 'orchid', name: 'Orchid Grove Secondary', red: .27, acc: .91, kg: 1122 },
  { id: 'sunbird', name: 'Sunbird Secondary', red: .22, acc: .89, kg: 864 },
  { id: 'kingfisher', name: 'Kingfisher Secondary', red: .19, acc: .90, kg: 1390 },
  { id: 'tembusu', name: 'Tembusu Hill Secondary', red: .12, acc: .86, kg: 402 },
];
const DAYS = ['Mon 21', 'Tue 22', 'Wed 23', 'Thu 24'];

function seedLog(baseline, r) {
  return DAYS.map(d => {
    const w = clamp(baseline * (0.55 + r() * 0.7), 0.02, 0.6);
    const portion = r() < .3 ? 'S' : r() < .85 ? 'M' : 'L';
    const std = PL.nutrientsOf(Object.fromEntries(MENU.map(x => [x.id, x.g[portion]])));
    const k = 1 - w * (.8 + r() * .4);
    return { day: d, portion, w, pts: Math.round(22 + (baseline - w) / baseline * 14 + r() * 8), n: { kcal: Math.round(std.kcal * k), c: Math.round(std.c * k), p: Math.round(std.p * k * (.85 + r() * .3)), f: Math.round(std.f * k) } };
  }).reverse();
}
function freshState() {
  const r = rng(42);
  const dish = {};
  MENU.forEach(d => { const served = 140 * d.g.M * (0.92 + r() * .1); dish[d.id] = { served, ret: served * TYPICAL_LEFT[d.id] * (0.85 + r() * .25) }; });
  const students = NAMED.map(s => ({
    id: s.id, name: s.name, cls: '3B', baseline: s.baseline, week: s.week, scanned: false, named: true,
    pet: { xp: s.xp, c: { ...s.c }, en: s.en, nu: s.nu, jo: s.jo, streak: s.streak, book: [...s.book], quest: 1 }, log: seedLog(s.baseline, r),
  }));
  EXTRA.forEach((name, i) => {
    const baseline = .18 + r() * .24, xp = Math.round(20 + r() * 520);
    students.push({
      id: 'x' + i, name, cls: '3B', baseline, week: Math.round(70 + r() * 130), scanned: false, named: false,
      pet: { xp, c: { veg: Math.round(r() * 14), lowWaste: Math.round(r() * 16), balanced: Math.round(r() * 16), quests: Math.round(r() * 6) }, en: 40 + Math.round(r() * 50), nu: 40 + Math.round(r() * 50), jo: 40 + Math.round(r() * 50), streak: Math.floor(r() * 7), book: [], quest: Math.floor(r() * 3) },
      log: seedLog(baseline, r),
    });
  });
  return {
    v: 8,
    students,
    classes: CLASS_SEED.map(c => ({ ...c })),
    today: { trays: 140, zero: 17, co2: 11200, dish, servedNow: Object.fromEntries(MENU.map(d => [d.id, dish[d.id].served])), eating: 0, feed: [], clock: 11 * 60 + 48, trayNo: 412 },
    term: { kg: 1284, meals: 41210, zero: 6120 },
    zeroWeek: [.11, .14, .13, .16],
    order: { approved: null },
    me: 's1',
  };
}

/* ------------------------------------------------------------ store (localStorage + cross-tab sync) */
const KEY = 'plateloop-sg-v9';
const chan = 'BroadcastChannel' in window ? new BroadcastChannel('plateloop') : null;
const subs = new Set();
function readStored() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!s || s.v !== 8) return null;
    if (s.today.co2 == null) s.today.co2 = 11200; // saves from before the live CO₂ counter
    return s;
  } catch (e) { return null; }
}
PL.S = readStored() || freshState();
PL.store = {
  save(kind = 'update') {
    try { localStorage.setItem(KEY, JSON.stringify(PL.S)); } catch (e) {}
    if (chan) chan.postMessage(kind);
    subs.forEach(fn => fn(kind, true));
  },
  subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
  reset() { PL.S = freshState(); this.save('reset'); },
};
const pull = kind => { const s = readStored(); if (s) { PL.S = s; subs.forEach(fn => fn(kind || 'update', false)); } };
// Both: BroadcastChannel is instant between tabs, and the storage event also covers pages opened as local files.
if (chan) chan.onmessage = e => pull(e.data);
addEventListener('storage', e => { if (e.key === KEY) pull('update'); });

/* ------------------------------------------------------------ lookups + leaderboards */
PL.student = id => PL.S.students.find(s => s.id === id);
PL.stageOf = xp => [...STAGES].reverse().find(s => xp >= s.at);
PL.nextStage = xp => STAGES.find(s => s.at > xp);
PL.formOf = pet => Object.entries({ leafy: pet.c.veg, crystal: pet.c.lowWaste, guardian: pet.c.balanced, explorer: pet.c.quests * 2 }).sort((a, b) => b[1] - a[1])[0][0];
PL.moodOf = pet => { const a = (pet.en + pet.nu + pet.jo) / 3; return a < 40 ? 'sleepy' : a < 62 ? 'happy' : 'joy'; };
PL.clock = () => { const m = Math.round(PL.S.today.clock); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; };
PL.classStats = c => { const w = c.ret / c.served; return { w, red: (c.base - w) / c.base }; };
PL.classRows = () => PL.S.classes.map(c => ({ c, ...PL.classStats(c) })).sort((a, b) => b.red - a.red);
PL.studentRows = () => [...PL.S.students].sort((a, b) => b.week - a.week || a.name.localeCompare(b.name));
PL.streakRows = () => [...PL.S.students].sort((a, b) => b.pet.streak - a.pet.streak || b.week - a.week);
PL.cls32Scanned = () => PL.S.students.filter(s => s.cls === '3B' && s.scanned).length;
PL.schoolRows = () => {
  const cr = PL.S.classes.map(PL.classStats);
  const us = { id: 'harbourlight', name: PL.SCHOOL, us: true, red: cr.reduce((a, c) => a + c.red, 0) / cr.length, acc: .93, kg: PL.S.term.kg };
  return [us, ...SCHOOLS].sort((a, b) => b.red - a.red);
};
PL.todayTotals = () => { let sv = 0, lf = 0, val = 0; MENU.forEach(d => { const x = PL.S.today.dish[d.id]; sv += x.served; lf += x.ret; val += x.ret * d.price; }); return { sv, lf, val, w: lf / sv }; };

/* ------------------------------------------------------------ one scanner, two scans per tray
   BEFORE lunch: the tray is weighed and photographed full, which records what was served.
   AFTER lunch: the same scanner measures what is left. eaten = before − after. */
const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
const STANDARD_M = Object.fromEntries(MENU.map(d => [d.id, d.g.M]));
PL.portionOf = served => { const r = sum(served) / sum(STANDARD_M); return r < .87 ? 'S' : r > 1.12 ? 'L' : 'M'; };
PL.scanState = st => st.scanned ? 'done' : st.before ? 'eating' : 'none';

function scoreMeal(st, served, measured, portion) {
  const pet = st.pet;
  const total = sum(served), left = sum(measured);
  const w = left / total;
  const improvement = (st.baseline - w) / st.baseline;
  let energy = clamp(Math.round(10 + 14 * improvement), 2, 25);
  const rightSized = portion === 'S' && w < .12;
  if (rightSized) energy = 25;
  const eaten = id => 1 - measured[id] / served[id];
  const groups = ['grain', 'protein', 'veg', 'fruit'].filter(g => MENU.some(d => d.group === g && eaten(d.id) >= .5));
  const nutrition = groups.length * 5;
  const vegTried = MENU.some(d => d.group === 'veg' && eaten(d.id) >= .5);
  const tasted = eaten(PL.CRAVING) >= .2;
  const questDone = tasted && pet.quest < 3;
  const lowWaste = w < .15;
  const streak = lowWaste ? pet.streak + 1 : 0;
  const joy = 4 + (streak >= 3 ? 6 : 0) + (questDone ? 15 : 0);
  const xp = energy + nutrition + joy;
  const mood = w < .12 ? 'joy' : w < .3 ? 'happy' : 'meh';
  let line;
  if (rightSized) line = 'Perfect portion! A small plate, all eaten. Full energy for me!';
  else if (questDone) line = `You tasted the ${DISH[PL.CRAVING].name.toLowerCase()}! Quest ${pet.quest + 1} of 3 done!`;
  else if (improvement > .3) line = 'Way less left than usual. I feel super strong!';
  else if (w < .3) line = 'Yum, thanks for lunch! Nice job.';
  else line = 'Lots came back today. Take a smaller portion tomorrow and I still get full energy!';
  return { w, served: total, left, improvement, energy, nutrition, joy, xp, groups, vegTried, questDone, lowWaste, streak, mood, line, rightSized };
}

/** BEFORE lunch. portion: what the kitchen served (S/M/L); the scanner measures the real grams. */
PL.scanBefore = (sid, portion, method = 'face') => {
  const st = PL.student(sid), T = PL.S.today;
  const served = Object.fromEntries(MENU.map(d => [d.id, Math.round(d.g[portion] * (.94 + Math.random() * .12))]));
  const tray = ++T.trayNo;
  T.clock += .2;
  st.before = { served, t: PL.clock(), tray, method };
  MENU.forEach(d => { T.servedNow[d.id] += served[d.id]; });
  T.eating += 1;
  const total = sum(served);
  T.feed.unshift({ kind: 'before', t: PL.clock(), tray, cls: st.cls, sid, method, portion: PL.portionOf(served), served: total });
  T.feed = T.feed.slice(0, 60);
  PL.S.lastScan = { sid, at: Date.now(), kind: 'before' };
  return { served, total, n: PL.nutrientsOf(served), kcal: PL.nutrientsOf(served).kcal, portion: PL.portionOf(served), tray, method };
};

/** AFTER lunch. eatPct: dish id → % eaten (0–100). Without a before scan the standard portion is assumed. */
PL.scanAfter = (sid, eatPct, method = 'face') => {
  const st = PL.student(sid), pet = st.pet, T = PL.S.today;
  const clsRankBefore = PL.classRows().findIndex(r => r.c.id === st.cls) + 1;
  const meRankBefore = PL.studentRows().findIndex(s => s.id === sid) + 1;
  let served = st.before && st.before.served, estimated = false, tray = st.before && st.before.tray;
  if (!served) { served = { ...STANDARD_M }; estimated = true; tray = ++T.trayNo; MENU.forEach(d => { T.servedNow[d.id] += served[d.id]; }); }
  else T.eating = Math.max(0, T.eating - 1);
  const portion = PL.portionOf(served);
  const measured = Object.fromEntries(MENU.map(d => {
    const g = served[d.id], tru = g * (1 - eatPct[d.id] / 100);
    return [d.id, tru < 1 ? 0 : clamp(tru + (Math.random() * 4 - 2), 0, g)];
  }));
  const r = scoreMeal(st, served, measured, portion);
  pet.xp += r.xp;
  pet.en = clamp(Math.round(pet.en * .55 + r.energy * 4 * .45), 5, 100);
  pet.nu = clamp(Math.round(pet.nu * .55 + r.nutrition * 5 * .45), 5, 100);
  pet.jo = clamp(Math.round(pet.jo * .6 + (40 + r.joy * 3) * .4), 5, 100);
  pet.streak = r.streak;
  if (r.vegTried) pet.c.veg++;
  if (r.lowWaste) pet.c.lowWaste++;
  if (r.groups.length >= 3) pet.c.balanced++;
  if (r.questDone) { pet.c.quests++; pet.quest++; }
  st.week += r.xp;
  st.scanned = true;
  r.intake = PL.nutrientsOf(Object.fromEntries(MENU.map(d => [d.id, served[d.id] - measured[d.id]])));
  r.zero = r.w < .05;
  // CO₂e avoided on this tray compared with the student's usual leftovers, in grams (shown live to the student)
  r.co2 = Math.round(Math.max(0, st.baseline * r.served - r.left) / 1000 * PL.CO2_PER_KG * 1000);
  T.co2 = (T.co2 || 0) + r.co2;
  if (r.zero) { T.zero = (T.zero || 0) + 1; PL.S.term.zero = (PL.S.term.zero || 0) + 1; }
  st.after = { t: (T.clock += .35, PL.clock()), left: r.left, w: r.w, intake: r.intake, zero: r.zero, served, measured, co2: r.co2 };
  st.log.unshift({ day: 'Fri 25', portion, w: r.w, pts: r.xp, n: r.intake });
  st.log = st.log.slice(0, 6);
  r.servedBy = served; r.measured = measured;
  r.game = PL.game ? PL.game.feedLunch(st, r) : null; // Loopi's hunger, hearts and the plate in its bowl
  // completed trays feed the kitchen's waste numbers and the class league
  MENU.forEach(d => { T.dish[d.id].served += served[d.id]; T.dish[d.id].ret += measured[d.id]; });
  T.trays++;
  const c = PL.S.classes.find(c => c.id === st.cls);
  c.served += r.served / 1000; c.ret += r.left / 1000; c.xp += Math.max(2, Math.round((c.base - r.w) * 40));
  PL.S.term.meals++;
  PL.S.term.kg += Math.max(0, r.served / 1000 * (PL.SCHOOL_BASELINE - r.w));
  T.feed.unshift({ kind: 'after', t: PL.clock(), tray, cls: st.cls, sid, method, portion, w: r.w, xp: r.xp, served: r.served, left: r.left, estimated, zero: r.zero, kcal: r.intake.kcal });
  T.feed = T.feed.slice(0, 60);
  Object.assign(r, { clsRank: PL.classRows().findIndex(x => x.c.id === st.cls) + 1, clsRankBefore, meRank: PL.studentRows().findIndex(s => s.id === sid) + 1, meRankBefore, measured, portion, sid, tray, estimated });
  PL.S.lastScan = { sid, at: Date.now(), kind: 'after', xp: r.xp, line: r.line };
  return r;
};
/** Both scans in one go (used to simulate the rest of the class). */
PL.scanTray = (sid, portion, eatPct) => { if (!PL.student(sid).before) PL.scanBefore(sid, portion); return PL.scanAfter(sid, eatPct); };
PL.zeroRate = () => { const t = PL.S.today; return t.trays ? t.zero / t.trays : 0; };
/** Simulate everyone in class 3B who hasn't finished both scans yet. */
PL.scanRestOfClass = () => {
  let n = 0;
  PL.S.students.filter(s => s.cls === '3B' && !s.scanned).forEach(s => {
    const p = Math.random() < .3 ? 'S' : Math.random() < .8 ? 'M' : 'L';
    const f = (s.baseline / .3) * (.5 + Math.random() * .6);
    PL.scanTray(s.id, p, Object.fromEntries(MENU.map(d => [d.id, Math.round(clamp(1 - TYPICAL_LEFT[d.id] * f, 0, 1) * 100)])));
    n++;
  });
  return n;
};

/* ------------------------------------------------------------ any element with data-reset restarts the demo lunch */
document.addEventListener('click', e => { if (e.target.closest('[data-reset]')) { PL.store.reset(); PL.toast('Demo reset to the start of lunch.'); } });

/* ------------------------------------------------------------ pixel pet renderer (LCD style) */
const LCD = PL.LCD = { bg: '#DDE4D4', ink: '#1D1D1F', mid: '#9AA592' };
const ACC_SLOT = { cap: 'head', crown: 'head', halo: 'head', headphones: 'head', bow: 'side', flower: 'side', glasses: 'face', scarf: 'neck', wings: 'back', aura: 'aura' };
PL.drawPet = (cv, o) => {
  // o.ink / o.mid recolour the outline and shading; o.fill paints the body (for the full-colour room)
  const INK = o.ink || LCD.ink, MID = o.mid || LCD.mid, FILL = o.fill || null;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.imageSmoothingEnabled = false;
  if (o.bg === 'none') ctx.clearRect(0, 0, W, H); else { ctx.fillStyle = o.bg || LCD.bg; ctx.fillRect(0, 0, W, H); }
  const rows = o.rows || 30;
  const u = Math.max(1, Math.floor(H / rows));
  const cols = Math.floor(W / u);
  const ox = Math.floor((W - cols * u) / 2), oy = Math.floor((H - rows * u) / 2);
  const P = (x, y, c = INK) => { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= cols || y >= rows) return; ctx.fillStyle = c; ctx.fillRect(ox + x * u, oy + y * u, u, u); };
  const t = o.t || 0, cx = cols / 2, ground = rows - 4;
  if (!o.noGround) for (let x = 2; x < cols - 2; x += 2) P(x, ground + 1, MID);
  const ell = (ecx, ecy, rx, ry, dither = true) => {
    const inside = (x, y) => ((x + .5 - ecx) / rx) ** 2 + ((y + .5 - ecy) / ry) ** 2 <= 1;
    for (let y = Math.floor(ecy - ry - 1); y <= Math.ceil(ecy + ry + 1); y++)
      for (let x = Math.floor(ecx - rx - 1); x <= Math.ceil(ecx + rx + 1); x++) {
        if (!inside(x, y)) continue;
        const edge = !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1);
        if (edge) P(x, y); else { if (FILL) P(x, y, FILL); if ((dither || FILL) && y > ecy + ry * .35 && (x + y) % 2 === 0) P(x, y, MID); }
      }
  };
  if (o.stage === 'egg') {
    const wob = t % 4 === 1 ? 1 : t % 4 === 3 ? -1 : 0, ex = cx + wob, ery = 8.5, ey = ground - ery;
    ell(ex, ey, 6.5, ery, false);
    [[-2, -3], [2, -1], [-1, 2], [3, 3], [0, -6]].forEach(([dx, dy]) => { P(ex + dx - .5, ey + dy, MID); P(ex + dx + .5, ey + dy, MID); });
    if ((o.progress || 0) > .6) [[-3, -1], [-2, 0], [-1, -1], [0, 0], [1, -1], [2, 0]].forEach(([dx, dy]) => P(ex + dx, ey + dy - 1));
    return;
  }
  const [rx, ry] = { baby: [5, 4.2], child: [7, 5.8], adult: [8.8, 7.2] }[o.stage];
  const bob = (t % 2) ? 1 : 0;
  const by = ground - ry - (o.stage === 'baby' ? 0 : 1.5) - bob;
  ell(cx, by, rx, ry);
  if (o.stage !== 'baby') { P(cx - 3, ground); P(cx - 2, ground); P(cx + 2, ground); P(cx + 3, ground); P(cx - 3, ground - 1); P(cx + 3, ground - 1); }
  if (o.stage === 'adult') { const wave = t % 2 ? -1 : 0; P(cx - rx - 1, by + 1 + wave); P(cx - rx - 2, by + wave); P(cx + rx + 1, by + 1); P(cx + rx + 2, by + 2); }
  const ex = Math.round(rx * .42), ey = Math.round(by - ry * .15), blink = t % 9 === 0;
  const eye = x => {
    const m = o.mood;
    if (m === 'sleepy' || blink) { P(x - 1, ey); P(x, ey); P(x + 1, ey); }
    else if (m === 'joy') { P(x - 1, ey + 1); P(x, ey); P(x + 1, ey + 1); }
    else if (m === 'meh') { P(x, ey); P(x, ey + 1); }
    else { P(x, ey); P(x + 1, ey); P(x, ey + 1); P(x + 1, ey + 1); }
  };
  eye(Math.round(cx - ex - .5)); eye(Math.round(cx + ex - .5));
  const my = ey + 3, mx = Math.round(cx - .5);
  if (o.mood === 'joy') { for (let i = -2; i <= 2; i++) P(mx + i, my); P(mx - 1, my + 1); P(mx, my + 1); P(mx + 1, my + 1); P(Math.round(cx - ex - 2.5), my - 1, MID); P(Math.round(cx + ex + 1.5), my - 1, MID); }
  else if (o.mood === 'happy') { P(mx - 2, my); P(mx + 2, my); P(mx - 1, my + 1); P(mx, my + 1); P(mx + 1, my + 1); }
  else if (o.mood === 'meh') { P(mx - 1, my + 1); P(mx, my + 1); P(mx + 1, my + 1); }
  else P(mx, my + 1);
  if (o.mood === 'sleepy') { const zx = cx + rx + 1, zy = by - ry - 2 - (t % 3); [[0, 0], [1, 0], [2, 0], [1, 1], [0, 2], [1, 2], [2, 2]].forEach(([a, b]) => P(zx + a, zy + b)); }
  const top = Math.round(by - ry), f = o.form, full = o.stage === 'adult';
  const headAcc = ACC_SLOT[o.acc] === 'head';
  const drawAcc = () => {
    const a = o.acc, xc = cx - .5, I = INK, M = MID;
    if (!a) return;
    if (a === 'cap') { for (let x = -3; x <= 3; x++) P(xc + x, top - 1); for (let x = -2; x <= 2; x++) P(xc + x, top - 2, Math.abs(x) === 2 ? I : M); for (let x = -1; x <= 1; x++) P(xc + x, top - 3); P(xc + 4, top - 1); P(xc + 5, top - 1); }
    else if (a === 'crown') { for (let x = -3; x <= 3; x++) { P(xc + x, top - 1); P(xc + x, top - 2, Math.abs(x) === 3 || x === 0 ? I : M); } [-3, 0, 3].forEach(x => P(xc + x, top - 3)); P(xc, top - 4); }
    else if (a === 'halo') { const y0 = top - 4; for (let x = -2; x <= 2; x++) { P(xc + x, y0 - 1); P(xc + x, y0 + 1); } P(xc - 3, y0); P(xc + 3, y0); if (t % 2) P(xc + 4, y0 - 2, M); }
    else if (a === 'headphones') { for (let k = 0; k <= 16; k++) { const ang = Math.PI * (.12 + .76 * k / 16); P(cx + Math.cos(ang) * (rx + 1) - .5, by - Math.sin(ang) * (ry + 1)); } [-1, 1].forEach(s => { const x0 = Math.round(cx + s * (rx + 1) - .5); for (let y = -1; y <= 1; y++) { P(x0, ey + y); P(x0 - s, ey + y, M); } }); }
    else if (a === 'bow') { const bx = Math.round(cx + rx * .55), y0 = top + 1; P(bx, y0, M); [-1, -2, 1, 2].forEach(dx => { P(bx + dx, y0 - 1); P(bx + dx, y0 + 1); if (Math.abs(dx) === 2) P(bx + dx, y0); }); }
    else if (a === 'flower') { const fx = Math.round(cx - rx * .55), fy = top + 1; P(fx, fy, M); P(fx, fy - 1); P(fx, fy + 1); P(fx - 1, fy); P(fx + 1, fy); }
    else if (a === 'glasses') { const xs = [Math.round(cx - ex - .5), Math.round(cx + ex - .5)]; xs.forEach(x0 => { for (let x = -2; x <= 2; x++) { P(x0 + x, ey - 1); P(x0 + x, ey + 2); } P(x0 - 2, ey); P(x0 - 2, ey + 1); P(x0 + 2, ey); P(x0 + 2, ey + 1); }); for (let x = xs[0] + 3; x <= xs[1] - 3; x++) P(x, ey); }
    else if (a === 'scarf') { const y = Math.round(by + ry * .3); for (let x = Math.round(cx - rx * .85); x <= Math.round(cx + rx * .85); x++) { P(x, y); P(x, y + 1, M); } P(xc + 3, y + 2); P(xc + 3, y + 3); P(xc + 4, y + 3, M); }
    else if (a === 'wings') { const flap = t % 2; [-1, 1].forEach(s => [[0, 0, M], [1, -1, M], [1, 0, M], [2, -2, I], [2, -1, M], [2, 0, I], [1, 1, I], [3, -2, I]].forEach(([dx, dy, c]) => P(cx + s * (rx + 1 + dx) - .5, by - 1 + dy - flap, c))); }
    else if (a === 'aura') { for (let k = 0; k < 4; k++) { const ang = t * .6 + k * Math.PI / 2, x0 = Math.round(cx + Math.cos(ang) * (rx + 3) - .5), y0 = Math.round(by + Math.sin(ang) * (ry + 1)); P(x0, y0); if ((t + k) % 2) { P(x0 - 1, y0, M); P(x0 + 1, y0, M); P(x0, y0 - 1, M); P(x0, y0 + 1, M); } } }
  };
  if (o.stage === 'baby') { if (!headAcc) { P(cx - .5, top - 1); P(cx - .5, top - 2); } drawAcc(); return; }
  if (headAcc && f !== 'guardian') { /* hats and crowns replace the form's head decoration */ }
  else if (f === 'leafy') {
    P(cx - .5, top - 1); P(cx - .5, top - 2);
    [[-1, -3], [-2, -3], [-3, -4], [-2, -4], [-4, -5], [-3, -5], [-2, -5]].forEach(([a, b]) => { P(cx - .5 + a, top + b); P(cx - .5 - a, top + b + (full ? 0 : 1)); });
    if (full) [[-3, 2], [3, 3], [-1, 4]].forEach(([a, b]) => P(cx + a, by + b, MID));
  } else if (f === 'crystal') {
    const h = full ? 3 : 2;
    for (let i = 0; i <= h; i++) for (let j = -i; j <= i; j++) P(cx - .5 + j, top - 1 - (2 * h - i), Math.abs(j) === i ? INK : MID);
    for (let i = h - 1; i >= 0; i--) for (let j = -i; j <= i; j++) P(cx - .5 + j, top - 1 - i, Math.abs(j) === i ? INK : MID);
    if (full && t % 2 === 0) [[-rx - 3, -ry], [rx + 2, -ry + 2]].forEach(([a, b]) => { P(cx + a, by + b); P(cx + a - 1, by + b); P(cx + a + 1, by + b); P(cx + a, by + b - 1); P(cx + a, by + b + 1); });
  } else if (f === 'guardian') {
    const yb = Math.round(by - ry * .62);
    for (let x = Math.round(cx - rx * .8); x <= Math.round(cx + rx * .8); x++) P(x, yb);
    P(cx - .5, yb - 1); P(cx - .5, yb - 2);
    if (full) { const sx = Math.round(cx + rx + 1), sy = Math.round(by - 1); for (let y = 0; y < 5; y++) { P(sx, sy + y); P(sx + 3, sy + y); } for (let x = 0; x <= 3; x++) P(sx + x, sy); P(sx + 1, sy + 5); P(sx + 2, sy + 5); P(sx + 1, sy + 2, MID); P(sx + 2, sy + 2, MID); }
  } else if (f === 'explorer') {
    const w = Math.round(rx * (full ? .95 : .7));
    for (let x = -w; x <= w; x++) P(cx - .5 + x, top);
    for (let x = -2; x <= 2; x++) { P(cx - .5 + x, top - 1); P(cx - .5 + x, top - 2, x === -2 || x === 2 ? INK : MID); }
    for (let x = -2; x <= 2; x++) P(cx - .5 + x, top - 3);
    if (full) { const bx = Math.round(cx - rx - 3), byy = Math.round(by - 2); for (let y = 0; y < 5; y++) { P(bx, byy + y); P(bx + 2, byy + y); } P(bx + 1, byy); P(bx + 1, byy + 4); P(bx + 1, byy + 2, MID); }
  }
  drawAcc();
};
/** A small canvas showing a student's (or class's) current pet. */
PL.petCanvas = (w, h, o) => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; PL.drawPet(cv, { rows: 30, ...o }); return cv; };
/** A student's Loopi stage comes from the game (hearts → evolve); before game.js loads, fall back to XP. */
PL.stuStage = st => st.game ? STAGES[st.game.stage] : PL.stageOf(st.pet.xp);
PL.petOf = st => {
  const g = st.game;
  const mood = g && g.hunger === 0 ? 'sleepy' : PL.moodOf(st.pet);
  return { stage: PL.stuStage(st).id, form: PL.formOf(st.pet), mood, progress: g ? g.hearts / Math.max(1, (PL.game ? PL.game.heartsReq(g) : 3)) : st.pet.xp / 40, acc: g ? g.eq : null };
};
/** Replace every <canvas data-pet="sid"> / data-cls="id"> inside root with a drawn pet. */
PL.paintPets = (root, t = 0) => {
  PL.$$('canvas[data-pet]', root).forEach(cv => { const st = PL.student(cv.dataset.pet); if (st) PL.drawPet(cv, { rows: 30, t, ...PL.petOf(st) }); });
  PL.$$('canvas[data-cls]', root).forEach(cv => { const c = PL.S.classes.find(c => c.id === cv.dataset.cls); if (c) PL.drawPet(cv, { rows: 30, t, stage: PL.stageOf(c.xp).id, form: c.form, mood: PL.classStats(c).red > .25 ? 'joy' : 'happy' }); });
  PL.$$('canvas[data-form]', root).forEach(cv => PL.drawPet(cv, { rows: 30, t, stage: cv.dataset.stage || 'adult', form: cv.dataset.form, mood: 'happy' }));
};
PL.lcdText = (cv, lines) => {
  const ctx = cv.getContext('2d');
  ctx.fillStyle = LCD.bg; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = LCD.ink; ctx.textBaseline = 'top';
  let y = 10;
  lines.forEach(l => {
    if (l.bar != null) {
      ctx.font = '10px Silkscreen, monospace'; ctx.fillText(l.label, 10, y + 1);
      ctx.strokeStyle = LCD.ink; ctx.lineWidth = 2; ctx.strokeRect(58, y, cv.width - 70, 11);
      ctx.fillRect(61, y + 3, Math.round((cv.width - 76) * l.bar / 100), 5);
      y += 22;
    } else { ctx.font = (l.size || 11) + 'px Silkscreen, monospace'; ctx.fillText(l.text, 10, y); y += (l.size || 11) + 8; }
  });
};

/* ------------------------------------------------------------ tray (top view SVG) */
const CELL = { x: [22, 144, 266], w: 112, y: [22, 138], h: [106, 140] };
const PORTION_F = { S: .74, M: 1, L: 1.18 };
function blobPath(cx, cy, rx, ry, seed) {
  const n = 14, pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, k = 1 + .09 * Math.sin(3 * a + seed) + .06 * Math.sin(5 * a + seed * 2.3); pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); }
  let d = '';
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    if (i === 0) d += `M${((p[0] + q[0]) / 2).toFixed(1)},${((p[1] + q[1]) / 2).toFixed(1)}`;
    const nx = pts[(i + 1) % n], nn = pts[(i + 2) % n];
    d += ` Q${nx[0].toFixed(1)},${nx[1].toFixed(1)} ${((nx[0] + nn[0]) / 2).toFixed(1)},${((nx[1] + nn[1]) / 2).toFixed(1)}`;
  }
  return d + 'Z';
}
PL.traySVG = ({ portion = 'M', left = null, scanning = false, labels = null, empty = false, id = 'tg' }) => {
  let s = `<svg viewBox="0 0 400 300" role="img" aria-label="Lunch tray, top view"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--steel-2)"/><stop offset="1" stop-color="var(--steel)"/></linearGradient></defs>`;
  s += `<rect x="6" y="6" width="388" height="288" rx="22" fill="url(#${id})" stroke="var(--steel-edge)" stroke-width="2"/>`;
  MENU.forEach(d => { const [ci, ri] = d.slot; s += `<rect x="${CELL.x[ci]}" y="${CELL.y[ri]}" width="${CELL.w}" height="${CELL.h[ri]}" rx="14" fill="var(--steel-2)" stroke="var(--steel-edge)" stroke-width="1.5"/>`; });
  if (!empty) MENU.forEach((d, i) => {
    const [ci, ri] = d.slot, cx = CELL.x[ci] + CELL.w / 2, cy = CELL.y[ri] + CELL.h[ri] / 2;
    const frac = (left ? left[d.id] : 1) * PORTION_F[portion];
    if (frac <= 0.01) return;
    const k = Math.sqrt(frac);
    if (d.id === 'soup') {
      s += `<circle cx="${cx}" cy="${cy}" r="46" fill="#F7F7F2" stroke="var(--steel-edge)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="${(38 * Math.min(1, k)).toFixed(1)}" fill="${d.color}"/>`;
      s += `<circle cx="${cx - 10}" cy="${cy - 8}" r="${(5 * k).toFixed(1)}" fill="#E7C08A" opacity=".8"/><circle cx="${cx + 12}" cy="${cy + 6}" r="${(4 * k).toFixed(1)}" fill="#6E8F3A" opacity=".8"/>`;
    } else {
      const rx = CELL.w * .36 * k, ry = CELL.h[ri] * .33 * k;
      s += `<path d="${blobPath(cx, cy, Math.min(rx, CELL.w * .45), Math.min(ry, CELL.h[ri] * .44), i * 1.7)}" fill="${d.color}" stroke="${d.edge}" stroke-width="1.5"/>`;
      if (d.id === 'rice') for (let j = 0; j < 14; j++) { const a = j * 2.4, rr = (j % 5) / 5 * .8; s += `<ellipse cx="${(cx + Math.cos(a) * rx * rr).toFixed(1)}" cy="${(cy + Math.sin(a) * ry * rr).toFixed(1)}" rx="2.2" ry="1.3" fill="#8C6B4A" opacity=".5"/>`; }
      if (d.id === 'cabbage' || d.id === 'chicken' || d.id === 'kailan') for (let j = 0; j < 5; j++) { const a = j * 1.9 + i; s += `<ellipse cx="${(cx + Math.cos(a) * rx * .45).toFixed(1)}" cy="${(cy + Math.sin(a) * ry * .45).toFixed(1)}" rx="${(6 * k).toFixed(1)}" ry="${(3 * k).toFixed(1)}" fill="${d.edge}" opacity=".55" transform="rotate(${j * 40} ${cx} ${cy})"/>`; }
      if (d.id === 'melon') for (let j = 0; j < 6; j++) s += `<ellipse cx="${(cx - 20 + (j % 3) * 20).toFixed(1)}" cy="${(cy - 8 * k + Math.floor(j / 3) * 16 * k).toFixed(1)}" rx="2" ry="3" fill="#2B2B2E" opacity=".8"/>`;
    }
  });
  if (labels) MENU.forEach(d => {
    const [ci, ri] = d.slot, x = CELL.x[ci] + 4, y = CELL.y[ri] + 4, w = CELL.w - 8, h = CELL.h[ri] - 8, txt = `${labels[d.id]} g left`;
    s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="none" stroke="var(--mint)" stroke-width="2" stroke-dasharray="6 4"/>`;
    s += `<rect x="${x + 6}" y="${y + h - 24}" width="${Math.min(w - 12, 12 + txt.length * 6.3)}" height="18" rx="9" fill="var(--ink)"/><text class="det-label" x="${x + 13}" y="${y + h - 11}" fill="var(--ground)">${txt}</text>`;
  });
  if (scanning) s += `<g class="scanline"><rect x="10" y="10" width="380" height="4" fill="var(--mint)"/><rect x="10" y="14" width="380" height="22" fill="var(--mint)" opacity=".15"/></g>`;
  return s + '</svg>';
};

/* ------------------------------------------------------------ shared UI bits */
PL.rankDelta = (before, after) => after < before ? `<span class="up">▲ ${before - after}</span>` : '';
PL.icons = {
  back: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  loop: '<svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="var(--mint)" stroke-width="4"/><path d="M16 3a13 13 0 0 1 13 13" fill="none" stroke="var(--persim)" stroke-width="4" stroke-linecap="round"/><circle cx="16" cy="16" r="5" fill="currentColor"/></svg>',
};
PL.backLink = (label = 'All apps') => `<a class="backlink" href="#home">${PL.icons.back}<span>${label}</span></a>`;
})();

</script>
<script>
/* ---- js/visual.js ---- */

(() => {
'use strict';
const V = PL.V = {};
const esc = PL.esc;

/* ---------------------------------------------------------------- Loopi, the guide

V.loopi = (expr = 'happy', size = 96, label = 'Loopi') => {
  const look = { point: [2.2, .5], think: [-1.8, -2.2], wow: [0, 0] }[expr] || [0, .6];
  const eye = x => expr === 'cheer'
    ? `<path d="M${x - 7} 67q7-8 14 0" fill="none" stroke="#1F2A1D" stroke-width="3.4" stroke-linecap="round"/>`
    : `<g class="lp-eye"><ellipse cx="${x}" cy="66" rx="${expr === 'wow' ? 8 : 7}" ry="${expr === 'wow' ? 9.5 : 8.5}" fill="#fff"/><circle cx="${x + look[0]}" cy="${67 + look[1]}" r="${expr === 'wow' ? 4.6 : 4}" fill="#1F2A1D"/><circle cx="${x + look[0] + 1.6}" cy="${65 + look[1]}" r="1.4" fill="#fff"/></g>`;
  const mouth = {
    cheer: '<path d="M49 80q11 16 22 0Z" fill="#1F2A1D"/><path d="M54 86q6 5 12 0" fill="#FF8FA0"/>',
    wow: '<ellipse cx="60" cy="84" rx="4.5" ry="5.5" fill="#1F2A1D"/>',
    think: '<path d="M56 84q5-2 9 1" fill="none" stroke="#1F2A1D" stroke-width="3" stroke-linecap="round"/>',
    calm: '<path d="M52 82q8 5 16 0" fill="none" stroke="#1F2A1D" stroke-width="3" stroke-linecap="round"/>',
  }[expr] || '<path d="M50 80q10 10 20 0" fill="none" stroke="#1F2A1D" stroke-width="3.2" stroke-linecap="round"/>';
  const arm = (d, cls = '') => `<path class="${cls}" d="${d}" fill="none" stroke="#6CC25C" stroke-width="8" stroke-linecap="round"/>`;
  const arms = {

const KIND = [

};
